# config/integrity_policy.yaml — 门禁 `gate_config_integrity` 的**策略清单**（N-166，2026-09-30）
#
# 为什么外置（用户提问的正面回答）
# -------------------------------
# 该门禁原先把下列**策略值**写死在脚本内（`_ON_MISS` / `_NOTIFY_KINDS` / `_NOTIFY_ON` /
# `_MAX_TIMEOUT` / `_PYTHON_ALIASES`）。它们与"校验逻辑"无关，是**可调策略**：
# 调整它们不需要改判据代码，却必须改门禁源码 —— 这既让"改策略"变成"改门禁"（高风险动作），
# 也让同一策略在两处各写一份（实测 `_PYTHON_ALIASES` 与 `_PYTHON_ALIASES_T` **逐字重复**：
# 一处改而另一处漏 → 同一语义在两条判据下不一致，属**隐蔽型判据失效**）。
#
# 为什么**不**把整个门禁"规则化"为 YAML
# -------------------------------------
# 该文件 1200 行中约 **1000 行是判据实现逻辑**（读文件、AST 解析、跨文件比对、双向闭合校验），
# 无法用 YAML 表达 —— 强行外置会得到"配置的配置"（YAML 里写伪代码），失去类型检查与可测性。
# 故本文件**只承载策略清单**；判据逻辑仍在代码（见 README §8.6 降级链与 `tools/audit_health.py`）。
# 该门禁真正的结构问题是**单门禁承担 11 个异质领域**（tools 清单/待办队列/语料/调度/触发/
# 步骤顺序/agent 态/域值/主题覆盖/语义清单/常量）→ 建议后续按领域拆分（见第三十七批报告遗留项）。
#
# 纪律：本文件是**唯一事实源**；门禁经 `config/loader.load_integrity_policy()` 读取
# （R24：程序可读配置的唯一读取口）。缺失或键不全 → 门禁 **FAIL**（不静默取默认值）。

# argv 首元素可接受的 Python 可执行名（跨平台/别名）。
# **顶层共用键**：schedule.yaml 与 triggers.yaml **两条判据都按它判定** ——
# 原实现在门禁内**逐字重复两份**（`_PYTHON_ALIASES` / `_PYTHON_ALIASES_T`），
# "改一漏一"会让同一语义在两条判据下不一致（N-166 合并为单一来源）。
python_aliases:
  - python
  - python.exe
  - py
  - python3

# 调度作业策略（与 `config/schedule.yaml` 的受控值域一致）
schedule:
  # 错过触发时刻的处置（schedule.yaml `on_miss` 的受控值域）
  on_miss:
    - skip
    - run_at_next_boot
  # 通知通道类型（schedule.yaml `notify.kind` 的受控值域）
  notify_kinds:
    - none
    - file
    - webhook
  # 允许的通知触发事件（schedule.yaml `notify.on` 的受控值域）
  # ⚠️ W1-5：**判定基准是 `common_lib.notify.NOTIFY_EVENTS`**（唯一事实源）；本项仅作
  #   漂移检测对照——两份不一致即门禁 FAIL（此前两份各自维护，新增 degraded_step 时漂移）。
  notify_on:
    - failed_step
    - gate_fail
    - worklist_aged
    - doctor_fail
    - degraded_step
    # 诊断第 3 波（2026-10-19）：待办积压**总量净增长**告警。
    # 与 `worklist_aged` 口径不同（前者问"这条放了多久"，后者问"越积越多吗"），
    # 发送点 `tools/backlog_governance.py`（经 `cli.py backlog growth` 由
    # schedule 的 `backlog_growth` 作业每日触发）。
    - backlog_growth
    # W5（§13.3）：与 NOTIFY_EVENTS 同步扩展（SLI/SLO 与质量两个事件，
    # 发送点分别是 tools/check_slo.py 与 tools/gen_quality_metrics.py）。
    - slo_breach
    - quality_regression

# 单文件行数预算（方案 §13.11：行数管规模、C901 管结构，两者互补）

# 为什么要有判据：方案 §7.8 的 D 类（>1200 行 4→0）是**一次性核对**，没有机器守门；
# 之后 `tools/run_production_refresh.py` 又长到 2300+ 行（随 W0–W5 持续新增步骤/判据）
# ⇒ **规模在无人盯防的情况下回涨**。本判据采用与 `gate_import_bootstrap` 相同的
# **只减不增**基线纪律：不要求立刻拆完（采集层拆分需真实数据环境，见 docs/tech_debt.md
# TD-1/D-遗留），但**禁止新增长超限文件**。
file_budget:
  max_lines: 800
  scope: [std_lib, modules, tools, config, interfaces, gates, commands, backlog_growth
    ]
  baseline:
    - tools/run_production_refresh.py
    - std_lib/scraper_std/document_structure.py
    - tools/gen_analysis_deliveries.py
    - std_lib/scraper_std/crawler_common.py
    - tools/gen_flow_map.py
    - tools/audit_health.py
    - modules/regulatory_classifier/recall_audit/run_retrieval_after_checks.py
    - tools/gen_benchmark.py
    - tools/extract_relations.py
    - std_lib/scraper_std/excel_structure.py
  # 判定口径：**超限集合**（lines > max_lines）必须 ⊆ baseline。
  # 拆完一个就从 baseline 删一个（基线单调收缩）；新增超限文件即 FAIL。

# 触发项策略（与 `config/triggers.yaml` 一致）
triggers:
  # 作业超时上限（秒）；超过即判 FAIL（防"挂死式"作业）
  max_timeout: 7200
