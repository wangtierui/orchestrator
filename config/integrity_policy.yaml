# config/integrity_policy.yaml — 门禁 `gate_config_integrity` 的**策略清单**（N-166，2026-09-30）
#
# 为什么外置（用户提问的正面回答）
# -------------------------------
# 该门禁原先把下列**策略值**写死在脚本内（`_ON_MISS` / `_NOTIFY_KINDS` / `_NOTIFY_ON` /
# `_MAX_TIMEOUT` / `_PYTHON_ALIASES`）。它们与"校验逻辑"无关，是**可调策略**：
# 调整它们不需要改判据代码，却必须改门禁源码 —— 这既让"改策略"变成"改门禁"（高风险动作），
# 也让同一策略在两处各写一份（实测 `_PYTHON_ALIASES` 与 `_PYTHON_ALIASES_T` **逐字重复**：
# 一处改而另一处漏 → 同一语义在两条判据下不一致，属**隐蔽型判据失效**）。
#
# 为什么**不**把整个门禁"规则化"为 YAML
# -------------------------------------
# 该文件 1200 行中约 **1000 行是判据实现逻辑**（读文件、AST 解析、跨文件比对、双向闭合校验），
# 无法用 YAML 表达 —— 强行外置会得到"配置的配置"（YAML 里写伪代码），失去类型检查与可测性。
# 故本文件**只承载策略清单**；判据逻辑仍在代码（见 README §8.6 降级链与 `tools/audit_health.py`）。
# 该门禁真正的结构问题是**单门禁承担 11 个异质领域**（tools 清单/待办队列/语料/调度/触发/
# 步骤顺序/agent 态/域值/主题覆盖/语义清单/常量）→ 建议后续按领域拆分（见第三十七批报告遗留项）。
#
# 纪律：本文件是**唯一事实源**；门禁经 `config/loader.load_integrity_policy()` 读取
# （R24：程序可读配置的唯一读取口）。缺失或键不全 → 门禁 **FAIL**（不静默取默认值）。

# argv 首元素可接受的 Python 可执行名（跨平台/别名）。
# **顶层共用键**：schedule.yaml 与 triggers.yaml **两条判据都按它判定** ——
# 原实现在门禁内**逐字重复两份**（`_PYTHON_ALIASES` / `_PYTHON_ALIASES_T`），
# "改一漏一"会让同一语义在两条判据下不一致（N-166 合并为单一来源）。
python_aliases:
  - python
  - python.exe
  - py
  - python3

# 调度作业策略（与 `config/schedule.yaml` 的受控值域一致）
schedule:
  # 错过触发时刻的处置（schedule.yaml `on_miss` 的受控值域）
  on_miss:
    - skip
    - run_at_next_boot
  # 通知通道类型（schedule.yaml `notify.kind` 的受控值域）
  notify_kinds:
    - none
    - file
    - webhook
  # 允许的通知触发事件（schedule.yaml `notify.on` 的受控值域）
  notify_on:
    - failed_step
    - gate_fail
    - worklist_aged
    - doctor_fail

# 触发项策略（与 `config/triggers.yaml` 一致）
triggers:
  # 作业超时上限（秒）；超过即判 FAIL（防"挂死式"作业）
  max_timeout: 7200
