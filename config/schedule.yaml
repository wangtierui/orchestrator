# config/schedule.yaml —— 调度**唯一事实源**（v2 §3.9 + §3.13.6，P2-2/P2-6）
#
# ⚠️ 变更纪律：本文件是唯一源，运行手册的定时表由本文件**反向生成**。
#    改动后必须执行：`python tools/gen_schedule_doc.py`（写出手册）与
#    `python cli.py schedule verify`（比对已安装计划任务）。
#    `gate_config_integrity` 判据 S 会断言「手册定时表 == 本文件渲染结果」，
#    手改手册会被门禁判 FAIL。
#
# 决策 D-12（2026-09-26，口径统一）：实测记录为 01:30 / 06:00–06:37，
#    原手册手抄为 01:00 / 06:30 —— 取**整点且互不重叠**的一组（01:00/06:00/07:00/08:00），
#    避免 01:30 与 01:00 任务窗口重叠、06:30 与 06:00 长跑任务重叠。
version: "1.0"

jobs:
  # ---- 定时（cron 五段式；Windows 计划任务由 tools/install_schedule.py 生成 XML）----
  - id: refresh
    kind: cron
    when: "0 6 * * *"
    argv: ["cli.py", "run", "--no-scrape", "--resume"]
    on_miss: run_at_next_boot
    desc: "全链刷新（raw 已抓取，仅重清洗 + 全链；当日无 raw 变化时各阶段快跳）"
  - id: nfra_weekly
    kind: cron
    when: "0 1 * * 2"
    argv: ["cli.py", "run", "--collect", "nfra-weekly"]
    on_miss: skip
    desc: "nfra 周报增量链（单实例锁 / 顶部窗口 / 断点续跑）"
  # N-185（2026-10-08）：**其余四源此前无任何定时采集** —— 实测 2026-10-06（周二）只有
  #   `nfra_weekly` 采集并出报告，gov/mof/pbc 的 raw 当日未更新；而 `refresh` 明确是
  #   `--no-scrape`（“raw 已抓取，仅重清洗 + 全链”）。故新增本作业补上**周度增量采集**。
  # 设计取舍（据实，非拍脑袋）：
  #   · **周三 01:00**（而非与 nfra 同日）：nfra 周二 01:00 实测最长约 68 分钟，同日会**重叠**；
  #     重叠时单实例锁会让后者**直接退出** → 该周采集**静默缺失**（比不排程更危险）。
  #   · **不带 `--resume`**（与 nfra_weekly 一致）：`_resume_plan` 的跳过集包含**任何上次 rc=0
  #     的步骤**（含 `collect:*`）→ 带 `--resume` 会把**采集本身**跳过（作业形同虚设）。
  #   · **supp 不在 argv 内**：它**没有网络采集器**（`COLLECT_CMD` 无 supp 项），其增量通道是
  #     「投放区 `data/inbox/<域>/` → `inbox_drop` 条件触发（每日 06:00 refresh 会评估）」
  #     与「人工批次 `--supp-batch`」。此处**不假装自动**（与 triggers.yaml 的 supp_ingest 口径一致）。
  #   · 下游（clean/apply/relate…）由本作业的**同轮全链**完成；次日的 `refresh --resume` 再兜底。
  - id: incremental_weekly
    kind: cron
    when: "0 1 * * 3"
    argv: ["cli.py", "run", "--collect", "gov,mof,pbc"]
    on_miss: skip
    desc: "gov/mof/pbc 周度增量采集 + 全链（含报告）；supp 走投放区（inbox_drop 触发）"
  - id: verify
    kind: cron
    when: "0 7 * * 1"
    # N-51（2026-09-27）：原 `--only 6.9` 用**阶段号**，而 `--only` 只认**步骤名**
    # （实测 6.9 令全部步骤 SKIP = 空跑 5.7s）。改为步骤名；该步已入主链为条件步骤，
    # 此处保留为**独立周入口**（条件 days_since≥7 自守，重复调用无害）。
    argv: ["cli.py", "run", "--only", "timeliness:verify"]
    on_miss: skip
    desc: "效力核验批次（有 Token 时；断点续跑，配额耗尽自动停）"
  - id: publish_wiki
    kind: cron
    when: "0 8 * * 1"
    # N-51：同上（原 `--only 21.5` → 步骤名）；wiki_sync 已入主链为条件步骤。
    argv: ["cli.py", "run", "--only", "wiki:sync"]
    on_miss: skip
    desc: "发布件刷新 + llm_wiki 源同步（SHA256 增量；条件触发 wiki_sync，见 triggers.yaml）"
  - id: monthly_check
    kind: cron
    when: "0 9 1 * *"
    argv: ["cli.py", "gates"]
    on_miss: skip
    desc: "月度巡检：门禁（另需人工跑 `cli.py source diff` / `cli.py timeliness summary` / check_llm_wiki_upstream）"

  # ---- 事件驱动（无 cron；由上游步骤完成后触发，登记于此以保证"定时清单"完整且单一来源）----
  - id: timeliness_sync
    kind: event
    when: ""
    after: verify
    argv: ["cli.py", "timeliness", "sync"]
    on_miss: skip
    desc: "核验后：台账 → 归属表时效同步（F-C03）；已由 run 主链 6.9 之后的阶段承接"
  - id: gov_increment
    kind: event
    when: ""
    # N-185 修正（2026-10-08）：原写 `after: refresh` 且 desc 称「**已并入 refresh**」，
    # 但 `refresh` 的 argv 是 `--no-scrape` ⇒ **根本不含采集**，该声明与实现**矛盾**
    # （属"纸面接线"：读者据手册会以为 gov 每天增量，实际每源都无定时采集）。
    # 现改指**真实承接者** `incremental_weekly`（周三 01:00 采集 gov/mof/pbc）。
    after: incremental_weekly
    argv: ["cli.py", "run", "--collect", "gov"]
    on_miss: skip
    desc: "gov 源增量（含 zhengceku 子源）——由 `incremental_weekly`（周三 01:00）承接；此处仅登记语义，不重复调度"

notify:
  # 无人值守的必要件（v2 §3.13.6）：现状编排器只有 run_log 与 stdout，失败无人知晓。
  kind: file            # none | file | webhook
  on: [failed_step, gate_fail, worklist_aged, doctor_fail]
  file_dir: reports/_alerts     # 入库可审计（reports 已在门禁排除集，不新增盲区）
  # webhook 为可选：URL 只从环境变量 `REG_ORCH_NOTIFY_WEBHOOK` 读取，**禁止入库**
