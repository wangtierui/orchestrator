# -*- coding: utf-8 -*-
# regulatory_compliance_orchestrator — 四子项目统一工程配置（P0 骨架，2026-09-08）
# 演进纪律：本工程为唯一演进点；原四仓（regulatory_scrapers/classifier/drafter/base）只读冻结。
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-compliance-orchestrator"
version = "0.1.0"
description = "监管合规编排器：五源采集/清洗 + RFN分类 + 内部制度扫描 + 制度起草（统一编排）"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.25.0",
    "beautifulsoup4>=4.10.0",
    "PyYAML>=6.0",
    # 解析/结构化链（2026-09-12 审查补登记 D1：清洗/条款抽取/制度摄取实际依赖）
    "lxml>=4.9",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-docx>=1.0",
    # 2026-09-13 依赖归属修正：pypdf/pdfplumber 是 PDF **文本层**解析组件（不是 OCR），
    # 原先只声明在 [ocr] extra —— 按 README 只装 .[dev] 时，crawler_common._extract_pdf()
    # 两库皆缺会**静默**返回 extract_status="library_missing"，使 `internal index` 对 PDF
    # 产出空正文（不报错、不被门禁拦截）。详见 reports/scratch/克隆可移植性检视报告_20260913.md · CP-A01。
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    # 编码探测（std_lib/scraper_std/encoding.py 惰性导入；缺失会静默降级为 gb18030→utf-8）
    "chardet>=5.0",
    # 2026-09-26（v2 §3.7 G1/G2）依赖声明完整性修复：
    #  - Pillow：ocr_engine / supp_ocr_pdf / pbc_backfill_pdfs 直接 `from PIL import ...`（原未声明）
    #  - urllib3：gov_collector / gov_parse 直接 `from urllib3.util.retry import Retry`（原仅经 requests 传递）
    #  - PyMuPDF：supp_fix_raw_factual 顶层导入（已补保护）；原先只在 [ocr] extra，
    #    导致"只装 .[dev]"时 import 即崩——按真实依赖层上移 base（下界取舍见原 [ocr] 注释）
    "Pillow>=10.0",
    "urllib3>=2.0",
    "PyMuPDF>=1.24.3,<2",
    # 说明（2026-09-13）：原 `cryptography>=3.0` 已移除——全仓零引用（死声明，扩大安装面）。
]

[project.optional-dependencies]
# 2026-10-13（问题项 P-8 · 工具链标定固化）：mypy **锁 1.x**、补 types-PyYAML。
# 理由（实测）：mypy 2.x 对「tools/ 无 __init__.py 的裸名/包名双注册」判定趋严，
# `mypy .` 报 "Source file found twice under different module names" 直接中止全仓检查
# （1.20 仅在 tests/ 用 `from tools import X` 时触发，已统一为裸名修复，但 2.x 的行为
# 差异未评估）；且 yaml 缺存根时 7 处 [import-untyped]。主版本工具升级须单独评估
#（同 ADR 纪律），不在重构中静默改变标定行为 ⇒ 上界锁 <2，存根显式声明。
dev = ["pytest>=7.0.0", "coverage>=7.0.0", "ruff>=0.6", "mypy>=1.10,<2", "types-PyYAML>=6.0",
       # W5（§13.2 供应链安全）：以下三者为**实际在用**却此前未声明的影子依赖——
       #   pytest-timeout：pytest 入口 `--timeout=900`（防单测挂死掩盖失败，ci_check 亦依赖）
       #   bandit：SAST（ci_check 作业，方案 §9.2）
       #   pip-audit：依赖漏洞扫描（ci_check 作业 + gate_dependency_audit 判据 D4）
       # 门禁 gate_dependency_audit 判据 D3 会拒绝「在用未声明」，故此处补齐（ADR-0011）。
       "pytest-timeout>=2.1", "bandit>=1.7", "pip-audit>=2.5",
       # 2026-10-19（内联 JS 语法守卫）：`web/assets/index.html` 的 `<script>` 一旦
       # 有语法错误，**整段脚本不执行** ⇒ 页面停在初始态（`加载中…` + `SSE 连接中…`），
       # 而服务端 HTTP 200、API 全绿、SSE 有 hello/ping ⇒ 极易误判成"后端/SSE 故障"
       # （2026-10-19 实际发生过：模板字符串内注释含反引号 ⇒ 提前闭合 ⇒ 全站瘫痪）。
       # 本仓无 Node，故用 **esprima**（纯 Python 的 ECMAScript 解析器）做真语法检查；
       # `tools/js_syntax_lint.py` 在它不可用时降级为词法兜底（并**明确标注**降级）。
       # 仅开发/CI 使用，主链运行期不 import ⇒ 放 dev extra 而非 base dependencies。
       "esprima>=4.0"]
# OCR extra（2026-09-12 审查补版本区间 D3：Paddle 生态变动快，锁主版本）
# 2026-09-13：pypdf/pdfplumber 上移 base（非 OCR 组件）；PyMuPDF 下界修正见下。
ocr = [
    # 2026-09-26：PyMuPDF 已上移 base（supp_fix_raw_factual 顶层导入；见 dependencies 注释）。
    # 代码统一使用 `import pymupdf`（该导入名自 PyMuPDF 1.24.3 起提供，旧版仅 `fitz`）。
    "paddleocr>=3.0,<4",
    "paddlex[ocr]>=3.0,<4",
]
# 说明（2026-09-13）：原 `mcp = ["mcp>=2.0.0"]` 已移除——全仓零 `import mcp`（死 extra）。
# 北大法宝时效核验的真实依赖在 **Node 侧**：`@pkulaw/mcp-cli` + 托管 Node
# （经 env PKULAW_NODE_EXE / PKULAW_PKG_DIR 注入，见 README §6.7），与 Python extra 无关。
#
# P1 语义增强 extra（N-102，2026-09-28）—— **可选增强层**，与 `ocr` 同款定位：
#   · 清单唯一事实源：`config/schema/semantic_tools.json`（来源仓库/用途/体积/离线性）；
#   · 能力探测：`python -m std_lib.common_lib.semantic_tools --probe`（未安装 → 全链走既有正则）；
#   · 三条硬纪律（见清单 policy）：零硬依赖 / 降级链须**可观测** / 产物须带 `fingerprint()`。
#   · ⚠️ 版本区间为**保守下界**：上界与具体可用版本须在首次实装冒烟后按实测锁定
#     （不臆造精确约束；锁定后请在此更新并注明实测日期）。
#   · 未列入本 extra 的工具（非 pip 安装，须人工/Docker 部署）：
#     DeepKE（源码树，N-176 起**替代原 aprcoie**；其 requirements 与主栈冲突 → 须独立 venv）、
#     SignalGraph（纯 Python 源码库）、WeKnora docreader（gRPC 服务）、
#     ParadeDB（PostgreSQL 扩展 + Docker）。
#   · `hdbscan` 不重复声明：新版 `bertopic` 已改用 `sklearn.cluster.HDBSCAN`（sklearn>=1.3）；
#     `ltp` 与 `hanlp` **二选一**（同一增强层，按中文分句质量择优）。
# 批 63（E4）：补**运行期硬用**库 —— `semantic_models.py` 直接 import sentence_transformers /
# transformers / torch（无这些则 load_embedder 直接 ModelUnavailable ⇒ "装了等于没装" ✗）；ltp 与 hanlp
# 是分词器二选一（此处一并声明，装不装由使用者定；版本下限取宽松值，避免与主栈 pin 冲突）。
semantic = [
    "hanlp>=2.1",
    "text2vec>=1.2",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "sentence-transformers>=3",
    "transformers>=4.30",
    "torch>=2",
    "ltp>=4.2",
]

[project.scripts]
orchestrator = "cli:main"

[tool.setuptools]
py-modules = ["cli", "paths"]
include-package-data = true

# 包发现（2026-09-13）：由手写清单改为 find，避免新增包（如 commands 拆分产物）漏登记。
# **刻意不含 modules/**：该目录内含无 __init__.py 的子目录（scripts、timeliness_review）
# 与大量不入库数据，且运行时契约是"源码树内 sys.path 注入"（commands/*.py 用 paths.ROOT 拼装），
# 而非"安装为可导入包"。故 wheel 不承载 modules/ —— 非源码树安装由 cli.py 启动校验显式拒绝并
# 给出可执行指引（替代原先晦涩的 ModuleNotFoundError，见 CP-A02）。
[tool.setuptools.packages.find]
include = ["std_lib*", "config*", "interfaces*", "gates*", "commands*"]
exclude = ["modules*", "tests*", "tools*", "reports*", "docs*"]

# 配置文件随包分发（2026-09-13 修复）：原 wheel 内 config/ 仅 3 个 .py，
# sources.yaml / ocr.yaml / schema/*.json 全缺 → 任何非可编辑安装下 config.loader
# 直接 FileNotFoundError（CP-A03）。
[tool.setuptools.package-data]
config = ["*.yaml", "schema/*.json", "schema/*.yaml"]

[tool.setuptools.exclude-package-data]
"*" = ["data/**", "cache/**", "logs/**", "venv/**"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "cache", "logs", "backups", "venv", "reports/_tmp", "_tmp_smoke",
                  # 2026-09-26（v2 §3.15.3 A4）：退役脚本隔离层不再维护风格
                  "tools/retired",
                  # W4（§7.2 A 类，2026-10-15）：modules 侧退役隔离层同口径
                  # （J9 判据保零引用；观察期后整体删除，勿在退役层做功风格整改）
                  "modules/regulatory_scrapers/retired",
                  "modules/regulatory_classifier/retired",
                  # 2026-10-09（批 48）：`refactor/` **属其他用户**（采集器抽取重构 WIP），
                  # 本机**不得修改其任何文件**，视为**独立模块** ⇒ 不纳入本仓风格检查。
                  # ⚠️ 注意：这不等于"它没有 lint 问题"——批 47 曾误代为修正（已回滚）；
                  # 其真实问题（含 2 项 F821 未导入 json 的真 bug）改由**转交登记**处理。
                  "refactor"]

# 迁移既有代码豁免：collectors / classifier 复制代码保留其紧凑风格（单行/短变量名），
# 与旧仓 ruff 配置同口径；语义修复（F821 等）已在迁移时完成，风格项逐步清理。
[tool.ruff.lint.per-file-ignores]
"modules/regulatory_scrapers/collectors/*.py" = ["E741", "E701", "E702"]
"modules/regulatory_scrapers/collectors/supp/utils/*.py" = ["E741", "E701", "E702"]
"modules/regulatory_scrapers/clean_index/*.py" = ["E741", "E701", "E702"]
"modules/regulatory_scrapers/timeliness_review/*.py" = ["E741", "E701", "E702"]
"modules/regulatory_classifier/recall_audit/*.py" = ["E741", "E701", "E702"]
"modules/regulatory_classifier/scripts/*.py" = ["E741", "E701", "E702"]
"std_lib/**/*.py" = ["E741", "E701", "E702"]

[tool.ruff.lint]
# N-74（2026-09-28）：`BLE` + `RUF100` 入 select —— 让"宽泛捕获须声明意图"从**约定**变**机器强制**。
#   · 背景：全仓 120+ 处 `except Exception:` 以 `# noqa: BLE001` 作意图声明（`gate_runtime_hygiene`
#     判据②要求 except 行含 `#`），但 `BLE` 此前**未 select** → 该 noqa **是死抑制**：既不禁用任何
#     检查，也不被 RUF100 校验 → 可静默堆积、可写错码、可贴在不会报错的行上而无人察觉。
#   · `BLE` 启用后：这些 noqa 成为**真抑制**（声明与机制合一），未声明的裸 `except Exception` 直接报错。
#   · `RUF100` 启用后：**死抑制永久防复发**（本轮已清理 443 处 E402/PLC0415 死码——`E402` 在下方
#     ignore 中、`PL` 前缀从未 select，二者均不参与检查）。
#   · 纪律：RUF100 的修复**必须**走配置口径（裸 `ruff check --fix`）；**禁止**用
#     `ruff check --select RUF100 --fix` —— CLI 的 `--select` 会覆盖配置的规则集，使 ruff 把
#     "配置内有效但不在 CLI 集合内"的 noqa 全部误判为未使用并删除（本批实测误删 323 条有效抑制）。
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF100"]
ignore = ["E501", "UP009", "UP031", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# 排除目录与 `gate_no_duplicate_libs.EXCLUDE_DIRS` 口径一致（**唯一事实源**：非源码层不参与检查）：
# `retired/`（退役隔离层，其"不再被引用"由 gate_config_integrity 判据 J3 保证）、
# `archive/`（归档层）、`build/`+`dist/`（构建产物）。
exclude = ["data/", "cache/", "logs/", "backups/", "retired/", "archive/", "build/", "dist/",
           # 2026-10-13（问题项 P-3 续）：`reports/_tmp/` 是**运行期临时目录**（gitignore 忽略；
           # ruff extend-exclude 早已含它）。其中曾残留历史一次性脚本（如 s10_tests_append.py，
           # 2026-10-10 批 52 遗留，且自身带语法错误）⇒ mypy 遍历即语法错误退出，基线不可达。
           # 临时层不参与类型检查（与 ruff 口径对齐）。
           "reports/_tmp/",
           # 2026-10-09（批 48）：`refactor/` 属**其他用户**的独立模块（本机不得修改）
           # ⇒ 不纳入本仓类型检查（其 14 项既有类型错误已随报告披露并转交）。
           "refactor/",
           # 2026-10-13（问题项 P-3）：`external/`（13.4GB 外部资产：模型权重/PaddleOCR/
           # tesseract junction/upstream 源码树）**gitignore 忽略但 mypy 不读 .gitignore** ——
           # 此前会遍历进 upstream/WeKnora/mcp-server，遇非法包名直接配置错误退出，
           # 使「mypy 0 error」基线在带 external/ 的克隆上不可达。非源码层一律排除
           # （ruff 侧早已因尊重 .gitignore 而天然跳过，两侧口径由此对齐）。
           "external/"]
# N-72（2026-09-28）：历史层 mypy **已全量收敛**（236 → 0，含 5 处真 bug：chinese_numerals 键空间、
# clean_index 元组当整数、checkpoint `raise object()`、retention `glob.fnmatch`、
# normalize_internal_naming `and _writeback_identity(...)` 恒假），CI 的 mypy 范围已扩至
# **全仓**（std_lib / modules / tools / config / interfaces / gates / commands）。
#
# N-73（2026-09-28）· 两项严格化（**本文件为单点事实源**，CI 不再重复传参）：
#   1) `check_untyped_defs = true` —— 此前**未注解函数体**不参与检查（mypy 默认），是历史层
#      最后一处盲区（新增 116 error，含 tri-state 赋值/`dict[str,str]` 载体/守卫缺失等）；已全量收敛；
#   2) `follow_imports = "normal"` —— 原 `silent` 会跳过未显式指定路径的**间接导入**（薄弱面）；
#      实测切 `normal` 后增量 **0 error**，故免费换得"整棵导入图同口径检查"。
follow_imports = "normal"
check_untyped_defs = true

# ---- 覆盖率口径（v2 §3.7 G4/G5，P2-4）----
# 口径说明：只计"本仓自有的治理/标准/接口/命令/工具层"（modules/** 为历史语料处理代码，
# 体量大且多为一次性脚本，纳入会掩盖真实趋势）；阈值 20% 为**起点**（现状基线），
# 只升不降——新增代码应带测试，旧代码在触及处补测。
[tool.coverage.run]
source = ["std_lib", "config", "interfaces", "gates", "commands", "tools"]
branch = false

[tool.coverage.report]
fail_under = 20
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def main\\(argv=None\\) -> int:",
]

# ---- bandit（SAST，方案 §9.2 / §13.2-2；ci_check 作业「bandit」）----
# 口径选择（质量优先，但**必须可行动**）：
#   · 全量跑 bandit 会淹没在 tests/ 的 assert/eval 式样与退役隔离层的历史代码里
#     ⇒ 只对**交付层**（std_lib/modules/tools/gates/commands/interfaces）扫，退役层排除；
#   · 检查项选**有真实危害**的一类（subprocess_shell=True ⇒ 命令注入 /
#     hardcoded_bind_all_interfaces ⇒ 对外监听 / pickle.loads / eval / md5 / sha1 /
#     Jinja2 autoescape / assert_used 在非测试路径），其余（异常吞咽等）交给 review；
#   · severity medium 以上才报：低危噪音会让作业被习惯性忽略——**告警疲劳等于没有告警**。
[tool.bandit]
# ⚠️ 实测（2026-10-15）：bandit 的 pyproject 解析器**只认 skips/tests 等子键，不认
# `exclude`**（`skips` 生效、`exclude` 被静默忽略 ⇒ 退役层 refactor/ 仍被扫入）。
# 故排除项的**权威落点是命令行** `--exclude`（见 tools/ci_check.py 的 bandit 作业与
# ADR-0011 的复核命令）；此处保留声明仅为可读性，**不视为生效配置**。
exclude = ["*retired*", "*external*", "*graphify-out*", "*refactor*",
           "*tests*", "*reports/_tmp*", "*reports\\_tmp*", "*__pycache__*"]
skips = [
  "B406",  # blacklist import xml.sax.saxutils：仅用于**转义**写任务计划 XML（不解析）
  # 逐类跳过，**每条附理由**（禁「整类静默」：未列出的检查项保持阻断）：
  "B101",  # assert_used：门禁/契约锚点大量使用断言表达不变式（有意用法，非校验缺失）
  "B110",  # try_except_pass：降级纪律的既定形态（无可用能力时静默跳过并由审计台账披露）
  "B112",  # try_except_continue：同上（单条记录坏数据跳过，不中止整批）
  "B603",  # subprocess_without_shell_equals_true：全仓 argv 均传 list 形态且 shell=False
  "B404",  # blacklist import subprocess：采集链与工具链的核心依赖（非恶意用法）
  "B405",  # blacklist import xml.etree：仅解析 zip 内 docx/xlsx 结构（见 B314 理由）
  "B314",  # blacklist xml.etree / xml.sax：① Python 标准库 ElementTree **不解析外部实体**
            #   （无 XXE 面）；② 输入是官方文档 zip 内的 document.xml/sharedStrings.xml，
            #   非外部输入的 XML 流；③ install_schedule 命中处只是 Windows 任务计划
            #   **命名空间常量字符串**，根本不解析 XML。若将来引入「解析外部 XML」场景，
            #   必须改为 defusedxml 并**移除本条**。
  "B310",  # audit urlopen：采集器本就按 URL 抓取（审计模式对本仓语义不适用）
  "B311",  # random：仅用于抓取延时抖动与采样，非安全随机（安全场景走 secrets）
  # —— 以下 6 类为 2026-10-15 **逐处核实**后的类级判定（每处命中都看过上下文，非 blanket）——
  "B102",  # exec：唯一一处执行**本仓自有**源码段取 classify()（import 会触发全量扫描，
            #   文件内已注明该设计；输入非用户数据）。复发条件：改为 exec 外部输入 ⇒ 移除本条。
  "B103",  # set_bad_file_permissions：写入目标均为**本仓产物目录**（单机本地仓，Windows
            #   语义无实害）。复发条件：开始写用户/共享目录 ⇒ 移除本条。
  "B105",  # hardcoded_password：两处均为**误报**（Python 标识符名与中文文案键）；真实
            #   硬编码密钥由 gate_secret_scan 覆盖。
  "B324",  # hashlib md5/sha1：全仓仅用于**内容指纹与去重键**（RFN 编号派生、附件校验
            #   对照等），非口令/签名/证书；需要密码学强度处一律走 SSOT io_atomic.sha256_bytes。
            #   复发条件：用于签名/令牌/证书 ⇒ 移除本条。
  "B607",  # start_process_with_partial_path：14 处全为**操作系统命令按名调用**
            #   （git/tasklist/schtasks/soffice——绝对路径反而不 portable）。唯一真实风险
            #   子类「以裸 `python` 启动子进程」已修为 sys.executable，并由门禁
            #   gate_dependency_audit 判据 D7 机器守护（防回潮）。
  "B608",  # hardcoded_sql：全部为**占位符 + 参数绑定**；插值部分仅代码内常量列名或经
            #   `_check_name` 白名单校验的标识符。历史唯一「无插值却带 f 前缀」的误报已改。
            #   复发条件：把用户输入拼进 SQL ⇒ 移除本条。
]
confidence = ["medium", "high"]

[tool.bandit.b101]
# assert_used：契约/不变式断言是有意用法（门禁与测试辅助函数大量使用）——
# 只在**子进程内**才算问题（禁用 -O 会让关键校验消失），故保留默认级别不豁免。
# 如实测噪音过高，改用 `# nosec B101` 逐处显式豁免而非全局关掉。

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# 用例分层（2026-09-13 可移植性修复 · CP-E03）：数据依赖用例须显式标记，
# 使无数据环境（刚克隆 / 无备份的 CI）可执行 `pytest tests -m "not data"` 做代码级回归，
# 而不必面对"11 个失败其实是数据缺失"的误判。
markers = [
    "data: 依赖本机现行数据产物（cleaned 快照/归属表/底座/merged_view/发布件）的验收用例；无数据环境用 -m \"not data\" 排除",
    # W5（方案 §9.3）：契约类用例（门禁判据正/负例、import 面、产物形态、传输行为）
    # ——无数据环境可跑，与 data 标记互补（`-m "contract"` 单独收敛契约回归）。
    "contract: 契约类用例（门禁正/负例、import 面、产物形态）——无数据环境可跑",
]
