[pytest]
# refactor 是独立项目根：用 pytest.ini 固定 rootdir。
# 父工程 orchestrator/ 也有 pyproject.toml，若让 pytest 把 rootdir 定在那里，
# pythonpath 会把父目录加进 sys.path，导致 config 等顶层名解析到父工程的同名包。
#
# 测试按「步骤归属」就近放：各阶段自己的 tests/ 目录，跨模块契约放 tests/contract/。
# --import-mode=importlib 让多个 tests/ 共存，且不需要每个目录都有 __init__.py。
testpaths = collectors/tests clause/tests docgraph/tests rag/tests tests/contract
pythonpath = .
norecursedirs = .venv .git data cache out graphify-out *.egg-info __pycache__ build dist
addopts = -q -m "not data" --import-mode=importlib
markers =
    data: 依赖本机数据产物（cache/raw）的用例；无数据环境用 -m "not data" 排除
