<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政策法规</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 本页只写布局；颜色/边框/圆角/字号一律来自 Primer 类与令牌（§10） */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">政策法规</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div id="searchSlot"></div>
  <div id="toolbarSlot"></div>
  <div class="border rounded-2" id="tableSlot"></div>
  <div id="pagerSlot"></div>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  const state = { q: '', sort: 'publish_date', desc: '1', page: 1, size: 50, source: '', theme: '', timeliness: '', density: 'comfortable' };
  let data = { items: [], total: 0, pages: 1 };
  let tbl = null;

  const COLUMNS = [
    { key: 'title', label: '名称', width: 'minmax(0,2.6fr)', titleFrom: 'title', wrap: false,
      render: (r) => `<a href="#" data-open="1">${r.title || '—'}</a>` },
    { key: 'document_number', label: '文号', width: '180px', titleFrom: 'document_number' },
    { key: 'theme_label', label: '主题', width: '150px' },
    { key: 'timeliness_status', label: '时效', width: '90px',
      render: (r) => table.badge(r.timeliness_status) },
    { key: 'publish_date', label: '发布日期', width: '120px', sortable: true },
  ];

  async function fetchPage() {
    const qs = new URLSearchParams({ page: String(state.page), size: String(state.size),
      sort: state.sort, desc: state.desc });
    // 搜索与筛选全部由后端执行（§8.9）：前端只负责把条件发出去
    if (state.q) qs.set('q', state.q);
    if (state.source) qs.set('source', state.source);
    if (state.theme) qs.set('theme', state.theme);
    if (state.timeliness) qs.set('timeliness', state.timeliness);
    const res = await fetch(`/api/records?${qs}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function renderAll() {
    if (!tbl) {
      tbl = table.renderTable({
        columns: COLUMNS, rows: data.items, density: state.density, label: '政策法规列表',
        sortKey: state.sort, sortDir: state.desc === '1' ? 'desc' : 'asc',
        onSort: (key, dir) => { state.sort = key; state.desc = dir === 'desc' ? '1' : '0'; state.page = 1; refresh(); },
        empty: { title: '没有匹配的法规', desc: '换个关键词，或清除筛选' },
      });
      document.getElementById('tableSlot').append(tbl.el);
    } else {
      tbl.update(data.items, state.density);
    }
    const pager = controls.renderPagination({ page: data.page || state.page, pages: data.pages || 1,
      total: data.total, size: state.size, onChange: (p) => { state.page = p; refresh(); } });
    document.getElementById('pagerSlot').replaceChildren(pager);
    document.getElementById('stamp').textContent =
      `共 ${core.fmtInt(data.total)} 条 · ${new Date().toLocaleTimeString('zh-CN')}`;
  }

  async function refresh() {
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      data = await fetchPage();
      renderAll();
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(
        core.renderState('error', { title: '加载失败', desc: String(e.message || e),
          action: { label: '重试', onClick: refresh } }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  // 搜索行
  const search = controls.renderSearch({
    id: 'q', label: '搜索政策法规', placeholder: '搜索或筛选：主题:T1、文号:金非银检函…（回车应用）',
    onInput: (v) => { state.q = v; state.page = 1; refresh(); },
    onSubmit: (v) => { state.q = v; state.page = 1; refresh(); },
  });
  document.getElementById('searchSlot').append(search.el);

  // 工具条：右侧两个筛选（来源 / 时效），点击打开面板（behaviors 定位 + 焦点）
  const facets = await fetch('/api/records/facets', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({}));
  const toolbar = controls.renderToolbar({
    segments: [{ key: 'all', label: '全部' }, { key: 'valid', label: '有效' }],
    active: 'all',
    filters: [{ key: 'source', label: '来源' }, { key: 'timeliness', label: '时效' }],
    density: state.density,
    onSegment: (k) => { state.timeliness = k === 'valid' ? 'valid' : ''; state.page = 1; refresh(); },
    onFilter: async (f, btn) => {
      const opts = (facets[f.key] || facets[f.key === 'source' ? 'sources' : 'timeliness'] || [])
        .map((o) => ({ key: o.value, label: `${o.label} (${o.count})` }));
      await controls.openPanel({
        anchor: btn, label: `筛选：${f.label}`, items: opts,
        onPick: (it) => { state[f.key] = it.key; state.page = 1; refresh(); },
      });
    },
    onDensity: (d) => { state.density = d; tbl && tbl.setDensity(d); },
  });
  document.getElementById('toolbarSlot').append(toolbar);

  refresh();
})();
</script>
</body>
</html>
