<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户反馈</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">用户反馈</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div id="toolbarSlot"></div>
  <div class="border rounded-2" id="tableSlot"></div>
  <p class="text-small m-0">提交入口在左侧栏底部「Feedback」，本页只做查看与办结（规格 §9.8.2）。</p>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  const KIND = { bug: '缺陷', data: '数据质量', feature: '功能缺失', other: '其他' };
  const SEV = { low: '轻微', normal: '一般', high: '严重', blocker: '阻塞' };
  const ST = { open: '待受理', resolved: '已办结', closed: '已办结' };

  const state = { status: 'open', kind: '', severity: '', density: 'comfortable' };
  let data = { items: [], total: 0 };
  let tbl = null;

  const COLUMNS = [
    { key: 'created_at', label: '时间', width: '150px', render: (r) => (r.created_at || '').replace('T', ' ').slice(0, 16) },
    { key: 'fid', label: '编号', width: '210px' },
    { key: 'kind', label: '分类', width: '100px', render: (r) => table.badge(KIND[r.kind] || r.kind) },
    { key: 'severity', label: '严重度', width: '90px', render: (r) => table.badge(SEV[r.severity] || r.severity) },
    { key: 'page', label: '页面', width: '110px' },
    { key: 'title', label: '标题 / 说明', width: 'minmax(0,2.4fr)', wrap: true,
      render: (r) => {
        const box = document.createElement('div');
        const t = document.createElement('div');
        t.textContent = r.title || '—';
        box.append(t);
        if (r.detail) {
          const d = document.createElement('div');
          d.className = 'text-small';
          d.style.color = 'var(--fgColor-muted)';
          d.textContent = r.detail;
          box.append(d);
        }
        return box;
      } },
    { key: 'account', label: '记录者', width: '150px' },
    { key: 'status', label: '状态', width: '90px', render: (r) => table.badge(ST[r.status] || r.status) },
    { key: 'act', label: '操作', width: '80px', render: (r, i) => {
      if (r.status !== 'open') return '—';
      const b = document.createElement('button');
      b.className = 'btn btn-sm';
      b.type = 'button';
      b.textContent = '办结';
      b.addEventListener('click', (e) => { e.stopPropagation(); resolve(r); });
      return b;
    } },
  ];

  async function resolve(row) {
    const reason = prompt(`办结「${row.title}」的理由（进审计台账，必填）`);
    if (reason == null) return;
    if (!String(reason).trim()) { alert('理由必填'); return; }
    const res = await fetch('/api/feedback/resolve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fid: row.fid, status: 'resolved', reason: String(reason).trim() }),
    });
    const out = await res.json().catch(() => ({ ok: false, reason: `HTTP ${res.status}` }));
    if (!out.ok) { alert(out.reason || '办结失败'); return; }
    refresh();
  }

  async function refresh() {
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      const d = await fetch('/api/feedback', { cache: 'no-store' }).then((r) => r.json());
      data = d;
      const items = (d.items || []).filter((x) => {
        if (state.status === 'open' && x.status !== 'open') return false;
        if (state.status === 'done' && x.status === 'open') return false;
        if (state.kind && x.kind !== state.kind) return false;
        if (state.severity && x.severity !== state.severity) return false;
        return true;
      });
      if (!tbl) {
        tbl = table.renderTable({ columns: COLUMNS, rows: items, density: state.density,
          label: '用户反馈列表', empty: { title: '当前没有反馈', desc: '点左侧栏底部 Feedback 提交' } });
        document.getElementById('tableSlot').append(tbl.el);
      } else tbl.update(items, state.density);
      document.getElementById('stamp').textContent = `共 ${core.fmtInt((d.items || []).length)} 条 · 待受理 ${(d.items || []).filter((x) => x.status === 'open').length}`;
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: refresh } }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('toolbarSlot').append(controls.renderToolbar({
    segments: [{ key: 'open', label: '待受理' }, { key: 'done', label: '已办结' }],
    active: state.status,
    filters: [{ key: 'kind', label: '分类' }, { key: 'severity', label: '严重度' }],
    density: state.density,
    onSegment: (k) => { state.status = k; refresh(); },
    onFilter: async (f, btn) => {
      const src = f.key === 'kind' ? KIND : SEV;
      const opts = Object.entries(src).map(([k, label]) => ({ key: k, label }));
      await controls.openPanel({ anchor: btn, label: `筛选：${f.label}`, items: opts,
        onPick: (it) => { state[f.key] = it.key; refresh(); } });
    },
    onDensity: (d) => { state.density = d; tbl && tbl.setDensity(d); },
  }));

  refresh();
})();
</script>
</body>
</html>
