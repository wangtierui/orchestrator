<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目结构 · 平行重建样板页（径向树）</title>
<link rel="stylesheet" href="../primer-primitives.css">
<link rel="stylesheet" href="../primer.css">
<style>
  body { background: var(--bgColor-default); }
  .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { padding: 16px; }
  .card > h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600;
              display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart { width: 100%; height: 640px; }
  #info { min-height: 40px; font-size: 12px; }
</style>
</head>
<body>
<div class="page">
  <div class="d-flex flex-items-center flex-wrap gap-2 mb-3">
    <h2 class="h3 m-0">项目结构</h2>
    <span id="meta" class="text-small"></span>
    <span class="flex-auto"></span>
    <span class="text-small">数据源：/project-tree.json</span>
  </div>

  <div class="border rounded-2 card">
    <h3><span>目录与关键文件</span><span id="cnt" class="text-small"></span></h3>
    <div id="chart" class="chart" role="img" aria-label="项目结构径向树"></div>
    <div id="info" class="text-small"></div>
  </div>
</div>

<script src="../vendor/echarts/echarts.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let chart = null;

const toTree = (n) => ({
  name: n.name,
  value: n.size || undefined,
  children: (n.children || []).map(toTree),
});

async function load() {
  const d = await (await fetch("../project-tree.json", { cache: "no-store" })).json();
  const meta = d.meta || {};
  const root = toTree(d.tree || {});
  $("#meta").textContent = `${meta.root || ""} · 生成于 ${meta.generated_at || "—"}`;
  $("#cnt").textContent = `${meta.node_count || 0} 个节点${meta.truncated ? "（已截断）" : ""}`;

  chart = chart || echarts.init($("#chart"));
  chart.setOption({
    tooltip: { trigger: "item", formatter: (p) => esc(p.name) },
    series: [{
      type: "tree",
      data: [root],
      layout: "radial",
      symbolSize: 6,
      initialTreeDepth: Number(meta.max_depth) || 3,
      label: { fontSize: 11, position: "left", verticalAlign: "middle", align: "right" },
      leaves: { label: { position: "right", align: "left" } },
      emphasis: { focus: "descendant" },
      expandAndCollapse: true,
      animationDuration: 400,
    }],
  });
  chart.resize();
  chart.on("click", (p) => {
    $("#info").textContent = `选中：${p.name}` + (p.value ? ` · ${p.value}` : "");
  });
}

window.addEventListener("resize", () => chart && chart.resize());
load();
</script>
</body>
</html>
