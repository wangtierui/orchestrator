<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目结构</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">项目结构</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div class="border rounded-2 p-3">
    <div id="chart"></div>
  </div>
  <div class="border rounded-2 p-3" id="info">
    <div class="text-small">点节点查看路径与用途</div>
  </div>
</div>
<script src="/vendor/echarts/echarts.min.js"></script>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    chart: await import('/js/ui/chart.js'),
  };
  const { core, chart } = RCO;

  try {
    const d = await fetch('/project-tree.json', { cache: 'no-store' }).then((r) => r.json());
    const meta = d.meta || {};
    const root = d.tree || { name: 'root', children: [] };

    document.getElementById('stamp').textContent =
      `${meta.node_count || 0} 节点 · 深度 ${meta.max_depth || '—'}${meta.truncated ? ' · 已截断' : ''}`;
    if (meta.truncated) {
      const tip = document.createElement('div');
      tip.className = 'text-small';
      tip.textContent = '已达节点上限，树被截断（meta.truncated=true）';
      document.getElementById('info').prepend(tip);
    }

    const host = document.getElementById('chart');
    const inst = chart.mountChart({
      el: host, height: 640, label: '项目目录径向树',
      option: {
        tooltip: { trigger: 'item', formatter: (p) => (p.data && p.data.path) || p.name },
        series: [{
          type: 'tree',
          data: [root],
          layout: 'radial',
          initialTreeDepth: 3,
          symbolSize: 6,
          label: { position: 'top', fontSize: 11 },
          leaves: { label: { position: 'right' } },
          emphasis: { focus: 'descendant' },
        }],
      },
    });

    inst.chart.on('click', (p) => {
      const box = document.getElementById('info');
      box.replaceChildren();
      const name = document.createElement('div');
      name.className = 'text-bold';
      name.textContent = p.name || '—';
      const path = document.createElement('div');
      path.className = 'text-small';
      path.textContent = (p.data && p.data.path) || '—';
      const purpose = document.createElement('div');
      purpose.className = 'text-small';
      purpose.textContent = (p.data && p.data.purpose) || '';
      box.append(name, path, purpose);
    });
  } catch (e) {
    document.getElementById('chart').replaceChildren(core.renderState('error', {
      title: '结构加载失败', desc: String(e.message || e) }));
  } finally {
    core.markReady();
  }
})();
</script>
</body>
</html>
