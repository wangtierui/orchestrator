<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目总览</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局：栅格、间距、图表高度 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-lg); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); }
  .card { display: flex; flex-direction: column; gap: var(--space-sm); }
  .card h3 { margin: 0; font-size: var(--text-body-size-large); font-weight: 600; }
  .kpi { display: flex; flex-direction: column; gap: var(--space-xxs); }
  .kpi .n { font-size: var(--text-title-size-small); font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: var(--space-sm); }
  .bar { display: flex; height: var(--base-size-8); overflow: hidden; border-radius: 2em; }
  .bar > span { display: block; height: 100%; }
  ol.alerts { margin: 0; padding-left: var(--space-lg); }
  ol.alerts li { margin-bottom: var(--space-xs); }
  @media (max-width: 63.25rem) { .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 48rem) {
    .grid4, .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">项目总览</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <div class="grid4" id="kpiRow"></div>

  <h2 class="h4 m-0">运行与健康</h2>
  <div class="grid4" id="groupA"></div>

  <h2 class="h4 m-0">数据资产</h2>
  <div class="grid4" id="groupB"></div>

  <h2 class="h4 m-0">质量指标</h2>
  <div class="stack" id="groupC"></div>

  <h2 class="h4 m-0">任务</h2>
  <div class="grid2" id="groupD"></div>

  <h2 class="h4 m-0">发布与告警</h2>
  <div class="grid2" id="groupE"></div>
</div>
<script src="/vendor/echarts/echarts.min.js"></script>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    chart: await import('/js/ui/chart.js'),
  };
  const { core, chart } = RCO;

  const fmtBytes = (n) => {
    const v = Number(n) || 0;
    if (v >= 1024 ** 4) return `${(v / 1024 ** 4).toFixed(1)} TB`;
    if (v >= 1024 ** 3) return `${(v / 1024 ** 3).toFixed(1)} GB`;
    if (v >= 1024 ** 2) return `${(v / 1024 ** 2).toFixed(0)} MB`;
    return `${v} B`;
  };
  /* run_at 可能是 Unix 秒时间戳（实测 1793829773.85），要按数字分支处理 */
  function t(s) {
    if (s == null || s === '') return '';
    const n = Number(s);
    if (isFinite(n) && n > 1000000000) {
      const d = new Date(n * 1000);
      const pad = function (x) { return x < 10 ? '0' + x : String(x); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
        + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return String(s).replace('T', ' ').slice(0, 16);
  }
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const card = (title, extra) => {
    const c = el('section', 'border rounded-2 p-3 card');
    c.append(el('h3', '', title));
    if (extra) c.append(el('div', 'text-small', extra));
    return c;
  };
  const kv = (k, v) => {
    const r = el('div', 'kv');
    r.append(el('span', '', k), el('span', 'text-bold', v));
    return r;
  };

  async function load() {
    const [ov, mt, fb] = await Promise.all([
      fetch('/api/overview', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({})),
      fetch('/api/metrics', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({})),
      fetch('/api/feedback', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({})),
    ]);

    const rh = ov.run_health || {};
    const gs = ov.gate_status || {};
    const wl = ov.worklist || {};
    const st = ov.storage || {};
    const fr = ov.freshness || {};
    const al = ov.alerts || {};
    const trend = mt.gate_trend || [];
    const themes = Object.entries(mt.theme_dist || {}).sort((a, b) => b[1] - a[1]);
    const aging = mt.worklist_aging || {};
    const fbOpen = ((fb.items || []).filter((x) => x.status === 'open')).length;

    /* counts 只有 {unknown:N} 时按 step_statuses 统计：
     * rc 取值 OK / FAIL / SKIP（字符串），实测 42 步 = OK 2 + FAIL 1 + SKIP 39。 */
    const statuses = Array.isArray(rh.step_statuses) ? rh.step_statuses : [];
    let ok = 0, bad = 0, skip = 0;
    for (let i = 0; i < statuses.length; i++) {
      const rc = String(statuses[i].rc || '').toUpperCase();
      if (rc === 'OK' || rc === '0') ok++;
      else if (rc === 'SKIP') skip++;
      else if (rc) bad++;
    }

    /* ① KPI 四格 */
    const kpi = document.getElementById('kpiRow');
    const items = [
      ['门禁通过', `${gs.passed ?? '—'} / ${gs.total ?? '—'}`, '#/governance'],
      ['待办未处置', String(wl.open_total ?? '—'), '#/worklist'],
      ['链步成功', `${ok} / ${(rh.steps ?? ok + bad) || '—'}`, '#/flow'],
      ['存储占用', fmtBytes(st.total_bytes), '#/storage'],
    ];
    for (const [label, value, href] of items) {
      const c = el('section', 'border rounded-2 p-3 kpi');
      c.append(el('div', 'text-small', label));
      const n = el('div', 'n');
      const a = el('a', '', value);
      a.href = href;
      n.append(a);
      c.append(n);
      kpi.append(c);
    }

    /* ② 门禁通过（失败项可点） */
    const g = card('门禁通过', `${gs.passed ?? '—'} / ${gs.total ?? '—'} · 运行 ${rh.run_id || '—'}`);
    const failed = gs.failed || [];
    if (!failed.length) {
      g.append(el('div', 'text-small', '全部通过 ✓'));
    } else {
      const ul = el('ul', 'text-small');
      ul.style.margin = '0';
      ul.style.paddingLeft = 'var(--space-lg)';
      failed.slice(0, 4).forEach((f) => {
        const li = el('li');
        const a = el('a', '', f.descr || f.id || '（无描述）');
        a.href = '#/governance';
        li.append(a);
        ul.append(li);
      });
      g.append(ul);
      if (failed.length > 4) g.append(el('div', 'text-small', `另有 ${failed.length - 4} 项`));
    }
    document.getElementById('groupA').append(g);

    /* ③ 链步成功/失败 */
    const steps = card('链步成功 / 失败', `共 ${rh.steps ?? '—'} 步`);
    steps.append(kv('成功', String(ok)), kv('失败', String(bad)));
    if (bad) {
      const names = statuses
        .filter(function (x) {
          const rc = String(x.rc || '').toUpperCase();
          return rc && rc !== 'OK' && rc !== '0' && rc !== 'SKIP';
        })
        .slice(0, 2)
        .map(function (x) { return x.step || x.name || '?'; })
        .join('、');
      if (names) steps.append(el('div', 'text-small', `失败步骤：${names}`));
    }
    document.getElementById('groupA').append(steps);

    /* ④ 链步状态分布（环形） */
    const distCard = card('链步状态分布');
    const distHost = el('div', '');
    distHost.id = 'c-dist';
    distCard.append(distHost);
    document.getElementById('groupA').append(distCard);
    const dist = Object.entries(rh.counts || {}).filter(([, v]) => Number(v) > 0);
    if (dist.length) {
      chart.mountChart({ el: distHost, height: 220, label: '链步状态分布环形图',
        option: { tooltip: { trigger: 'item' },
          series: [{ type: 'pie', radius: ['45%', '70%'],
            data: dist.map(([k, v]) => ({ name: k, value: Number(v) })) }] } });
    } else {
      distHost.replaceChildren(core.renderState('empty', { title: '本轮无步骤记录' }));
    }

    /* ⑤ 运行信息 */
    const info = card('运行信息', rh.run_id || '—');
    info.append(kv('步数', String(rh.steps ?? '—')),
      kv('累计耗时', rh.total_elapsed_s ? `${Math.round(rh.total_elapsed_s / 60)} 分钟` : '—'),
      kv('最近运行', t(rh.run_at)),
      kv('最近完成', t(rh.last_finished_at) || '—'));
    document.getElementById('groupA').append(info);

    /* ⑥ 覆盖文件与条文（接口未提供） */
    const cov = card('覆盖文件与条文');
    cov.append(core.renderState('empty', { title: '接口未提供', desc: '/api/overview 无 coverage 字段' }));
    document.getElementById('groupB').append(cov);

    /* ⑦ 存储占用（5 类占比条） */
    const storage = card('存储占用', fmtBytes(st.total_bytes));
    const ratio = st.ratio || {};
    const bar = el('div', 'bar');
    const palette = chart.palette();
    Object.entries(st.bytes || {}).forEach(([k, v], i) => {
      const seg = el('span', '');
      seg.style.width = `${(ratio[k] || 0) * 100}%`;
      seg.style.background = palette[i % palette.length];
      seg.title = `${k} ${fmtBytes(v)}`;
      bar.append(seg);
    });
    storage.append(bar);
    const list = el('div', 'text-small');
    list.textContent = Object.entries(st.bytes || {})
      .map(([k, v]) => `${k} ${((ratio[k] || 0) * 100).toFixed(1)}%`).join(' · ');
    storage.append(list);
    document.getElementById('groupB').append(storage);

    /* ⑧ 数据新鲜度 */
    const fresh = card('数据新鲜度', `过期 ${fr.stale_count ?? 0} 条`);
    const bys = Object.entries(fr.by_status || {});
    if (bys.length) bys.forEach(([k, v]) => fresh.append(kv(k, String(v))));
    else fresh.append(el('div', 'text-small', '无记录'));
    (fr.stale || []).slice(0, 3).forEach((s) => fresh.append(el('div', 'text-small', `过期：${s.edge || s.name || JSON.stringify(s).slice(0, 30)}`)));
    document.getElementById('groupB').append(fresh);

    /* ⑨ 主题分布（rose） */
    const themeCard = card('主题分布', `${themes.length} 个主题`);
    const themeHost = el('div', '');
    themeCard.append(themeHost);
    document.getElementById('groupB').append(themeCard);
    if (themes.length) {
      chart.mountChart({ el: themeHost, height: 320, label: '主题分布玫瑰图',
        option: { tooltip: { trigger: 'item' }, legend: { type: 'scroll', bottom: 0 },
          series: [{ type: 'pie', roseType: 'radius', radius: ['16%', '72%'],
            data: themes.slice(0, 8).map(([k, v]) => ({ name: k, value: v })) }] } });
    } else {
      themeHost.replaceChildren(core.renderState('empty', { title: '暂无主题数据' }));
    }

    /* ⑩ 门禁趋势（通栏 line） */
    const trendCard = card('门禁通过率趋势');
    const trendHost = el('div', '');
    trendCard.append(trendHost);
    document.getElementById('groupC').append(trendCard);
    if (trend.length >= 2) {
      chart.mountChart({ el: trendHost, height: 220, label: '门禁通过率趋势折线图',
        option: { tooltip: { trigger: 'axis' },
          xAxis: { type: 'category', data: trend.map((x) => String(x.run_id || '').slice(-6)) },
          yAxis: { type: 'value', min: 0, max: 100 },
          series: [{ type: 'line', data: trend.map((x) => x.rate), areaStyle: {} }] } });
    } else {
      trendHost.replaceChildren(core.renderState('empty', { title: '数据点不足', desc: '需 ≥2 次运行' }));
    }

    /* ⑪⑫⑬ 质量三块（接口未返回 quality） */
    const q = mt.quality;
    for (const [title, desc] of [['SLI / SLO 达标率', 'metrics.quality.sli'], ['DAMA 六维', 'metrics.quality.dimensions'], ['质量快照', 'metrics.quality']]) {
      const c = card(title);
      c.append(q ? el('div', 'text-small', JSON.stringify(q).slice(0, 80))
        : core.renderState('empty', { title: '未接入', desc: `接口未返回 ${desc}` }));
      document.getElementById('groupC').append(c);
    }

    /* ⑭ 任务：程序指令 / 用户反馈 */
    const task = card('未处置任务');
    task.append(kv('程序指令', String(wl.open_total ?? '—')), kv('用户反馈', String(fbOpen)));
    const old = wl.oldest_open_days;
    task.append(el('div', 'text-small', old != null ? `最老未处置 ${old} 天` : '最老未处置 —'));
    document.getElementById('groupD').append(task);

    /* ⑮ 任务账龄（bar） */
    const ageCard = card('任务账龄');
    const ageHost = el('div', '');
    ageCard.append(ageHost);
    document.getElementById('groupD').append(ageCard);
    const ageEntries = Object.entries(aging);
    if (ageEntries.length) {
      chart.mountChart({ el: ageHost, height: 220, label: '任务账龄柱状图',
        option: { tooltip: { trigger: 'axis' },
          xAxis: { type: 'category', data: ageEntries.map(([k]) => k) },
          yAxis: { type: 'value' },
          series: [{ type: 'bar', data: ageEntries.map(([, v]) => v), barMaxWidth: 40 }] } });
    } else {
      ageHost.replaceChildren(core.renderState('empty', { title: '暂无数据' }));
    }

    /* ⑯ 发布件 + 契约自检（接口未提供） */
    const rel = card('发布件状态 + 契约自检');
    rel.append(core.renderState('empty', { title: '接口未提供', desc: '/api/overview 无 release / coverage 字段' }));
    document.getElementById('groupE').append(rel);

    /* ⑰ 告警 */
    const alertCard = card('告警', `共 ${al.count ?? 0} 条`);
    const list2 = el('ol', 'alerts text-small');
    (al.alerts || []).slice(0, 5).forEach((a) => {
      const li = el('li', '', `${t(a.at)} · ${a.title || a.event || ''}`);
      list2.append(li);
    });
    if (!(al.alerts || []).length) alertCard.append(el('div', 'text-small', `无近期告警（${al.count ?? 0} 条记录）`));
    else {
      alertCard.append(list2);
      const more = el('a', 'text-small', '查看全部');
      more.href = '#/governance';
      alertCard.append(more);
    }
    document.getElementById('groupE').append(alertCard);

    document.getElementById('stamp').textContent = `最近运行 ${t(rh.run_at) || '—'} · ${new Date().toLocaleTimeString('zh-CN')}`;
  }

  try {
    await load();
  } catch (e) {
    document.getElementById('kpiRow').replaceChildren(core.renderState('error', {
      title: '加载失败', desc: String(e.message || e) }));
  } finally {
    core.markReady();
  }
})();
</script>
</body>
</html>
