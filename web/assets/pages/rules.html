<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司制度</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局；颜色/边框/圆角/字号来自 Primer 类与令牌 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">公司制度</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div id="searchSlot"></div>
  <div id="toolbarSlot"></div>
  <div class="border rounded-2" id="tableSlot"></div>
  <div id="pagerSlot"></div>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  const Q0 = window.RCO_PARAMS || {};
  const state = {
    q: Q0.q || '', sort: Q0.sort || 'title', desc: Q0.desc || '0',
    page: Number(Q0.page || 1), size: Number(Q0.size || 50),
    theme: Q0.theme || '', file_type: Q0.file_type || '',
    density: Q0.density || 'comfortable',
  };

  /* P3：状态即 URL（#/rules?q=&sort=&desc=&page=&density=） */
  let urlMode = 'push';
  function rulesUrl() {
    const qs = new URLSearchParams();
    ['q', 'sort', 'desc', 'page', 'size', 'theme', 'file_type', 'density'].forEach((k) => {
      if (state[k] !== '' && state[k] != null) qs.set(k, String(state[k]));
    });
    return '#/rules' + (qs.toString() ? '?' + qs.toString() : '');
  }
  function pushUrl() {
    const url = rulesUrl();
    if (url === location.hash) return;
    if (urlMode === 'replace') history.replaceState({ page: 'rules' }, '', url);
    else history.pushState({ page: 'rules' }, '', url);
    urlMode = 'push';
  }
  let data = { items: [], total: 0, pages: 1 };
  let tbl = null;

  /* 规格 §9.7.3：名称、文号不可排序；可排序仅 主题 / 类型 */
  const COLUMNS = [
    { key: 'title', label: '名称', width: 'minmax(0,2.6fr)', titleFrom: 'title' },
    { key: 'docno', label: '文号', width: '180px', titleFrom: 'docno' },
    { key: 'theme_label', label: '主题', width: '160px', sortable: true },
    { key: 'file_type', label: '类型', width: '110px', sortable: true, render: (r) => table.badge(r.file_type) },
    { key: 'article_count', label: '条款', width: '80px', align: 'right', render: (r) => (r.article_count ? String(r.article_count) : '—') },
  ];

  async function fetchPage() {
    const qs = new URLSearchParams({ page: String(state.page), size: String(state.size),
      sort: state.sort, desc: state.desc });
    if (state.q) qs.set('q', state.q);
    if (state.theme) qs.set('theme', state.theme);
    if (state.file_type) qs.set('file_type', state.file_type);
    const res = await fetch(`/api/rules?${qs}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function renderAll() {
    if (!tbl) {
      tbl = table.renderTable({
        columns: COLUMNS, rows: data.items, density: state.density, label: '公司制度列表',
        sortKey: state.sort, sortDir: state.desc === '1' ? 'desc' : 'asc',
        onSort: (key, dir) => { state.sort = key; state.desc = dir === 'desc' ? '1' : '0'; state.page = 1; refresh(); },
        empty: { title: '没有匹配的制度', desc: '换个关键词，或清除筛选' },
      });
      document.getElementById('tableSlot').append(tbl.el);
    } else {
      tbl.update(data.items, state.density);
    }
    document.getElementById('pagerSlot').replaceChildren(controls.renderPagination({
      page: data.page || state.page, pages: data.pages || 1, total: data.total, size: state.size,
      onChange: (p) => { state.page = p; refresh(); },
    }));
    document.getElementById('stamp').textContent =
      `共 ${core.fmtInt(data.total)} 条 · ${new Date().toLocaleTimeString('zh-CN')}`;
  }

  async function refresh() {
    pushUrl();   /* 唯一出口：任何状态变更都回写 URL */
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      data = await fetchPage();
      renderAll();
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: refresh },
      }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索公司制度', placeholder: '搜索或筛选：主题:T1、文号:…（回车应用）',
    onInput: (v) => { state.q = v; state.page = 1; urlMode = 'replace'; refresh(); },
    onSubmit: (v) => { state.q = v; state.page = 1; refresh(); },
  }).el);

  const facets = await fetch('/api/rules/facets', { cache: 'no-store' })
    .then((r) => r.json()).catch(() => ({}));

  document.getElementById('toolbarSlot').append(controls.renderToolbar({
    segments: [{ key: 'all', label: '全部' }, { key: 'policy', label: '制度' }],
    active: 'all',
    filters: [{ key: 'theme', label: '主题' }, { key: 'file_type', label: '类型' }],
    density: state.density,
    onSegment: (k) => { state.file_type = k === 'policy' ? 'policy' : ''; state.page = 1; refresh(); },
    onFilter: async (f, btn) => {
      const bucket = facets[f.key] || facets[f.key === 'theme' ? 'themes' : 'types'] || [];
      const opts = bucket.map((o) => ({ key: o.value, label: o.label, count: o.count }));
      await controls.openPanel({
        anchor: btn, label: `筛选：${f.label}`, items: opts,
        onPick: (it) => { state[f.key] = it.key; state.page = 1; refresh(); },
      });
    },
    onDensity: (d) => { state.density = d; tbl && tbl.setDensity(d); },
  }));

  refresh();
})();
</script>
</body>
</html>
