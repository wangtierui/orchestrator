<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本管理</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">版本管理</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div id="cardsSlot" class="row"></div>
  <div id="searchSlot"></div>
  <div class="border rounded-2" id="tableSlot"></div>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  let commits = [];
  let tbl = null;
  let q = '';

  /* P3：搜索词写 URL */
  let urlMode = 'push';
  function pushUrl() {
    const url = q ? `#/release?q=${encodeURIComponent(q)}` : '#/release';
    if (url === location.hash) return;
    if (urlMode === 'replace') history.replaceState({ page: 'release' }, '', url);
    else history.pushState({ page: 'release' }, '', url);
    urlMode = 'push';
  }

  const COLUMNS = [
    { key: 'date', label: '日期', width: '120px' },
    { key: 'subject', label: '提交主题', width: 'minmax(0,3fr)', titleFrom: 'subject' },
    { key: 'sha', label: 'sha', width: '110px', render: (r) => table.badge(String(r.sha || '').slice(0, 7)) },
    { key: 'act', label: '操作', width: '90px', render: (r) => {
      const b = document.createElement('button');
      b.className = 'btn btn-sm'; b.type = 'button'; b.textContent = '复制';
      b.setAttribute('aria-label', `复制 ${r.sha} 的完整 sha`);
      b.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(r.sha);
          b.textContent = '已复制';
          setTimeout(() => { b.textContent = '复制'; }, 1200);
        } catch (e) {
          alert(`复制失败：${e.message}（非 https 环境浏览器会拒绝）`);
        }
      });
      return b;
    } },
  ];

  function card(label, value, hint) {
    const box = document.createElement('div');
    box.className = 'border rounded-2 p-3';
    box.style.flex = '1 1 0';
    box.innerHTML = `<div class="text-small">${label}</div>
      <div class="text-bold" style="font-size:var(--text-title-size-small)">${value}</div>
      ${hint ? `<div class="text-small">${hint}</div>` : ''}`;
    return box;
  }

  function renderCards(d) {
    const host = document.getElementById('cardsSlot');
    const sbom = d.sbom || {};
    host.replaceChildren(
      card('提交总数', core.fmtInt(d.commit_total || commits.length), '来自 /api/release'),
      card('发布件', sbom.available ? core.fmtInt(sbom.count || 0) : '未生成', sbom.updated_at || ''),
      card('契约版本', d.contract_version || '—', '与条文契约自检同源'),
    );
  }

  function rows() {
    if (!q) return commits;
    const k = q.toLowerCase();
    return commits.filter((c) => `${c.sha} ${c.subject} ${c.date}`.toLowerCase().includes(k));
  }

  function render() {
    pushUrl();   /* 唯一出口 */
    const data = rows();
    if (!tbl) {
      tbl = table.renderTable({ columns: COLUMNS, rows: data, label: '提交列表',
        density: 'compact',
        empty: { title: '没有匹配的提交', desc: '换个关键词' } });
      document.getElementById('tableSlot').append(tbl.el);
    } else tbl.update(data);
    document.getElementById('stamp').textContent = `显示 ${data.length} / ${commits.length} 条 · ${new Date().toLocaleTimeString('zh-CN')}`;
  }

  async function load() {
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      const d = await fetch('/api/release', { cache: 'no-store' }).then((r) => r.json());
      commits = d.commits || [];
      renderCards(d);
      render();
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: load } }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索提交', placeholder: '搜 sha / 主题 / 日期…',
    onInput: (v) => { q = v; urlMode = 'replace'; render(); },
    onSubmit: (v) => { q = v; render(); },
  }).el);

  const __q0 = (window.RCO_PARAMS || {}).q || '';
  if (__q0) {
    q = __q0;
    const box = document.getElementById('q');
    if (box) box.value = __q0;
  }
  load();
})();
</script>
</body>
</html>
