<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>程序指令</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .bulk { display: flex; align-items: center; gap: var(--space-sm); }
  .detail { padding: var(--space-lg); background: var(--bgColor-muted); }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">程序指令</h1>
    <span class="text-small" id="stamp"></span>
  </div>
  <div id="searchSlot"></div>
  <div id="toolbarSlot"></div>
  <div id="bulkSlot" hidden class="border rounded-2 p-2 bulk" role="region" aria-label="批量处置">
    <span class="text-small" id="bulkCount">已选 0 条</span>
    <span class="grow"></span>
    <select id="bulkStatus" class="form-select" style="width:140px" aria-label="处置状态">
      <option value="resolved">已办结</option>
      <option value="dismissed">不适用</option>
    </select>
    <input id="bulkWhy" class="form-control" style="width:280px" placeholder="理由（必填，进审计台账）" aria-label="批量处置理由">
    <button id="bulkGo" class="btn btn-primary" type="button">批量处置</button>
    <button id="bulkCancel" class="btn" type="button">取消</button>
  </div>
  <div class="border rounded-2" id="tableSlot"></div>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  const state = { status: 'open', kind: '', q: '', density: 'comfortable' };
  let rows = [];
  let tbl = null;

  const COLUMNS = [
    { key: 'kind', label: 'kind', width: '190px', render: (r) => table.badge(r.kind) },
    { key: 'subject', label: '名称', width: 'minmax(0,2.2fr)', titleFrom: 'subject' },
    { key: 'suggestion', label: '建议', width: 'minmax(0,1.6fr)', titleFrom: 'suggestion' },
    { key: 'confidence', label: '置信度', width: '90px', align: 'right',
      render: (r) => (r.confidence == null ? '—' : Number(r.confidence).toFixed(2)) },
    { key: 'created_at', label: '时间', width: '150px',
      render: (r) => (r.created_at || '').replace('T', ' ').slice(0, 16) },
    { key: 'act', label: '操作', width: '80px', render: (r) => {
      const b = document.createElement('button');
      b.className = 'btn btn-sm'; b.type = 'button'; b.textContent = '处置';
      b.addEventListener('click', (e) => { e.stopPropagation(); openInline(r); });
      return b;
    } },
  ];

  /* 行内处置：在目标行后插入一个详情块（规格 §9.8.1） */
  function openInline(row) {
    document.querySelectorAll('.detail').forEach((d) => d.remove());
    const host = tbl.el.querySelector('.rco-tbl__body');
    if (!host) return;
    const form = controls.renderForm({
      fields: [
        { key: 'status', label: '处置状态', type: 'select', required: true,
          options: [{ value: 'resolved', label: '已办结' }, { value: 'dismissed', label: '不适用' }] },
        { key: 'why', label: '处置理由', type: 'textarea', required: true },
      ],
      actions: [{ key: 'cancel', label: '取消', onClick: () => box.remove() },
        { key: 'submit', label: '提交', variant: 'primary' }],
      onSubmit: async (v) => {
        const out = await post(row.item_id, v.status, v.why);
        if (!out.ok) { alert(out.reason || '提交失败'); return; }
        box.remove();
        refresh();
      },
    });
    const box = document.createElement('div');
    box.className = 'detail';
    box.append(form.el);
    host.append(box);
    box.querySelector('select')?.focus();
  }

  async function post(itemId, status, why) {
    const res = await fetch('/api/worklist/resolve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: itemId, status, resolution: why, by: 'web' }),
    });
    return res.json().catch(() => ({ ok: false, reason: `HTTP ${res.status}` }));
  }

  function bulkBar() {
    const box = document.getElementById('bulkSlot');
    const sel = tbl ? tbl.selection() : [];
    box.hidden = sel.length === 0;
    document.getElementById('bulkCount').textContent = `已选 ${sel.length} 条`;
    return sel;
  }

  async function refresh() {
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      const d = await fetch(`/api/worklist?status=${state.status}`, { cache: 'no-store' }).then((r) => r.json());
      rows = (d.items || []).filter((x) => {
        if (state.kind && x.kind !== state.kind) return false;
        if (state.q) {
          const hay = `${x.item_id} ${x.subject} ${x.kind} ${x.suggestion || ''}`.toLowerCase();
          if (!hay.includes(state.q.toLowerCase())) return false;
        }
        return true;
      });
      if (!tbl) {
        tbl = table.renderTable({ columns: COLUMNS, rows, density: state.density, selectable: true,
          label: '程序指令列表', onSelect: bulkBar,
          empty: { title: '当前没有待受理项', desc: '切换状态或清除筛选' } });
        document.getElementById('tableSlot').append(tbl.el);
      } else tbl.update(rows, state.density);
      document.getElementById('stamp').textContent = `共 ${core.fmtInt((d.items || []).length)} 条 · 筛选后 ${rows.length}`;
      bulkBar();
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: refresh } }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索程序指令', placeholder: '搜编号 / 名称 / kind…',
    onInput: (v) => { state.q = v; refresh(); },
    onSubmit: (v) => { state.q = v; refresh(); },
  }).el);

  document.getElementById('toolbarSlot').append(controls.renderToolbar({
    segments: [{ key: 'open', label: '待受理' }, { key: 'resolved', label: '已办结' }],
    active: state.status,
    filters: [{ key: 'kind', label: 'kind' }],
    density: state.density,
    onSegment: (k) => { state.status = k; refresh(); },
    onFilter: async (f, btn) => {
      const kinds = await fetch('/api/worklist/kinds').then((r) => r.json()).catch(() => ({}));
      const opts = (kinds.kinds || []).map((k) => ({ key: k, label: k }));
      await controls.openPanel({ anchor: btn, label: '筛选：kind', items: opts,
        onPick: (it) => { state.kind = it.key; refresh(); } });
    },
    onDensity: (d) => { state.density = d; tbl && tbl.setDensity(d); },
  }));

  document.getElementById('bulkGo').addEventListener('click', async () => {
    const sel = tbl ? tbl.selection() : [];
    const why = document.getElementById('bulkWhy').value.trim();
    if (!sel.length) { alert('未选择任何条目'); return; }
    if (!why) { alert('批量处置必须填理由（进审计台账）'); return; }
    const status = document.getElementById('bulkStatus').value;
    let ok = 0; let bad = 0;
    for (const row of sel) {
      const out = await post(row.item_id, status, why);
      if (out.ok) ok++; else bad++;
    }
    alert(`成功 ${ok} 条${bad ? `，失败 ${bad} 条` : ''}`);
    document.getElementById('bulkWhy').value = '';
    tbl.clearSelection();
    refresh();
  });
  document.getElementById('bulkCancel').addEventListener('click', () => { tbl && tbl.clearSelection(); bulkBar(); });

  refresh();
})();
</script>
</body>
</html>
