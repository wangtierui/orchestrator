<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档检索</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">文档检索</h1>
    <span class="text-small" id="stamp" aria-live="polite"></span>
  </div>
  <div id="searchSlot"></div>
  <div class="row">
    <div role="group" aria-label="结果类型" class="row">
      <button class="btn btn-sm" id="tabRecord" type="button" aria-pressed="true">记录</button>
      <button class="btn btn-sm" id="tabArticle" type="button" aria-pressed="false"
              disabled title="条文检索需后端 /api/search?type=article（施工项 E3）">条文</button>
    </div>
    <span class="grow"></span>
    <span class="text-small" id="mode"></span>
  </div>
  <div class="border rounded-2" id="tableSlot"></div>
  <p class="text-small m-0">接口固定返回 20 条（无 total/offset），因此本页不分页——要翻页需后端补 total/offset（E3）。</p>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  let tbl = null;
  let lastQ = '';

  const COLUMNS = [
    { key: 'title', label: '标题', width: 'minmax(0,2.6fr)', titleFrom: 'title' },
    { key: 'document_number', label: '文号', width: '170px' },
    { key: 'theme_label', label: '主题', width: '150px' },
    { key: 'timeliness_status', label: '时效', width: '90px', render: (r) => table.badge(r.timeliness_status) },
    { key: 'source', label: '来源', width: '80px' },
    { key: 'publish_date', label: '日期', width: '110px' },
    { key: 'body_len', label: '字数', width: '80px', align: 'right',
      render: (r) => (r.body_len ? core.fmtInt(r.body_len) : '—') },
  ];

  async function run(q) {
    lastQ = q;
    if (!q.trim()) {
      document.getElementById('tableSlot').replaceChildren(
        core.renderState('empty', { title: '输入关键词开始检索', desc: '≥3 字走全文索引，2 字内为模糊匹配' }));
      document.getElementById('stamp').textContent = '';
      document.getElementById('mode').textContent = '';
      core.markReady();
      return;
    }
    document.getElementById('tableSlot').setAttribute('aria-busy', 'true');
    try {
      const d = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { cache: 'no-store' })
        .then((r) => r.json());
      const rows = d.results || [];
      document.getElementById('stamp').textContent = `命中 ${rows.length} 条`;
      document.getElementById('mode').textContent = `模式：${d.mode === 'fts' ? '全文索引' : '模糊匹配'}`;
      if (!tbl) {
        tbl = table.renderTable({ columns: COLUMNS, rows, label: '检索结果',
          empty: { title: '无命中', desc: '换个关键词，或确认底座已发布' } });
        document.getElementById('tableSlot').append(tbl.el);
      } else tbl.update(rows);
    } catch (e) {
      document.getElementById('tableSlot').replaceChildren(core.renderState('error', {
        title: '检索失败', desc: String(e.message || e), action: { label: '重试', onClick: () => run(lastQ) } }));
    } finally {
      document.getElementById('tableSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索文档', placeholder: '搜索标题 / 文号 / 全文…（回车应用）',
    onInput: (v) => { if (v.length >= 2) run(v); },
    onSubmit: (v) => run(v),
  }).el);

  document.getElementById('tabRecord').addEventListener('click', () => {
    document.getElementById('tabRecord').setAttribute('aria-pressed', 'true');
    document.getElementById('tabArticle').setAttribute('aria-pressed', 'false');
  });

  run('');
})();
</script>
</body>
</html>
