<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>治理审计</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-lg); }
  .kpi .n { font-size: var(--text-title-size-small); font-weight: 600; }
  .h2 { font-size: var(--text-body-size-large); font-weight: 600; margin: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">治理审计</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <div class="kpi" id="kpi"></div>

  <div id="searchSlot"></div>

  <section class="stack">
    <h2 class="h2">运行时间线</h2>
    <div class="border rounded-2" id="runsSlot"></div>
  </section>

  <section class="stack">
    <h2 class="h2">变更台账 <span class="text-small" id="auditFilter"></span></h2>
    <div class="border rounded-2" id="auditSlot"></div>
  </section>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { table, controls, core } = RCO;

  let runs = [];
  let audit = [];
  let runsTbl = null;
  let auditTbl = null;
  let q = '';
  let onlyRun = '';        /* 点运行行后台账过滤（§9.4 两表联动） */

  const shortTime = (s) => (s || '').replace('T', ' ').slice(0, 16);
  const dur = (r) => {
    const a = Date.parse(r.started_at || '');
    const b = Date.parse(r.finished_at || '');
    if (!a || !b) return '—';
    const m = Math.round((b - a) / 60000);
    return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分` : `${m} 分钟`;
  };
  const nz = (v) => (v == null || v === '' ? '—' : String(v));

  const RUN_COLS = [
    { key: 'ok', label: '', width: '24px', render: (r) => table.badge(r.finished_at ? '✓' : '…') },
    { key: 'started_at', label: '开始', width: '150px', render: (r) => shortTime(r.started_at) },
    { key: 'finished_at', label: '结束', width: '150px', render: (r) => shortTime(r.finished_at) },
    { key: 'dur', label: '耗时', width: '120px', render: (r) => dur(r) },
    { key: 'run_id', label: '运行', width: 'minmax(0,1fr)', titleFrom: 'run_id' },
  ];

  const AUDIT_COLS = [
    { key: 'ts', label: '时间', width: '150px', render: (r) => shortTime(r.ts) },
    { key: 'target', label: '对象', width: 'minmax(0,1.2fr)', render: (r) => `${nz(r.target)}${r.target_key ? ' · ' + r.target_key : ''}` },
    { key: 'field', label: '字段', width: '150px' },
    { key: 'change', label: '变更', width: 'minmax(0,1.6fr)', wrap: true, render: (r) => {
      const box = document.createElement('span');
      box.textContent = `${nz(r.old_value)} → ${nz(r.new_value)}`.slice(0, 160);
      return box;
    } },
    { key: 'actor', label: '操作者', width: '220px', titleFrom: 'actor' },
  ];

  function computeKpi() {
    const total = runs.length;
    const done = runs.filter((r) => r.finished_at).length;
    const rate = total ? Math.round((done / total) * 100) : 0;
    const mins = runs.map((r) => {
      const a = Date.parse(r.started_at || ''); const b = Date.parse(r.finished_at || '');
      return a && b ? (b - a) / 60000 : null;
    }).filter((x) => x != null).sort((x, y) => x - y);
    const med = mins.length ? Math.round(mins[Math.floor(mins.length / 2)]) : 0;
    const items = [
      ['运行', String(total), '条'],
      ['已结束', String(done), '条'],
      ['完成率', String(rate), '%'],
      ['耗时中位数', String(med), '分钟'],
    ];
    const host = document.getElementById('kpi');
    host.replaceChildren();
    for (const [label, value, unit] of items) {
      const card = document.createElement('div');
      card.className = 'border rounded-2 p-3';
      card.innerHTML = `<div class="text-small">${label}</div><div class="n">${value}<span class="text-small"> ${unit}</span></div>`;
      host.append(card);
    }
  }

  function filteredAudit() {
    return audit.filter((a) => {
      if (onlyRun && a.target_key !== onlyRun && !String(a.target_key || '').includes(onlyRun)) return false;
      if (!q) return true;
      const hay = `${a.ts} ${a.actor} ${a.action} ${a.target} ${a.target_key} ${a.field}`.toLowerCase();
      return hay.includes(q.toLowerCase());
    });
  }

  function renderAudit() {
    const rows = filteredAudit();
    if (!auditTbl) {
      auditTbl = table.renderTable({ columns: AUDIT_COLS, rows, label: '变更台账',
        empty: { title: '没有匹配的变更', desc: onlyRun ? '该运行未产生审计记录' : '清空搜索试试' } });
      document.getElementById('auditSlot').append(auditTbl.el);
    } else auditTbl.update(rows);
    document.getElementById('auditFilter').textContent = onlyRun ? `（已按运行过滤：${onlyRun}）` : '';
  }

  async function load() {
    document.getElementById('runsSlot').setAttribute('aria-busy', 'true');
    try {
      const d = await fetch('/api/governance', { cache: 'no-store' }).then((r) => r.json());
      runs = d.runs || [];
      audit = d.audit || [];
      computeKpi();
      if (!runsTbl) {
        runsTbl = table.renderTable({ columns: RUN_COLS, rows: runs, label: '运行时间线',
          density: 'compact',
          onRow: (r) => { onlyRun = onlyRun === r.run_id ? '' : r.run_id; renderAudit(); },
          empty: { title: '尚未运行', desc: '点此触发一次运行' } });
        document.getElementById('runsSlot').append(runsTbl.el);
      } else runsTbl.update(runs);
      renderAudit();
      document.getElementById('stamp').textContent =
        `运行 ${runs.length} 条 · 审计 ${audit.length} 条 · ${new Date().toLocaleTimeString('zh-CN')}`;
    } catch (e) {
      document.getElementById('runsSlot').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: load } }));
    } finally {
      document.getElementById('runsSlot').removeAttribute('aria-busy');
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索审计台账', placeholder: '搜索 id / 对象 / 字段 / 操作者…',
    onInput: (v) => { q = v; renderAudit(); },
    onSubmit: (v) => { q = v; renderAudit(); },
  }).el);

  load();
})();
</script>
</body>
</html>
