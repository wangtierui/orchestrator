<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关系图谱</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-lg); }
  .hubs { margin: 0; padding-left: var(--space-lg); }
  @media (max-width: 63.25rem) { .split { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">关系图谱</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <div class="row" id="tabsSlot" role="group" aria-label="图谱视图"></div>

  <div class="split">
    <section class="border rounded-2 p-3">
      <div id="chart"></div>
      <div class="text-small" id="note"></div>
    </section>
    <section class="border rounded-2 p-3">
      <h3 class="h4 m-0">高频节点</h3>
      <ol class="hubs text-small" id="hubs"></ol>
    </section>
  </div>
</div>
<script src="/vendor/echarts/echarts.min.js"></script>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    chart: await import('/js/ui/chart.js'),
  };
  const { core, chart } = RCO;

  const host = document.getElementById('chart');
  const note = document.getElementById('note');

  /* 骨架先出：/api/relations 冷启动实测 26s，不能让页面空白等着 */
  host.replaceChildren(core.renderSkeleton(6));
  note.textContent = '正在加载关系数据（该接口冷启动约 20–30 秒）…';

  let inst = null;

  /* 接口里不同视图的 nodes/edges 形状不一致（数组 / 以 id 为键的对象），
   * 之前直接 .map 会抛 TypeError，导致点击视图后页面毫无反应（实测）。 */
  function asArr(x) {
    if (Array.isArray(x)) return x;
    if (x && typeof x === 'object') return Object.values(x);
    return [];
  }

  function draw(view) {
    if (inst) inst.dispose();
    const nodes = asArr(view.nodes).map((n) => ({
      name: n.name || n.id, value: n.value, symbolSize: 8 + Math.min(22, (n.degree || 1) * 2),
    }));
    const edges = asArr(view.edges).map((e) => ({
      source: e.source || e.from, target: e.target || e.to,
    }));
    if (!nodes.length || !edges.length) {
      host.replaceChildren(core.renderState('empty', { title: '暂无关系', desc: view.note || '' }));
      return;
    }
    inst = chart.mountChart({
      el: host, height: 560, label: `关系图谱：${view.label || ''}`,
      option: {
        tooltip: { confine: true },
        series: [{
          type: 'graph', layout: 'force', roam: true, draggable: true,
          data: nodes, links: edges,
          force: { repulsion: 120, edgeLength: 60, gravity: 0.08 },
          label: { show: true, fontSize: 10, position: 'right' },
          lineStyle: { opacity: 0.45 },
          emphasis: { focus: 'adjacency' },
        }],
      },
    });
    note.textContent = `${view.label || ''}：节点 ${nodes.length} · 边 ${edges.length}${view.note ? ' · ' + view.note : ''}`;
  }

  function renderTabs(views, active) {
    const box = document.getElementById('tabsSlot');
    box.replaceChildren();
    views.forEach((v) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-sm';
      b.textContent = v.label || v.key;
      b.setAttribute('aria-pressed', String(v.key === active));
      if (v.key === active) b.classList.add('btn-primary');
      b.addEventListener('click', () => {
        if (v.key && `#/graph?view=${encodeURIComponent(v.key)}` !== location.hash) {
          history.pushState({ page: 'graph' }, '', `#/graph?view=${encodeURIComponent(v.key)}`);
        }
        renderTabs(views, v.key);
        draw(v);
      });
      box.append(b);
    });
  }

  function renderHubs(hubs) {
    const ol = document.getElementById('hubs');
    ol.replaceChildren();
    if (!hubs.length) {
      ol.append(document.createTextNode('无高频节点'));
      return;
    }
    hubs.slice(0, 12).forEach((h) => {
      const li = document.createElement('li');
      li.textContent = `${h.name || h.id} · ${h.degree || h.count || 0}`;
      ol.append(li);
    });
  }

  try {
    const d = await fetch('/api/relations', { cache: 'no-store' }).then((r) => r.json());
    const views = d.views || [];
    if (!views.length) {
      host.replaceChildren(core.renderState('empty', { title: '暂无关系数据', desc: '先跑一次关系抽取' }));
      core.markReady();
      return;
    }
    const __want = (window.RCO_PARAMS || {}).view;
    const __hit = views.find((x) => x.key === __want) || views[0];
    renderTabs(views, __hit.key);
    draw(__hit);
    renderHubs(d.hubs || []);
    document.getElementById('stamp').textContent =
      `视图 ${views.length} 个 · 边合计 ${(d.counts && d.counts.total) ?? '—'}`;
  } catch (e) {
    host.replaceChildren(core.renderState('error', {
      title: '关系数据加载失败', desc: String(e.message || e) }));
  } finally {
    core.markReady();
  }
})();
</script>
</body>
</html>
