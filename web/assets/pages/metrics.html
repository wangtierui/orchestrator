<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指标</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局：栅格、间距、图表高度 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
  .card { display: flex; flex-direction: column; gap: var(--space-sm); }
  .card h3 { margin: 0; font-size: var(--text-body-size-large); font-weight: 600; }
  @media (max-width: 63.25rem) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 48rem) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">指标</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <section class="border rounded-2 p-3 card">
    <h3>门禁通过率趋势</h3>
    <div id="c-gate"></div>
  </section>

  <div class="grid3">
    <section class="border rounded-2 p-3 card"><h3>待办账龄</h3><div id="c-age"></div></section>
    <section class="border rounded-2 p-3 card"><h3>时效三态</h3><div id="c-time"></div></section>
    <section class="border rounded-2 p-3 card"><h3>关系类型</h3><div id="c-rel"></div></section>
  </div>

  <section class="border rounded-2 p-3 card">
    <h3>主题分布（Top 8）</h3>
    <div id="c-theme"></div>
  </section>

  <p class="text-small m-0">数据来自 /api/metrics；quality（SLI/DAMA）当前接口未返回，故本页不画。</p>
</div>
<script src="/vendor/echarts/echarts.min.js"></script>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    chart: await import('/js/ui/chart.js'),
  };
  const { core, chart } = RCO;
  const charts = [];

  function mount(id, option, height, label) {
    const host = document.getElementById(id);
    if (!host) return;
    const inst = chart.mountChart({ el: host, option, height, label });
    charts.push(inst);
  }

  function barOf(dict, opts = {}) {
    const entries = Object.entries(dict || {});
    return {
      xAxis: { type: 'category', data: entries.map(([k]) => k) },
      yAxis: { type: 'value' },
      series: [{ type: 'bar', data: entries.map(([, v]) => v), barMaxWidth: 40 }],
      tooltip: { trigger: 'axis' },
      ...opts,
    };
  }

  async function load() {
    try {
      const d = await fetch('/api/metrics', { cache: 'no-store' }).then((r) => r.json());

      /* ① 趋势：折线，<2 点给空态 */
      const trend = d.gate_trend || [];
      if (trend.length >= 2) {
        mount('c-gate', {
          xAxis: { type: 'category', data: trend.map((x) => String(x.run_id || '').slice(-6)) },
          yAxis: { type: 'value', min: 0, max: 100 },
          series: [{ type: 'line', data: trend.map((x) => x.rate), smooth: false, areaStyle: {} }],
          tooltip: { trigger: 'axis' },
        }, 220, '门禁通过率趋势折线图');
      } else {
        document.getElementById('c-gate').replaceChildren(
          core.renderState('empty', { title: '数据点不足', desc: '至少需要 2 次运行' }));
      }

      /* ② 待办账龄：柱 */
      mount('c-age', barOf(d.worklist_aging), 220, '待办账龄柱状图');

      /* ③ 时效三态：柱（规格明确不是饼） */
      mount('c-time', barOf(d.timeliness_tri), 220, '时效三态柱状图');

      /* ④ 关系类型：柱（by_kind） */
      const byKind = (d.relations && d.relations.relations && d.relations.relations.by_kind) || {};
      mount('c-rel', barOf(byKind), 220, '关系类型柱状图');

      /* ⑤ 主题分布：玫瑰图，半径=条数 */
      const themes = Object.entries(d.theme_dist || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
      mount('c-theme', {
        tooltip: { trigger: 'item' },
        legend: { type: 'scroll', bottom: 0 },
        series: [{
          type: 'pie',
          roseType: 'radius',
          radius: ['16%', '76%'],
          data: themes.map(([k, v]) => ({ name: k, value: v })),
        }],
      }, 320, '主题分布玫瑰图');

      document.getElementById('stamp').textContent =
        `趋势 ${trend.length} 点 · 主题 ${Object.keys(d.theme_dist || {}).length} 个 · ${new Date().toLocaleTimeString('zh-CN')}`;
    } catch (e) {
      document.getElementById('c-gate').replaceChildren(core.renderState('error', {
        title: '加载失败', desc: String(e.message || e), action: { label: '重试', onClick: load } }));
    } finally {
      core.markReady();
    }
  }

  load();
})();
</script>
</body>
</html>
