<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指标 · 平行重建样板页（三列图表）</title>
<link rel="stylesheet" href="../primer-primitives.css">
<link rel="stylesheet" href="../primer.css">
<style>
  body { background: var(--bgColor-default); }
  .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid3 > .full { grid-column: 1 / -1; }
  .card { padding: 16px; }
  .card > h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600;
              display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart { width: 100%; height: 220px; }
  .chart.tall { height: 300px; }
  @media (max-width: 1011px) { .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 767px)  { .grid3 { grid-template-columns: 1fr; } }
  .gap-2 { gap: 8px; }   /* Primer 22 无此工具类，按布局补 */
</style>
</head>
<body>
<div class="page">
  <div class="d-flex flex-items-center flex-wrap gap-2 mb-3">
    <h2 class="h3 m-0">指标</h2>
    <span id="stamp" class="text-small"></span>
    <span class="flex-auto"></span>
    <span class="text-small">数据源：/api/metrics</span>
  </div>

  <div class="grid3">
    <div class="border rounded-2 card full">
      <h3><span>门禁通过率趋势</span><span id="g1" class="text-small"></span></h3>
      <div id="c-gate" class="chart" role="img" aria-label="门禁通过率趋势"></div>
    </div>

    <div class="border rounded-2 card">
      <h3><span>时效分布</span></h3>
      <div id="c-time" class="chart" role="img" aria-label="时效分布"></div>
    </div>

    <div class="border rounded-2 card">
      <h3><span>待办账龄</span></h3>
      <div id="c-age" class="chart" role="img" aria-label="待办账龄"></div>
    </div>

    <div class="border rounded-2 card">
      <h3><span>关系类型</span></h3>
      <div id="c-rel" class="chart" role="img" aria-label="关系类型"></div>
    </div>

    <div class="border rounded-2 card full">
      <h3><span>主题分布</span></h3>
      <div id="c-theme" class="chart tall" role="img" aria-label="主题分布"></div>
    </div>
  </div>
</div>

<script src="../vendor/echarts/echarts.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const charts = {};
const base = {
  textStyle: { fontSize: 11 },
  grid: { left: 8, right: 16, top: 16, bottom: 8, containLabel: true },
};

function init(id) {
  if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
  return charts[id];
}

function line(id, xs, ys) {
  init(id).setOption({
    ...base,
    tooltip: { trigger: "axis" },
    xAxis: { type: "category", data: xs, axisLabel: { fontSize: 10, rotate: 0 } },
    yAxis: { type: "value", max: 100, splitLine: { lineStyle: { type: "dashed" } } },
    series: [{ type: "line", data: ys, smooth: true, symbolSize: 5,
               areaStyle: { opacity: 0.12 } }],
  }, true);
}

function pie(id, data) {
  init(id).setOption({
    textStyle: { fontSize: 11 },
    tooltip: { trigger: "item" },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    series: [{ type: "pie", radius: ["42%", "66%"], center: ["50%", "44%"],
               label: { show: false }, data }],
  }, true);
}

function bar(id, xs, ys, opts) {
  const o = opts || {};
  init(id).setOption({
    ...base,
    tooltip: { trigger: "axis" },
    xAxis: o.horizontal ? { type: "value" } : { type: "category", data: xs, axisLabel: { fontSize: 10 } },
    yAxis: o.horizontal ? { type: "category", data: xs, axisLabel: { fontSize: 11 } }
                        : { type: "value" },
    series: [{ type: "bar", data: ys, barMaxWidth: 18 }],
  }, true);
}

async function load() {
  const d = await (await fetch("/api/metrics", { cache: "no-store" })).json();
  $("#stamp").textContent = d.fetched_at || "";

  const gt = d.gate_trend || [];
  $("#g1").textContent = gt.length ? `最近 ${gt.length} 轮` : "";
  line("c-gate", gt.map((x) => String(x.run_id || "").slice(-8)), gt.map((x) => x.rate));

  const tt = d.timeliness_tri || {};
  pie("c-time", Object.entries(tt).map(([k, v]) => ({ name: k, value: Number(v) || 0 })));

  const wa = d.worklist_aging || {};
  bar("c-age", Object.keys(wa), Object.values(wa).map(Number));

  const rel = (d.relations && d.relations.relations) || {};
  const bk = rel.by_kind || {};
  bar("c-rel", Object.keys(bk), Object.values(bk).map(Number));

  const td = d.theme_dist || {};
  const names = Object.keys(td).sort((a, b) => td[b] - td[a]).slice(0, 8).reverse();
  bar("c-theme", names, names.map((n) => Number(td[n]) || 0), { horizontal: true });
}

window.addEventListener("resize", () => Object.values(charts).forEach((c) => c.resize()));
load();
</script>
</body>
</html>
