<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<script src="/js/ui/err.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监管统计（EAST）</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
  .kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-lg); }
  .kpi .n { font-size: var(--text-title-size-small); font-weight: 600; }
  @media (max-width: 63.25rem) { .kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 48rem) { .kpi { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">监管统计（EAST）</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <div class="kpi" id="kpi"></div>

  <div id="searchSlot"></div>

  <section class="stack">
    <h2 class="h4 m-0">数据结构（全部主题域）</h2>
    <div class="border rounded-2" id="tablesSlot"></div>
  </section>

  <section class="stack">
    <h2 class="h4 m-0">数据元</h2>
    <div class="border rounded-2" id="elementsSlot"></div>
  </section>

  <p class="text-small m-0">
    本页只呈现 EAST 规范自身的内容（数据表 / 数据元 / 计数），不再列出其他分类的条目数与卡片。
    数据按规范原样展示，**不做排序**（旧版 EAST 各表同样无排序），列筛选与分页需后端支持（E3/E5）。
  </p>
</div>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    controls: await import('/js/ui/controls.js'),
  };
  const { core, table, controls } = RCO;

  let tables = [];
  let elements = [];
  let tTbl = null;
  let eTbl = null;
  let q = '';

  const TABLE_COLS = [
    { key: 'table_no', label: '表号', width: '90px' },
    { key: 'table_code', label: '表编码', width: '120px' },
    { key: 'table_name', label: '表中文名', width: 'minmax(0,1.6fr)', titleFrom: 'table_name' },
    { key: 'domain', label: '主题域', width: '140px' },
    { key: 'pk_items', label: '主键项', width: '90px', align: 'right' },
    { key: 'items', label: '数据项', width: '90px', align: 'right' },
  ];

  const ELEM_COLS = [
    { key: 'code', label: '数据元编码', width: '130px' },
    { key: 'name', label: '名称', width: 'minmax(0,1.4fr)', titleFrom: 'name' },
    { key: 'type', label: '类型', width: '90px' },
    { key: 'format', label: '格式', width: '110px' },
    { key: 'domain', label: '取值范围', width: 'minmax(0,1.6fr)', titleFrom: 'domain' },
  ];

  const hit = (obj) => {
    if (!q) return true;
    const hay = Object.values(obj).filter((v) => typeof v === 'string' || typeof v === 'number').join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  };

  function render() {
    const tRows = tables.filter(hit);
    const eRows = elements.filter(hit);

    if (!tTbl) {
      tTbl = table.renderTable({ columns: TABLE_COLS, rows: tRows, label: 'EAST 数据表清单',
        density: 'compact', empty: { title: '没有匹配的数据表' } });
      document.getElementById('tablesSlot').append(tTbl.el);
    } else tTbl.update(tRows);

    if (!eTbl) {
      eTbl = table.renderTable({ columns: ELEM_COLS, rows: eRows, label: 'EAST 数据元清单',
        density: 'compact', empty: { title: '没有匹配的数据元' } });
      document.getElementById('elementsSlot').append(eTbl.el);
    } else eTbl.update(eRows);

    document.getElementById('stamp').textContent =
      `数据表 ${tRows.length}/${tables.length} · 数据元 ${eRows.length}/${elements.length}`;
  }

  async function load() {
    try {
      const d = await fetch('/api/east', { cache: 'no-store' }).then((r) => r.json());
      if (!d || d.available === false) {
        document.getElementById('kpi').replaceChildren(
          core.renderState('empty', { title: 'EAST 规范未导入', desc: d && d.reason ? String(d.reason) : '' }));
        core.markReady();
        return;
      }
      const st = d.stats || {};
      tables = d.tables || [];
      elements = d.elements || [];

      const items = [
        ['附件', st.attachments], ['数据表', st.tables], ['数据项', st.items],
        ['主键项', st.pk_items], ['数据元', st.elements], ['业务代码表', st.code_tables],
        ['代码值', st.codes], ['检核规则', st.rules],
      ];
      const host = document.getElementById('kpi');
      host.replaceChildren();
      for (const [label, value] of items) {
        const c = document.createElement('div');
        c.className = 'border rounded-2 p-3';
        c.innerHTML = `<div class="text-small">${label}</div><div class="n">${core.fmtInt(value || 0)}</div>`;
        host.append(c);
      }
      render();
    } catch (e) {
      document.getElementById('tablesSlot').replaceChildren(core.renderState('error', {
        title: 'EAST 数据加载失败', desc: String(e.message || e) }));
    } finally {
      core.markReady();
    }
  }

  document.getElementById('searchSlot').append(controls.renderSearch({
    id: 'q', label: '搜索数据表与数据元', placeholder: '搜表号 / 表名 / 数据元编码…',
    onInput: (v) => { q = v; if (tTbl) render(); },
    onSubmit: (v) => { q = v; if (tTbl) render(); },
  }).el);

  load();
})();
</script>
</body>
</html>
