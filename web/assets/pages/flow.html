<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据流转 · 平行重建样板页（桑基图）</title>
<link rel="stylesheet" href="../primer-primitives.css">
<link rel="stylesheet" href="../primer.css">
<style>
  body { background: var(--bgColor-default); }
  .page { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { padding: 16px; }
  .card > h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600;
              display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .chart { width: 100%; height: 460px; }
  .gap-2 { gap: 8px; }   /* Primer 22 无此工具类，按布局补 */
</style>
</head>
<body>
<div class="page">
  <div class="d-flex flex-items-center flex-wrap gap-2 mb-3">
    <h2 class="h3 m-0">数据流转</h2>
    <span id="meta" class="text-small"></span>
    <span class="flex-auto"></span>
    <span class="text-small">数据源：/api/flow</span>
  </div>

  <div class="border rounded-2 card">
    <h3><span>按数据源的步骤链路</span><span id="cnt" class="text-small"></span></h3>
    <div id="chart" class="chart" role="img" aria-label="数据流转桑基图"></div>
    <div id="note" class="text-small mt-2"></div>
  </div>
</div>

<script src="../vendor/echarts/echarts.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let chart = null;

/* 链路由步骤命名推导：collect:X → clean:X → relevance:X → apply:X
 * （/api/flow 只给 steps 列表与 weights，不给显式 links，这里按命名规则连边并注明） */
function buildLinks(steps, weights) {
  const bySource = {};
  /* 优先用 weights 的键：形如 clean:gov 的干净 stage:source；
   * steps 里可能带 _weekly 之类的后缀（collect:nfra_weekly），会把链路切断。 */
  const ids = Object.keys(weights).length ? Object.keys(weights) : steps;
  ids.forEach((id) => {
    const [stage, src] = String(id).split(":");
    if (!src) return;
    (bySource[src] = bySource[src] || []).push(stage);
  });
  const order = ["collect", "clean", "relevance", "apply"];
  const links = [];
  Object.entries(bySource).forEach(([src, stages]) => {
    for (let i = 0; i < stages.length - 1; i++) {
      const a = `${stages[i]}:${src}`, b = `${stages[i + 1]}:${src}`;
      if (order.indexOf(stages[i]) > order.indexOf(stages[i + 1])) continue;
      links.push({ source: a, target: b, value: Number(weights[a]) || Number(weights[b]) || 1 });
    }
  });
  return links;
}

async function load() {
  const d = await (await fetch("/api/flow", { cache: "no-store" })).json();
  if (!d.available) { $("#note").textContent = d.reason || "不可用"; return; }
  const steps = d.steps || [];
  const links = buildLinks(steps, d.weights || {});
  const names = [...new Set([].concat(...links.map((l) => [l.source, l.target])))];
  $("#cnt").textContent = `${names.length} 个节点 / ${links.length} 条边`;
  $("#meta").textContent = `运行 ${d.run_id || "—"} · ${d.fetched_at || ""}`;
  $("#note").textContent = "链路按步骤命名（collect→clean→relevance→apply）推导：/api/flow 未提供显式 links。";

  chart = chart || echarts.init($("#chart"));
  chart.setOption({
    tooltip: { trigger: "item", triggerOn: "mousemove" },
    series: [{
      type: "sankey", left: 8, right: 120, top: 8, bottom: 8,
      nodeGap: 8, nodeWidth: 12, emphasis: { focus: "adjacency" },
      label: { fontSize: 11 },
      data: names.map((n) => ({ name: n })),
      links,
    }],
  });
  chart.resize();
}

window.addEventListener("resize", () => chart && chart.resize());
load();
</script>
</body>
</html>
