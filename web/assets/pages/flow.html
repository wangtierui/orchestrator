<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据流转</title>
<link rel="stylesheet" href="/primer-primitives.css">
<link rel="stylesheet" href="/primer.css">
<style>
  /* 只写布局 */
  .page { max-width: var(--rco-content-width, 75rem); margin-inline: auto; padding: var(--space-lg); }
  .stack { display: flex; flex-direction: column; gap: var(--space-lg); }
  .row { display: flex; align-items: center; gap: var(--space-sm); }
  .grow { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div class="page stack" role="main">
  <div class="row">
    <h1 class="h3 m-0 grow">数据流转</h1>
    <span class="text-small" id="stamp"></span>
  </div>

  <section class="border rounded-2 p-3">
    <div id="chart"></div>
    <div class="text-small" id="chartNote"></div>
  </section>

  <section class="stack">
    <h2 class="h4 m-0">运行步骤</h2>
    <div class="border rounded-2" id="tableSlot"></div>
  </section>
</div>
<script src="/vendor/echarts/echarts.min.js"></script>
<script>
(async () => {
  const RCO = window.RCO || {
    core: await import('/js/ui/core.js'),
    table: await import('/js/ui/table.js'),
    chart: await import('/js/ui/chart.js'),
  };
  const { core, table, chart } = RCO;

  const host = document.getElementById('chart');
  const note = document.getElementById('chartNote');

  try {
    const f = await fetch('/api/flow', { cache: 'no-store' }).then((r) => r.json());
    const steps = f.steps || [];
    const status = f.step_status || {};
    const weights = f.weights || {};

    document.getElementById('stamp').textContent =
      `运行 ${f.run_id || '—'} · 步骤 ${steps.length} · 权重项 ${Object.keys(weights).length}`;

    /* ① 有显式 nodes/edges 才画桑基；否则画权重条形图（不伪造链路） */
    const nodes = (f.nodes || []).map((n) => (typeof n === 'string' ? { name: n } : n));
    const edges = (f.edges || []).map((e) => ({
      source: e.source || e.from, target: e.target || e.to, value: e.value || e.weight || 1,
    })).filter((e) => e.source && e.target);

    if (nodes.length && edges.length) {
      chart.mountChart({ el: host, height: 460, label: '数据流转桑基图',
        option: {
          tooltip: { trigger: 'item' },
          series: [{ type: 'sankey', data: nodes, links: edges,
            emphasis: { focus: 'adjacency' }, lineStyle: { color: 'gradient', opacity: 0.35 },
            label: { fontSize: 11 } }],
        } });
      note.textContent = `桑基节点 ${nodes.length} · 边 ${edges.length}（来自接口 nodes/edges）`;
    } else {
      const top = Object.entries(weights).sort((a, b) => b[1] - a[1]).slice(0, 12);
      chart.mountChart({ el: host, height: 460, label: '流转权重条形图',
        option: {
          tooltip: { trigger: 'axis' },
          grid: { left: 120, right: 24, top: 16, bottom: 24, containLabel: false },
          xAxis: { type: 'value' },
          yAxis: { type: 'category', data: top.map(([k]) => k).reverse() },
          series: [{ type: 'bar', data: top.map(([, v]) => v).reverse(), barMaxWidth: 18 }],
        } });
      note.textContent = `接口未提供显式 nodes/edges，改画权重 Top ${top.length}（不推导链路，避免把猜测当事实）`;
    }

    /* ② 运行步骤表（真实状态，不是"未连线任务"） */
    const rows = steps.map((s) => {
      const st = status[s] || {};
      return { step: s, rc: st.rc || '—', status: st.status || '—', elapsed: st.elapsed_s };
    });
    const tbl = table.renderTable({
      columns: [
        { key: 'step', label: '步骤', width: 'minmax(0,2fr)', titleFrom: 'step' },
        { key: 'rc', label: '返回码', width: '100px', render: (r) => table.badge(r.rc) },
        { key: 'status', label: '状态', width: '100px' },
        { key: 'elapsed', label: '耗时', width: '100px', align: 'right',
          render: (r) => (r.elapsed == null ? '—' : `${Number(r.elapsed).toFixed(1)}s`) },
      ],
      rows, density: 'compact', label: '运行步骤',
      empty: { title: '本轮无步骤记录' },
    });
    document.getElementById('tableSlot').append(tbl.el);
  } catch (e) {
    host.replaceChildren(core.renderState('error', { title: '流转数据加载失败', desc: String(e.message || e) }));
  } finally {
    core.markReady();
  }
})();
</script>
</body>
</html>
