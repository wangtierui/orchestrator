<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合规工作台</title>
<link rel="stylesheet" href="primer-primitives.css">
<link rel="stylesheet" href="primer.css">
<style>
  /* 只允许布局。颜色/边框/圆角一律取令牌或 Primer 类。 */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bgColor-default); display: flex; flex-direction: column; }

  /* ── 顶栏 68px ── */
  .topbar { height: 52px; flex: 0 0 52px; display: flex; align-items: center;
            gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--borderColor-default); }
  .brand { display: flex; align-items: center; gap: 8px; height: 32px; }
  .gsearch { width: 191px; height: 32px; }
  .spacer { flex: 1 1 auto; }
  .logo-link { display: inline-flex; align-items: center; color: var(--fgColor-default); }

  /* ── 页签行 40px（仓库条） ── */
  .repo-tabs { flex: 0 0 40px; display: flex; align-items: center; gap: 4px;
               padding: 0 16px; border-bottom: 1px solid var(--borderColor-default);
               overflow-x: auto; overflow-y: hidden; }
  .repo-tabs::-webkit-scrollbar { height: 0; }
  .tab { height: 32px; padding: 0 10px; display: inline-flex; align-items: center;
         border-radius: 6px; font-size: 14px; white-space: nowrap; text-decoration: none;
         color: var(--fgColor-default); }
  .tab:hover { background: var(--bgColor-muted); }
  .tab[aria-current="page"] { font-weight: 600;
    box-shadow: inset 0 -2px 0 var(--borderColor-accent-emphasis); border-radius: 6px 6px 0 0; }

  /* ── 主体 ── */
  .shell { flex: 1 1 auto; display: flex; min-height: 0; }
  .rail { width: 239px; flex: 0 0 239px; padding: 8px;
          border-right: 1px solid var(--borderColor-default); overflow-y: auto; }
  .rail .grp { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
               color: var(--fgColor-muted); padding: 8px 8px 4px; }
  .rail .item { height: 32px; display: flex; align-items: center; padding: 6px 8px;
                border-radius: 6px; font-size: 13px; color: var(--fgColor-default);
                cursor: pointer; user-select: none; }
  .rail .item:hover { background: var(--bgColor-muted); }
  .rail .item.on { background: var(--bgColor-muted); font-weight: 600; }
  .rail .hint { font-size: 11px; color: var(--fgColor-muted); padding: 4px 8px; line-height: 1.5; }
  .rail { display: flex; flex-direction: column; }
  .rail-items { flex: 1 1 auto; }
  .rail-foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--space-sm);
               padding-top: var(--space-sm); border-top: 1px solid var(--borderColor-default); }
  .rail-act { height: 32px; padding: 6px 8px; text-align: left; border: 0; background: none;
              border-radius: 6px; font-size: var(--text-body-size-medium); cursor: pointer;
              color: var(--fgColor-default); }
  .rail-act:hover { background: var(--bgColor-muted); }
  body[data-sidebar="collapsed"] .rail { display: none; }
  .main { flex: 1 1 auto; min-width: 0; overflow-y: auto; }
  .loading { padding: 24px; font-size: 13px; color: var(--fgColor-muted); }
</style>
</head>
<body>

<div class="topbar">
  <button id="expandBtn" class="btn" type="button" hidden aria-label="展开侧边栏"
          aria-expanded="false" aria-controls="rail" style="width:32px;height:32px;padding:0">≡</button>
  <a class="logo-link" href="#overview" title="回到总览">
    <svg class="octicon" width="28" height="28" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0a8 8 0 0 1 8 8 8 8 0 0 1-5.47 7.59c-.4.07-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8a8 8 0 0 1 8-8Z"></path>
    </svg>
  </a>
  <span class="text-bold">合规工作台</span>
  <input id="jump" class="form-control gsearch" type="search"
         placeholder="跳转页面…" aria-label="跳转页面" role="searchbox" aria-controls="tabs">
  <span class="spacer"></span>
  <a class="text-small" href="/legacy.html" title="旧版工作台（历史保留）">旧版</a>
  <svg class="octicon" width="32" height="32" viewBox="0 0 16 16" fill="currentColor" role="img" aria-label="当前用户">
    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2 1H6a4 4 0 0 0-4 4v1h12v-1a4 4 0 0 0-4-4Z"></path>
  </svg>
</div>

<nav class="repo-tabs" id="tabs" role="navigation" aria-label="模块导航"></nav>

<div class="shell">
  <aside class="rail" id="rail" role="navigation" aria-label="侧边导航">
    <div id="railItems" class="rail-items"></div>
    <div class="rail-foot">
      <button id="feedbackBtn" class="rail-act" type="button">Feedback</button>
      <button id="collapseBtn" class="rail-act" type="button"
              aria-expanded="true" aria-controls="rail">Collapse sidebar</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="loading">加载中…</div></main>
</div>

<style id="page-style"></style>
<script src="vendor/echarts/echarts.min.js"></script>
<script type="module">
import * as chrome from "/js/ui/chrome.js";
/* ══ 单页框架（方案 B）：各页作为「片段」注入 #main，不再用 iframe ══
 * 片段格式沿用现有 /pages/*.html：<style>…</style> + <body> 内容 + 内联<script>。
 * 注入规则：body 级规则剔除（避免覆盖壳）、内联 script 重新执行、src=echarts 跳过（壳已加载）。 */


/* 页面侧异常捕获（P0 基础设施）：
 * 冒烟探针读 window.__psErr，若正则/模块/接口出错，失败详情里能直接看到原因，
 * 而不是只有 "has=None / data-page-ready 未标记"。 */
window.__psErr = null;
window.addEventListener("error", (e) => {
  if (!window.__psErr) window.__psErr = String(e.message || (e.error && e.error.message) || e.type);
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  if (!window.__psErr) window.__psErr = "unhandled: " + String((r && r.message) || r);
});

const $ = (s, r) => (r || document).querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));



/* ── 页面级监听器的登记与清理（避免反复切换后叠加） ── */
let pageListeners = [];
const rawAddWin = window.addEventListener.bind(window);
const rawAddDoc = document.addEventListener.bind(document);
window.addEventListener = function (type, fn, opt) {
  if (type === "resize") pageListeners.push(["w", type, fn, opt]);
  return rawAddWin(type, fn, opt);
};
document.addEventListener = function (type, fn, opt) {
  if (type === "change" || type === "click" || type === "keydown" || type === "input") {
    pageListeners.push(["d", type, fn, opt]);
  }
  return rawAddDoc(type, fn, opt);
};
function clearPageListeners() {
  pageListeners.forEach(([w, type, fn, opt]) => {
    (w === "w" ? window : document).removeEventListener(type, fn, opt);
  });
  pageListeners = [];
}

/* ── 卸载旧页面：销毁图表 + 清监听 ── */
function teardown() {
  clearPageListeners();
  if (window.echarts) {
    $("#main").querySelectorAll("[id]").forEach((el) => {
      const inst = echarts.getInstanceByDom(el);
      if (inst) inst.dispose();
    });
  }
  $("#main").innerHTML = "";
  $("#page-style").textContent = "";
}

/* ── 注入片段 ── */
async function mount(slug) {
  const res = await fetch(`/pages/${slug}.html?v=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");

  /* 样式：剔除 body{} 规则（页面自带 body 背景会盖掉壳） */
  let css = [...doc.querySelectorAll("style")].map((s) => s.textContent).join("\n");
  css = css.replace(/(^|\})\s*body\s*\{[^}]*\}/g, "$1");
  $("#page-style").textContent = css;

  /* 结构：body 下除 script 外的元素 */
  const frag = document.createElement("div");
  [...doc.body.children].forEach((el) => {
    if (el.tagName === "SCRIPT") return;
    frag.appendChild(el.cloneNode(true));
  });
  $("#main").innerHTML = frag.innerHTML;

  /* 脚本：重新执行（跳过 echarts 的 src 引用，壳已加载） */
  const scripts = [...doc.querySelectorAll("script")];
  for (const s of scripts) {
    if (s.src && s.src.includes("echarts")) continue;
    const code = s.textContent || "";
    if (!code.trim()) continue;
    /* 用 Function 包一层：各页都声明 const S/$/esc，直接注入会与壳或前一页冲突
     * （Identifier already declared ⇒ 整段不执行，且没有任何报错提示）。 */
    try {
      new Function(code)();
    } catch (err) {
      console.error("[page script]", err);
      throw new Error("页面脚本异常：" + (err && err.message));
    }
  }
  await new Promise((r) => setTimeout(r, 260));   /* 给首屏 fetch 一点时间 */
  $("#main").scrollTop = 0;
}

/* ── 本页导航 ── */
let loading = false;
async function show(pageId) {
  const page = chrome.PAGES[pageId] || chrome.PAGES.overview;
  const group = chrome.groupOf(pageId);
  document.querySelectorAll(".tab").forEach((a) => {
    if (a.dataset.group === group.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
  document.title = `${page.name} · 合规工作台`;
  window.RCO_PARAMS = currentParams();
  chrome.renderRail(document.getElementById("railItems") || $("#rail"), pageId);
  if (loading) return;
  loading = true;
  try {
    teardown();
    $("#main").innerHTML = '<div class="loading">加载中…</div>';
    if (page.slug) await mount(page.slug);
    else $("#main").innerHTML = '<div class="loading">该页未定义</div>';
  } catch (e) {
    $("#main").innerHTML = `<div class="loading">加载失败：${esc(e.message)}</div>`;
  } finally {
    loading = false;
  }
}

function currentParams() {
  const raw = (location.hash || "").replace(/^#/, "");
  const qi = raw.indexOf("?");
  const out = {};
  if (qi >= 0) for (const [k, v] of new URLSearchParams(raw.slice(qi + 1))) out[k] = v;
  return out;
}
function current() {
  let id = (location.hash || "#overview").replace(/^#/, "");
  if (id.startsWith("/")) id = id.slice(1);
  id = id.split("?")[0] || "overview";
  if (chrome.PAGES[id]) return id;                       /* #laws 这类旧链接仍然可用 */
  const g = chrome.NAV.find((x) => x.id === id);         /* #docs 这类组链接 → 首个子页 */
  return g ? g.pages[0] : "overview";
}

let timer = null;
$("#jump").addEventListener("input", (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const q = e.target.value.trim();
    if (!q) return;
    const hit = chrome.NAV.find((g) => g.name.includes(q)) || Object.entries(chrome.PAGES).map(([id, p]) => ({ id, name: p.name })).find((p) => p.name.includes(q));
    if (hit) location.hash = "#" + (hit.pages ? hit.pages[0] : hit.id);
  }, 200);
});

window.addEventListener("hashchange", () => show(current()));
chrome.renderTabs($("#tabs"), current());
show(current());
</script>
<script type="module">
import { getAnchoredPosition, focusZone, focusTrap, scrollIntoView, FocusKeys }
  from "/vendor/primer-behaviors/dist/esm/index.mjs";
import * as core from "/js/ui/core.js";
import * as table from "/js/ui/table.js";
import * as controls from "/js/ui/controls.js";
import * as chart from "/js/ui/chart.js";
import * as routerMod from "/js/ui/router.js";

/* 页面脚本以 classic script 注入，无法 import；把模块挂到 window 供其调用。 */
window.RCO = { core, table, controls, chart, router: routerMod,
  behaviors: { getAnchoredPosition, focusZone, focusTrap, scrollIntoView, FocusKeys } };

/* ── 侧栏折叠态（§5.2.2）：宽度归零 + localStorage 记忆 + 焦点转移 ── */
const rail = document.getElementById("rail");
const expandBtn = document.getElementById("expandBtn");
const collapseBtn = document.getElementById("collapseBtn");

function applySidebar(state, focus) {
  const collapsed = state === "collapsed";
  document.body.dataset.sidebar = collapsed ? "collapsed" : "expanded";
  expandBtn.hidden = !collapsed;
  expandBtn.setAttribute("aria-expanded", String(!collapsed));
  collapseBtn.setAttribute("aria-expanded", String(!collapsed));
  localStorage.setItem("rco.sidebar", collapsed ? "collapsed" : "expanded");
  if (focus) (collapsed ? expandBtn : collapseBtn).focus();
}
expandBtn.addEventListener("click", () => applySidebar("expanded", true));
collapseBtn.addEventListener("click", () => applySidebar("collapsed", true));
applySidebar(localStorage.getItem("rco.sidebar") || "expanded", false);

/* ── 侧栏条目滚动：只滚容器，不滚整页（§6.4） ── */
const main = document.getElementById("main");
document.getElementById("railItems").addEventListener("click", (ev) => {
  const item = ev.target.closest(".rail-item");
  if (!item) return;
  const target = main.querySelector(item.dataset.sel || "");
  if (target) scrollIntoView(target, main, { direction: "vertical", startMargin: 8 });
});

/* ── 仓库条溢出：More 下拉（§5.2.1） ── */
const tabsNav = document.getElementById("tabs");
let moreBtn = null, morePanel = null;

function closeMore() {
  if (morePanel) { morePanel.remove(); morePanel = null; }
  if (moreBtn) { moreBtn.setAttribute("aria-expanded", "false"); moreBtn.focus(); }
}
function openMore(moved) {
  morePanel = document.createElement("div");
  morePanel.setAttribute("role", "menu");
  morePanel.setAttribute("aria-label", "更多页签");
  morePanel.style.cssText = "position:absolute;width:320px;border-radius:12px;padding:8px;" +
    "background:var(--bgColor-default);box-shadow:0 0 0 1px rgba(209,217,224,.25),0 8px 24px rgba(66,74,83,.12);";
  for (const a of moved) {
    const item = document.createElement("a");
    item.href = a.getAttribute("href");
    item.setAttribute("role", "menuitem");
    item.className = "rail-act";
    item.textContent = a.textContent;
    if (a.getAttribute("aria-current")) item.setAttribute("aria-current", "page");
    morePanel.append(item);
  }
  document.body.append(morePanel);
  const pos = getAnchoredPosition(morePanel, moreBtn, { side: "outside-bottom", align: "end", allowOutOfBounds: false });
  morePanel.style.top = `${pos.top + window.scrollY}px`;
  morePanel.style.left = `${pos.left + window.scrollX}px`;
  moreBtn.setAttribute("aria-expanded", "true");
  const zone = focusZone(morePanel, { bindKeys: FocusKeys.ArrowVertical | FocusKeys.HomeAndEnd });
  const trap = focusTrap(morePanel, morePanel.querySelector('[role="menuitem"]'));
  morePanel.addEventListener("click", () => { zone.abort && zone.abort(); trap && trap.abort && trap.abort(); closeMore(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMore(); }, { once: true });
}

function layoutTabs() {
  const tabs = [...tabsNav.querySelectorAll("a.tab")];
  tabs.forEach((a) => { a.hidden = false; });
  if (moreBtn) { moreBtn.remove(); moreBtn = null; }
  closeMore && closeMore();
  const avail = tabsNav.clientWidth - 32;
  let used = 0;
  const moved = [];
  for (const a of tabs) {
    const w = a.getBoundingClientRect().width || 80;
    if (used + w > avail) moved.push(a);
    used += w;
  }
  if (!moved.length) return;
  // 保留至少 1 项，其余进 More
  for (const a of moved) a.hidden = true;
  const current = moved.find((a) => a.getAttribute("aria-current"));
  moreBtn = document.createElement("button");
  moreBtn.type = "button";
  moreBtn.className = "btn";
  moreBtn.setAttribute("aria-haspopup", "menu");
  moreBtn.setAttribute("aria-expanded", "false");
  moreBtn.setAttribute("aria-label", current ? `更多页签（当前：${current.textContent}）` : "更多页签");
  moreBtn.style.cssText = "width:auto;height:32px;padding:0 12px;flex:0 0 auto;";
  moreBtn.textContent = current ? current.textContent : "More";
  moreBtn.addEventListener("click", () => (morePanel ? closeMore() : openMore(moved)));
  tabsNav.append(moreBtn);
}

new ResizeObserver(() => layoutTabs()).observe(tabsNav);
addEventListener("hashchange", () => setTimeout(layoutTabs, 0));
setTimeout(layoutTabs, 300);

/* ── Feedback 弹窗（侧栏底部唯一入口，规格 §9.8.2） ── */
const FB_KINDS = [["bug", "缺陷"], ["data", "数据质量"], ["feature", "功能缺失"], ["other", "其他"]];
const FB_SEV = [["low", "轻微"], ["normal", "一般"], ["high", "严重"], ["blocker", "阻塞"]];

function openFeedback() {
  if (document.getElementById("fbDialog")) return;
  const kindOpts = FB_KINDS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  const sevOpts = FB_SEV.map(([v, l]) => `<option value="${v}"${v === "normal" ? " selected" : ""}>${l}</option>`).join("");
  const cur = (window.RCO && window.RCO.router && window.RCO.router.parse().page) || "overview";

  const dlg = document.createElement("div");
  dlg.id = "fbDialog";
  dlg.setAttribute("role", "dialog");
  dlg.setAttribute("aria-modal", "true");
  dlg.setAttribute("aria-labelledby", "fbTitle");
  dlg.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;" +
    "background:rgba(31,35,40,.5);z-index:100;";
  dlg.innerHTML = `
    <div class="bgColor-default" style="width:560px;max-width:calc(100vw - 32px);border-radius:12px;padding:var(--space-lg);">
      <h3 class="h4 mb-2" id="fbTitle">提交反馈</h3>
      <p class="text-small mb-3">写入任务管理 › 用户反馈，状态为「待受理」。</p>
      <div class="form-group">
        <div class="form-group-header"><label for="fbKind">分类 *</label></div>
        <select id="fbKind" class="form-select">${kindOpts}</select>
      </div>
      <div class="form-group">
        <div class="form-group-header"><label for="fbSev">严重度 *</label></div>
        <select id="fbSev" class="form-select">${sevOpts}</select>
      </div>
      <div class="form-group">
        <div class="form-group-header"><label for="fbPage">页面 *</label></div>
        <input id="fbPage" class="form-control" value="${cur}">
      </div>
      <div class="form-group">
        <div class="form-group-header"><label for="fbText">标题 *</label></div>
        <input id="fbText" class="form-control" aria-describedby="fbErr">
      </div>
      <div class="form-group">
        <div class="form-group-header"><label for="fbDetail">说明</label></div>
        <textarea id="fbDetail" class="form-control" rows="4"></textarea>
      </div>
      <div id="fbErr" class="text-small" style="color:var(--fgColor-danger);" hidden></div>
      <div class="d-flex" style="gap:var(--space-sm);justify-content:flex-end;margin-top:var(--space-md);">
        <button id="fbCancel" class="btn" type="button">取消</button>
        <button id="fbSubmit" class="btn btn-primary" type="button">提交</button>
      </div>
    </div>`;
  document.body.append(dlg);

  const trap = focusTrap(dlg.querySelector('[role="dialog"]') || dlg, document.getElementById("fbKind"));
  const close = () => {
    trap && trap.abort && trap.abort();
    dlg.remove();
    /* focusTrap.abort() 会先把焦点还给"打开前的元素"（这里是 body），
     * 所以要在下一帧再夺回，否则 Esc 后焦点落到 body。 */
    /* 已知偏差：Esc 关闭后焦点落到 body（behaviors 的焦点归还与本页显式
     * focus 冲突，双 rAF 与 250ms 兜底实测都无效），记录在重构报告里。 */
    requestAnimationFrame(() => document.getElementById("feedbackBtn").focus());
  };
  document.getElementById("fbCancel").addEventListener("click", close);
  dlg.addEventListener("click", (e) => { if (e.target === dlg) close(); });
  /* 捕获阶段监听：focusTrap 会拦冒泡阶段的 Esc，冒泡监听收不到（实测） */
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { e.stopPropagation(); close(); document.removeEventListener("keydown", esc, true); } }, true);

  document.getElementById("fbSubmit").addEventListener("click", async () => {
    const err = document.getElementById("fbErr");
    const title = document.getElementById("fbText").value.trim();
    err.hidden = true;
    if (!title) {
      err.textContent = "标题必填";
      err.hidden = false;
      document.getElementById("fbText").setAttribute("aria-invalid", "true");
      document.getElementById("fbText").focus();
      return;
    }
    const body = {
      kind: document.getElementById("fbKind").value,
      severity: document.getElementById("fbSev").value,
      page: document.getElementById("fbPage").value.trim(),
      title,
      detail: document.getElementById("fbDetail").value.trim(),
      reporter: "",
    };
    try {
      const res = await fetch("/api/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.reason || "提交失败");
      close();
      const tip = document.createElement("div");
      tip.setAttribute("role", "status");
      tip.className = "border rounded-2 p-2";
      tip.style.cssText = "position:fixed;right:24px;bottom:24px;z-index:110;background:var(--bgColor-default);";
      tip.textContent = `已提交 #${out.fid}，可在任务管理查看`;
      document.body.append(tip);
      setTimeout(() => tip.remove(), 4000);
    } catch (e) {
      err.textContent = String(e.message || e);
      err.hidden = false;
    }
  });
}
document.getElementById("feedbackBtn")?.addEventListener("click", openFeedback);

</script>
</body>
