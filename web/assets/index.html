<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisory Statistics</title>
<!-- 图标：单文件 SVG（无外链），服务端按 basename 从 web/assets/ 读盘 -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#f6f8fa">
<!-- 零 CDN：以下两份均为**本地静态资源**（web/assets/），运行时不出网。
     · primer.css   = 官方 @primer/css 21.5.1 编译产物（原样，不裁剪）
     · octicons.js  = 官方 @primer/octicons 的图标子集（path 数据内联，见文件头）
     顺序：先官方基底，再自有 <style> 覆盖（同权重时后者胜）。 -->
<link rel="stylesheet" href="primer-primitives.css">
<link rel="stylesheet" href="primer.css">
<style>
/* ============================================================
 * 设计令牌（2026-10-22 第一百零九批重设计）
 * 参照 idataserch.com 的 B2B 信息型语法：**浅底白卡 + 深蓝主色 + 数字背书**。
 * 为什么换成浅色：确认台是"每天要读数字"的工作台，浅底白卡在长时间阅读、
 * 打印/截图归档、以及和 Excel/公文并排时都更稳（深色系在投影与外发截图里会失真）。
 * 令牌全部集中在此，页面里不写死色值/圆角/间距 —— 改主题只改这一处。
 * ============================================================ */
:root{
  /* ---- GitHub 色板（2026-10-27 第一百二十一批；用户指定值） ---- */
  --bg:#ffffff; --bg-subtle:#f6f8fa;
  /* 边框/次要文字用**用户指定值**（与实测 #d1d9e0 / #59636e 仅差 1–2 个色阶，肉眼不可辨）；
   * 另留 `--border-muted` 取实测的带透明度版本，用于列表卡片等"更轻"的边线。 */
  --border:#d0d7de; --border-muted:#d1d9e0b3;
  --text:#1f2328; --text-muted:#656d76;
  /* 头部深色是**实测**得到的关键事实（GitHub light 主题 header = #25292e），不能沿用浅灰 */
  /* 登录态顶栏：与第二层同为浅色系（用户第 2 条）；下边框仍为 0，分割交给第二层 */
  --header-bg:#f6f8fa; --header-fg:#1f2328;
  --accent:#0969da; --success:#1a7f37; --danger:#cf222e; --hover:#f3f4f6;

  /* ---- 兼容层：把历史令牌指到新色板 ----
   * 确认台有 3000+ 行样式在用 `--primary/--fg/--line` 这套名字；逐条改名既无收益
   * 又容易漏。这里做**别名**，一次收口（改色只改上面 9 个值）。 */
  --primary:var(--accent); --primary-h:#0550ae; --primary-l:#ddf4ff;
  --accent2:#2f7cf6; --ai:#8250df;
  --fg:var(--text); --fg2:#59636e; --fg3:var(--text-muted); --fg4:#afb8c1;
  --alt:var(--bg-subtle); --card:#ffffff;
  /* 边框/分隔线：老样式全在用 `--line/--line2` —— 漏了它们会让所有 1px 边框失效 */
  --line:var(--border); --line2:#d8dee4;
  --ok:var(--success); --ok-l:#dafbe1;
  --warn:#9a6700; --warn-l:#fff8c5;
  --bad:var(--danger); --bad-l:#ffebe9;

  /* ---- 形状与间距：克制的 6px 圆角、边框优先 ---- */
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow:0 1px 0 rgba(31,35,40,.04);
  --shadow-h:0 3px 12px rgba(31,35,40,.08);
  /* 用户强制的两套字体栈（禁止外部 Web Font） */
  --font-sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
  --header-height:52px;   /* 用户规范：双层顶栏的高度用变量管理 */
  --head-h:var(--header-height);      /* 顶部横向导航高度（48–56） */
  --rail-w:264px;     /* 侧栏展开宽（240–280） */
  --rail-w-min:56px;  /* 侧栏折叠宽（48–64） */
}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono,pre,kbd,samp{font-family:var(--mono)}
code,.mono{font-size:12px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:var(--s4);padding:10px var(--s5);max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));
  display:inline-block}
.brand small{font-weight:400;color:var(--fg3);font-size:12px;margin-left:2px}
.hstat{display:flex;gap:var(--s2);align-items:center;margin-left:auto;flex-wrap:wrap}
.badge{font-size:12px;color:var(--fg2);border:1px solid var(--line);background:var(--alt);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.live{color:var(--ok);background:var(--ok-l);border-color:#BFE6D6}
.badge.off{color:var(--warn);background:var(--warn-l);border-color:#F0DCB4}
.badge.bad{color:var(--bad);background:var(--bad-l);border-color:#F3C9C2}

/* ---------- 页签 ---------- */
nav{background:#fff;border-bottom:1px solid var(--line)}
.nwrap{display:flex;gap:var(--s1);padding:0 var(--s5);max-width:1560px;margin:0 auto;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);
  padding:11px 14px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap}
nav button:hover{color:var(--fg);background:var(--alt)}
nav button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

main{max-width:1560px;margin:0 auto;padding:var(--s5)}

/* ---------- 卡片 ---------- */
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:var(--shadow)}
.card>h3{margin:0 0 var(--s3);font-size:15px;font-weight:600;display:flex;
  justify-content:space-between;align-items:baseline;gap:var(--s2)}
.card>h3 .hint{font-size:12px;color:var(--fg3);font-weight:400}
.card .src{margin-top:var(--s3);padding-top:var(--s2);border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--fg3)}
.section{margin:var(--s6) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s3)}
.section h2{margin:0;font-size:19px;font-weight:600}
.section .desc{color:var(--fg3);font-size:13px}
.section .no{font-family:var(--mono);color:var(--primary);font-weight:700}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .u{font-size:13px;color:var(--fg3);font-weight:400;margin-left:4px}
.kpi .l{font-size:12.5px;color:var(--fg2)}
.kpibar{display:flex;gap:var(--s4);flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:5px 0;
  border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg2)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- 状态色 ---------- */
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--fg3)}



/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg2);font-weight:600;background:var(--alt);position:sticky;top:0;z-index:1;
  font-size:12.5px;white-space:nowrap}
tbody tr:hover td{background:var(--bg-subtle)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.id{font-family:var(--mono);font-size:12px;color:var(--fg2);word-break:break-all}
/*: 列表/表格**不允许**内部纵向滚动（规范：唯一滚动容器是 #view）。
 * 宽表仍可横向滚动（`overflow-x:auto`），否则窄屏会把列挤没。 */
.tblwrap{max-height:none;overflow-x:auto;overflow-y:visible;border:0;border-radius:0}

tr.detail>td{background:var(--primary-l);border-bottom:1px solid var(--line2)}

/* ---------- 控件 ---------- */
input,select,textarea{font:inherit;background:#fff;color:var(--fg);border:1px solid var(--line2);
  border-radius:var(--r-md);padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-l);border-color:var(--primary)}
textarea{width:100%;min-height:60px;resize:vertical}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
button.act{font:inherit;font-weight:500;cursor:pointer;border-radius:var(--r-md);
  border:1px solid var(--primary);background:var(--primary);color:#fff;padding:7px 14px}
button.act:hover{background:var(--primary-h)}
button.act.ghost{background:#fff;color:var(--primary);border-color:var(--line2)}
button.act.ghost:hover{background:var(--primary-l);border-color:var(--primary)}
button.link{background:none;border:0;color:var(--primary);cursor:pointer;font:inherit;padding:0}
button.link:hover{text-decoration:underline}
button[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- 条形（用 flex 而非 SVG：从结构上消灭"标签溢出画布"） ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:minmax(88px,150px) 1fr 96px;gap:var(--s2);align-items:center;
  font-size:12.5px}
.brow .bl{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{background:var(--alt);border-radius:var(--r-sm);height:16px;position:relative;overflow:hidden}
.brow .bf{height:100%;border-radius:var(--r-sm);transition:width .25s}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
.note{font-size:11.5px;color:var(--fg3);margin-top:var(--s2)}

/* ---------- 图例/工具条 ---------- */
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);font-size:11.5px;color:var(--fg3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3)}
.toast{position:fixed;right:var(--s5);bottom:var(--s5);background:var(--fg);color:#fff;
  border-radius:var(--r-md);padding:10px 14px;font-size:13px;opacity:0;transform:translateY(6px);
  transition:all .2s;z-index:50;max-width:min(520px,90vw);pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad)}
pre{background:var(--alt);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;
  overflow:auto;font-size:12px;max-height:280px;font-family:var(--mono)}
details>summary{cursor:pointer;color:var(--primary);font-size:13px}
.foot{color:var(--fg3);font-size:11.5px;text-align:center;padding:var(--s6) 0 var(--s3)}
.scrollx{overflow-x:auto;padding-bottom:var(--s2)}
/* ---------- 政策法规 / 公司制度：可筛选 + 可排序的表头（2026-10-23） ---------- */
/* 两行表头：第一行筛选控件、第二行列名（点击排序）。
 * 为什么不做"一个搜索框搜全部"：用户明确要求"表头可筛选"，逐列筛才能表达
 * "只看 mof 的已废止"这种组合意图；而排序指示（▴/▾）必须与列名同格，否则
 * 读者不知道当前是按哪一列排的。 */
tr.filters th{padding:4px 6px;background:var(--card);position:static;border-bottom:1px solid var(--line)}
tr.filters input,tr.filters select{width:100%;font-size:12px;padding:4px 6px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--fg)}
tr.filters input:focus,tr.filters select:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 2px var(--primary-l)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover,th.sortable.on{color:var(--primary)}
th.sortable .arw{font-size:10px;opacity:.85}
.pager{display:flex;gap:var(--s3);align-items:center;justify-content:flex-end;
  margin-top:var(--s3);font-size:13px;color:var(--fg2)}
.pager button{padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r-sm);
  background:var(--card);cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.45;cursor:default}
.lv-meta .Label{font-size:12px;line-height:18px;height:18px;
  border-radius:999px;padding:0 7px}

.ttl{max-width:420px}
/* ---------- 关系图谱 ---------- */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.gnode{cursor:pointer}
.gnode:hover circle{stroke:var(--primary);stroke-width:2.5}
.gnode text{font-size:11px;fill:var(--fg2);paint-order:stroke;stroke:var(--card);
  stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.glegend{display:flex;gap:var(--s4);font-size:12px;color:var(--fg2);margin:var(--s2) 0}
.glegend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
.brand .logo{width:20px;height:20px;fill:currentColor;margin-right:8px;opacity:.92;flex:none}
/* ---------- 关系图谱：四视图切换 + 全览卡片 ---------- */
.gtabs{gap:var(--s1);margin-bottom:var(--s3)}


.gcard{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  background:var(--card);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.gcard:hover{border-color:var(--primary);box-shadow:var(--shadow-h)}
.gcard-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.gnode text{pointer-events:none}
/* ---------- EAST 数据结构：左表右项（2026-10-26） ---------- */
.eastwrap{display:grid;grid-template-columns:300px 1fr;gap:var(--s3);align-items:start}
@media (max-width:900px){.eastwrap{grid-template-columns:1fr}}
.eastleft{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2);background:var(--card)}
.eastright{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);background:var(--card);min-width:0}
.echips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;max-height:96px;overflow:auto}

.etbl{display:grid;grid-template-columns:1fr auto;grid-auto-rows:auto;gap:0 6px;
  text-align:left;padding:5px 8px;border:1px solid transparent;border-radius:var(--r-sm);
  background:none;cursor:pointer;font-size:12.5px;color:var(--fg)}
.etbl .code{font-family:var(--mono);font-size:11px;color:var(--fg2);grid-column:1}
.etbl .nm{grid-column:1;font-size:12.5px}
.etbl .cnt{grid-column:2;grid-row:1/span 2;align-self:center;font-family:var(--mono);
  font-size:11px;color:var(--fg3)}
.etbl:hover{background:var(--alt)}
.etbl.on{background:var(--primary-l);border-color:var(--primary)}

/*: 3D 关系图容器（2026-10-26）：SVG 拖拽旋转 + 底部操作条 */
.g3wrap{border:1px solid var(--line);border-radius:10px;background:
  radial-gradient(circle at 50% 45%, var(--card), var(--bg) 78%);overflow:hidden}
.g3svg{touch-action:none;cursor:grab;display:block}
.g3svg:active{cursor:grabbing}
.g3bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);
  font-size:12px;background:var(--card)}
.g3n circle{transition:r .12s}

/*: 左栏（页面级，位于 `main` 之外 —— 2026-10-27 第一百二十批）
 * 历史：曾用 `.sidewrap` 把 aside 塞进内容卡片，结果是"卡中卡"、折叠要逐页实现、
 * 切页时左栏位置跳动。现在只有一套实现：`#rail` + `.rail`。 */
.side-h{font-size:11.5px;letter-spacing:.04em;color:var(--fg3);padding:6px 8px 4px}
.sideitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--fg);cursor:pointer;
  text-align:left;line-height:1.35}
.sideitem:hover{background:var(--alt)}
.sideitem.on{background:var(--primary-l);color:var(--primary);font-weight:600}
.sideitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sideitem .cnt{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sideitem .dot{width:7px;height:7px;border-radius:50%;flex:none}

/*: 2026-10-27（用户第 2/8 条）：
 *   · `.grid.g3` = **固定 3 列**（不是 auto-fit）—— 卡片宽度只由列数决定，
 *     与"这一板块有几张卡"无关，12 个模块才可能真正等宽；
 *   · 留白收一档（`--s5`→`--s4`），max-width 放宽，参照 GitHub 的三段式布局：
 *     顶部横向导航 / 左侧可折叠侧栏 / 右侧内容。 */
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1280px){.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.grid.g3{grid-template-columns:1fr}}
.grid.g3>.section{margin:var(--s5) 0 0}
.card{padding:var(--s4)}

/*: 左侧栏折叠（2026-10-27 用户第 8 条：GitHub 三段式布局）
 * 折叠后内容区占满宽度；状态存 localStorage，跨页面/刷新保持。
 * 二级项用 `.sideitem-sub`（缩进 + 前置点），让"EAST → 数据表"这类层级一眼看出。 */
.railToggle{border:1px solid var(--line);background:var(--card);color:var(--fg2);
  border-radius:7px;width:30px;height:30px;line-height:1;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
.railToggle:hover{background:var(--alt);color:var(--fg)}
.sideitem-sub{padding-left:20px;font-size:12px}
.sideitem-sub .nm::before{content:"·";margin-right:5px;color:var(--fg4)}
.card>h3{margin:0 0 var(--s2)}
.card .src{margin-top:var(--s2)}
.section{margin:var(--s5) 0 var(--s2)}
h3.near{margin-top:var(--s1)}

/* 注：批 120 的 `.shell`（232px 固定列）已删除 —— 批 121 用 `--rail-w` 令牌
 * 统一控制展开/折叠宽度，两套规则并存会让"折叠后宽度"取决于书写顺序。 */

/* ============================================================
 * 三块式骨架（GitHub Issues 风格，2026-10-27）
 *   固定顶栏 52px / 可折叠侧栏 264↔56px / 主内容自适应
 * 仅借鉴布局与视觉语言，不改路由与业务。
 * ============================================================ */
body{background:var(--bg-subtle)}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border)}
.hbar{display:flex;align-items:center;gap:12px;height:var(--head-h);
  padding:0 16px;max-width:none;margin:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;
  color:var(--header-fg);height:32px}
.brand .logo{width:32px;height:32px;display:inline-flex;align-items:center;
  justify-content:center}
.brand .logo{width:20px;height:20px;color:var(--text)}
.brand small{display:none}
.crumb{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;min-width:0}
.crumb .sep{color:var(--fg4)}
.crumb b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:34vw}
.hsearch{flex:1;max-width:520px;margin-left:auto;position:relative}
.hsearch button{width:100%;display:flex;align-items:center;gap:8px;height:30px;
  padding:0 10px;font-size:12.5px;color:var(--text-muted);background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;text-align:left}
.hsearch button:hover{background:var(--hover);color:var(--text)}
.hsearch kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg3);
  border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--bg)}
.hstat{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:nowrap}
.hstat .badge{font-size:11.5px;height:24px;line-height:22px;padding:0 8px;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  color:var(--text-muted)}
.hstat .badge.live{background:var(--ok-l);border-color:#aceebb;color:#116329}
.hstat .badge.off{background:var(--warn-l);border-color:#eac54f;color:#7d4e00}
.hstat .badge.bad{background:var(--bad-l);border-color:#ffcecb;color:#a40e26}
.railOpen{display:none;width:30px;height:30px;
  border:1px solid var(--border);background:var(--bg);
  border-radius:var(--r-md);color:var(--text-muted);cursor:pointer;
  font-size:14px;line-height:1;align-items:center;justify-content:center}
.railOpen:hover{background:var(--hover);color:var(--text)}
@media (max-width:1024px){ .railOpen{display:inline-flex} }
.rail-mask{display:none}
@media (max-width:1024px){
  body.rail-open .rail-mask{display:block;position:fixed;inset:var(--head-h) 0 0 0;
    background:rgba(31,35,40,.28);z-index:34}
}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;
  font-weight:600;border:0;cursor:pointer}
header nav{display:none}          /* 页面导航移入侧栏（顶栏只留面包屑与全局入口） */

/* ============================================================
 * 全幅三块式（2026-10-27 第一百二十二批）
 *   .app 100vh/100vw（overflow:hidden）
 *     ├ 全局头 52px（#f6f8fa，1px 下边框）
 *     ├ 模块页签 48px（#fff，1px 下边框；溢出折叠进 More，**不出横向滚动条**）
 *     └ .body-layout（flex，overflow:hidden）
 *          ├ .rail 260px（右侧 1px 切割，自身滚动）
 *          └ #view 唯一滚动容器（overflow-y:auto）
 * 纪律：面板之间只用 1px 实线切割；无外阴影、无大圆角、无"灰色大底板包裹"。
 * ============================================================ */
html,body{height:100%}
body{overflow:hidden;background:var(--bg)}
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden}
/* 规范：第一层**无**下边框；层与层的分割只由第二层的 1px 承担 */
.global-header{height:var(--header-height);background:var(--header-bg);
  color:var(--header-fg);display:flex;align-items:center;
  gap:12px;padding:0 16px;border-bottom:0;flex-shrink:0;
  position:static}                        /* 固定由 flex 布局保证，不用 sticky */
.global-header .logo{display:inline-flex;align-items:center}
.iconbtn{width:32px;height:32px;flex:none;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);color:var(--text-muted);cursor:pointer;padding:0}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn svg{display:block}
.tabs-more{display:inline-flex;align-items:center;gap:4px}
.global-header .brand small{display:none}
.gsearch{flex:0 1 320px;min-width:140px;position:relative;display:flex}
.gsearch input{width:100%;height:32px;padding:0 40px 0 30px;font-size:13px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text)}
.gsearch input::placeholder{color:var(--text-muted)}
.gsearch input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent)}
.gsearch .ico{position:absolute;left:9px;top:7px;color:var(--text-muted);font-size:12px;
  pointer-events:none}
.gsearch-k{position:absolute;right:6px;top:6px;height:20px;padding:0 5px;font-size:11px;
  font-family:var(--mono);color:var(--text-muted);background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:4px;cursor:pointer}
.gsearch-k:hover{color:var(--text);background:var(--hover)}
/* 原地下拉：**无遮罩**，不把页面压暗 */
.spop{position:fixed;z-index:70;width:min(560px,calc(100vw - 32px));max-height:60vh;
  overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 8px 24px rgba(31,35,40,.12);padding:6px}
.spop .grp{font-size:11px;color:var(--text-muted);padding:6px 8px 2px;font-weight:600}
.spop .it{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  padding:7px 8px;border-radius:6px;font-size:13px;color:var(--text);cursor:pointer;
  text-align:left;position:relative}
.spop .it:hover,.spop .it[aria-selected="true"]{background:var(--bg-subtle)}
.spop .it:hover::before,.spop .it[aria-selected="true"]::before{content:"";position:absolute;
  left:0;top:3px;bottom:3px;width:4px;background:var(--accent);border-radius:2px}
.spop .it .hint{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.spop .empty{padding:10px 8px;font-size:12.5px;color:var(--text-muted)}
/* 模块页签：溢出折叠进 More，容器 overflow:hidden 保证永不出现横向滚动条 */
.repo-tabs{height:48px;background:var(--bg-subtle);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;justify-content:flex-start;padding:0 8px;
  flex-shrink:0;overflow:hidden;position:relative}
.tabs-inner{display:flex;align-items:stretch;gap:0;min-width:0;overflow:hidden}
.tab{height:48px;padding:0 12px;border:0;background:none;color:var(--text-muted);
  font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  border-bottom:2px solid transparent;white-space:nowrap;flex:0 0 auto}
.tab:hover{color:var(--text);background:var(--bg-subtle)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:#fd8c73}
.tab .tab-ico{display:inline-flex;align-items:center;color:var(--text-muted)}
.tab.on .tab-ico{color:var(--text)}
.tabs-more{height:48px;padding:0 12px;border:0;background:none;color:var(--text-muted);
  font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  border-bottom:2px solid transparent;margin-left:auto;flex:0 0 auto}
.tabs-more:hover{color:var(--text);background:var(--bg-subtle)}
.tabs-more[hidden]{display:none}
.body-layout{display:flex;flex:1;min-height:0;overflow:hidden}
.rail{width:260px;flex:0 0 260px;border:0;border-right:1px solid var(--border);
  border-radius:0;background:var(--bg);overflow-y:auto;padding:16px 8px;
  position:static;max-height:none;box-shadow:none;
  display:flex;flex-direction:column}       /* 底部折叠按钮靠 flex 顶到底 */
body.rail-off .rail{width:56px;flex-basis:56px;padding:12px 4px}
body.rail-off .rail .side-h,body.rail-off .rail .nm,
body.rail-off .rail .cnt,body.rail-off .rail .rail-foot .rt-txt{display:none}
body.rail-off .rail .sideitem{justify-content:center;padding:8px 0}
body.rail-off .rail .sideitem .glyph{display:inline-flex}
.main-content{flex:1;min-width:0;overflow-y:auto;padding:24px;background:var(--bg)}
/* 总览是全景页：没有侧栏，左右各留 220 的呼吸区（用户第 10 条），窄屏自动收 */
body.no-rail .main-content{padding-left:220px;padding-right:220px}
@media (max-width:1440px){body.no-rail .main-content{padding-left:96px;padding-right:96px}}
@media (max-width:1024px){body.no-rail .main-content{padding-left:16px;padding-right:16px}}
main{padding:0;max-width:none;margin:0;min-width:0}
/* 侧栏项：选中 = 浅灰底 + 深黑加粗 + 左侧 2px 强调线（**不用蓝色整块**） */
.rail .sideitem{position:relative;display:flex;align-items:center;gap:8px;width:100%;
  border:0;background:none;padding:0 8px;height:32px;border-radius:6px;font-size:14px;
  color:var(--text);cursor:pointer;text-align:left;line-height:1.4}
.rail .sideitem:hover{background:var(--bg-subtle)}
.rail .sideitem.on{background:var(--bg-subtle);color:var(--text);font-weight:600}
.rail .sideitem.on::before{content:"";position:absolute;left:-8px;top:3px;bottom:3px;
  width:4px;background:var(--accent);border-radius:2px}
.rail .sideitem:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rail .sideitem .glyph{width:16px;text-align:center;flex:none;font-size:12px;
  color:var(--text-muted)}
.rail .sideitem.on .glyph{color:var(--text)}
.rail .sideitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.rail .sideitem .cnt{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.side-h{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-muted);
  padding:10px 8px 4px;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.side-sep{height:1px;background:var(--border);margin:8px 0}
.rail-foot{margin-top:auto;padding-top:8px;border-top:0;
  display:flex;align-items:center;gap:6px}
.rail-foot .rt-ico{display:inline-flex;align-items:center}
.rail-foot button{flex:1;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;height:28px;border:1px solid var(--border);background:var(--bg);
  border-radius:6px;font-size:12px;color:var(--text-muted);cursor:pointer}
.rail-foot button:hover{background:var(--hover);color:var(--text)}
.sideitem-sub{padding-left:26px !important;font-size:12.5px}
.sideitem-sub .nm::before{content:"·";margin-right:5px;color:var(--fg4)}

/* 页面标题区（GitHub 的 repository header 观感：标题 + 灰色描述 + 右侧动作） */
.ph{display:flex;align-items:flex-start;gap:12px;margin:0 0 12px;
  padding-bottom:0;border-bottom:0}
.ph h1{font-size:20px;font-weight:600;margin:0;color:var(--text);line-height:1.3}
.ph .desc{font-size:13px;color:var(--text-muted);margin-top:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* 按钮：**用 Primer 的 `.btn`**（高度/圆角/边框/悬停全由官方组件给）。
 * 只保留一条业务覆盖：主操作必须是深绿实心（用户规范），挂在官方 `.btn-primary` 上。 */
.btn.btn-primary{background:var(--success);border-color:rgba(31,35,40,.15);color:#fff}
.btn.btn-primary:hover{background:#187733}

@media (max-width:1024px){
  .rail{position:fixed;left:0;top:100px;bottom:0;width:260px;z-index:35;
    box-shadow:0 8px 24px rgba(31,35,40,.12);transform:translateX(-100%);
    transition:transform .16s ease}
  body.rail-open .rail{transform:translateX(0)}
  body.rail-off .rail{transform:translateX(-100%)}
  .main-content{padding:16px}
  .gsearch{max-width:none}
}
/* ============================================================
 * 列表视图（GitHub Issues 风格）：工具栏 / 表头菜单 / 切片面板 / 批量栏
 * 说明：圆角 6px、边框优先、无渐变；密度接近 GitHub Issues。
 * ============================================================ */
.lv{background:var(--bg);border:1px solid var(--border-muted,#d8dee4);
  border-radius:6px;overflow:hidden}
.lv-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.lv-bar .sp{flex:1}
.lv-bar .count{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lv-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;
  border:1px solid var(--border);background:var(--bg-subtle);color:var(--text);
  border-radius:999px;padding:2px 8px;max-width:280px}
.lv-chip b{font-weight:600}
.lv-chip button{border:0;background:none;color:var(--text-muted);cursor:pointer;
  padding:0 0 0 2px;font-size:12px;line-height:1}
.lv-chip button:hover{color:var(--danger)}
.lv-chip.slice{border-color:#c8e1ff;background:#ddf4ff;color:#0550ae}
.lv-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.lv-body{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.lv-body.slice{grid-template-columns:minmax(0,1fr) 280px}
.lv-scroll{overflow:visible;max-height:none}
.lv-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.lv-table th{position:static;background:transparent;
  border-bottom:1px solid var(--border);padding:0;text-align:left;white-space:nowrap;
  font-size:12px;font-weight:600;color:var(--text-muted)}
.lv-th{display:flex;align-items:center;gap:2px;padding:6px 8px}
.lv-th .sortbtn{border:0;background:none;font:inherit;color:inherit;cursor:pointer;
  padding:2px 4px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.lv-th .sortbtn:hover{background:var(--hover);color:var(--text)}
.lv-th .sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lv-th .menu{opacity:0;border:0;background:none;color:var(--text-muted);cursor:pointer;
  width:22px;height:22px;border-radius:4px;line-height:1;font-size:13px}
.lv-table th:hover .menu,.lv-th .menu:focus-visible,.lv-th .menu[aria-expanded="true"]{
  opacity:1}
.lv-th .menu:hover{background:var(--hover);color:var(--text)}
.lv-th.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.lv-table th[draggable="true"]{cursor:grab}
.lv-table td{border-bottom:1px solid var(--border);padding:6px 8px;
  vertical-align:middle;font-size:14px;height:32px}
.lv-table tbody tr:hover td{background:var(--hover)}
.lv-table tbody tr[aria-selected="true"] td{background:var(--primary-l)}
.lv-table tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lv-title{font-weight:500;font-size:16px;line-height:24px;color:var(--text);line-height:1.4;
  text-decoration:none;margin-right:8px}
.lv-title:hover{color:var(--accent);text-decoration:underline}
.lv-title a{color:inherit;text-decoration:none}
.lv-title a:hover{color:var(--accent);text-decoration:underline}
.lv-meta{display:inline-flex;gap:4px;flex-wrap:wrap;color:var(--text-muted);
  font-size:12px;align-items:center;vertical-align:middle}
.lv-meta .meta-i{display:inline-flex;align-items:center;gap:4px}
.lv-meta .dot-sep{color:var(--fg4);margin:0 2px}
.lv-badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);
  background:var(--bg-subtle);border-radius:999px;padding:0 7px;height:18px;
  font-size:12px;line-height:18px;color:var(--text-muted);white-space:nowrap}
.lv-badge.ok{background:var(--ok-l);border-color:#aceebb;color:#116329}
.lv-badge.bad{background:var(--bad-l);border-color:#ffcecb;color:#a40e26}
.lv-badge.warn{background:var(--warn-l);border-color:#eac54f;color:#7d4e00}
.lv-selcell{width:32px;padding-right:0 !important}
.lv-stcell{width:24px;padding-right:0 !important}
.lv-stcell .lv-st{display:block}
/* 操作列已删除（与元数据里的「关系」重复） */
.lv-ck{appearance:none;width:14px;height:14px;border:1px solid var(--border);
  border-radius:3px;cursor:pointer;display:inline-block;vertical-align:middle;
  background:var(--bg);position:relative}
.lv-ck:checked{background:var(--accent);border-color:var(--accent)}
.lv-ck:checked::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.lv-ck:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* 复选框：默认只在悬停/选中时出现；一旦进入选择模式则全部常显 */
.lv-table tbody .lv-selcell .lv-ck{opacity:0;transition:opacity .1s}
.lv-table tbody tr:hover .lv-ck,
body.lv-selecting .lv-table tbody .lv-ck,
.lv-ck:checked,
.lv-ck:focus-visible{opacity:1}
/* 切片面板 */
.lv-slice{border-left:1px solid var(--border);background:var(--bg);
  max-height:calc(100vh - 240px);overflow:auto;padding:10px}
.lv-slice h4{margin:0 0 8px;font-size:12px;color:var(--text-muted);font-weight:600;
  display:flex;align-items:center;gap:6px}
.lv-slice select{width:100%;height:28px;font-size:12px;margin-bottom:8px;
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg)}
.lv-slice .val{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;
  padding:5px 6px;border-radius:var(--r-md);font-size:12.5px;cursor:pointer;text-align:left}
.lv-slice .val:hover{background:var(--hover)}
.lv-slice .val.on{background:var(--primary-l);color:var(--accent);font-weight:600}
.lv-slice .val .c{margin-left:auto;color:var(--fg3);font-variant-numeric:tabular-nums}
.lv-slice .foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);
  display:flex;gap:6px}
.lv-slice .foot button{flex:1;height:26px;font-size:12px;border:1px solid var(--border);
  background:var(--bg);border-radius:var(--r-md);cursor:pointer;color:var(--text-muted)}
.lv-slice .foot button:hover{background:var(--hover);color:var(--text)}
/* 表头/切片浮层菜单 */
.lv-pop{position:fixed;z-index:60;min-width:196px;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-h);
  padding:4px;font-size:13px}
.lv-pop button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  padding:7px 10px;border-radius:var(--r-md);text-align:left;cursor:pointer;color:var(--text);
  font:inherit}
.lv-pop button:hover{background:var(--hover)}
.lv-pop button[disabled]{color:var(--fg4);cursor:not-allowed;background:none}
.lv-pop .sep{height:1px;background:var(--border);margin:4px 2px}
.lv-pop .hint{color:var(--text-muted);font-size:11.5px;padding:4px 10px 6px}
/* 批量操作栏 */
.lv-batch{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(12px);
  background:#1f2328;color:#fff;border-radius:999px;padding:8px 10px 8px 16px;
  display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(31,35,40,.24);
  z-index:70;font-size:13px;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.lv-batch.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.lv-batch .n{font-weight:600}
.lv-batch button{height:28px;padding:0 12px;border-radius:999px;border:1px solid transparent;
  background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;cursor:pointer}
.lv-batch button:hover{background:rgba(255,255,255,.24)}
.lv-batch button.x{background:none;border:0;font-size:16px;line-height:1;padding:0 6px}
.lv-batch .st{font-size:12px;color:#d0d7de}
/* 空态 */


@media (max-width:1024px){
  .lv-body.slice{grid-template-columns:minmax(0,1fr)}
  .lv-slice{border-left:0;border-top:1px solid var(--border);max-height:none}
  .lv-scroll{max-height:none}
}


/* ---------- 命令面板（Ctrl/⌘ + K） ---------- */
.pal-mask{position:fixed;inset:0;background:rgba(31,35,40,.32);z-index:80;
  display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal{width:min(640px,92vw);background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-xl);box-shadow:0 16px 48px rgba(31,35,40,.24);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;
  padding:12px 14px;font-size:14px;background:var(--bg);outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:44vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md);
  font-size:13px;cursor:pointer;color:var(--text)}
.pal li[aria-selected="true"]{background:var(--primary-l);color:var(--accent)}
.pal li .hint{margin-left:auto;font-size:11.5px;color:var(--text-muted)}
.pal .foot{border-top:1px solid var(--border);padding:6px 12px;font-size:11.5px;
  color:var(--text-muted);display:flex;gap:12px}
.pal em{font-style:normal;background:var(--bg-subtle);border:1px solid var(--border);
  border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:11px}

/* ============================================================
 * 去卡片化覆盖层（批 122）
 * 规范：模块平铺在纯白背景上，模块之间只用 1px 实线切割；
 * 禁止圆角白盒 + 外阴影 + 虚线框。
 * ============================================================ */
.card{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.card>h3{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  font-size:14px;font-weight:600;display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
.card .src{margin-top:8px;padding-top:6px;font-size:11.5px;color:var(--text-muted)}
.card hr,.card .dashed{border:0;border-top:1px solid var(--border)}
/* 栅格：用 1px 间隙渲染切割线（比给每个模块加边框更整齐） */
.grid{display:grid;gap:1px;background:var(--border);border-top:1px solid var(--border);
  border-bottom:1px solid var(--border)}
.grid>*{background:var(--bg)}          /* 含 KPI 这类非 .card 的直接子节点 */
.grid>.card,.grid>.section{background:var(--bg);padding:16px;margin:0}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1280px){.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.grid.g3{grid-template-columns:1fr}}
.grid.g3>.section{margin:0;grid-column:1/-1;border-bottom:1px solid var(--border)}
/* 表格容器：基础规则已改为无内部纵向滚动，这里只补"外框由表格自己画" */
.tblwrap>table{border:1px solid var(--border)}
.scrollx{overflow-x:auto;max-height:none}
/* 列表：平铺 + 表头底边加粗 + 行 1px 分割 */
/* 容器边框/圆角以基础规则为准（实测 GitHub 是 1px + 6px），这里不再清零 */
.lv-table th{border-bottom:1px solid var(--border)}
/* 工具行在 thead 里，分割交给 th —— 这里不再画线（用户："底部边框线过多"） */
.lv-bar{border-bottom:0;background:transparent}
.lv-slice{border-left:1px solid var(--border);background:transparent}
body.lv-compact .lv-table td{padding:2px 8px;height:26px;font-size:13px;white-space:nowrap}
body.lv-compact .lv-title{font-size:13px}
body.lv-compact .lv-meta{margin-top:2px}
body.lv-compact .lv-title{font-size:12.5px}
/* 状态筛选页签（替代外部下拉框） */
.ftabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin:0 0 12px;
  overflow:hidden}
.ftab{height:36px;padding:0 12px;border:0;background:none;font-size:13px;
  color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ftab:hover{color:var(--text);background:var(--bg-subtle)}
.ftab.on{color:var(--text);font-weight:600;border-bottom-color:#fd8c73}
.ftab .c{font-size:11px;color:var(--text-muted);background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:999px;padding:0 6px}
/* 密度切换（宽松 / 紧凑） */
/* 批 135：SegmentedControl（实测 2×32×32、aria-pressed 表达选中） */
.density{display:inline-flex;height:32px;border:1px solid var(--border);border-radius:6px;
  overflow:hidden;
  overflow:hidden;margin-left:auto}
.density button{height:32px;width:32px;padding:0;border:0;background:transparent;
  color:var(--text-muted);font-size:12px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:4px}
.density button+button{border-left:1px solid var(--border)}
.density button.on{background:var(--bg-subtle);color:var(--text)}
.density button:hover{background:var(--hover)}
.density button.on:hover{background:var(--bg-subtle)}
/* 表头字段筛选面板：选项带复选框/圆点/主副文本，悬停或选中时浅灰 + 2px 蓝线 */
.fpop{position:fixed;z-index:70;width:300px;max-height:60vh;overflow:auto;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 8px 24px rgba(31,35,40,.12);padding:8px}
.fpop .q{width:100%;height:28px;font-size:12.5px;border:1px solid var(--border);
  border-radius:6px;padding:0 8px;margin-bottom:6px;background:var(--bg)}
.fpop .opt{position:relative;display:flex;align-items:center;gap:8px;width:100%;
  border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left;
  font-size:12.5px;color:var(--text);cursor:pointer}
.fpop .opt:hover{background:var(--bg-subtle)}
.fpop .opt:hover::before,.fpop .opt[aria-checked="true"]::before{content:"";position:absolute;
  left:0;top:3px;bottom:3px;width:4px;background:var(--accent);border-radius:2px}
.fpop .opt[aria-checked="true"]{background:var(--bg-subtle);font-weight:600}

.fpop .opt .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg4)}
.fpop .opt .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop .opt .s{font-size:11px;color:var(--text-muted);font-weight:400}
.fpop .opt .c{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.fpop .ck{width:14px;height:14px;flex:none;border:1px solid var(--border);border-radius:3px;
  background:var(--bg);position:relative}
.fpop .opt[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
.fpop .opt[aria-checked="true"] .ck::after{content:"";position:absolute;left:3.5px;top:1px;
  width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}

/* 列表全局过滤框（表头上方唯一的文本入口）与批量理由 */
.lv-q{height:32px;min-width:220px;flex:1 1 260px;max-width:420px;font-size:12.5px;
  border:1px solid var(--border);border-radius:6px;padding:0 8px;background:var(--bg);
  color:var(--text)}
.lv-q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lv-batch input{height:26px;width:180px;font-size:12.5px;border-radius:6px;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);
  color:#fff;padding:0 8px}
.lv-batch input::placeholder{color:rgba(255,255,255,.55)}
.lv-batch input:focus{outline:none;border-color:#fff}

/* ============================================================
 * 暗色主题（顶栏 ☾ 切换，写 localStorage；不依赖任何外部库）
 * 只覆盖"表面/边框/文字"这几类令牌 —— 语义色（accent/success/danger）沿用 GitHub 暗色值。
 * ============================================================ */
html[data-color-mode="dark"]{
  --bg:#0d1117; --bg-subtle:#151b23;
  --border:#3d444d; --border-muted:#3d444d80;
  --text:#e6edf3; --text-muted:#9198a1;
  --accent:#4493f8; --success:#3fb950; --danger:#f85149; --hover:#1f262d;
  --header-bg:#010409; --header-fg:#ffffff;
  --fg:var(--text); --fg2:#b1bac4; --fg3:var(--text-muted); --fg4:#6e7681;
  --line:var(--border); --line2:#3d444d; --alt:var(--bg-subtle); --card:var(--bg);
  --primary:var(--accent); --primary-h:#388bfd; --primary-l:#388bfd1a;
  --ok:var(--success); --ok-l:#2ea04326; --warn:#d29922; --warn-l:#bb800926;
  --bad:var(--danger); --bad-l:#f851491a;
}
html[data-color-mode="dark"] img{opacity:.92}
html[data-color-mode="dark"] .lv-badge,
html[data-color-mode="dark"] .Label{background:#21262d;border-color:#3d444d}

/* ============================================================
 * 列表（批 126，复刻 GitHub Issues）
 *  · 工具行（搜索/筛选/字段/计数/密度）**在 <thead> 内**，不再上挂一条独立工具条
 *  · 三列：选择 / 状态 / 事项；行内不再有"操作"列
 *  · 宽松 = 标题一行 + 元数据一行；紧凑 = 同一行（同一份 DOM）
 * ============================================================ */
.lv-tools th{padding:0;background:var(--bg);border-bottom:1px solid var(--border)}
.lv-tools .lv-bar{padding:8px 8px;border:0;background:transparent}
.lv-headrow th{padding:0;background:var(--bg);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text);font-weight:600;text-align:left;
  vertical-align:middle}
.lv-headrow .lv-th{padding:6px 8px;gap:2px}
.lv-headrow .lv-th .sortbtn{padding:0 2px}
.lv-primary-th{width:auto}
.lv-primary{padding-left:8px}
/* 宽松（默认）：两行 */
.lv-primary .lv-title{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.lv-primary .lv-meta{display:flex;margin-top:2px}
/* 紧凑：一行（标题与元数据并排，超长省略） */
body.lv-compact .lv-primary{display:flex;align-items:center;gap:8px;min-width:0}
body.lv-compact .lv-primary .lv-title{display:inline;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:0 1 auto;margin-right:0}
body.lv-compact .lv-primary .lv-meta{display:inline-flex;margin-top:0;flex:1 1 auto;
  min-width:0;overflow:hidden;white-space:nowrap}
/* 分页脚：只保留与表格之间的那一条线 */
.lv-foot{display:flex;justify-content:flex-end;padding:8px 8px 4px}
.lv-foot .pager{border:0;padding:0;background:transparent}

/* 统一高度（批 127）：表头 48 / 宽松行 65 / 紧凑行 38 / 控件 32 */
.lv-headrow th{height:48px;padding:0}
.lv-table td{height:65px}
body.lv-compact .lv-table td{height:38px}
.lv-headctl{width:auto;padding:0 8px 0 0 !important}
.lv-headctl .lv-bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
  justify-content:flex-end;padding:0}
.lv-headctl .lv-q{height:32px;flex:0 1 240px;min-width:120px}
.lv-headctl .btn{height:32px}
.lv-headctl .count{font-size:12px;color:var(--text-muted);white-space:nowrap}
.lv-headctl .density{height:32px}
.lv-headctl .density button{height:30px}
@media (max-width:1200px){.lv-headctl .lv-q{flex-basis:160px}}

/* 栅格里的模块必须是白底：`.card{background:transparent}` 会盖掉 `.grid>*`（同权重、后写者胜），
 * 于是容器的 1px 切割色（#d0d7de）透出来，看起来像"深灰模块底"（用户第 8 条）。 */
.grid > .card, .grid > .section, .grid > *{background:var(--bg)}

/* ============================================================
 * 表单控件基线（批 127）：一切 input/select/textarea 走同一套尺寸与圆角。
 * 为什么需要：待办/留言板/文档检索里的控件**没有 class**，Primer 只管 `.form-control`，
 * 于是裸 input 是浏览器默认外观 —— 这是"三个页面风格不一致"的真正原因。
 * ============================================================ */
input:not([type="checkbox"]):not([type="radio"]),select,textarea{
  height:32px;padding:0 8px;font-family:var(--font-sans);font-size:13px;
  color:var(--text);background:var(--bg);border:1px solid var(--border);
  border-radius:6px;box-shadow:none;min-width:0}
textarea{height:auto;padding:6px 8px;line-height:1.5}
input:not([type="checkbox"]):not([type="radio"]):focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
select{padding-right:24px}
/* 标签与按钮同一套圆角（与搜索框一致） */
.lv-badge,.Counter,.Label{border-radius:6px}

/* ============================================================
 * 列表表头（批 128，按 CDP 实测复刻）
 *   · 一行 48px，底色 #f6f8fa（与顶栏一致），下边框 1px
 *   · 只放可操作项：状态页签 + 字段按钮 + 排序 + 密度 + 保存视图
 *   · 不显示列名、不放全局搜索框
 * ============================================================ */
.lv-headrow th{height:48px;padding:0;background:var(--bg-subtle);
  border-bottom:1px solid var(--border)}
.lv-headbar{display:flex;align-items:center;gap:8px;height:48px;padding:8px;background:var(--bg-subtle);
  background:var(--bg-subtle);flex-wrap:nowrap;overflow:hidden}
.lv-headbar .ftabs{margin:0;border:0;display:flex;gap:2px;flex-shrink:0}
.lv-headbar .ftab{height:32px;padding:0 10px;border:0;border-radius:6px;background:none;
  color:var(--text-muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.lv-headbar .ftab.on{background:var(--bg);color:var(--text);font-weight:600;
  box-shadow:inset 0 -2px 0 #fd8c73}
.lv-fsep{width:1px;height:20px;background:var(--border);flex:none}


/* 面板选项：32 高（用户规范） */
.fpop .opt{height:32px}
.fpop .opt .t{line-height:1.2}

/* ============================================================
 * 批 128 覆盖层：顶栏尺寸/底色、侧栏尺寸/滚动条/折叠竖线、反馈入口
 * （统一放末尾：既有的同名规则被改过多次，锚点匹配不可靠）
 * ============================================================ */
/* 顶栏：所有控件 32 高、浅灰底、同一基线 */
.global-header .brand{height:32px}
.global-header .brand .logo{width:32px;height:32px}
.hstat{align-items:center}
.hstat .badge{height:32px;line-height:30px;padding:0 10px;background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:6px;color:var(--text-muted);
  display:inline-flex;align-items:center;white-space:nowrap;font-size:12px}
.iconbtn{width:32px;height:32px;background:var(--bg-subtle);border-radius:6px}
.avatar{width:32px;height:32px;display:inline-flex;align-items:center;
  justify-content:center;font-size:13px}
.gsearch input{height:32px;background:var(--bg-subtle);border-radius:6px}
.gsearch .ico{top:9px}
.gsearch-k{top:6px}

/* 侧栏：项 32 高；折叠键 32 高且无边框；滚动条 6px、无箭头 */
.rail{border-top:0;padding-top:8px;scrollbar-width:thin;
  scrollbar-color:var(--border) transparent}
.rail::-webkit-scrollbar{width:6px;height:6px}
.rail::-webkit-scrollbar-track{background:transparent}
.rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.rail::-webkit-scrollbar-button{display:none;width:0;height:0}
.rail .sideitem,.rail .sideitem-sub{height:32px;flex:0 0 auto}
.rail .rail-fb{flex:0 0 auto}
.rail .side-h,.rail .side-sep{flex:0 0 auto}
.rail .sideitem-sub{font-size:13px}
.rail-foot{padding-top:6px}
.rail-foot button{height:32px;border:0;background:transparent;border-radius:6px;
  color:var(--text-muted);font-size:13px}
.rail-foot button:hover{background:var(--hover);color:var(--text)}
.rail-fb{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;
  margin-top:6px;border:0;background:none;border-radius:6px;color:var(--text-muted);
  font-size:14px;cursor:pointer}
.rail-fb:hover{background:var(--hover);color:var(--text)}
body.rail-off .rail-fb{justify-content:center;padding:0}
body.rail-off .rail-fb .nm{display:none}
/* 折叠后：选中项仍要有 4px 竖线（原来被负偏移裁掉） */
body.rail-off .rail .sideitem.on::before{left:-4px}
body.rail-off .rail .sideitem.on{background:var(--bg-subtle)}

/* ============================================================
 * 批 129：按 GitHub 实测校订（页签悬停/2px 下划线、表头无边框项、灰底、滚动条）
 * ============================================================ */
/* ① 页签：悬停浅灰、激活 2px #fd8c73 下划线（实测 ::after 高 2px） */
.tab{position:relative;border-bottom:0 !important}
.tab:hover{background:rgba(129,139,152,.12);border-radius:6px 6px 0 0}
.tab.on{background:transparent}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;
  background:#fd8c73;border-radius:2px}
.repo-tabs{box-shadow:inset 0 -1px 0 0 rgba(209,217,224,.7);border-bottom:0}

/* ② 表头筛选项：**无边框**（1px transparent），悬停浅灰；只有密度是分组控件 */

.density{border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.lv-headbar .lv-savebtn{width:32px;padding:0;justify-content:center}
.lv-headbar .ftab{border-radius:6px}
.lv-headbar .ftab:hover{background:rgba(129,139,152,.12)}
.lv-headbar .ftab.on{background:transparent;box-shadow:inset 0 -2px 0 #fd8c73}

/* ③ 灰底根治：容器不再用"边框色"当 1px 线（空单元格会露出灰块）；
 *    改为每个格子自己画 1px 内描边，容器透明 ⇒ 空区与页面同色。 */
.grid{background:transparent !important;gap:1px}
.grid>*{box-shadow:inset 0 0 0 1px var(--border);background:var(--bg)}

/* ④ 滚动条：与侧栏一致（6px、同色、无箭头），全局生效 */
html,body,#view{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#view::-webkit-scrollbar{width:6px;height:6px}
#view::-webkit-scrollbar-track{background:transparent}
#view::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#view::-webkit-scrollbar-button{display:none;width:0;height:0}

/* ⑤ 侧栏：选中竖线离左缘留出间距；分组标题上方不再画横线 */
.rail{padding-left:12px !important}
.rail .sideitem.on::before{left:-6px}
body.rail-off .rail .sideitem.on::before{left:-6px}
.side-sep{display:none}
.side-h{margin:10px 0 4px;font-size:12px;color:var(--text-muted);font-weight:600}

/* ⑥ 反馈 + 折叠：都在底部、都左对齐（不是居中胶囊） */
.rail-foot{margin-top:auto;padding-top:6px;border-top:0;display:flex;
  flex-direction:column;align-items:stretch;gap:4px}
.rail-fb,.rail-foot button{justify-content:flex-start;width:100%;height:32px;padding:0 8px;
  border:0;background:transparent;border-radius:6px;color:var(--text-muted);
  font-size:14px;display:flex;align-items:center;gap:8px}
.rail-fb:hover,.rail-foot button:hover{background:var(--hover);color:var(--text)}
body.rail-off .rail-fb,body.rail-off .rail-foot button{justify-content:center;padding:0}

/* ⑦ 顶栏：头像底色与第一行一致（不再蓝色实心） */
.avatar{background:var(--bg-subtle);border:1px solid var(--border);color:var(--text)}
.avatar:hover{background:var(--hover)}

/* ⑧ 列表容器四边都有边框（原来只有上/下） */
.lv{border:1px solid var(--border);border-radius:6px;overflow:hidden}

/* ⑨ 待办/检索里的自定义按钮统一成 Primer `.btn` 的观感 */


/* ⑩ 去掉多余上下边框（关键指标带 / 数据源行 / 审计日志分隔） */
.kpibar{border-top:0 !important;border-bottom:0 !important}
.card .src{border-top:0 !important}

/* 发布事件：左右两栏（列表 | 变更详情），列表不设固定高度 */
.rel-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;
  align-items:start}
.rel-split>#commitbox{position:sticky;top:8px}
@media (max-width:1180px){.rel-split{grid-template-columns:1fr}}

/* ============================================================
 * 批 130：页签几何对齐实测值 + 搜索框/侧栏/板块边线
 * ============================================================ */
/* ① 页签：48 的容器里放 32 的项（GitHub: nav 48 = 8 + 32 + 8） */
.repo-tabs{align-items:flex-start;padding:8px 16px 0;flex-wrap:nowrap}
.tab{height:32px;margin:0 2px 0 0;padding:0 8px;border-radius:6px;
  font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:rgba(129,139,152,.12)}
.tab.on{background:transparent}
.tab.on::after{left:8px;right:8px;bottom:0;height:2px;background:#fd8c73;border-radius:2px}
.repo-tabs{box-shadow:inset 0 -1px 0 0 rgba(209,217,224,.7)}
/* 第二个页签层与第一行的间距：GitHub 第一行图标底部到第二行文字顶 ≈ 8px */

/* ② 顶栏搜索框：图标不压文字、底色与顶栏一致（GitHub 的 header search 就是同色+边框） */
/* id 选择器压过全局表单基线（后者是 input:not(...)，特异性更高） */
#gsearchInput{padding:0 40px 0 34px;background:var(--bg-subtle);
  border:1px solid var(--border);height:32px;border-radius:6px}
.gsearch .ico{left:10px;top:9px;width:16px;height:16px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--text-muted)}
.gsearch-k{top:7px}
/* 顶栏内部垂直居中，且行高压缩到 GitHub 的观感 */

/* ③ 侧栏：首个分组不再有标题行，顶部内距 8（GitHub sidebar padding 8） */
.rail{padding:8px 8px 8px 12px}
#rail .side-h{display:none}

/* ④ 板块不再有边线（GitHub 的卡片就是白底无框；上一版的 inset 描边要去掉） */
.grid>*{box-shadow:none !important;border:0 !important;background:var(--bg)}
.grid{gap:16px;background:transparent}

/* ⑤ 发布事件右栏：空态也要有高度（否则两栏视觉上缺一半） */
.rel-split>#commitbox{min-height:200px}

/* ============================================================
 * 批 130 全局统一：按钮与表格观感
 *   待办闭环 / 留言板 / 文档检索 / 治理审计 这些页仍是裸 table，
 *   与列表页（.lv）观感不一致 —— 这里统一成 GitHub 的"轻表头 + 52 行高 + 1px 底线"。
 * ============================================================ */
.scrollx table,.tblwrap table{width:100%;border-collapse:separate;border-spacing:0}
.scrollx thead th,.tblwrap thead th{height:40px;padding:0 8px;text-align:left;
  font-size:12px;font-weight:600;color:var(--text-muted);background:var(--bg-subtle);
  border-bottom:1px solid var(--border);white-space:nowrap}
.scrollx tbody td,.tblwrap tbody td{height:52px;padding:8px;font-size:13px;
  border-bottom:1px solid var(--border);vertical-align:middle}
.scrollx tbody tr:hover td,.tblwrap tbody tr:hover td{background:var(--bg-subtle)}

/* 按钮统一：primary → 深绿实心；link → 蓝色文字链接（GitHub 的 .btn-primary / .Link） */
button.primary,.btn.btn-primary{height:32px;padding:0 12px;border:1px solid rgba(31,35,40,.15);
  border-radius:6px;background:var(--success);color:#fff;font-size:13px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.primary:hover,.btn.btn-primary:hover{background:#187733}
button.link{background:none;border:0;padding:0;color:var(--accent);font-size:13px;
  cursor:pointer;text-decoration:none}
button.link:hover{text-decoration:underline}
select,input[type="text"],input[type="search"],textarea{font-size:13px}

/* ============================================================
 * 批 131：页签下划线压在容器线上、去横线、反馈贴底
 * ============================================================ */
/* ① 激活页签的 2px 线要**压在**第二行的 1px 底线上（GitHub 视觉上是一条线加粗） */
.tab.on::after{bottom:-8px;height:2px}

/* ② 去掉多余横线：栅格容器不再有边框；模块标题不再有下划线 */
.grid,.grid.g3,.grid.two{border:0 !important}
.card>h3,.card h3{border-bottom:0 !important;padding-bottom:0}
.kpibar{border:0 !important}
.card .src{border-top:0 !important}

/* ③ 反馈 + 折叠：作为整体**贴底**（侧栏内容可滚，但这一块始终在可见区底部） */
.rail-foot{position:sticky;bottom:0;z-index:2;background:var(--bg);
  display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 0 4px;
  border-top:0;margin-top:auto}
.rail-fb,.rail-foot button{justify-content:flex-start;text-align:left}

/* 反馈弹窗（对齐 GitHub 的 new issue 表单：宽 940、左标签右控件、底部按钮靠右） */
.fb-modal{width:min(940px,94vw);max-height:88vh;overflow:auto;background:var(--bg);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(31,35,40,.2)}
.fb-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border)}
.fb-head h2{margin:0;font-size:16px;font-weight:600}
.fb-body{padding:16px 20px}
.fb-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;
  align-items:start;margin-bottom:12px}
.fb-label{font-size:13px;color:var(--text-muted);text-align:right;padding-top:8px}
.fb-ctl{width:100%}
.fb-note{margin:4px 0 12px 152px;font-size:12px;color:var(--text-muted)}
.fb-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:12px;
  border-top:1px solid var(--border)}
@media (max-width:640px){.fb-row{grid-template-columns:1fr}
  .fb-label{text-align:left;padding-top:0}.fb-note{margin-left:0}}

/* 表头筛选按钮（旧式表格） */
th{position:relative}
.thf{margin-left:6px;width:20px;height:20px;border:0;border-radius:4px;background:transparent;
  color:var(--text-muted);cursor:pointer;vertical-align:middle;padding:0;
  display:inline-flex;align-items:center;justify-content:center}
.thf:hover{background:rgba(129,139,152,.16);color:var(--text)}
th.on .thf{background:rgba(9,105,218,.12);color:var(--accent)}

/* 批132-css：折叠 32 / 页签下划线贴底 / 三·四级缩进 / 密集 lv 表 */
.rail-foot button,.rail-fb{height:32px;min-height:32px;line-height:32px}
.repo-tabs{padding-top:0}
.tab{margin-top:8px}   /* 与 GitHub 一致：tab 底边距容器底 8px，下划线在 tab 底边 */
/* 批 142：橙线改由容器级 #tabsInk 绘制（贴在容器底部，与 1px 底线重叠） */
.rail .sideitem-sub2{padding-left:28px;font-size:13px}
.rail .sideitem-sub3{padding-left:44px;font-size:12.5px}
body.rail-off .rail .sideitem-sub2,body.rail-off .rail .sideitem-sub3{
  padding-left:0;justify-content:center}
.lv-dense .lv-table td{height:40px;font-size:12.5px;padding:4px 8px}
.lv-dense .lv-table th{height:40px;font-size:12px}
.lv-headrow-plain th{height:48px;padding:0 8px;text-align:left;font-size:12px;
  font-weight:600;color:var(--text-muted);background:var(--bg-subtle);
  border-bottom:1px solid var(--border);white-space:nowrap}

/* 批133：列头筛选按钮（.lv 表头内） */

.colf .ch{display:inline-flex;color:var(--text-muted)}
th.on .colf .ch{color:var(--accent)}
.lv-dense .lv-row:hover td{background:var(--bg-subtle)}
.lv-empty-row td{height:auto !important;padding:16px !important}

/* 批 134（P1）：标签圆角与全局一致（6px）；Primer .Label 默认 9999px 胶囊 */
.Label{border-radius:6px;padding:0 7px;line-height:18px;font-size:11.5px;
  display:inline-flex;align-items:center}

/* 状态开关（GitHub Open/Closed）：30 高、无边框、选中加粗 */
.ghstate{display:inline-flex;align-items:center;gap:2px;height:30px}
.ghstate-btn{height:30px;padding:0 8px;border:0;background:none;border-radius:6px;
  color:var(--text-muted);font-size:14px;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.ghstate-btn:hover{background:var(--hover)}
.ghstate-btn.on{color:var(--text);font-weight:600}
.ghstate-btn .n{color:var(--text-muted);font-weight:400}
.ghstate-btn.on .n{color:var(--text-muted)}

/* 批 137：筛选类按钮的"选中"只用一条规则（外观交给 Primer .btn-invisible） */
.gbtn.on,.lv-fbtn.on,.colf.on,.gbtn[aria-pressed="true"]{
  background:var(--bg-subtle);color:var(--text)}

/* 批 137：动效对齐 GitHub 实测（0.08s / cubic-bezier(.65,0,.35,1)） */
.btn,.btn-invisible,.gbtn,.lv-fbtn,.colf,.tab,.sideitem,.ghstate-btn{
  transition:color .08s cubic-bezier(.65,0,.35,1),
             background-color .08s cubic-bezier(.65,0,.35,1),
             border-color .08s cubic-bezier(.65,0,.35,1),
             fill .08s cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion: reduce){
  .btn,.btn-invisible,.gbtn,.lv-fbtn,.colf,.tab,.sideitem,.ghstate-btn{transition:none}
}

/* 批 137b：不可见按钮统一 32 高（Primer .btn-invisible 默认按 padding 撑，实测 30） */
.btn-invisible,.lv-fbtn,.gbtn,.colf{height:32px;min-height:32px;padding:0 8px;
  border-radius:6px}
.lv-fbtn .octicon,.colf .ch{color:var(--text-muted)}

/* 批 138（P2）：筛选面板的清除入口 —— 搜索框内右侧 X，不再有底部"清除"行 */
.fpop .fpop-x{position:absolute;right:8px;top:8px;width:24px;height:24px;border:0;
  background:none;border-radius:6px;color:var(--text-muted);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center}
.fpop .fpop-x:hover{background:var(--hover);color:var(--text)}

/* 批 139（P2）：列表上方筛选框（整宽、30 高；条件 token 在框内、右侧 X 清除） */
.lv-fbar{padding:8px;border-bottom:1px solid var(--border)}
.lv-fbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:32px;
  padding:2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.lv-fbox:focus-within{border-color:#0969da;box-shadow:0 0 0 1px #0969da inset}
.lv-fq{flex:1 1 160px;min-width:120px;height:26px;border:0;outline:0;background:none;
  font-size:14px;color:var(--text)}
.lv-tok{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;
  border:1px solid var(--border);border-radius:6px;background:var(--bg-subtle);
  font-size:12px;color:var(--text)}
.lv-tok b{font-weight:600;color:var(--text-muted)}
.lv-tok button{border:0;background:none;padding:0;display:inline-flex;
  color:var(--text-muted);cursor:pointer}
.lv-tok button:hover{color:var(--text)}
.lv-fx{margin-left:auto;border:0;background:none;width:24px;height:24px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);
  cursor:pointer}
.lv-fx:hover{background:var(--hover);color:var(--text)}

/* 批 140：筛选框按 GitHub 实测 30（输入 30、外框 30） */
.lv-fbox{min-height:30px;padding:0 8px}
.lv-fq{height:30px}
.fpop input.q{height:30px;border:0;box-shadow:none}
/* 选项勾选框：多选显示 checkbox 方块，选中打勾 */
.fpop .opt .ck{width:16px;height:16px;border:1px solid var(--border);border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  color:#fff;background:var(--bg)}
.fpop .opt .ck.on{background:#0969da;border-color:#0969da}
.fpop .opt[aria-checked="true"]{background:var(--bg-subtle)}

/* 批 140b：筛选框 30 高（压过全局表单基线的 input{height:32}） */
.lv-fbar .lv-fbox{min-height:30px;padding:0 8px}
.lv-fbar .lv-fbox .lv-fq{height:30px;border:0;box-shadow:none}
.fpop .q{height:30px}

/* 批 140c：截断统一用 Primer 的 .Truncate 语义（裸用 + 嵌套 .Truncate-text 都支持） */
.Truncate{display:block;max-width:520px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.Truncate>.Truncate-text,.Truncate-text{display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
td .Truncate{max-width:520px}

/* 批 141（P3）：表头统一 48（含旧表格转换来的 .lv-dense），标题行高 24 */
.lv-dense .lv-table th{height:48px}
.lv-title{line-height:24px}

/* 批 142（P4）：分页按 GitHub 实测 32×32、圆角 6、整条居中 */
.paginate-container{text-align:center;margin:12px 0 4px}
.pagination{display:inline-flex;align-items:center;gap:2px}
.pagination a,.pagination span,.pagination em{height:32px;min-width:32px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
  border:1px solid transparent;font-size:14px;text-decoration:none}
.pagination .previous_page,.pagination .next_page{min-width:auto;padding:0 10px}
.lv-foot{justify-content:center !important}

/* 批 142：页签墨线（容器底部 2px，压在 1px 底线上） */
.repo-tabs{position:relative}
.tabs-ink{position:absolute;bottom:0;height:2px;background:#fd8c73;border-radius:2px;
  display:none;pointer-events:none;
  transition:left .08s cubic-bezier(.65,0,.35,1),width .08s cubic-bezier(.65,0,.35,1)}
.tab.on::after{display:none}

/* 批 142（P4）：侧栏内距按实测 8；折叠过渡 150ms（GitHub 的收起动画节奏） */
.rail{padding:8px 8px 8px 12px;
  transition:width .15s cubic-bezier(.65,0,.35,1),
             flex-basis .15s cubic-bezier(.65,0,.35,1)}
body.rail-off .rail{transition:width .15s cubic-bezier(.65,0,.35,1),
             flex-basis .15s cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion: reduce){ .rail{transition:none} }

/* 批 144 */
/* ③ 筛选框：去掉外层"框线"，图标在输入区内 */
.lv-fbar{border-bottom:1px solid var(--border)}
.lv-fbox{border:0;box-shadow:inset 0 0 0 1px var(--border);border-radius:6px;
  padding:0 8px;gap:4px}
.lv-fbox:focus-within{box-shadow:inset 0 0 0 2px #0969da}
.lv-fico{display:inline-flex;color:var(--text-muted);flex:none}
/* ④⑥ 表头文字与对齐 */
.lv-headbar .lv-fbtn,.lv-headbar .lv-sortbtn{color:var(--text)}
.lv-headbar{align-items:center}
/* ⑤ 排序按钮：图标与文字间距 */
.lv-sortbtn .octicon{color:var(--text-muted)}
.lv-sortbtn{display:inline-flex;align-items:center;gap:4px}
/* ⑧ 分页：无外框、无边框、hover 浅灰底 */
.paginate-container{border:0;text-align:center}
.pagination a,.pagination span,.pagination em{border-color:transparent}
.paginate-container .pagination a:hover,.paginate-container .pagination a:focus{background:var(--bg-subtle);border-color:transparent}
/* ⑪ 焦点环：GitHub 是 inset 2px #0969da（实测 outline:2px transparent; shadow inset） */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid transparent;outline-offset:-2px;
  box-shadow:0 0 0 2px #0969da inset}

/* 批 145（第 1 条）：列表行 -> CSS Grid（GitHub 三区：选择 / 状态 / 主体）
 * 用 display:grid 作用于 tr，td 变成网格项；列宽固定为 32/24/1fr，间距 8。 */
.lv:not(.lv-dense) .lv-table tr.lv-row{display:grid;grid-template-columns:32px 24px minmax(0,1fr);
  align-items:center;column-gap:8px;height:auto;min-height:65px;padding:8px}
.lv:not(.lv-dense) .lv-table tr.lv-row>td{display:block;padding:0;border:0;height:auto;min-width:0}
body.lv-compact .lv:not(.lv-dense) .lv-table tr.lv-row{min-height:38px;padding:4px 8px}
.lv:not(.lv-dense) .lv-table tr.lv-row:hover{background:var(--bg-subtle)}
.lv:not(.lv-dense) .lv-table tr.lv-row[aria-selected="true"]{background:var(--bg-subtle)}

/* 批 146：网格表（div 行）—— 与列表页同一套观感，列宽由调用方用 --cols 指定 */
.lv-gtable{border:1px solid var(--border);border-radius:6px;background:var(--bg);
  overflow:hidden}
.lv-gtable .lv-headbar{display:flex;align-items:center;gap:8px;height:48px;
  padding:8px;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
.lv-gtable .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px;border-bottom:1px solid var(--border)}
.lv-gtable .lv-grid{display:grid}
.lv-gtable .lv-row{display:grid;grid-template-columns:var(--cols,1fr);align-items:center;
  column-gap:8px;min-height:65px;padding:8px;border-bottom:1px solid var(--border)}
.lv-gtable .lv-row:last-child{border-bottom:0}
.lv-gtable .lv-row:hover{background:var(--bg-subtle)}
.lv-gtable .lv-cell{min-width:0;display:block;font-size:14px}
.lv-gtable .lv-cell.muted{color:var(--text-muted)}
.lv-gtable .lv-row.detail{display:block;grid-template-columns:none;background:var(--bg-subtle);
  padding:8px 12px}
.lv-gtable .Truncate{max-width:100%}
</style>
</head>
<body>
<div class="app">
<header class="global-header" id="appHeader">
  <button class="railOpen" id="railOpen" aria-label="打开导航" aria-controls="rail"
    aria-expanded="false" title="打开导航"><span id="railOpenIco"></span></button>
  <div class="brand">
    <span class="logo" id="brandIco" aria-hidden="true"></span>
    Supervisory Statistics
  </div>
  <div class="hstat">
    <div class="gsearch" id="gsearchWrap">
      <span class="ico" id="searchIco" aria-hidden="true"></span>
      <input id="gsearchInput" type="text" autocomplete="off" spellcheck="false"
        placeholder="搜索或跳转…" aria-label="全局搜索"
        aria-haspopup="listbox" aria-expanded="false" aria-controls="gsearchPop">
      <button class="gsearch-k" id="gsearchCmd" title="命令面板（Ctrl K）"
        aria-label="打开命令面板">Ctrl K</button>
    </div>
    <span class="badge" id="live">连接中…</span>
    <span class="badge" id="scope" title="访问范围">—</span>
    <span class="badge" id="auth" title="登录身份">—</span>
    <span class="badge" id="gates">门禁 —</span>
    <span class="badge" id="stamp">—</span>
    <button class="iconbtn" id="bellBtn" aria-haspopup="dialog" aria-label="通知"
      title="通知"><span id="bellIco"></span></button>
    <button class="iconbtn" id="themeBtn" aria-label="切换明暗主题" title="切换明暗主题">
      <span id="themeIco"></span></button>
    <button class="avatar" id="avatarBtn" title="身份与访问范围" aria-label="账号菜单">我</button>
  </div>
</header>
<nav class="repo-tabs" id="repoTabs" aria-label="模块导航">
  <div class="tabs-inner" id="tabsInner"></div>
  <span class="tabs-ink" id="tabsInk" aria-hidden="true"></span>
  <button class="tabs-more" id="tabsMore" hidden aria-haspopup="menu"
    aria-expanded="false"><span>More</span><span id="moreIco"></span></button>
</nav>
<div class="body-layout" id="shell">
  <div class="rail-mask" id="railMask" aria-hidden="true"></div>
  <aside class="rail" id="rail" aria-label="本页导航"></aside>
  <main id="view" class="main-content"><div class="card">加载中…</div></main>
</div>
</div>
<div class="toast" id="toast"></div>

<script src="octicons.js"></script>
<script>
"use strict";
/* ============================================================
 * 确认台前端
 * 纪律：① 每张卡披露「数据源 + 抓取时刻」；② 不可用即显示**原因**（不白屏）；
 *      ③ SSE 失败自动降级为 5s 轮询；④ 零外链、零构建。
 *
 * 2026-10-22（第一百零九批）修的用户可见缺陷：
 *   · P3 报 TypeError: Cannot convert undefined or null to object
 *     —— 根因是 `Object.assign(LAST.metrics, m)` 而 `LAST.metrics` 首次为 undefined。
 *     现改为**新建对象**，并新增 `obj()` 兜底所有 `Object.entries/keys`。
 *   · P1 无任何显示 —— 后端已改为"展开 {src} + 按产物连边的真实 DAG"，
 *     前端改为**分层列布局**（此前两列灰块、无连线无数字）。
 *   · P4 列与内容错位 / 地址错配 / 本地文件打不开 / 处置在列表最下方
 *     —— 见各函数内注释。
 *   · P2/P7 并入总览；P6 增访问地址列；P8 全量提交 + 点开完整变更。
 * ============================================================ */

const TABS = [
  {id:"overview", name:"总览"},
  {id:"flow",     name:"数据流转"},
  {id:"metrics",  name:"指标"},
  {id:"worklist", name:"待办闭环"},
  /* 2026-10-23 新增三页：政策法规 / 公司制度 / 关系图谱。
   * 为什么放在待办闭环之后：读者动线是"看总量 → 查具体文件 → 看它的来龙去脉"，

const kb  = b => { if(b==null) return "—"; const u=["B","KB","MB","GB","TB"]; let i=0,v=Number(b)||0;

/*: `obj()` —— 把"可能为 null/undefined/非对象"的值安全转成对象。

/*: CSRF 令牌：优先用登录响应里给的，其次读 `wb_csrf` cookie（double-submit）。
 * 为什么必须回落到 cookie：**可信代理认证**从不走登录接口，令牌只由
 * `/api/auth/status` 下发成 cookie，前端拿不到它就无法写（实测踩到）。 */
function csrfToken(){
  if(STATE.csrf) return STATE.csrf;
  const m = (document.cookie || "").match(/(?:^|;\s*)wb_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

async function api(path, opts){
  const o = Object.assign({headers:{}}, opts||{});
  o.headers = Object.assign({"Accept":"application/json"}, obj(opts && opts.headers));
  // CSRF：写请求必须带与 cookie 一致的 `X-CSRF`（服务端强制校验）
  const ctk = csrfToken();
  if(ctk) o.headers["X-CSRF"] = ctk;
  const r = await fetch(path, o);
  const ct = r.headers.get("content-type")||"";
  if(!ct.includes("json")) return {available:false, reason:"非 JSON 响应（HTTP "+r.status+"）"};
  let j={}; try{ j = await r.json(); }catch(e){ return {available:false, reason:"响应不是合法 JSON"}; }
  /* 401 ⇒ 会话失效/未登录：置状态，并**异步**触发一次重渲染切到登录卡片。
   *
   * ⚠️ 为什么不能直接 `render()`（2026-10-23 真实故障）：
   * `render()` 内部会 await 多个 `api()`，而 `api()` 在 401 时又调 `render()`
   * ⇒ **递归**（render→api→render→…），浏览器表现为"页面空着/一直转"，
   * 用户看到的就是"两个地址都显示未认证、什么都点不出来"。
   * 改为 `setTimeout(0)` + 一次性闸门：跳出当前调用栈，且并发 401 只触发一次。 */
  if(r.status === 401 && j && j.need_login){
    STATE.auth = {authenticated:false, mode:j.mode || "",
                  user:"", user_source:"未认证"};
    HEALTH_P = null;
    if(!AUTH_RELOADING && CUR !== "__login"){
      AUTH_RELOADING = true;
      setTimeout(()=>{ AUTH_RELOADING = false; render(); }, 0);
    }
  }
  if(!r.ok) return Object.assign({available:false}, obj(j), {httpStatus:r.status});
  return j;
}

function card(title, hint, body, src, at){
  /* 标题为空 ⇒ **不渲染标题行**（用户第 2 条：这些页面不需要文字标题）。
   * 保留 h3 的空壳会让标题区仍占一条边框/高度，等于"删了字没删结构"。 */
  const head = title
    ? `<h3><span>${esc(title)}</span><span class="hint">${esc(hint||"")}</span></h3>`
    : "";
  return `<div class="card">${head}
    ${body}<div class="src">数据源：${esc(src||"—")}${at?(" ｜ 抓取："+esc(at)):""}</div></div>`;
}
function unavail(d, why){
  return card(why||"卡片","",`<div class="pill warn">⚠ 不可用</div>
    <div class="note">${esc(d.reason||d.error||"未知原因")}</div>`, d.source);
}
const kv = (k,v,cls)=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v ${cls||""}">${v}</span></div>`;
/* 批 134（P1）：标签统一用 Primer 的 .Label 家族——不再自绘 pill；
 * 语义色映射沿用旧调用方传入的 ok/warn/bad。 */
const PILL_LABEL = {ok: "Label--success", warn: "Label--attention",
                    bad: "Label--danger", done: "Label--success"};
const pill = (t, c) => `<span class="Label ${PILL_LABEL[c] || ""}">${esc(t)}</span>`;
const kpi = (label,value,unit,cls)=>
  `<div class="kpi"><div class="n ${cls||""}">${value}${unit?`<span class="u">${esc(unit)}</span>`:""}</div>
   <div class="l">${esc(label)}</div></div>`;

/*: 条形列表（**用 flex 而非 SVG**）
 * 用户三次报"图表渲染异常"，其中两次的根因都是 SVG 里**文字按估算宽度排版会溢出画布**
 * （标签压柱、数值被裁）。CSS 网格 + `text-overflow` 从结构上消除了这类问题：
 * 文字只在它自己的格子里，永远不会跑到柱子上。 */
function bars(data, color, unit){
  const e = Object.entries(obj(data));
  if(!e.length) return '<div class="muted">暂无数据</div>';
  const max = Math.max(1, ...e.map(([,v])=>Number(v)||0));
  const total = e.reduce((a,[,v])=>a+(Number(v)||0),0);
  const rows = e.map(([k,v])=>{
    const n=Number(v)||0, pct=max?Math.max(n>0?1.5:0, n/max*100):0;
    const share=total?(n/total*100):0;
    return `<div class="brow" title="${esc(k)}：${num(n)}${unit||""}（占 ${share.toFixed(1)}%）">
      <div class="bl">${esc(k)}</div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${color}"></div></div>
      <div class="bv">${num(n)}${unit?" "+esc(unit):""}<span class="muted" style="font-weight:400"> · ${share.toFixed(share>=10?0:1)}%</span></div>
    </div>`;}).join("");
  const pos=e.map(([,v])=>Number(v)||0).filter(v=>v>0);
  const minPos=pos.length?Math.min(...pos):0;
  const note = (minPos>0 && max/minPos>=20)
    ? `<div class="note">分布高度集中（最大 ${num(max)} / 最小非零 ${num(minPos)}，约 ${Math.round(max/minPos)} 倍）：
        小值条形按线性比例接近不可见，**数值与占比均已标注**——这是真实分布，不是图坏了。</div>` : "";
  return `<div class="bars">${rows}</div>${note}`;
}
