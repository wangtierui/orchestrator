function bindGraph(){
  const v = $("#view");
  // 视图切换（全览 / 四类关系）——**只切视图、不换中心**，条件保留在 STATE
  $$("[data-gview]", v).forEach(el => {
    el.onclick = (ev) => {
      const key = el.dataset.gview;
      if (!key) return;
      // 卡片里可能嵌了图表按钮，避免冒泡重复触发
      ev.stopPropagation();
      STATE.graph = Object.assign({}, obj(STATE.graph), {view: key});
      CUR = "graph"; render();
    };
  });
  $$("g.gnode", v).forEach(g => { g.onclick = () => goGraph(g.dataset.ref); });
  // 表格/枢纽榜里的"查看"也是入口
  $$("[data-ref]", v).forEach(el => {
    if (el.tagName === "G") return;              // 图节点上面已绑
    el.onclick = () => goGraph(el.dataset.ref);
  });
  const back = $("#gback", v);
  if (back) back.onclick = () => {
    STATE.graph = {};                             // 清空中心 ⇒ 下次渲染走全局
    CUR = "graph"; render();
  };
  // E-R 实体框 / 表名点选 → 切换中心（**2D 图，不走 g3d**）
  $$("[data-erdtab]", v).forEach(el => {
    el.onclick = () => { STATE.east_erd = el.dataset.erdtab || ""; render(); };
  });
  bindG3d();
}

/** 跳到「关系图谱」页签并以 `ref` 为中心。
 *  不直接 `render()`：先改 hash，让 hashchange 统一负责 CUR/导航高亮/渲染，
 *  避免"手改 CUR + 再触发 hashchange"造成**渲染两次**（闪一下）。 */
function goGraph(ref){
  if (!ref) return;
  STATE.graph = Object.assign({}, obj(STATE.graph), {ref: ref});
  if (location.hash.slice(1) === "graph") { CUR = "graph"; render(); }
  else { location.hash = "graph"; }
}

  const cats = arr(d.categories).filter(c => String(c.label || "").includes("EAST"));

/* ===================== 「EAST 规范」浏览器（v3，2026-10-26） =====================
 *
 * 六个分页，按"人怎么用规范"切：
 *   概览    —— 通知信息 + 覆盖度 + 附件清单（1, 1-1, 1-2 … 自然序）

 *   数据元  —— 307 个数据元字典（编码/名称/定义/取值/格式/被几张表用到）
 *   代码表  —— 63 张业务代码表（带 `CDxxxxxx` 编号；多级表按层级缩进）

 *   E-R 图  —— 表间字段级关系（3D 可拖拽）

 * 三条 UX 纪律（都写在代码里，免得后人改回去）：
 *   · `取值范围` 若是"参照《业务代码表》XX，编号CDxxxxxx"，**点它直接跳到那张代码表**；
 *     跳转目标由抽取层解析（`code_ref`），页面不做字符串猜测；
 *   · 代码表**不显示「返回目录」**列 —— 那是 xlsm 的导航超链接，已在抽取层剔除；
 *   · 数据项/数据元/代码表/规则全部**懒加载**（首屏只下 434KB 结构件）。
 */
const EAST_TABS = [

function eastKpis(d){

/* ============ 监管统计：**两级**侧栏（2026-10-27 用户第 7 条）============
 *
 * 一级：EAST（7 个二级页签） / 统计制度（监管制度、公司制度）
 * 为什么这么分：EAST 是"一套规范的长相"（表/元/码/规则/关系），
 * 统计制度是"规定口径的文件"（监管发文 + 本公司办法）—— 两类读者动机不同，
 * 平铺成 9 个一级页签会让人分不清"我在看规范还是在看制度"。
 */
const EAST_SCOPES = [
  {key: "east", label: "EAST", hint: "监管数据标准化规范"},
  {key: "stat", label: "统计制度", hint: "监管发文 + 公司办法"},
];
const STAT_TABS = [
  {key: "reg", label: "监管制度"},
  {key: "corp", label: "公司制度"},
];

/*: 监管统计的两级导航 → 登记到 rail（一级=scope，二级=页签）。
 *
 * ⚠️ 二级项的动作键必须是 `east_tab` / `stat_tab`（与 SIDE_ACT 对应）；
 * 早前写成 `data-side="east_tab"` 却没在 SIDE_ACT 注册，症状就是"点了没反应"。
 */
function eastSide(scope, tab, statTab){
  const d = obj(STATE.east);
  const st = obj(d.stats);
  const tabCount = (k) => k === "tables" ? st.tables
    : k === "elements" ? arr(d.elements).length
    : k === "codes" ? st.code_tables
    : k === "rules" ? st.rules
    : k === "er" ? st.er_edges : null;
  /* 一级=分组标题（恒不高亮）；二级=页签；三/四级只在当前页签展开 ——
   * 默认展开到第二层，与 GitHub 侧栏的按需展开一致（用户第 8 条）。 */
  const items = [{side: "east_scope", skey: "east", label: "EAST", level: 1, cur: false}];
  if (scope === "east") {
    EAST_TABS.forEach(x => {
      /* 子项被选中时，父级（二级页签）**不再高亮** —— GitHub 侧栏只标当前项（第 3 条） */
      const childOn = (x.k === "overview" && !!(STATE.east_cat && STATE.east_cat.on))
        || (x.k === "tables" && !!(STATE.east_domain || STATE.east_sel))
        || (x.k === "codes" && !!STATE.east_code)
        || (x.k === "rules" && !!STATE.east_rtype);
      items.push({side: "east_tab", skey: x.k, label: x.n, level: 2,
                  count: tabCount(x.k), cur: tab === x.k && !childOn});
      if (tab !== x.k) return;
      if (x.k === "overview") {
        const c = obj(STATE.east_cat);
        items.push({side: "east_cat", skey: "", label: "数据结构", level: 3,
                    count: arr(d.tables).length, cur: !!c.on && !c.domain});
        arr(d.domains).forEach(dm => items.push({
          side: "east_cat", skey: dm, label: dm, level: 4,
          count: obj(st.by_domain)[dm], cur: !!c.on && c.domain === dm,
        }));
      }
      if (x.k === "tables") {
        arr(d.domains).forEach(dm => {
          const on = String(STATE.east_domain || "") === dm;
          items.push({side: "east_domain", skey: dm, label: dm, level: 3,
                      count: obj(st.by_domain)[dm], cur: on});
          if (!on) return;
          arr(d.tables).filter(tb => tb.domain === dm).forEach(tb => {
            items.push({side: "east_table", skey: tb.table_no,
                        label: (tb.table_code ? tb.table_code + " · " : "") + (tb.table_name || ""),
                        level: 4, cur: String(STATE.east_sel || "") === tb.table_no});
          });
        });
      }
      if (x.k === "codes") {
        arr(d.code_index).slice().sort((a, b) =>
          String(a.id || "zzz") < String(b.id || "zzz") ? -1 : 1)
          .forEach(c => items.push({side: "east_codesel", skey: c.sheet,
            label: (c.id ? c.id + " · " : "") + (c.name || c.sheet), level: 3,
            count: c.count, cur: String(STATE.east_code || "") === c.sheet}));
      }
      if (x.k === "rules") {
        Object.keys(obj(d.rule_index)).forEach(k => {
          const m = obj(obj(d.rule_index)[k]);
          items.push({side: "east_rtype", skey: k, label: k + " " + (m.label || ""),
                      level: 3, count: m.count,
                      cur: String(STATE.east_rtype || "") === k});
        });
      }
    });
  }
  items.push({side: "east_scope", skey: "stat", label: "统计制度", level: 1, cur: false});
  if (scope === "stat") {
    STAT_TABS.forEach(x => items.push({side: "stat_tab", skey: x.key, label: x.label,
                                       level: 2, cur: statTab === x.key}));
  }
  railSet("规范与制度", items.map(it => ({...it, on: !!it.cur})), "");
  return items;
}

    <div class="muted" style="margin-bottom:var(--s2)">${esc(d.note || "")}</div>`;
  /* 批 132（第 10 条）：除概览外，不再重复"规范说明 + 覆盖度"那段文案。 */
  const showHead = tab === "overview";
  const cat = obj(STATE.east_cat);
  const body = scope === "stat"
    ? (statTab === "corp" ? eastStatCorp() : eastStatReg(regstats))
    : (cat.on ? eastCatalog(d, String(cat.domain || ""))
      : tab === "tables" ? eastTables(d)
      : tab === "elements" ? eastElements(d)
      : tab === "codes" ? eastCodes(d)
      : tab === "rules" ? eastRules(d)
      : tab === "er" ? eastEr(d)
      : tab === "erd" ? eastErd(d)
      : eastOverview(d, regstats));
  eastSide(scope, tab, statTab);        // 只登记导航，不再包 aside
  return (showHead ? head : "") + body;
}

/* ---------------- 概览：覆盖度 + 附件清单 ---------------- */
function _natNo(a, b){
  // 附件号自然序：1 < 1-1 < 1-2 < 1-10 < 2（直接字符串比较会把 1-10 排到 1-2 前面）
  const pa = String(a || "").split(/[-.]/), pb = String(b || "").split(/[-.]/);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i], y = pb[i];
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    const nx = Number(x), ny = Number(y);
    if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return nx - ny;
    if (isNaN(nx) || isNaN(ny)) {
      const c = String(x).localeCompare(String(y), "zh");
      if (c) return c;
    }
  }
  return 0;
}

function eastOverview(d, regstats){
  const st = obj(d.stats), src = obj(d.source);
  /* ③（2026-10-26 复核用户原意）：「EAST / 监管数据标准化」指的是**监管统计资料清单**
   * 那个区块（含"当前库内仅 1 条"与 名称/文号/时效/源/访问地址/关系 表），
   * 它必须显示在**附件清单上方**。资料块由 `viewRegstats` 生成后传入。 */
  const docsBlock = arr(obj(regstats).categories).length
    ? eastRegstatsDocs(regstats) : "";
  const atts = arr(src.attachments).slice().sort((a, b) => _natNo(a.no, b.no));
  const rows = atts.map(a => `<tr>
      <td class="mono">${esc(a.no || "-")}</td>
      <td class="ttl">${esc(a.name || "")}</td>
      <td><span class="Label">${esc(a.kind || "—")}</span></td>
      <td class="mono">${(Number(a.bytes || 0) / 1048576).toFixed(2)} MB</td>
      <td>${a.text_len ? pill(num(a.text_len) + " 字", "ok")
                       : (String(a.kind) === "jpg" ? '<span class="muted">图片</span>'
                                                   : pill("未抽出", "warn"))}</td>
      <td class="mono">${esc(a.sha256 || "")}</td></tr>`).join("");
  const nEmpty = atts.filter(a => !a.text_len && String(a.kind) !== "jpg").length;
  /* 2026-10-27（用户第 1 条）：概览原来有**两个**"EAST / 监管数据标准化"标题，
   * 中间还夹着能力边界 note ⇒ 读起来像两段并列内容。现在收敛成：
   *   ① 唯一的顶部标题（只留通知文号/日期，标题文字在卡片头里）
   *   ② KPI + 能力边界（页级共识）
   *   ③ 资料段（保险业监管数据标准化规范…）—— **紧邻** ④
   *   ④ 附件清单（12 个，自然序）—— 中间不再插任何东西
   */
  return `${eastKpis(d)}
    <div class="note" style="margin:var(--s2) 0 var(--s3)">
      <b>能力边界</b>：本页只做**规范查阅**（有哪些表、每个数据项怎么填、代码表取值、
      检核规则、表间关系），<b>不校验报文、不生成 EAST 数据</b>。
      覆盖附件 1 / 1-1 / 1-2 / 1-3 / 1-4 / 1-5 / 1-6 与表单类 2~6。
    </div>
    ${docsBlock}
    <h3 style="margin:var(--s3) 0 var(--s2)">
      <span>附件清单 <span class="Label">${num(atts.length)} 个</span></span>
      <span class="hint">按附件号自然序排列（1, 1-1, 1-2 …）；抽取状态如实标注${
        nEmpty ? "（" + num(nEmpty) + " 个非图片附件未抽出正文）" : ""}</span></h3>
    <div class="lv lv-gtable"><div class="lv-scroll"><div class="lv-grid" style="--cols:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">${rows}</div></div></div>
    <div class="muted" style="margin-top:var(--s2)">
      来源：<code title="${esc(src.index || "")}">${esc(String(src.index || "").split("/").pop())}</code>
      ；附件字节存采集目录（唯一事实源），正文全文可在「文档检索」问。</div>`;
}

/* ---------------- E-R 图（3D） ---------------- */
function eastEr(d){
  const er = obj(d.er), nodes0 = arr(er.nodes), edges0 = arr(er.edges), st = obj(er.stats);
  if(!edges0.length){
    return '<div class="note">尚未解析出表间关系（需要附件1-5 的「表间数据项关联性校验规则-E」）。</div>';
  }
  const linked = nodes0.filter(n => Number(n.degree) > 0);
  const nodes = linked.map(n => ({id: n.id, name: n.name || n.code, docno: n.code,
                                  kind: "table", group: n.domain || "未分类",
                                  degree: Number(n.degree) || 1}));
  const edges = edges0.map(e => ({
    from: e.from, to: e.to, label: "",
    title: `${e.from_table}.${e.field} → ${e.to_table}${e.dst_field ? "." + e.dst_field : ""}`
           + `（${e.source} ${e.rule_no}）`,
    color: e.source === "1-5E" ? "var(--primary)" : "var(--alt)",
  }));
  const bySource = obj(st.by_source);
  return `<div class="muted" style="margin-bottom:var(--s2)">${esc(er.note || "")}</div>
    <div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("数据表", num(st.nodes), "个")}
      ${kpi("有关系", num(st.linked_nodes), "个", "ok")}
      ${kpi("关系边", num(st.edges), "条")}
      ${kpi("来自 1-5-E", num(bySource["1-5E"]), "条")}
      ${kpi("来自 1-3 关联", num(bySource["1-3关联"]), "条")}

/* ---------------- E-R 图（表级，按附件1-6 语义重建） ----------------
 *
 * 附件1-6 是一张 **JPG 图片**（`…_附件1-6_E-R图（修订版）_20250410.jpg`），
 * 机器不可解析。但它的语义在附件里是**有机器可读来源**的：
 *   1-5-E「表间数据项关联性校验规则」319 条 + 1-3「关联数据项」362 条
 *   —— 两条来源都明确写了"哪张表的哪个字段必须出现在哪张表里"。
 * 所以本图**不是凭空画的**：把 681 条字段级关系按（源表→目标表）聚合，
 * 得到表级 E-R；点任一张表会列出它的**上游**（谁指向它）与**下游**（它指向谁）。
 * 页面明写图片原件位置，读者可自行核对 —— 不假装"我们解析了那张图"。
 */
/* ---------------- E-R 图（附件1-6 风格：实体框 + 正交连线 + 基数） ----------------
 *
 * 为什么不做成"关系图那样的 3D"（用户第 6 条明确要求区分）：
 *   · 附件1-6 是**实体-关系图**：表是方框、连线标基数（1:N）、字段写在框里；
 *   · 读者用它回答"这张表的主外键指向谁"，要的是**可读的连线**而不是密度感。
 *
 * 布局（聚焦式）：左列 = 上游（指向中心的表），中间 = 中心实体，右列 = 下游。
 * 112 张表全画会变成毛线团 —— 所以默认聚焦**度数最高**的那张，点任一张表可切换。
 * 数据来源仍是 1-5-E（319 条）+ 1-3「关联数据项」（362 条），页面写明"不假装解析了那张 JPG"。
 */
function eastErd(d){
  const er = obj(d.er), edges0 = arr(er.edges), nodes0 = arr(er.nodes);
  if(!edges0.length) return '<div class="note">尚未解析出表间关系。</div>';
  const byNo = {};
  nodes0.forEach(n => { byNo[n.id] = n; });
  // 表→表聚合（保留来源与样例规则、以及涉及的字段）
  const agg = {};
  edges0.forEach(e => {
    const k = e.from + "→" + e.to;
    if(!agg[k]) agg[k] = {from: e.from, to: e.to, from_table: e.from_table,
                          to_table: e.to_table, count: 0, sources: {},
                          fields: [], sample: e.rule || ""};
    const a = agg[k];
    a.count += 1;
    a.sources[e.source] = (a.sources[e.source] || 0) + 1;
    if(a.fields.length < 6) {
      a.fields.push(e.field + (e.dst_field ? "→" + e.dst_field : ""));
    }
  });
  const pairs = Object.values(agg);
  const deg = {};
  pairs.forEach(p => {
    deg[p.from] = (deg[p.from] || 0) + p.count;
    deg[p.to] = (deg[p.to] || 0) + p.count;
  });
  // 焦点：用户点过的表 > 度数最高 > 第一张
  let cur = String(STATE.east_erd || "");
  if(!cur || !byNo[cur]) {
    cur = Object.keys(deg).sort((a, b) => deg[b] - deg[a])[0] || "";
  }
  const up = pairs.filter(p => p.to === cur).sort((a, b) => b.count - a.count);
  const down = pairs.filter(p => p.from === cur).sort((a, b) => b.count - a.count);
  const center = byNo[cur] || {id: cur, name: cur, code: "", domain: ""};

  /* ---------- 画布：左上游 / 中中心 / 右下游 ---------- */
  const BW = 300, BH = 46, GAP = 14, PAD = 20, CX = 380, CW = 300;
  const rows = Math.max(up.length, down.length, 1);
  const H = PAD * 2 + Math.max(rows * (BH + GAP), BH + 40) + 30;
  const W = CX * 2 + CW;
  const cy = PAD + (rows * (BH + GAP) - GAP) / 2 - BH / 2;   // 中心框垂直居中

  const box = (x, y, title, sub, cnt, on, id) => `<g class="erbox${on ? " on" : ""}"
      data-erdtab="${esc(id)}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="7"
        fill="${on ? "var(--primary-l)" : "var(--card)"}"
        stroke="${on ? "var(--primary)" : "var(--line2)"}" stroke-width="${on ? 2 : 1}"/>
      <text x="${x + 10}" y="${y + 18}" style="font-size:12.5px;font-weight:600;fill:var(--fg)">
        ${esc(_gCut(sub || title, 18))}</text>
      <text x="${x + 10}" y="${y + 34}" style="font-size:11px;fill:var(--fg3)">
        ${esc(_gCut(title, 26))}${cnt ? " · " + cnt + " 条关系" : ""}</text>
    </g>`;

  const nUp = up.length, nDown = down.length;
  const upY = (i) => PAD + i * (BH + GAP) + Math.max(0, (rows - nUp) * (BH + GAP) / 2);
  const dnY = (i) => PAD + i * (BH + GAP) + Math.max(0, (rows - nDown) * (BH + GAP) / 2);

  const link = (x1, y1, x2, y2, label, fromLeft) => {
    const mx = (x1 + x2) / 2;
    return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" fill="none"
        stroke="var(--primary)" stroke-width="1.1" opacity=".55"/>
      <circle cx="${x2}" cy="${y2}" r="2.6" fill="var(--primary)" opacity=".8"/>
      <text x="${mx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle"
        style="font-size:10.5px;fill:var(--fg3)">${esc(label)}</text>`;
  };

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="E-R 实体关系图" style="background:
      radial-gradient(circle at 50% 40%, var(--card), var(--bg) 75%);border-radius:10px;
      border:1px solid var(--line)">`;
  up.forEach((p, i) => {
    const y = upY(i);
    svg += box(PAD, y, p.from_table, byNo[p.from] ? byNo[p.from].name : "", p.count, false, p.from);
    svg += link(PAD + BW, y + BH / 2, CX, cy + BH / 2, p.count + " 条", true);
  });
  down.forEach((p, i) => {
    const y = dnY(i);
    svg += box(CX + CW, y, p.to_table, byNo[p.to] ? byNo[p.to].name : "", p.count, false, p.to);
    svg += link(CX + CW, cy + BH / 2, CX + CW, y + BH / 2, p.count + " 条", false);
  });
  // 中心实体框（更高：带关联字段清单）
  const fields = [...new Set([...up.map(p => p.fields[0] || ""), ...down.map(p => p.fields[0] || "")])]
    .filter(Boolean).slice(0, 5);
  const CH = BH + 14 + Math.max(0, fields.length) * 15;
  svg += `<g>
      <rect x="${CX}" y="${cy}" width="${CW}" height="${CH}" rx="8"
        fill="var(--primary-l)" stroke="var(--primary)" stroke-width="2"/>
      <text x="${CX + 12}" y="${cy + 20}" style="font-size:13px;font-weight:700;fill:var(--primary)">
        ${esc(_gCut(center.name || cur, 20))}</text>
      <text x="${CX + 12}" y="${cy + 37}" style="font-size:11px;fill:var(--fg2)">
        ${esc(center.code || "")} · ${esc(center.domain || "未分类")}</text>
      ${fields.map((f, i) => `<text x="${CX + 12}" y="${cy + 58 + i * 15}"
        style="font-size:10.5px;fill:var(--fg3)">◇ ${esc(_gCut(f, 26))}</text>`).join("")}
    </g>`;
  svg += "</svg>";

  const rowLi = (p, dir) => `<tr>
      <td>${dir === "up" ? "←" : "→"}</td>
      <td><button class="link" data-erdtab="${esc(dir === "up" ? p.from : p.to)}">
        ${esc(dir === "up" ? p.from_table : p.to_table)}</button></td>
      <td class="mono">${esc(dir === "up" ? p.from : p.to)}</td>
      <td class="num">${num(p.count)}</td>
      <td class="muted">${esc(Object.keys(p.sources).join("/"))}</td>
      <td class="muted">${esc(_gCut(p.fields.join("；"), 46))}</td></tr>`;

  return `<div class="note" style="margin-bottom:var(--s2)">
      附件1-6 是**图片**（E-R 图（修订版）.jpg），机器不可解析；本图按其**实体-关系语义**，
      用 1-5-E 表间关联规则（319 条）+ 1-3「关联数据项」（362 条）重建：
      <b>${num(nodes0.length)} 张表 / ${num(pairs.length)} 条表间指向</b>，可逐条与图片核对。
      <b>点任一实体框可切换中心</b>（看它的上游/下游）。</div>
    <div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("参与表", num(nodes0.length), "张")}
      ${kpi("表间指向", num(pairs.length), "条")}
      ${kpi("字段级关系", num(edges0.length), "条")}
      ${kpi("当前中心上游", num(up.length), "张")}
      ${kpi("当前中心下游", num(down.length), "张")}
    </div>
    <div class="scrollx">${svg}</div>
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>指向（左=上游，右=下游）</span>
      <span class="muted">连线上的数字 = 该对表之间的字段级关系条数</span>
    </div>
    <h3 style="margin:var(--s3) 0 var(--s2)">
      <span>「${esc(center.name || cur)}」的上游/下游</span>
      <span class="hint">共 ${num(deg[cur] || 0)} 条字段级关系；点表名可切换中心</span></h3>
    <div class="lv lv-gtable"><div class="lv-scroll"><div class="lv-grid" style="--cols:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">${[...up.map(p => rowLi(p, "up")),
      ...down.map(p => rowLi(p, "down"))].join("")
      || '<div class="lv-row"><span class="lv-cell" colspan="6" class="muted">该表没有表间关系</span></div>'}</div></div></div>`;
}

/*: 数据格式码 → 官方解释（说明书是参数化码 `M!an`，数据项是具体码 `24!an`） */
function eastFmtDesc(code){
  const lg = obj(obj(STATE.east).format_legend);
  const c = String(code || "");
  if (!c) return "";
  if (lg[c]) return lg[c];
  const m = c.replace(/\d+/g, "M");
  if (lg[m]) return lg[m];
  return lg[m.replace(/\(M\)/, "(N)")] || "";
}

}

        ], String(obj(STATE._fbq).status || ""), "fbstatus")}
        ${["时间", "编号", "分类", "严重度", "页面", "标题 / 说明", "记录者", "IP",
           "状态"].map((lab, i) =>
          `<button class="lv-fbtn btn btn-invisible" data-gcol="${i}"
            aria-haspopup="dialog" title="按「${esc(lab)}」筛选">${esc(lab)}${
            ico("chevron-down", 16)}</button>`).join("")}
        <span class="sp"></span>
      </div>
      <div class="lv-scroll"><div class="lv-grid"
        style="--cols:150px 190px 90px 96px 96px minmax(0,1fr) 150px 120px 90px 80px">
        ${rows}</div></div>
    </div>`;
  const cur = String(obj(STATE._fbq).status || "");
  const stItems = [
    {key: "", label: "全部状态", count: st.total || 0},
    {key: "open", label: "待处置", count: obj(st.by_status).open},
    {key: "ack", label: "已受理", count: obj(st.by_status).ack},

  return card("", "发现问题就记一条",
    sideShell("fb", stItems, cur, body, "状态"),
    d.source_name || "interfaces.feedback_api", d.fetched_at);
}

/*: 提交（页面与弹窗共用一套逻辑与校验）。 */
async function fbSubmit(root, btn, done){
  const val = (sel) => { const el = $(sel, root); return el ? el.value : ""; };
  const payload = {
    kind: val("#fbkind") || "bug",
    severity: val("#fbsev") || "normal",
    page: val("#fbpage") || "",
    account: (val("#fbacc") || "").trim(),
    title: (val("#fbtitle") || "").trim(),
    detail: (val("#fbdetail") || "").trim(),
  };
  if (btn) btn.disabled = true;
  try {
    const r = await api("/api/feedback", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    if (r && r.ok) {
      toast("已记录：" + r.fid);
      if (done) done();
      render();
    } else {
      toast("提交失败：" + ((r && r.reason) || "未知原因"), true);
      if (btn) btn.disabled = false;
    }
  } catch (e) {
    toast("提交失败：" + String(e), true);
    if (btn) btn.disabled = false;
  }
}

/*: 侧栏「反馈」→ 居中弹窗（带遮罩）。 */
function openFeedbackModal(){
  lvClosePop();
  const mask = document.createElement("div");
  mask.className = "pal-mask";
  mask.innerHTML = `<div class="fb-modal" role="dialog" aria-modal="true"
      aria-labelledby="fbTitle">
      <div class="fb-head"><h2 id="fbTitle">记录一个问题</h2>
        <button class="iconbtn" data-close aria-label="关闭">${ico("x", 16)}</button></div>
      <div class="fb-body">${fbFormHtml()}</div>
    </div>`;
  document.body.appendChild(mask);
  applyPrimerControls();      /* 弹窗不在 render 流程里，控件要再过一遍 */
  const close = () => mask.remove();
  mask.addEventListener("click", (ev) => {
    if (ev.target === mask || (ev.target.closest && ev.target.closest("[data-close]"))) close();
  });
  const btn = $("#fbsubmit", mask);
  if (btn) btn.onclick = () => fbSubmit(mask, btn, close);
  const first = $("#fbtitle", mask);
  if (first) first.focus();
  return mask;
}

function bindFeedback(){
  const v = $("#view");
  /* 表头「全部/待处置/已受理/已闭环」开关 */
  $$("[data-fbstatus]", v).forEach(b => {
    b.onclick = () => {
      STATE._fbq = Object.assign({}, obj(STATE._fbq), {status: b.dataset.fbstatus || ""});
      render();
    };
  });
  const sub = $("#fbsubmit", v);
  if (sub) sub.onclick = () => fbSubmit(v, sub);
  const flt = $("#fbfilter", v);
  if (flt) {
    flt.value = (STATE._fbq || {}).status || "";
    flt.onchange = () => {
      STATE._fbq = Object.assign({}, obj(STATE._fbq), {status: flt.value});
      render();
    };
  }
  $$("[data-fbx]", v).forEach(b => {
    b.onclick = async () => {
      const fid = b.dataset.fbx;
      const handling = prompt("处置说明（闭环必填，≥4 字）：\n" + fid, "已核验并修复");
      if (handling == null) return;
      const r = await api("/api/feedback/resolve", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({fid: fid, handling: handling, status: "closed"}),
      });
      if (r && r.ok) { toast("已闭环 " + fid); render(); }
      else toast("处置失败：" + ((r && r.reason) || "未知原因"), true);
    };
  });
}

/* ========================= 列表视图引擎（GitHub Issues 风格） =========================

/* ---------------- 视图元数据（隐藏字段 / 列序 / 切片） ---------------- */
const LV_KEY = "lv.meta.v1";
const LV_VIEWS_KEY = "lv.views.v1";

function _ls(key, dflt) {
  try { return JSON.parse(localStorage.getItem(key) || "null") ?? dflt; }
  catch (e) { return dflt; }
}
function _lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 隐私模式 */ }
}

function lvMeta(list) {
  const all = _ls(LV_KEY, {});
  const m = Object.assign({hidden: [], order: [], sliceField: "", sliceValue: ""}, all[list] || {});
  return m;
}
function lvSetMeta(list, patch) {
  const all = _ls(LV_KEY, {});
  all[list] = Object.assign(lvMeta(list), patch);
  _lsSet(LV_KEY, all);
}
function lvFields(list, onlyVisible) {
  const cfg = LV[list], m = lvMeta(list);
  const by = {};
  cfg.fields.forEach(f => { by[f.k] = f; });
  const order = (m.order || []).filter(k => by[k]);
  const rest = cfg.fields.filter(f => order.indexOf(f.k) < 0).map(f => f.k);
  const fields = order.concat(rest).map(k => by[k]);
  return onlyVisible ? fields.filter(f => (m.hidden || []).indexOf(f.k) < 0) : fields;
}
function lvSliceActive(list) {
  const m = lvMeta(list);
  return !!(m.sliceField && m.sliceValue !== "" && m.sliceValue != null);
}

/* ---------------- 活动筛选（用于"非默认状态"提示） ---------------- */
function lvActiveFilters(list, st) {
  const out = [];
  const cfg = LV[list];
  cfg.fields.forEach(f => {
    if (!f.slice) return;
    if (st[f.slice]) out.push({kind: "filter", param: f.slice, field: f.label,
                               value: st[f.slice]});
  });
  ["q_title", "q_docno", "q_rfn", "q_ipn"].forEach(k => {
    if (st[k]) out.push({kind: "search", param: k, field: k.replace("q_", ""),
                         value: st[k]});
  });
  const m = lvMeta(list);
  if (lvSliceActive(list)) {
    out.push({kind: "slice", param: m.sliceField, field: (LV[list].fields.find(f => f.k === m.sliceField) || {}).label || m.sliceField,
              value: m.sliceValue});
  }
  return out;
}

/* ---------------- 行渲染 ---------------- */
/*: 行首状态图标 —— GitHub 用 `issue-opened` 绿点 / `issue-closed` 紫点表达状态。
 * 我们的状态是"时效"（laws）或"生效状态"（rules），映射到同一套观感。 */
const ST_TONE = {
  valid: "ok", pending: "warn", amended: "info",
  repealed: "done", expired: "done", "": "muted",
};
function lvStateIcon(it, list) {
  const v = list === "laws" ? it.timeliness_status : it.eff_status;
  const tone = ST_TONE[v == null ? "" : v] || "muted";
  const fill = tone === "ok" ? "#1a7f37"
    : tone === "warn" ? "#bf8700"
    : tone === "done" ? "#8250df"
    : tone === "info" ? "#0969da" : "#8c959f";
  const label = (ST_LABEL[v == null ? "" : v] || v || "未标注");
  /* 官方图标：open/closed 两种形态，颜色按时效映射（GitHub 就是这么表达状态的） */
  const name = (tone === "ok" || tone === "warn" || tone === "info")
    ? "issue-opened" : "issue-closed";
  return `<span class="lv-st" style="color:${fill}" role="img" aria-label="${esc(label)}"
      title="${esc(label)}">${ico(name, 16)}</span>`;
}

function lvRowId(list, it) {
  return String(list === "laws" ? (it.rfn || it.document_number || it.title || "")
                                : (it.ipn || it.docno || it.title || ""));
}
function lvSel(list) {
  STATE._lvsel = STATE._lvsel || {};
  STATE._lvsel[list] = STATE._lvsel[list] || {};
  return STATE._lvsel[list];
}

/*: 列表上方的筛选框（GitHub 的 filter input）：条件以 token 留在框内，右侧 X 清除。
 *
 * 语法与 GitHub 的 qualifier 同构：`主题:T1 文号:金非银检函`，不认识的键按自由文本处理
 * （落到"名称"上）。只改 `st` 里既有的查询参数，不新增接口参数。 */
const LV_QBAR_KEYS = {
  "主题": "theme", "来源": "source", "时效": "timeliness",
  "名称": "q_title", "标题": "q_title", "文号": "q_docno",
  "标识": "q_rfn", "唯一标识号": "q_rfn",
};

function lvFilterBar(list, st, act){
  const toks = act.map(a => `<span class="lv-tok${a.kind === "slice" ? " slice" : ""}">
      <b>${esc(a.field)}</b>${esc(String(a.value)).slice(0, 24)}
      <button data-lvrm="${esc(a.param)}" data-lvrmkind="${esc(a.kind)}"
        aria-label="移除该条件" title="移除">${ico("x", 12)}</button></span>`).join("");
  return `<div class="lv-fbar">
      <div class="lv-fbox" role="group" aria-label="筛选条件">

        ${toks}
        <input id="lvfq" class="lv-fq" autocomplete="off"
          placeholder="${act.length ? "继续输入：主题:T1 文号:…" : "搜索或筛选：主题:T1、文号:金非银检函…（回车应用）"}"
          aria-label="筛选条件">

          title="清除全部筛选">${ico("x", 14)}</button>` : ""}

    </div>`;
}

function lvRender(list, d, st, f) {
  const cfg = LV[list], m = lvMeta(list);
  const items = arr(d.items);
  const vis = lvFields(list, true);
  const primary = vis.find(x => x.primary) || vis[0];
  const cols = vis.filter(x => x !== primary && !x.meta);
  const metas = vis.filter(x => x.meta);
  const act = lvActiveFilters(list, st);
  const sel = lvSel(list);
  const selN = Object.keys(sel).filter(k => sel[k]).length;

  const chips = act.map(a => `<span class="lv-chip${a.kind === "slice" ? " slice" : ""}">
      ${a.kind === "slice" ? "切片" : "筛选"} <b>${esc(a.field)}</b>
      ${esc(String(a.value)).slice(0, 24)}
      <button data-lvrm="${esc(a.param)}" data-lvrmkind="${esc(a.kind)}"
        aria-label="移除该条件" title="移除">${ico("x", 12)}</button></span>`).join("");

  /* 表头与行**一一对应**（实测 GitHub 是 4 列：selection | status | primary | actions）。
   * `meta` 字段不再占列 —— 它们作为**内联元数据**跟在标题后面（GitHub 就是这么排的）。 */
  const stField = list === "laws" ? "timeliness_status" : "eff_status";
  const primaryFd = primary || {k: "title", label: "事项", sort: "title"};
  /* 三列（选择 / 状态 / 事项）—— GitHub 的 issues 行没有"操作列"：
   * 「查看关系」「打开本地文件」都在标题与元数据里，重复呈现会让每行末尾多一列噪声。 */
  /* 表头 = **一行工具条**（复刻 GitHub 列表头）：页签 + 字段按钮 + 排序 + 密度 + 保存视图。
   * 不显示任何列名（"状态/名称"），也不放全局搜索框与"筛选/字段"按钮 ——
   * 实测 GitHub 的列表头只有可操作项。 */
  const arrow = st.desc ? "triangle-down" : "triangle-up";
  const fbtns = (cfg.hdr || []).map(k => {
    const fd = cfg.fields.find(x => x.k === k);
    if (!fd) return "";
    const on = fd.slice ? !!st[fd.slice] : !!(fd.q && st[fd.q]);
    return `<button class="lv-fbtn${on ? " on" : ""}" data-lvf="${esc(k)}"
      aria-haspopup="dialog" aria-expanded="false"
      title="按「${esc(fd.label)}」筛选">${esc(fd.label)}${
      ico("chevron-down", 16)}</button>`;
  }).join("");
  const headCells = `<th colspan="3"><div class="lv-bar lv-headbar">
      ${lvFilterTabs(list, st)}
      <span class="lv-fsep" aria-hidden="true"></span>
      ${fbtns}
      <span class="sp"></span>
      <button class="lv-fbtn lv-sortbtn" data-lvsort="${esc(st.sort || primaryFd.sort || "title")}"
        title="切换升降序">${ico(st.desc ? "sort-desc" : "sort-asc", 16)}${
        esc((cfg.fields.find(x => (x.sort || x.k) === st.sort) || primaryFd).label || "名称")}${
        ico(arrow, 16)}</button>
      <span class="density" role="group" aria-label="显示密度">
        <button data-lvdensity="wide" title="宽松" aria-label="宽松"
          aria-pressed="${lvDensity() === "wide"}"
          class="${lvDensity() === "wide" ? "on" : ""}">${ico("rows", 16)}</button>
        <button data-lvdensity="compact" title="紧凑" aria-label="紧凑"
          aria-pressed="${lvDensity() === "compact"}"
          class="${lvDensity() === "compact" ? "on" : ""}">${ico("list-unordered", 16)}</button>
      </span>
      <button class="lv-fbtn lv-savebtn" data-lvsavecur="1"
        aria-label="保存为视图" title="保存为视图">${ico("pin", 16)}</button>
    </div></th>`;

  const rows = items.map(it => {
    const id = lvRowId(list, it);
    const isSel = !!sel[id];
    /* 内联元数据：`#编号 · 文号 · 主题 · 来源` —— 12px、muted、与标题同行。
     * 被隐藏的字段自然不出现（Hide field 的语义因此保持一致）。 */
    const metaParts = metas.map(fd => `<span class="meta-i">${
      fd.cell ? fd.cell(it) : esc(it[fd.k] || "")}</span>`);
    const meta = metaParts.length
      ? `<span class="lv-meta">${metaParts.join('<span class="dot-sep" aria-hidden="true">·</span>')}</span>`
      : "";
    /* 宽松：标题一行、元数据一行；紧凑：两者同一行。切换由 body.lv-compact 的 CSS 完成，
     * 不再需要两套模板（同一份 DOM 两种密度）。 */
    const href = list === "rules" && it.local_path

    const title = `<a class="lv-title" ${href ? `href="${esc(href)}" target="_blank" rel="noopener"` : ""}

    return `<tr class="lv-row" data-lvid="${esc(id)}" tabindex="0" aria-selected="${isSel}">
      <td class="lv-selcell"><input type="checkbox" class="lv-ck" data-lvck="${esc(id)}"
        ${isSel ? "checked" : ""} aria-label="选择：${esc(it.title || id)}"></td>
      <td class="lv-stcell">${lvStateIcon(it, list)}</td>

  const empty = `<tr><td colspan="3">

        <button class="btn" data-lvclear="1">清除筛选</button></div></td></tr>`;

  /* 切片面板：只列**服务端支持**的字段（否则会变成"只过滤当前页"的假筛选） */
  const sliceFields = cfg.fields.filter(x => x.slice);
  const sf = m.sliceField || (sliceFields[0] || {}).k || "";
  const opts = lvSliceOptions(list, sf, f, d);
  const slicePanel = `<aside class="lv-slice" id="lvSlice" ${lvSliceActive(list) || STATE._lvSliceOpen ? "" : "hidden"}
      aria-label="切片面板">
      <h4>Slice by <span class="lv-badge">切片</span></h4>
      <select id="lvSliceField" aria-label="选择切片字段">
        ${sliceFields.map(x => `<option value="${esc(x.k)}"${x.k === sf ? " selected" : ""}>${esc(x.label)}</option>`).join("")}
      </select>
      ${opts.length ? opts.map(o => `<button class="val${String(o.value) === String(st[(sliceFields.find(x => x.k === sf) || {}).slice] || "") ? " on" : ""}"
          data-lvslice="${esc(o.value)}">${esc(o.label || o.value || "（空）")}<span class="c">${num(o.count)}</span></button>`).join("")
        : '<div class="muted" style="font-size:12px;padding:4px">该字段没有可选值（后端未提供分面）</div>'}
      <div class="foot">
        <button data-lvnoslice="1">No slicing</button>
        <button data-lvslicefield="1">切换字段…</button>
      </div>
    </aside>`;

  return `<div class="ph">
      <div><div class="desc">${esc(cfg.desc)}</div></div>
      <div class="acts"></div>
    </div>
    <div class="lv">
      ${lvFilterBar(list, st, act)}
      <div class="lv-body${lvSliceActive(list) || STATE._lvSliceOpen ? " slice" : ""}">
        <div class="lv-scroll"><table class="lv-table" role="grid"
          aria-multiselectable="true" aria-label="${esc(cfg.title)}列表">
          <thead>
            <tr class="lv-headrow">${headCells}

            </tr>
          </thead>
          <tbody>${items.length ? rows : empty}</tbody>
        </table></div>
        ${slicePanel}
      </div>
      <div class="lv-foot">${pager(d, list + "Pager")}</div>
      <div class="src" style="padding:6px 12px;border-top:0">数据源：${esc(d.source_name || "—")}
        · 抓取时刻 ${esc(d.fetched_at || "—")}
        · 视图配置（隐藏字段/切片/已存视图）存本机浏览器，不入库</div>
    </div>
    <div class="lv-batch${selN ? " on" : ""}" id="lvBatch" role="region" aria-label="批量操作">
      <span class="n">已选 ${selN} 项</span>
      <input id="lvReason" type="text" placeholder="批量理由（写入导出）"
        aria-label="批量理由" autocomplete="off">
      <button data-lvbatch="copy">${ico("copy", 16)} 复制编号</button>
      <button data-lvbatch="csv">${ico("download", 16)} 导出 CSV</button>
      <button class="x" data-lvbatch="clear" aria-label="清除选择">${ico("x", 16)}</button>
    </div>`;
}

/* 切片的可选值：优先用后端分面（theme/source/timeliness），否则明确说明不可切片 */
function lvSliceOptions(list, fieldKey, facets, d) {
  const cfg = LV[list];
  const fd = cfg.fields.find(x => x.k === fieldKey);
  if (!fd || !fd.slice) return [];
  const src = fd.slice === "theme" ? arr(obj(facets).themes)
    : fd.slice === "source" ? arr(obj(facets).sources)
    : fd.slice === "timeliness" ? arr(obj(facets).timeliness) : [];
  return src.map(x => ({value: x.value == null ? "" : x.value,
                        label: x.label || x.value || "（空）", count: x.count}));
}


/* ---------------- 状态页签（替代外部"状态"下拉框） ----------------
 * 数据来源是**后端分面**（laws: timeliness / rules: status），点页签就是一次服务端过滤。
 */
const ST_LABEL = {
  valid: "现行有效", repealed: "已废止", amended: "已修订",
  pending: "尚未生效", expired: "已过期", "": "未标注",
};

function lvStatusField(list) {
  return list === "laws"
    ? {param: "timeliness", label: "时效", items: arr(obj(STATE.laws_f).timeliness)}
    : {param: "status", label: "状态", items: arr(obj(STATE.rules_f).status)};
}

function lvFilterTabs(list, st) {
  /* 批 129：状态不再平铺成页签 —— laws 把它当普通字段（时效），rules 没有状态维。 */
  return "";
  const f = lvStatusField(list);
  const cur = st[f.param] || "";
  const total = arr(f.items).reduce((a, x) => a + (Number(x.count) || 0), 0);
  const tabs = [{value: "", label: "全部", count: total}].concat(
    f.items.map(x => ({value: x.value == null ? "" : x.value,
                       label: ST_LABEL[x.value] || x.value || "未标注",
                       count: x.count})));
  return `<div class="ftabs" role="tablist" aria-label="${esc(f.label)}筛选">` +
    tabs.map(x => `<button class="ftab${String(x.value) === String(cur) ? " on" : ""}"
        role="tab" aria-selected="${String(x.value) === String(cur)}"
        data-lvtab="${esc(x.value)}"><span>${esc(x.label)}</span>
        ${x.count != null ? `<span class="c">${num(x.count)}</span>` : ""}</button>`).join("") +
    `</div>`;
}

/* ---------------- 全局过滤：一段文本 ↔ 结构化的后端参数 ----------------
 * 语法（type-ahead 由 <datalist> 提供）：`theme:xx` `source:gov` `时效:valid` `文号:xxx`，
 * 其余文字按"名称包含"处理。**解析结果直接落到既有查询参数**，没有新接口。
 */
const Q_KEYS = [
  {k: "theme", words: ["theme", "主题"]},
  {k: "source", words: ["source", "源"]},
  {k: "timeliness", words: ["timeliness", "时效"], listOnly: "laws"},
  {k: "status", words: ["status", "状态"], listOnly: "rules"},
  {k: "q_docno", words: ["docno", "文号"]},
  {k: "q_title", words: ["title", "名称"]},
];

function lvParseQuery(list, text) {
  const out = {q_title: "", q_docno: "", theme: "", source: "",
               timeliness: "", status: ""};
  const rest = [];
  String(text || "").split(/\s+/).forEach(tok => {
    const m = /^([^:：]+)[:：](.*)$/.exec(tok);
    if (!m) { if (tok) rest.push(tok); return; }
    const key = m[1].toLowerCase(), val = m[2];
    const hit = Q_KEYS.find(x => x.words.indexOf(key) >= 0);
    if (hit && (!hit.listOnly || hit.listOnly === list)) out[hit.k] = val;
    else rest.push(tok);
  });
  if (rest.length) out.q_title = rest.join(" ");
  return out;
}

function lvQueryText(list, st) {
  const parts = [];
  Q_KEYS.forEach(x => {
    if (x.listOnly && x.listOnly !== list) return;
    if (st[x.k]) parts.push(x.words[0] + ":" + st[x.k]);
  });
  if (st.q_title) parts.push(st.q_title);
  return parts.join(" ");
}

function lvQueryHints(list, facets) {
  const out = [];
  const f = obj(facets);
  arr(f.themes).forEach(x => out.push(`theme:${x.value || ""}`));
  arr(f.sources).forEach(x => out.push(`source:${x.value || ""}`));
  (list === "laws" ? arr(f.timeliness) : arr(f.status))
    .forEach(x => out.push(`${list === "laws" ? "时效" : "状态"}:${x.value || ""}`));
  out.push("文号:", "名称:");
  return out.map(x => `<option value="${esc(x)}"></option>`).join("");
}

/* ---------------- 表头字段筛选面板（选项：复选框 + 圆点 + 主文本 + 计数） ---------------- */
/*: 唯一的选项面板实现（GitHub ActionList 的等价物）。
 *
 * 之前面板有三套写法（字段面板 / 文本字段 / 旧表格列筛选），行结构、勾选语义、清除入口
 * 各不相同。这里收成一个函数：搜索框（内嵌 X）、选项行（复选框/单选框 + 圆点 + 主文本 +
 * 浅灰副文本 + 计数），多选时**不关闭面板**，单选时点完即关。
 *
 * opts: {anchor, options:[{value,label,sub,count,dot,color}], selected:[...], multi,
 *        placeholder, emptyText, onChange(values)}
 */
function openOptionList(opts){
  const o = opts || {};
  const sel = new Set((o.selected || []).map(String));
  const rowHtml = (it) => {
    const v = String(it.value);
    const on = sel.has(v);
    return `<button class="opt${on ? " on" : ""}" data-val="${esc(v)}"
        role="${o.multi ? "menuitemcheckbox" : "menuitemradio"}" aria-checked="${on}">
        <span class="ck${on ? " on" : ""}" aria-hidden="true">${on ? ico("check", 12) : ""}</span>
        ${it.dot === false ? "" : `<span class="dot" aria-hidden="true"${
          it.color ? ` style="background:${esc(it.color)}"` : ""}></span>`}
        <span class="t">${esc(it.label)}${it.sub ? `<span class="s">${esc(it.sub)}</span>` : ""}</span>
        ${it.count != null ? `<span class="c">${num(it.count)}</span>` : ""}
      </button>`;
  };
  const listHtml = (q) => {
    const ql = String(q || "").toLowerCase();
    const rows = (o.options || []).filter(it => !ql ||
      (String(it.label || "") + " " + String(it.value || "")).toLowerCase().includes(ql));
    if (!rows.length) {
      return `<div class="empty" style="padding:8px;color:var(--text-muted)">${
        esc(o.emptyText || "没有可选值")}</div>`;
    }
    return rows.slice(0, 200).map(rowHtml).join("");
  };
  const html = `<input class="q" id="fpopQ" placeholder="${esc(o.placeholder || "搜索…")}"
      aria-label="搜索取值"><button class="fpop-x" data-act="clear"
      aria-label="清除筛选" title="清除筛选">${ico("x", 14)}</button>
    <div id="fpopList">${listHtml("")}</div>`;
  const el = lvPop(o.anchor, html, {
    cls: "fpop",
    onPick: (act, btn) => {
      if (act === "clear") {
        sel.clear();
        if (o.onChange) o.onChange([...sel]);
        if (!o.multi) lvClosePop();
        return;
      }
      const v = btn.dataset.val;
      if (o.multi) {
        if (sel.has(v)) sel.delete(v); else sel.add(v);
        btn.classList.toggle("on", sel.has(v));
        btn.setAttribute("aria-checked", String(sel.has(v)));
        const ck = btn.querySelector(".ck");
        if (ck) { ck.classList.toggle("on", sel.has(v)); ck.innerHTML = sel.has(v) ? ico("check", 12) : ""; }
        if (o.onChange) o.onChange([...sel]);
      } else {
        sel.clear(); sel.add(v);
        if (o.onChange) o.onChange([...sel]);
        lvClosePop();
      }
    },
  });
  const q = $("#fpopQ", el);
  if (q) {
    q.oninput = () => {
      const box = $("#fpopList", el);
      if (box) box.innerHTML = listHtml(q.value.trim());
    };
    q.focus();
  }
  return el;
}

function lvFieldFilterPop(list, st, fieldKey, anchor, facets) {
  const fd = LV[list].fields.find(x => x.k === fieldKey) || {};

  /* 文本字段（唯一标识号 / 名称 / 文号）：走**服务端** q_* 参数。
   * 面板里的搜索框既是"过滤选项"也是"输入值"：回车即应用（不让它变成只过滤当前页的假筛选）。
   * 选项列表给的是"当前页出现过的值"，作为 type-ahead 建议，不是全集。 */
  if (!fd.slice && fd.q) {
    const cur = String(st[fd.q] || "");
    const items = arr(obj(STATE[LV[list].stateKey]).items);
    const seen = [];
    items.forEach(it => {
      const v = String(it[fd.k] || "").trim();
      if (v && seen.indexOf(v) < 0) seen.push(v);
    });
    const optHtml = (q2) => seen.filter(v => !q2 || v.toLowerCase().includes(q2))
      .slice(0, 40)
      .map(v => `<button class="opt" data-val="${esc(v)}" role="menuitemradio"
          aria-checked="${v === cur}">
          <span class="ck" aria-hidden="true"></span>
          <span class="dot" aria-hidden="true"></span>
          <span class="t">${esc(v)}<span class="s">当前页</span></span>
        </button>`).join("");
    const html = `<input class="q" id="fpopQ" placeholder="输入或搜索「${esc(fd.label)}」，回车应用…"
        aria-label="按${esc(fd.label)}筛选" value="${esc(cur)}"><button class="fpop-x" data-act="clear" aria-label="清除筛选" title="清除筛选">${ico("x", 14)}</button>
      <div id="fpopList">${optHtml("") ||
        '<div class="empty" style="padding:8px;color:var(--text-muted)">当前页没有可选值，直接输入后回车</div>'}</div>`;
    const el = lvPop(anchor, html, {
      cls: "fpop",
      onPick: (act2, btn) => {
        if (act2 === "clear") { st[fd.q] = ""; st.page = 1; lvClosePop(); render(); return; }
        st[fd.q] = String(btn.dataset.val || "");
        st.page = 1; lvClosePop(); render();
      },
    });
    const q = $("#fpopQ", el);
    if (q) {
      q.oninput = () => {
        const box = $("#fpopList", el);
        if (box) box.innerHTML = optHtml(q.value.trim().toLowerCase());
      };
      q.onkeydown = (ev) => {
        if (ev.key !== "Enter") return;
        st[fd.q] = q.value.trim(); st.page = 1; lvClosePop(); render();
      };
      q.focus();
    }
    return;
  }

  if (!fd.slice) return;
  const opts = lvSliceOptions(list, fieldKey, facets, {});
  const cur = String(st[fd.slice] || "");
  /* 统一走 openOptionList（单选；点完即关） */
  openOptionList({
    anchor,
    options: opts.map(o => ({value: o.value, label: o.label || "（空）",
                             sub: o.value || "", count: o.count})),
    selected: cur ? [cur] : [],
    multi: false,
    placeholder: "搜索该字段的取值…",
    emptyText: "该字段没有可选值",
    onChange: (vals) => {
      st[fd.slice] = vals.length ? vals[vals.length - 1] : "";
      st.page = 1;
      render();
    },
  });
}

/* ---------------- 浮层工具（表头菜单 / 字段 / 筛选 共用） ---------------- */
let _lvPop = null;
function lvClosePop() {
  if (_lvPop && _lvPop.parentNode) _lvPop.parentNode.removeChild(_lvPop);
  _lvPop = null;
  $$("[aria-expanded='true'][data-lvmenu],#lvFilterBtn,#lvFieldsBtn")
    .forEach(b => b.setAttribute("aria-expanded", "false"));
}
function lvPop(anchor, html, opts) {
  lvClosePop();
  const el = document.createElement("div");
  el.className = (opts && opts.cls) ? opts.cls : "lv-pop";
  el.setAttribute("role", "menu");
  el.innerHTML = html;
  el.style.visibility = "hidden";
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 8);
  let top = r.bottom + 4;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.left = Math.max(8, left) + "px";
  el.style.top = top + "px";
  el.style.visibility = "visible";
  _lvPop = el;
  if (anchor.setAttribute) anchor.setAttribute("aria-expanded", "true");
  // 键盘：方向键在菜单项间移动，Enter 触发，Escape 关闭
  const items = $$("button:not([disabled])", el);
  if (items.length) items[0].focus();
  el.addEventListener("keydown", (ev) => {
    const list = $$("button:not([disabled])", el);
    const i = list.indexOf(document.activeElement);
    if (ev.key === "Escape") { ev.preventDefault(); lvClosePop(); anchor.focus && anchor.focus(); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); (list[i + 1] || list[0]).focus(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); (list[i - 1] || list[list.length - 1]).focus(); }
  });
  if (opts && opts.onPick) {
    el.addEventListener("click", (ev) => {
      /* 取值项（.opt[data-val]）此前没人接 —— 只有 data-act 的按钮能触发，
       * 于是"点选项没反应"（列筛选/字段筛选都受影响）。这里一并接住。 */
      const opt = ev.target.closest("button.opt[data-val]");
      if (opt && !opt.disabled) { opts.onPick("pick", opt); return; }
      const b = ev.target.closest("button[data-act]");
      if (!b || b.disabled) return;
      opts.onPick(b.dataset.act, b);
    });
  }
  return el;
}

/* ---------------- 保存视图（Views） ---------------- */
function lvAllViews() { return _ls(LV_VIEWS_KEY, []); }
function lvSetViews(v) { _lsSet(LV_VIEWS_KEY, v); }
function lvSavedViews(cur) { return lvAllViews().filter(v => v.list === cur); }
function lvPinnedViews() { return lvAllViews().filter(v => v.pinned); }

function lvSnapshot(list, st) {
  const m = lvMeta(list);
  return {
    filters: {theme: st.theme || "", timeliness: st.timeliness || "",
              source: st.source || "", q_title: st.q_title || "",
              q_docno: st.q_docno || "", q_rfn: st.q_rfn || "", q_ipn: st.q_ipn || ""},
    sort: st.sort, desc: !!st.desc,
    hidden: (m.hidden || []).slice(), order: (m.order || []).slice(),
    sliceField: m.sliceField || "", sliceValue: m.sliceValue || "",
    size: st.size || 50,
  };
}

function lvApplyView(id) {
  const v = lvAllViews().find(x => x.id === id);
  if (!v) return;
  const st = STATE[LV[v.list].stateKey] = Object.assign({}, obj(STATE[LV[v.list].stateKey]));
  Object.assign(st, v.state.filters || {});
  st.sort = v.state.sort; st.desc = !!v.state.desc; st.page = 1;
  lvSetMeta(v.list, {hidden: v.state.hidden || [], order: v.state.order || [],
                     sliceField: v.state.sliceField || "",
                     sliceValue: v.state.sliceValue || ""});
  // 切片值要落到对应查询参数上（后端过滤）
  const fd = (LV[v.list].fields.find(x => x.k === (v.state.sliceField || "")) || {});
  if (fd.slice) st[fd.slice] = v.state.sliceValue || "";
  if (CUR !== v.list) { goPage(v.list); }
  else { render(); }
  try { window.scrollTo({ top: 0, behavior: "auto" }); } catch (e) { /* 老浏览器 */ }
  toast("已切换到视图：" + v.name);
}

function lvSavePrompt(list) {
  const st = obj(STATE[LV[list].stateKey]);
  const name = window.prompt("视图名称（保存后可从左侧「视图」一键切回）", "");
  if (name == null) return;
  const nm = String(name).trim();
  if (!nm) return;
  const views = lvAllViews();
  const id = "v" + Date.now().toString(36);
  views.push({id: id, list: list, name: nm, pinned: false, state: lvSnapshot(list, st)});
  lvSetViews(views);
  paintRail();
  toast("已保存视图：" + nm);
}

function lvTogglePin(id) {
  const views = lvAllViews();
  const v = views.find(x => x.id === id);
  if (!v) return;
  v.pinned = !v.pinned;
  lvSetViews(views);
  paintRail();
}

function lvDeleteView(id) {
  lvSetViews(lvAllViews().filter(x => x.id !== id));
  paintRail();
}

/* ---------------- 交互绑定 ---------------- */
function lvBind(list, d, st, f) {
  const v = $("#view");
  const rows = () => $$(".lv-row", v);
  const sel = lvSel(list);
  const updateBatch = () => {
    const n = Object.keys(sel).filter(k => sel[k]).length;
    const bar = $("#lvBatch");
    if (bar) {
      bar.classList.toggle("on", n > 0);
      const cnt = bar.querySelector(".n");
      if (cnt) cnt.textContent = "已选 " + n + " 项";
    }
    document.body.classList.toggle("lv-selecting", n > 0);
  };

  /* ⓪ 状态页签：点一次就是一次服务端过滤 */
  $$("[data-lvtab]", v).forEach(b => {
    b.onclick = () => {
      const f = lvStatusField(list);
      st[f.param] = b.dataset.lvtab || "";
      st.page = 1; render();
    };
  });

  /* ⓪ 表头字段按钮：每个字段一个下拉（GitHub 的 Author/Labels 同款） */
  $$("[data-lvf]", v).forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const open = b.getAttribute("aria-expanded") === "true";
      if (open) { lvClosePop(); return; }
      b.setAttribute("aria-expanded", "true");
      lvFieldFilterPop(list, st, b.dataset.lvf, b, f);
    };
  });

  /* ⓪ 全局过滤框：回车应用（解析 theme:/source:/时效:/文号: 前缀） */
  const lvq = $("#lvq", v);
  if (lvq) {
    lvq.onkeydown = (ev) => {
      if (ev.key !== "Enter") return;
      const parsed = lvParseQuery(list, lvq.value);
      Object.keys(parsed).forEach(k => {
        if (k in st) st[k] = parsed[k];
      });
      st.page = 1; render();
    };
  }

  /* ⓪ 显示密度 */
  $$("[data-lvdensity]", v).forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.lvdensity === lvDensity()));
    b.onclick = () => {
      lvSetDensity(b.dataset.lvdensity);
      $$("[data-lvdensity]", v).forEach(x => {
        const on = x === b;
        x.classList.toggle("on", on);
        x.setAttribute("aria-pressed", on ? "true" : "false");
      });
    };
  });

  /* ① 排序 */
  $$("[data-lvsort]", v).forEach(b => {
    b.onclick = () => {
      const k = b.dataset.lvsort;
      if (st.sort === k) st.desc = !st.desc;
      else { st.sort = k; st.desc = false; }
      st.page = 1; render();
    };
  });

  /* ② 表头菜单：Hide field / Slice by / 排序 */
  $$("[data-lvmenu]", v).forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const fk = b.dataset.lvmenu;
      const fd = LV[list].fields.find(x => x.k === fk) || {};
      const m = lvMeta(list);
      const hidden = (m.hidden || []).indexOf(fk) >= 0;
      const canSlice = !!fd.slice;
      const html = `<div class="hint">${esc(fd.label || fk)}</div>
        <button data-act="slice" ${canSlice ? "" : "disabled"}
          title="${canSlice ? "按该字段切片（服务端过滤）" : "该字段后端未提供分面，暂不支持切片"}">
          ⊂ 按此字段筛选（Slice by this field）${canSlice ? "" : " · 暂不支持"}</button>
        <button data-act="hide">${hidden ? "◉ 重新显示该字段" : "◌ Hide field"}</button>
        <div class="sep"></div>
        <button data-act="asc" ${fd.sort ? "" : "disabled"}>↑ 升序排序</button>
        <button data-act="desc" ${fd.sort ? "" : "disabled"}>↓ 降序排序</button>
        <div class="sep"></div>
        <button data-act="all">显示全部字段</button>`;
      lvPop(b, html, {
        onPick: (act2) => {
          if (act2 === "slice") {
            lvClosePop();
            lvFieldFilterPop(list, st, fk, b, f);
          } else if (act2 === "hide") {
            const hs = (m.hidden || []).slice();
            const i = hs.indexOf(fk);
            if (i >= 0) hs.splice(i, 1); else hs.push(fk);
            lvSetMeta(list, {hidden: hs}); lvClosePop(); render();
          } else if (act2 === "asc" || act2 === "desc") {
            st.sort = fd.sort; st.desc = act2 === "desc"; st.page = 1;
            lvClosePop(); render();
          } else if (act2 === "all") {
            lvSetMeta(list, {hidden: []}); lvClosePop(); render();
          }
        },
      });
    };
  });

  /* ③ 拖拽换列序 */
  let dragK = "";
  $$("th[data-lvfk]", v).forEach(th => {
    th.addEventListener("dragstart", (ev) => {
      dragK = th.dataset.lvfk;
      try { ev.dataTransfer.setData("text/plain", dragK); } catch (e) { /* noop */ }
      ev.dataTransfer.effectAllowed = "move";
    });
    th.addEventListener("dragover", (ev) => { ev.preventDefault(); th.classList.add("dragover"); });
    th.addEventListener("dragleave", () => th.classList.remove("dragover"));
    th.addEventListener("drop", (ev) => {
      ev.preventDefault(); th.classList.remove("dragover");
      const target = th.dataset.lvfk;
      if (!dragK || dragK === target) return;
      const order = lvFields(list, false).map(x => x.k).filter(k => k !== dragK);
      order.splice(order.indexOf(target), 0, dragK);
      lvSetMeta(list, {order: order});
      render();
    });
  });

  /* ④ 筛选 / 排序 Popover */
  const fb = $("#lvFilterBtn", v);
  if (fb) {
    fb.onclick = (ev) => {
      ev.stopPropagation();
      const sorts = [
        {k: "publish_date", l: "最新发布 (Newest)"},
        {k: "title", l: "名称"},
      ];
      const html = `<div class="hint">排序</div>
        ${sorts.map(s => `<button data-act="sort:${s.k}">${st.sort === s.k ? "● " : "○ "}${esc(s.l)}</button>`).join("")}
        <div class="sep"></div>
        <div class="hint">筛选（服务端）</div>
        <button data-act="focus:q_title">名称包含…</button>
        <button data-act="focus:q_docno">文号包含…</button>
        ${LV[list].fields.filter(x => x.slice).map(x =>
          `<button data-act="slice:${x.k}">⊂ 按「${esc(x.label)}」筛选</button>`).join("")}
        <div class="sep"></div>
        <button data-act="clear">清除搜索、筛选与排序</button>`;
      lvPop(fb, html, {
        onPick: (act2) => {
          if (act2.startsWith("sort:")) {
            const k = act2.slice(5);
            st.sort = k; st.desc = k === "publish_date"; st.page = 1;
            lvClosePop(); render();
          } else if (act2.startsWith("slice:")) {
            lvClosePop();
            lvFieldFilterPop(list, st, act2.slice(6), fb, f);
          } else if (act2.startsWith("focus:")) {
            lvClosePop();
            const el = $("#lvq_" + act2.slice(6));
            if (el) el.focus();
          } else if (act2 === "clear") {
            lvClearAll(list); lvClosePop();
          }
        },
      });
    };
  }

  /* ⑤ 字段显示/隐藏 Popover */
  const fbb = $("#lvFieldsBtn", v);
  if (fbb) {
    fbb.onclick = (ev) => {
      ev.stopPropagation();
      const m = lvMeta(list);
      const html = `<div class="hint">字段可见性</div>` +
        LV[list].fields.map(x => `<button data-act="t:${x.k}">${
          (m.hidden || []).indexOf(x.k) >= 0 ? "◌ " : "◉ "}${esc(x.label)}</button>`).join("") +
        `<div class="sep"></div><button data-act="reset">显示全部字段</button>`;
      lvPop(fbb, html, {
        onPick: (act2) => {
          const hs = (m.hidden || []).slice();
          if (act2 === "reset") { lvSetMeta(list, {hidden: []}); }
          else if (act2.startsWith("t:")) {
            const k = act2.slice(2); const i = hs.indexOf(k);
            if (i >= 0) hs.splice(i, 1); else hs.push(k);
            lvSetMeta(list, {hidden: hs});
          }
          lvClosePop(); render();
        },
      });
    };
  }

  /* ⑥ 切片面板 */
  const sf = $("#lvSliceField", v);
  if (sf) {
    sf.onchange = () => {
      lvSetMeta(list, {sliceField: sf.value, sliceValue: ""});
      render();
    };
  }
  $$("[data-lvslice]", v).forEach(b => {
    b.onclick = () => {
      const m = lvMeta(list);
      const fd = LV[list].fields.find(x => x.k === m.sliceField) || {};
      if (!fd.slice) return;
      st[fd.slice] = b.dataset.lvslice; st.page = 1;
      lvSetMeta(list, {sliceValue: b.dataset.lvslice});
      render();
    };
  });
  const ns = $("[data-lvnoslice]", v);
  if (ns) ns.onclick = () => {
    const m = lvMeta(list);
    const fd = LV[list].fields.find(x => x.k === m.sliceField) || {};
    if (fd.slice) st[fd.slice] = "";
    lvSetMeta(list, {sliceField: "", sliceValue: ""});
    STATE._lvSliceOpen = false;
    render();
  };
  const sfb = $("[data-lvslicefield]", v);
  if (sfb) sfb.onclick = () => { if (sf) sf.focus(); };

  /* ⑦ 清除 / 移除 chip */
  $$("[data-lvclear]", v).forEach(b => { b.onclick = () => lvClearAll(list); });
  $$("[data-lvrm]", v).forEach(b => {
    b.onclick = () => {
      const p = b.dataset.lvrm, kind = b.dataset.lvrmkind;
      if (kind === "slice") {
        const m = lvMeta(list);
        const fd = LV[list].fields.find(x => x.k === m.sliceField) || {};
        if (fd.slice) st[fd.slice] = "";
        lvSetMeta(list, {sliceValue: ""});
      } else { st[p] = ""; }
      st.page = 1; render();
    };
  });

  /* ⑧ 选择：悬停出勾选 → 勾选后常显；Shift 范围、Cmd 切换 */
  let lastIdx = -1;
  const toggle = (id, idx, ev) => {
    if (ev && ev.shiftKey && lastIdx >= 0) {
      const rs = rows();
      const [a, b2] = [Math.min(lastIdx, idx), Math.max(lastIdx, idx)];
      for (let i = a; i <= b2; i++) {
        const rid = rs[i] && rs[i].dataset.lvid;
        if (rid) sel[rid] = true;
      }
    } else if (ev && (ev.metaKey || ev.ctrlKey)) {
      sel[id] = !sel[id];
    } else {
      sel[id] = !sel[id];
    }
    lastIdx = idx;
    rows().forEach(r => {
      const on = !!sel[r.dataset.lvid];
      r.setAttribute("aria-selected", on ? "true" : "false");
      const ck = r.querySelector(".lv-ck");
      if (ck) ck.checked = on;
    });
    updateBatch();
  };
  rows().forEach((r, idx) => {
    const ck = r.querySelector(".lv-ck");
    if (ck) ck.onclick = (ev) => { ev.stopPropagation(); toggle(r.dataset.lvid, idx, ev); };
    r.onclick = (ev) => {
      if (ev.target.closest("a,button,input")) return;
      toggle(r.dataset.lvid, idx, ev);
    };
    r.onkeydown = (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); goGraph(r.dataset.lvid); }
      if (ev.key === " ") { ev.preventDefault(); toggle(r.dataset.lvid, idx, ev); }
    };
  });
  const all = $("#lvAll", v);
  if (all) all.onclick = () => {
    const on = all.checked;
    rows().forEach(r => { sel[r.dataset.lvid] = on; });
    rows().forEach(r => {
      r.setAttribute("aria-selected", on ? "true" : "false");
      const ck = r.querySelector(".lv-ck"); if (ck) ck.checked = on;
    });
    updateBatch();
  };
  updateBatch();

  /* ⑨ 批量操作 */
  $$("[data-lvbatch]", v).forEach(b => {
    b.onclick = () => {
      const act2 = b.dataset.lvbatch;
      const ids = Object.keys(sel).filter(k => sel[k]);
      if (act2 === "clear") {
        Object.keys(sel).forEach(k => { sel[k] = false; });
        rows().forEach(r => {
          r.setAttribute("aria-selected", "false");
          const ck = r.querySelector(".lv-ck"); if (ck) ck.checked = false;
        });
        updateBatch(); return;
      }
      if (!ids.length) return;
      if (act2 === "copy") {
        const txt = ids.join("\n");
        if (navigator.clipboard) navigator.clipboard.writeText(txt)
          .then(() => toast("已复制 " + ids.length + " 个编号"))
          .catch(() => toast("复制失败（浏览器不支持）", true));
        else toast("浏览器不支持剪贴板", true);
      } else if (act2 === "csv") {
        const reason = ($("#lvReason", v) || {}).value || "";
        const head2 = ["id", "title", "docno", "theme", "reason"];
        const lines = [head2.join(",")].concat(
          arr(d.items).filter(it => sel[lvRowId(list, it)]).map(it => [
            lvRowId(list, it), it.title || "", it.document_number || it.docno || "",
            it.theme_label || "", reason,
          ].map(x => '"' + String(x).replace(/"/g, '""') + '"').join(",")));
        const blob = new Blob(["\ufeff" + lines.join("\n")], {type: "text/csv;charset=utf-8"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = list + "_selected_" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.appendChild(a); a.click(); a.remove();
        toast("已导出 " + (lines.length - 1) + " 行");
      }
    };
  });

  /* ⑩ 分页 */
  const pg = $("#" + list + "Pager", v);
  if (pg) {
    $$("[data-pg]", pg).forEach(b => {
      b.onclick = (ev) => {
        ev.preventDefault();
        if (b.getAttribute("aria-disabled") === "true") return;
        const n = Number(b.dataset.pg) || 1;
        if (n === Number(st.page)) return;
        st.page = n; render();
      };
    });
  }
  $$("[data-rel]", v).forEach(b => { b.onclick = () => goGraph(b.dataset.rel); });
  $$("[data-lvsavecur]", v).forEach(b => { b.onclick = () => lvSavePrompt(list); });

  /* ⑪ 键盘：Cmd/Ctrl+A 全选当前页；Escape 渐进式取消 */
  const onKey = (ev) => {
    const tag = (ev.target && ev.target.tagName) || "";
    const typing = /INPUT|TEXTAREA|SELECT/.test(tag);
    if ((ev.ctrlKey || ev.metaKey) && String(ev.key).toLowerCase() === "a" && !typing) {
      ev.preventDefault();
      rows().forEach(r => { sel[r.dataset.lvid] = true; });
      rows().forEach(r => {
        r.setAttribute("aria-selected", "true");
        const ck = r.querySelector(".lv-ck"); if (ck) ck.checked = true;
      });
      updateBatch(); return;
    }
    if (ev.key === "Escape") {
      const n = Object.keys(sel).filter(k => sel[k]).length;
      if (n) {
        Object.keys(sel).forEach(k => { sel[k] = false; });
        rows().forEach(r => {
          r.setAttribute("aria-selected", "false");
          const ck = r.querySelector(".lv-ck"); if (ck) ck.checked = false;
        });
        updateBatch(); return;
      }
      if (_lvPop) { lvClosePop(); return; }
      const act2 = lvActiveFilters(list, st);
      if (act2.length) { lvClearAll(list); return; }
    }
  };
  // 先摘掉上一轮装的监听：`render()` 每次都重建视图，不摘就会累积
  // （表现为"按一次 Escape 连退好几级"、Ctrl+A 触发多次）。
  if (STATE._lvKeyHandler) document.removeEventListener("keydown", STATE._lvKeyHandler);
  document.addEventListener("keydown", onKey);
  STATE._lvKeyHandler = onKey;
}

function lvClearAll(list) {
  const st = STATE[LV[list].stateKey];
  ["theme", "timeliness", "source", "q_title", "q_docno", "q_rfn", "q_ipn"]
    .forEach(k => { if (k in st) st[k] = ""; });
  st.page = 1;
  lvSetMeta(list, {sliceField: "", sliceValue: ""});
  STATE._lvSliceOpen = false;
  render();
}


/* ======================= 命令面板（Ctrl/⌘ + K） =======================
 *
 * 为什么要有：字段很多时，逐个去表头点菜单很慢；键盘一条命令就能 show/hide 字段、
 * 切视图、跳页面。命令来源**复用同一份状态**（TABS / LV / lvMeta），不新造权限模型。
 */
function paletteCommands(){
  const out = TABS.map(t => ({label: "跳转：" + t.name, hint: "页面",
                              run: () => goPage(t.id)}));
  const list = LV[CUR] ? CUR : "";
  if (list) {
    const m = lvMeta(list);
    LV[list].fields.forEach(f => {
      const hidden = (m.hidden || []).indexOf(f.k) >= 0;
      out.push({
        label: (hidden ? "show " : "hide ") + f.label, hint: "字段",
        run: () => {
          const hs = (m.hidden || []).slice();
          const i = hs.indexOf(f.k);
          if (hidden) { if (i >= 0) hs.splice(i, 1); }
          else if (i < 0) hs.push(f.k);
          lvSetMeta(list, {hidden: hs}); render();
        },
      });
    });
    out.push({label: "save view", hint: "视图", run: () => lvSavePrompt(list)});
    out.push({label: "clear filters", hint: "筛选", run: () => lvClearAll(list)});
    lvAllViews().forEach(v => out.push({
      label: "视图：" + v.name, hint: v.list === list ? "切换" : (v.list === "laws" ? "政策法规" : "公司制度"),
      run: () => lvApplyView(v.id),
    }));
  }
  return out;
}

let _palEl = null;
function closePalette(){
  if (_palEl && _palEl.parentNode) _palEl.parentNode.removeChild(_palEl);
  _palEl = null;
}

function openPalette(){
  if (_palEl) { closePalette(); return; }
  const mask = document.createElement("div");
  mask.className = "pal-mask";
  mask.innerHTML = `<div class="pal" role="dialog" aria-modal="true" aria-label="命令面板">
      <input id="palInput" placeholder="输入页面名、字段名或 show / hide / save / clear…"
        aria-label="命令" autocomplete="off">
      <ul id="palList" role="listbox" aria-label="命令列表"></ul>
      <div class="foot"><span><em>↑</em><em>↓</em> 选择</span><span><em>Enter</em> 执行</span>
        <span><em>Esc</em> 关闭</span></div>
    </div>`;
  document.body.appendChild(mask);
  _palEl = mask;
  const input = $("#palInput", mask);
  const list = $("#palList", mask);
  let rows = [], idx = 0;

  const paint = () => {
    const q = String(input.value || "").trim().toLowerCase();
    rows = paletteCommands().filter(c => !q || (c.label + " " + c.hint).toLowerCase().includes(q))
      .slice(0, 40);
    idx = Math.min(idx, Math.max(0, rows.length - 1));
    list.innerHTML = rows.map((c, i) => `<li role="option" data-i="${i}"
        aria-selected="${i === idx}"><span>${esc(c.label)}</span>
        <span class="hint">${esc(c.hint || "")}</span></li>`).join("")
      || `<li class="muted" style="cursor:default">没有匹配的命令</li>`;
    const cur = list.querySelector('li[aria-selected="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({block: "nearest"});
  };
  const run = (i) => {
    const c = rows[i];
    if (!c) return;
    closePalette();
    try { c.run(); } catch (e) { toast("命令执行失败：" + e, true); }
  };
  input.oninput = () => { idx = 0; paint(); };
  input.onkeydown = (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); idx = Math.min(idx + 1, rows.length - 1); paint(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); idx = Math.max(idx - 1, 0); paint(); }
    else if (ev.key === "Enter") { ev.preventDefault(); run(idx); }
    else if (ev.key === "Escape") { ev.preventDefault(); closePalette(); }
  };
  list.onclick = (ev) => {
    const li = ev.target.closest("li[data-i]");
    if (li) run(Number(li.dataset.i));
  };
  mask.onclick = (ev) => { if (ev.target === mask) closePalette(); };
  paint();
  input.focus();
}

/*: 账号菜单：身份 / 范围 / 审计级别 / 门禁（原来这些散在 5 个徽标里，挤且难读）。 */

/* ======================= 模块页签（48px，溢出折叠进 More） =======================
 *
 * 硬约束（用户规范）：**禁止 overflow-x:auto**，放不下的页签必须收进 More；
 * 且**当前页签任何时候都要可见**（否则用户找不到自己在哪里）。
 *
 * 折叠算法（每次测量后重算，不做增量猜测）：
 *   1) 先算所有页签的自然宽度；
 *   2) 贪心从左装入，预留 More 按钮宽度；
 *   3) 若活跃页签没装进去 ⇒ 腾出最后一个非活跃位，把它换成活跃页签；
 *   4) 其余进 More 下拉。
 */
let _tabsSig = "";

function buildTabs(){
  const box = $("#tabsInner");
  if (!box) return;
  /* 每个页签 = 图标 + 文字（图标取自本地 Octicons，与侧栏同一份映射） */
  box.innerHTML = TABS.map(x => `<button class="tab" data-id="${esc(x.id)}"
      role="tab" aria-selected="false"><span class="tab-ico" aria-hidden="true">${
      ico(PAGE_GLYPH[x.id] || "circle", 16)}</span><span>${esc(x.name)}</span></button>`).join("");
  $$(".tab", box).forEach(b => {
    b.onclick = () => goPage(b.dataset.id);
  });
  const more = $("#tabsMore");
  if (more) {
    more.onclick = (ev) => {
      ev.stopPropagation();
      const hidden = $$(".tab", box).filter(x =>
        x.dataset.hidden === "1" && x.dataset.locked !== "1");
      if (!hidden.length) return;
      const html = hidden.map(x => `<button data-act="go:${esc(x.dataset.id)}"
          role="menuitem">${esc(x.textContent)}</button>`).join("");
      lvPop(more, html, {onPick: (act2) => {
        lvClosePop();
        if (act2.startsWith("go:")) goPage(act2.slice(3));
      }});
    };
  }
  foldTabs();
  window.addEventListener("resize", () => requestAnimationFrame(foldTabs));
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(foldTabs))
    .observe($("#repoTabs"));
}

/*: 同步页签墨线（容器级）：实测 GitHub 的橙线画在**容器底边**（2px，压在 1px 线上）。
 * 用 getBoundingClientRect 相对 nav 计算，折叠/换页/缩放都走同一处。 */
function syncTabInk(){
  const nav = $("#repoTabs"), ink = $("#tabsInk");
  if (!nav || !ink) return;
  const on = $(".tab.on", nav);
  if (!on || on.hidden) { ink.style.display = "none"; return; }
  const nb = nav.getBoundingClientRect(), tb = on.getBoundingClientRect();
  ink.style.display = "block";
  ink.style.left = Math.max(0, tb.left - nb.left + 8) + "px";
  ink.style.width = Math.max(0, tb.width - 16) + "px";
}

function foldTabs(){
  const wrap = $("#repoTabs"), box = $("#tabsInner"), more = $("#tabsMore");
  if (!wrap || !box || !more) return;
  const tabs = $$(".tab", box);
  if (!tabs.length) return;
  /* 内网只读：本机专属页签**不进测量也不进 More**（否则等于给了一个点不动的入口）。 */
  const locked = (id) => STATE._local === false && LOCAL_ONLY_TABS.indexOf(id) >= 0;
  const usable = tabs.filter(x => !locked(x.dataset.id));
  tabs.forEach(x => {
    const isLocked = locked(x.dataset.id);
    x.hidden = isLocked;
    x.dataset.hidden = isLocked ? "1" : "0";
    x.dataset.locked = isLocked ? "1" : "0";
  });
  tabs.length = 0;                      // 只对 usable 做折叠计算
  usable.forEach(x => tabs.push(x));
  more.hidden = true;
  const avail = wrap.clientWidth - 16;
  const moreW = 84;
  const widths = tabs.map(x => x.offsetWidth);
  const active = tabs.findIndex(x => x.dataset.id === CUR);
  let used = 0, visible = 0;
  for (let i = 0; i < tabs.length; i++) {
    const need = used + widths[i];
    const reserve = (i < tabs.length - 1) ? moreW : 0;
    if (need + reserve <= avail) { used = need; visible = i + 1; }
    else break;
  }
  if (visible === 0) visible = 1;
  // 活跃页签必须可见：腾出最后一位给它（保证顺序不乱、也不折叠它）
  if (active >= visible) {
    visible = Math.max(1, visible - 1);
    tabs.forEach((x, i) => {
      const show = i < visible || i === active;
      x.hidden = !show;
      x.dataset.hidden = show ? "0" : "1";
    });
  } else {
    tabs.forEach((x, i) => {
      const show = i < visible;
      x.hidden = !show;
      x.dataset.hidden = show ? "0" : "1";
    });
  }
  $$(".tab", box).forEach(x => {
    if (x.hidden && !x.dataset.hidden) x.dataset.hidden = "1";
  });
  const anyHidden = tabs.some(x => x.dataset.hidden === "1");
  more.hidden = !anyHidden;
  syncTabs();
}

function syncTabs(){
  $$("#tabsInner .tab").forEach(x => {
    const on = x.dataset.id === CUR;
    x.classList.toggle("on", on);
    x.setAttribute("aria-selected", on ? "true" : "false");
  });
  // 页签变了可能影响"活跃项是否被折叠"，下一帧重算
  requestAnimationFrame(foldTabs);
}

/* ======================= 全局搜索：原地下拉（无遮罩） ======================= */
let _spop = null;

function closeSearchPop(){
  if (_spop && _spop.parentNode) _spop.parentNode.removeChild(_spop);
  _spop = null;
  const inp = $("#gsearchInput");
  if (inp) inp.setAttribute("aria-expanded", "false");
}

function searchSuggestions(q){
  const kw = String(q || "").trim().toLowerCase();
  const out = [];
  TABS.forEach(t => out.push({grp: "跳转", label: t.name, hint: "页面",
                              run: () => goPage(t.id)}));
  if (LV[CUR]) {
    lvAllViews().forEach(v => out.push({
      grp: "视图", label: v.name,
      hint: v.list === "laws" ? "政策法规" : "公司制度",
      run: () => lvApplyView(v.id)}));
    LV[CUR].fields.forEach(f => {
      const hidden = (lvMeta(CUR).hidden || []).indexOf(f.k) >= 0;
      out.push({grp: "字段", label: (hidden ? "show " : "hide ") + f.label, hint: "字段",
                run: () => {
                  const hs = (lvMeta(CUR).hidden || []).slice();
                  const i = hs.indexOf(f.k);
                  if (hidden) { if (i >= 0) hs.splice(i, 1); } else if (i < 0) hs.push(f.k);
                  lvSetMeta(CUR, {hidden: hs}); render();
                }});
    });
  }
  out.push({grp: "命令", label: "打开命令面板", hint: "Ctrl K", run: () => openPalette()});
  return kw ? out.filter(x => (x.label + " " + x.hint).toLowerCase().includes(kw)) : out;
}

function openSearchPop(){
  const wrap = $("#gsearchWrap"), inp = $("#gsearchInput");
  if (!wrap || !inp) return;
  closeSearchPop();
  const el = document.createElement("div");
  el.className = "spop";
  el.setAttribute("role", "listbox");
  document.body.appendChild(el);
  _spop = el;
  const r = wrap.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - el.offsetWidth - 8)) + "px";
  el.style.top = (r.bottom + 4) + "px";
  el.style.width = Math.max(320, r.width) + "px";
  inp.setAttribute("aria-expanded", "true");

  let rows = [], idx = 0;
  const paint = () => {
    rows = searchSuggestions(inp.value);
    const groups = {};
    rows.forEach((x, i) => { (groups[x.grp] = groups[x.grp] || []).push({...x, i}); });
    el.innerHTML = Object.keys(groups).length
      ? Object.keys(groups).map(g => `<div class="grp">${esc(g)}</div>` +
          groups[g].map(x => `<button class="it" data-i="${x.i}" role="option"
            aria-selected="${x.i === idx}"><span>${esc(x.label)}</span>
            <span class="hint">${esc(x.hint || "")}</span></button>`).join("")).join("")
      : `<div class="empty">没有匹配项</div>`;
  };
  const run = (i) => {
    const x = rows[i];
    if (!x) return;
    closeSearchPop();
    inp.value = "";
    try { x.run(); } catch (e) { toast("执行失败：" + e, true); }
  };
  inp.oninput = () => { idx = 0; paint(); };
  inp.onkeydown = (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); idx = Math.min(idx + 1, rows.length - 1); paint(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); idx = Math.max(idx - 1, 0); paint(); }
    else if (ev.key === "Enter") { ev.preventDefault(); run(idx); }
    else if (ev.key === "Escape") { ev.preventDefault(); closeSearchPop(); inp.blur(); }
  };
  el.onclick = (ev) => {
    const b = ev.target.closest("button[data-i]");
    if (b) run(Number(b.dataset.i));
  };
  paint();
}

/*: 顶栏图标与主题（批 124：图标全部来自本地 Octicons；主题只切 `data-color-mode`）。 */
function applyTheme(mode){
  const m = (mode === "dark") ? "dark" : "light";
  document.documentElement.setAttribute("data-color-mode", m);
  try { localStorage.setItem("theme", m); } catch (e) { /* 隐私模式 */ }
  const el = $("#themeIco");
  if (el) el.innerHTML = ico(m === "dark" ? "sun" : "moon", 16);
}

function initChrome(){
  const setIco = (sel, name, size) => {
    const el = $(sel);
    if (el) el.innerHTML = ico(name, size || 16);
  };
  setIco("#brandIco", "mark-github", 32);
  setIco("#railOpenIco", "three-bars", 16);
  setIco("#searchIco", "search", 14);
  setIco("#moreIco", "chevron-down", 16);
  setIco("#bellIco", "bell", 16);
  const bell = $("#bellBtn");
  if (bell) bell.onclick = (ev) => {
    ev.stopPropagation();
    const g = obj(STATE.gates), h = obj(STATE.health);
    const rows = [
      ["门禁", g.summary || (g.pass != null ? `${g.pass} 项通过` : "—")],
      ["健康", h.ok === false ? "不通" : "正常"],
      ["范围", h.scope_label || h.scope || "—"],
      ["门禁时刻", g.fetched_at || "—"],
    ];
    lvPop(bell, `<div class="hint">通知与状态</div>` +
      rows.map(([k, v]) => `<button data-act="noop" disabled>
        <span style="color:var(--text-muted)">${esc(k)}</span>
        <span style="margin-left:auto">${esc(String(v))}</span></button>`).join("") +
      `<div class="sep"></div><button data-act="refresh">刷新</button>`,
      {onPick: (a) => { lvClosePop(); if (a === "refresh") render(); }});
  };

  let saved = "light";
  try { saved = localStorage.getItem("theme") || "light"; } catch (e) { /* 隐私模式 */ }
  applyTheme(saved);
  const tb = $("#themeBtn");
  if (tb) tb.onclick = () => applyTheme(
    document.documentElement.getAttribute("data-color-mode") === "dark" ? "light" : "dark");
}

/*: 点浮层外部就关（用户第 6 条：点了筛选按钮再点页面别处，面板应当消失）。 */
function bindGlobalDismiss(){
  document.addEventListener("click", (ev) => {
    const t2 = ev.target;
    if (!t2 || !t2.closest) return;
    if (t2.closest(".fpop") || t2.closest(".spop") || t2.closest(".pal-mask")) return;
    if (t2.closest("[data-lvf]") || t2.closest("[data-gcol]") || t2.closest("#gsearchWrap")) return;
    if ($(".fpop") || $(".spop")) lvClosePop();
  }, true);
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && ($(".fpop") || $(".spop"))) lvClosePop();
  });
}

/*: 列表筛选框（#lvfq）的键盘处理：委托到 document，任何页面都有效。
 *
 * 为什么不是就地绑定：这个输入框由 lvRender 生成，绑定写在各页 binder 里会随页面不同而漏；
 * 委托一次即可，且不依赖渲染时机。 */
function bindLvFilterBar(){
  document.addEventListener("keydown", (ev) => {
    const el = ev.target;
    if (!el || el.id !== "lvfq") return;
    if (ev.key === "Escape") { el.value = ""; return; }
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    const txt = String(el.value || "").trim();
    if (!txt) return;
    const cfg = LV[CUR] || {};
    const st = STATE[cfg.stateKey || CUR];
    if (!st || st.page == null) return;
    const free = [];
    txt.split(/\s+/).forEach(tok => {
      const k = tok.indexOf(":");
      if (k < 0) { free.push(tok); return; }
      const nm = tok.slice(0, k).trim();
      const key = LV_QBAR_KEYS[nm] || LV_QBAR_KEYS[nm.replace(/号$/, "")];
      if (key) st[key] = tok.slice(k + 1).trim();
      else free.push(tok);
    });
    if (free.length) st.q_title = free.join(" ");
    st.page = 1;
    render();
  }, true);
}

/*: 网格表的列筛选按钮（全局委托一次；各页只负责渲染按钮） */
function bindGridFilters(){
  document.addEventListener("click", (ev) => {
    const b = ev.target && ev.target.closest ? ev.target.closest("[data-gcol]") : null;
    if (!b) return;
    const root = b.closest(".lv-gtable");
    if (!root) return;
    ev.preventDefault();
    ev.stopPropagation();
    openGridFilter(root, Number(b.dataset.gcol), b);
  }, true);
}

function initNav(){
  lvSetDensity(lvDensity());
  bindGraphRows();
  bindGridFilters();
  bindLvFilterBar();
  bindGlobalDismiss();
  initChrome();
  bindRailToggle();
  buildTabs();
  const cmd = $("#gsearchCmd");
  if (cmd) cmd.onclick = (ev) => { ev.stopPropagation(); closeSearchPop(); openPalette(); };
  const gs = $("#gsearchInput");
  if (gs) {
    gs.onfocus = () => openSearchPop();
    gs.onclick = (ev) => { ev.stopPropagation(); if (!_spop) openSearchPop(); };
  }
  // 点外部关闭原地下拉（**没有遮罩**，页面不变暗）
  document.addEventListener("click", (ev) => {
    if (!_spop) return;
    if (ev.target.closest && ev.target.closest("#gsearchWrap,.spop")) return;
    closeSearchPop();
  });
  const ro = $("#railOpen");
  if (ro) ro.onclick = () => {
    const open = document.body.classList.toggle("rail-open");
    document.body.classList.remove("rail-off");
    ro.setAttribute("aria-expanded", open ? "true" : "false");
  };
  document.addEventListener("click", (ev) => {
    if (!document.body.classList.contains("rail-open")) return;
    const inside = ev.target.closest && ev.target.closest("#rail,#railOpen");
    if (!inside) {
      document.body.classList.remove("rail-open");
      if (ro) ro.setAttribute("aria-expanded", "false");
    }
  });
  const ab = $("#avatarBtn");
  if (ab) ab.onclick = (ev) => { ev.stopPropagation(); openAccountMenu(ab); };
  document.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && String(ev.key).toLowerCase() === "k") {
      ev.preventDefault();
      openPalette();
    }
  });
  // 点击侧栏导航后，移动端抽屉自动收起（否则遮住内容）
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest ? ev.target.closest("#rail [data-side]") : null;
    if (b && window.innerWidth < 1024) document.body.classList.remove("rail-open");
  });
  window.addEventListener("hashchange", ()=>{ if(applyHash()) render(); });
  if(!applyHash()) syncTabs();
}

/* SSE：失败自动降级为 5s 轮询（旁路纪律：确认台自身不可用绝不影响主链）。 */
function initSSE(){
  const live=$("#live");
  const setLive=(txt,cls)=>{ live.textContent=txt; live.className="badge "+(cls||""); };
  try{
    const es=new EventSource("/api/events");
    es.onopen=()=>setLive("实时","live");
    es.addEventListener("hello",()=>setLive("实时","live"));
    es.addEventListener("steps",e=>{ try{ const d=JSON.parse(e.data||"{}");
      setLive(`实时 · ${d.step||""}`, "live"); }catch(_){} });
    es.onerror=()=>{ setLive("轮询回退","off"); };
  }catch(e){ setLive("轮询","off"); }
  // 无论 SSE 是否可用都做一次轻量健康探测（让"门禁"徽标有数据）
  ensureHealth().then(()=>{
    const h = obj(STATE.health);
    const g=$("#gates");
    g.textContent = h.ok? `门禁 ${h.gates_registered} 道` : "门禁 不可用";
    g.className = h.ok? "badge" : "badge bad";
    const local = h.local_only === true || String(h.scope || "local") === "local";
    if (!local && LOCAL_ONLY_TABS.indexOf(CUR) >= 0) { location.hash = "overview"; }
  }).catch(()=>{});
  setInterval(()=>{ if(CUR==="overview"||CUR==="worklist") render(); }, 60000);
}

initNav();
initSSE();
render();
</script>
