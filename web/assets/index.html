/*: 全局关系图 —— **四视图**（2026-10-23 用户要求：四类关系都要能看见）。
 *
 * 为什么不是一个"全量图"
 * ----------------------
 * 5281 条关系里监管↔监管 5139、制度↔制度 24、制度→监管 118：全量同屏是不可读的黑网。
 * 但"画不下"不等于"不显示"。四类关系各自给最合适的呈现：
 *   ① 制度→监管：可定位的**全画**（25 条，不抽样）
 *   ② 监管↔监管：**枢纽星型**（Top15 按被引次数定大小，枢纽间直连边照画）
 *   ③ 制度↔制度：**全画**（24 条，数字编号 + 图例表，避免长名字互相压字）
 *   ④ 主题关系：**二部图**（主题 → 被其制度引用最多的监管文件）
 * 未定位的关系**不伪造节点**，但每个视图都显式给出条数（"找不到"≠"不存在"）。
 */
const GRAPH_VIEWS = [
  {key: "overview", name: "全览"},
  {key: "internal_to_regulatory", name: "制度 → 监管"},
  {key: "regulatory_to_regulatory", name: "监管 ↔ 监管"},
  {key: "internal_to_internal", name: "制度 ↔ 制度"},
  {key: "theme", name: "主题关系"},
  /* 2026-10-23 新增：语料外文件的**独立键空间**（`RFN-EXT-*`）。
   * 它必须单列一屏：这些目标不在库里，混进"监管文件"会让读者以为能点开原文。 */
  {key: "external", name: "外部法规"},
];

function _gTab(cur){
  return `<div class="toolbar gtabs">` + GRAPH_VIEWS.map(v =>
    `<button class="gbtn${v.key === cur ? " on" : ""}" data-gview="${v.key}">${
      esc(v.name)}</button>`).join("") + `</div>`;
}

function _gCut(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; }

/* ============================ 3D 关系图引擎 ============================
 *
 * 为什么自己写（不引 three.js）：本控制台**零外链、零构建**（内网可用、离线可跑），
 * 引一个 600KB 的 3D 库既破坏这条约束，也超出需求 —— 我们要的只是"能把一团
 * 关系转起来看清楚"，不是渲染管线。
 *
 * 做法：正交投影 + 深度排序，纯 SVG。
 *   · 布局：节点按 `group` 分簇，簇心沿**斐波那契球**均匀铺开（避免极区堆积），
 *     簇内再套一层小球面 ⇒ 既分层又不糊成一坨；
 *   · 旋转：拖拽改变 yaw/pitch；滚轮缩放；**惰性重绘**（rAF 合帧），
 *     681 条边在 1000×620 上实测流畅；
 *   · 可读性：标签只画"在前景且度数够大"的节点（默认不糊），
 *     点节点 → 高亮它的边 + 其余降到 0.06 透明度。
 *
 * 状态按 `key` 常驻（切页签回来还是你转到的角度），存在 `G3D_ST`。
 */
const G3D_ST = {};        // key -> {yaw, pitch, zoom, sel}
const G3D_MODEL = {};     // key -> model（拖拽时重算用）

function _g3dHash(s){
  let h = 2166136261;
  s = String(s || "");
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;   // 0..1 稳定抖动
}

function _g3dLayout(model){
  const nodes = model.nodes || [];
  const groups = [];
  const by = {};
  nodes.forEach(n => {
    const g = String(n.group || "");
    if(!(g in by)){ by[g] = []; groups.push(g); }
    by[g].push(n);
  });
  const R = 300, G = Math.max(1, groups.length);
  const out = {};
  groups.forEach((g, gi) => {
    // 簇心：斐波那契球（只取球面上一点，保证均匀）
    let cx = 0, cy = 0, cz = 0;
    if(G > 1){
      const y = -1 + 2 * (gi + 0.5) / G;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = gi * 2.399963229728653;
      cx = r * Math.cos(th) * R; cy = y * R; cz = r * Math.sin(th) * R;
    }
    const mem = by[g], M = Math.max(1, mem.length);
    // 簇内半径：成员多则铺开（∝ sqrt），但不超过簇间距的一半
    const rr = G === 1 ? R * 0.92 : Math.min(R * 0.55, 26 + 12 * Math.sqrt(M));
    mem.forEach((n, i) => {
      const y = M === 1 ? 0 : -1 + 2 * (i + 0.5) / M;
      const r2 = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * 2.399963229728653 + _g3dHash(n.id) * 1.7;
      out[n.id] = {
        x: cx + r2 * Math.cos(th) * rr,
        y: cy + y * rr,
        z: cz + r2 * Math.sin(th) * rr,
      };
    });
  });
  return out;
}

function _g3dProj(pos, st, W, H){
  const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
  const cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
  const D = 1000, zoom = st.zoom || 1;
  const out = {};
  Object.keys(pos).forEach(k => {
    const p = pos[k];
    let x = p.x * cy - p.z * sy;
    let z1 = p.x * sy + p.z * cy;
    const y = p.y * cp - z1 * sp;
    z1 = p.y * sp + z1 * cp;
    const s = zoom * D / (D + z1);
    out[k] = {x: W / 2 + x * s, y: H / 2 + y * s, z: z1, s: s};
  });
  return out;
}

/*: 渲染一张 3D 图（返回 SVG 字符串；拖拽由 `bindG3d` 接管重绘） */
function _g3dSvg(key, W, H){
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
      class="g3svg" data-g3="${esc(key)}" role="img" aria-label="三维关系图">
      ${_g3dInner(key, W, H)}</svg>`;
}

/*: 只产出 **内部** 内容 —— 拖拽重绘走 `svg.innerHTML = _g3dInner(...)`，
 * 关键点：**不能替换 svg 元素本身**，否则绑定在上面的 pointer 监听全丢，
 * 表现为"能转一下，之后就死住"（实测踩到）。 */
function _g3dInner(key, W, H){
  const model = G3D_MODEL[key] || {nodes: [], edges: []};
  const st = G3D_ST[key] || (G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""});
  const pos = model._pos || (model._pos = _g3dLayout(model));
  const pr = _g3dProj(pos, st, W, H);
  const sel = String(st.sel || "");
  const touch = new Set();
  (model.edges || []).forEach(e => {
    if(!sel) return;
    if(e.from === sel) touch.add(e.to);
    if(e.to === sel) touch.add(e.from);
  });
  const maxDeg = Math.max(1, ...(model.nodes || []).map(n => Number(n.degree) || 1));

  const edgeSvg = (model.edges || []).map(e => {
    const a = pr[e.from], b = pr[e.to];
    if(!a || !b) return "";
    const hot = sel && (e.from === sel || e.to === sel);
    const depth = (a.z + b.z) / 2;
    const op = hot ? .9 : (sel ? .05 : Math.max(.08, Math.min(.55, .42 - depth / 1400)));
    const dash = e.external ? ' stroke-dasharray="3 3"' : (e.dashed ? ' stroke-dasharray="6 4"' : "");
    return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}"
      y2="${b.y.toFixed(1)}" stroke="${e.color || "var(--primary)"}"
      stroke-width="${(hot ? 1.8 : .8) * ((a.s + b.s) / 2)}" opacity="${op.toFixed(2)}"${dash}>
      <title>${esc(e.title || e.label || "")}</title></line>`;
  }).join("");

  const ordered = (model.nodes || []).slice().sort((n1, n2) =>
    (pr[n1.id] ? pr[n1.id].z : 0) - (pr[n2.id] ? pr[n2.id].z : 0));
  const nodeSvg = ordered.map(n => {
    const p = pr[n.id];
    if(!p) return "";
    const deg = Number(n.degree) || 1;
    const r = (3.2 + 6.2 * Math.sqrt(deg / maxDeg)) * p.s;
    const on = sel === n.id, near = touch.has(n.id);
    // 标签策略：前景(s>0.95) 或 选中/邻接 或 高度数节点才显示 —— 否则 100+ 标签互相压
    const showLabel = on || near || (p.s > 0.98 && deg >= Math.max(2, maxDeg * 0.12))
      || (model.labelAll && p.s > 0.9);
    const fill = on ? "var(--primary)"
      : n.kind === "external" ? "var(--card)"
      : n.kind === "internal" ? "var(--primary-l)" : "var(--alt)";
    return `<g class="g3n" data-nid="${esc(n.id)}" style="cursor:pointer">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"
        fill="${fill}" stroke="${on || near ? "var(--primary)" : "var(--line2)"}"
        stroke-width="${on ? 2 : 1}" ${n.kind === "external" ? 'stroke-dasharray="2 2"' : ""}
        opacity="${sel && !on && !near ? .35 : .95}"/>
      ${showLabel ? `<text x="${(p.x + r + 3).toFixed(1)}" y="${(p.y + 3.4).toFixed(1)}"
        style="font-size:${(10.5 * Math.min(1.25, p.s)).toFixed(1)}px;fill:${
        on ? "var(--primary)" : "var(--fg2)"};pointer-events:none">${
        esc(_gCut(n.name || n.id, 14))}</text>` : ""}
      <title>${esc(n.name || n.id)}${n.docno ? "\n" + esc(n.docno) : ""}${
        n.degree ? "\n关联 " + num(n.degree) + " 条" : ""}\n点击聚焦</title></g>`;
  }).join("");

  return `<g>${edgeSvg}</g><g>${nodeSvg}</g>`;
}

/*: 容器（含操作提示与"重置视角"）—— 图例由调用方给 */
function g3dBox(key, model, W, H, hint){
  G3D_MODEL[key] = model;
  if(!G3D_ST[key]) G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""};
  return `<div class="g3wrap" data-g3key="${esc(key)}">
      ${_g3dSvg(key, W, H)}
      <div class="g3bar">
        <span class="muted">${hint || "拖拽旋转 · 滚轮缩放 · 点节点聚焦"}</span>
        <span style="flex:1"></span>
        <button class="link" data-g3reset="${esc(key)}">重置视角</button>
      </div>
    </div>`;
}

/*: 绑定拖拽/缩放/点选（**幂等**：每次渲染后调用一次即可） */
function bindG3d(){
  const v = $("#view");
  if(!v) return;
  $$("[data-g3key]", v).forEach(wrap => {
    const key = wrap.dataset.g3key;
    const svg = $(".g3svg", wrap);
    if(!svg || svg.dataset.bound === "1") return;
    svg.dataset.bound = "1";
    const W = 1040, H = 620;
    let drag = null;
    const redraw = () => {
      // 只换内容，不换 svg 元素（否则 pointer 监听丢失 → "转一下就死住"）
      svg.innerHTML = _g3dInner(key, W, H);
      // ⚠️ 必须清掉 nodes 标记：`bindG3dNodes` 用 `dataset.nodes === "1"` 防重复绑定，
      // 而 innerHTML 换过之后**旧节点已不存在**、新节点还没绑 —— 不清标记就会出现
      // "转一下之后点节点没反应"（实测用户报障）。
      svg.dataset.nodes = "0";
      bindG3dNodes(key, svg);
    };
    const onDown = (ev) => {
      drag = {x: ev.clientX, y: ev.clientY, moved: 0,
              yaw: G3D_ST[key].yaw, pitch: G3D_ST[key].pitch};
      svg.setPointerCapture && svg.setPointerCapture(ev.pointerId);
    };
    const onMove = (ev) => {
      if(!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
      G3D_ST[key].yaw = drag.yaw + dx * 0.008;
      G3D_ST[key].pitch = Math.max(-1.35, Math.min(1.35, drag.pitch + dy * 0.006));
      if(!drag.raf){
        drag.raf = requestAnimationFrame(() => { drag.raf = 0; redraw(); });
      }
    };
    const onUp = () => { drag = null; };
    svg.addEventListener("pointerdown", onDown);
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerup", onUp);
    svg.addEventListener("pointerleave", onUp);
    svg.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      G3D_ST[key].zoom = Math.max(0.45, Math.min(3, G3D_ST[key].zoom *
        (ev.deltaY > 0 ? 0.92 : 1.08)));
      redraw();
    }, {passive: false});
  });
  $$("[data-g3reset]", v).forEach(b => {
    b.onclick = () => {
      const key = b.dataset.g3reset;
      G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""};
      render();
    };
  });
  $$(".g3svg", v).forEach(svg => {
    bindG3dNodes(svg.dataset.g3 || "", svg);
  });
}

/*: 绑定节点点击（可重复调用：innerHTML 换过就重绑，未换则跳过） */
function bindG3dNodes(key, svg){
  if(!svg || svg.dataset.nodes === "1") return;
  svg.dataset.nodes = "1";
  const model = G3D_MODEL[key] || {};
  $$(".g3n", svg).forEach(g => {
    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      const id = g.dataset.nid;
      const st = G3D_ST[key];
      st.sel = (st.sel === id) ? "" : id;
      // 调用方可以要求"点选后整页重绘"（如 E-R 图要同步刷新下方的链路清单）。
      // 其余视图只换 SVG 内容 —— 整页重绘会丢掉拖拽位置以外的滚动上下文。
      if (typeof model.pick === "function") {
        model.pick(st.sel);
        return;
      }
      svg.dataset.nodes = "0";          // 允许重绘后重绑
      svg.innerHTML = _g3dInner(key, 1040, 620);
      bindG3dNodes(key, svg);
    });
  });
}

/*: 视图 ⑥ 局部图（点节点进入）：中心 + 一跳邻居，3D 球 */
function _gEgo(d){
  const nodes0 = arr(d.nodes), edges0 = arr(d.edges), c = obj(d.counts);
  const center = obj(d.center);
  if(!nodes0.length) return '<div class="note">该文件没有可画的关系。</div>';
  const deg = {};
  edges0.forEach(e => {
    deg[e.from] = (deg[e.from] || 0) + 1;
    deg[e.to] = (deg[e.to] || 0) + 1;
  });
  const nodes = nodes0.map(x => ({
    id: x.id, name: x.name || x.id, docno: x.docno,
    kind: x.external ? "external" : (x.kind || "regulatory"),
    group: x.id === center.id ? "center" : (x.kind === "internal" ? "internal" : "regulatory"),
    degree: deg[x.id] || 1,
  }));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "", external: !!e.external,
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("节点", num(nodes0.length), "个")}
      ${kpi("关系", num(edges0.length), "条")}
      ${kpi("依据", num(c.basis), "条", "ok")}
      ${kpi("废止", num(c.repeal), "条", c.repeal ? "bad" : "")}
      ${kpi("指向外部", num(c.external), "条", c.external ? "warn" : "")}
    </div>
    ${g3dBox("graph.ego." + String(center.id || ""), {nodes, edges, labelAll: true},
             1040, 600)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>中心文件</span>
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--alt)"></i>监管文件</span>
      <span><i style="background:var(--bad)"></i>废止</span>
    </div>`;
}

function viewGraphGlobal(d){
  const cur = (obj(STATE.graph).view) || "overview";
  const body = cur === "internal_to_regulatory" ? _gBipartite(d)
    : cur === "regulatory_to_regulatory" ? _gRegulatory(d)
    : cur === "internal_to_internal" ? _gInternal(d)
    : cur === "theme" ? _gTheme(d)
    : cur === "external" ? _gExternal(d)
    : _gOverview(d);
  const uv = obj(obj(d.counts).unresolved_by_view);
  const items = GRAPH_VIEWS.map(v => ({
    key: v.key, label: v.name,
    count: v.key === "external" ? obj(d.external).total
      : (obj(uv[v.key]).entity != null ? obj(uv[v.key]).entity : undefined),
    title: v.name + " · 数字为已定位条数",
  }));
  return card("关系图谱", "全局", sideShell("graph", items, cur, body, "视图"),
    d.source_name || "relations_api.global_graph", d.fetched_at);
}

/*: 视图 ⑤：外部法规（语料外，独立键空间 `RFN-EXT-*`）
 *
 * 呈现选择：**排行榜**而不是关系图 ——
 *   · 这些目标没有"出边"（它们不引用别人），画成图会得到一堆孤立点；
 *   · 读者真正想知道的是"我们的文件最常依据哪几部法"，这是一张榜能答的。
 * 诚实标注：编号 `RFN-EXT-*` + 「语料外」标记 + 顶部一句话说明"库里没有原文"。 */
function _gExternal(d){
  const g = obj(d.external), nodes = arr(g.nodes), c = obj(d.counts);
  const by = obj(g.by_guise), lbl = obj(g.guise_labels);
  const maxDeg = Math.max(1, ...nodes.map(n => Number(n.degree) || 0));
  const rows = nodes.map(n => `<tr>
      <td class="mono">${esc(n.id)}</td>
      <td class="ttl">${esc(n.name || "")}</td>
      <td class="mono">${esc(n.docno || "—")}</td>
      <td><span class="tag">${esc(n.guise_label || "未分类")}</span></td>
      <td style="min-width:120px">
        <div class="bar" style="width:${Math.max(4, Math.round(n.degree / maxDeg * 100))}%"></div>
      </td>
      <td class="mono">${num(n.degree)}</td></tr>`).join("")
    || '<tr><td colspan="6" class="muted">尚未生成外部权威表（运行 tools/build_external_authority.py）</td></tr>';
  const chips = Object.keys(by).map(k =>
    `<span class="tag">${esc(lbl[k] || k)} ${num(by[k])}</span>`).join(" ");
  return `<div class="note" style="margin-bottom:8px">
      外部法规是**语料外**文件（国家法律 / 行政法规 / 部委规章 / 制度历史版本）的登记键空间：
      编号 <code>RFN-EXT-*</code> 表示「被引用过、已登记」，<b>不代表库里能打开这份文件</b>。
      需要原文请按名称/文号在「政策法规」或官网检索。</div>
    <div class="kpibar" style="margin-bottom:var(--s3)">
      ${kpi("外部法规", num(c.external_total), "条")}
      ${kpi("覆盖关系", num(c.external_evidence), "条")}
      ${kpi("归属率（含外部）", `${(Number(c.attributed_ratio || 0) * 100).toFixed(1)}%`, "",
            Number(c.attributed_ratio) >= 0.8 ? "ok" : "warn")}
    </div>
    <div style="margin-bottom:var(--s3)">${chips}</div>
    <div class="scrollx"><table><thead><tr>
      <th>编号</th><th>名称</th><th>文号</th><th>类型</th><th>被引次数</th><th>次数</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin-top:var(--s2)">${esc(g.note || "")}</div>`;
}

function _gOverview(d){
  const c = obj(d.counts), vs = arr(d.views), uv = obj(c.unresolved_by_view);
  const cards = vs.map((v, i) => {
    const b = obj(uv[v.key]);
    /* 四桶（2026-10-23 扩）：entity / corpus / organ / external。
     * 之前把 corpus+external 混成"未定位"，读者会把"可补登记"误当成"没法修"。 */
    const bucketBar = v.key === "external"
      ? `<div class="kpibar" style="margin:8px 0">
           ${kpi("外部法规", num(obj(d.external).total), "条")}
           ${kpi("覆盖关系", num(obj(d.external).evidence), "条")}
         </div>`
      : `<div class="kpibar" style="margin:8px 0">
           ${kpi("已定位实体", num(b.entity), "条", b.entity ? "ok" : "")}
           ${kpi("语料内待补登记", num(b.corpus), "条", b.corpus ? "warn" : "")}
           ${kpi("语料外（已登记）", num(b.external), "条", "")}
           ${kpi("机关名（非文件）", num(b.organ), "条", "")}
         </div>`;
    return `<div class="gcard" data-gview="${esc(v.key)}">
      <div class="gcard-h"><b>${esc(v.label)}</b>
        <span class="tag">${num(v.total)} 条</span></div>
      ${bucketBar}
      <div class="muted" style="font-size:12px">${esc(v.note || "")}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">
        本视图绘制 ${num(v.edges)} 条边 / ${num(v.nodes)} 个节点 ⇒ 点击展开</div>
    </div>`;
  }).join("");
  const ratio = (x) => `${(Number(x || 0) * 100).toFixed(1)}%`;
  return `<div class="kpibar" style="margin-bottom:var(--s3)">
      ${kpi("关系总数", num(c.total_relations), "条")}
      ${kpi("文件类定位率", ratio(c.file_resolved_ratio), "",
            Number(c.file_resolved_ratio) >= 0.5 ? "ok" : "warn")}
      ${kpi("文件类可达率", ratio(c.file_located_ratio), "")}
      ${kpi("分母（剔除机关名）", num(c.file_denominator), "条")}
    </div>
    <div class="muted" style="margin-bottom:var(--s3)">${esc(d.note || "")}</div>
    <div class="ggrid">${cards}</div>`;
}

/*: 视图 ①「制度 → 监管」：3D 二部球（左簇=公司制度，右簇=监管/外部法规）
 *
 * 全画不抽样：可定位 cross 关系实测 100 条、双方各 80+ 节点 —— 这个规模下单层
 * 2D 二部图已经开始互相压字，转到 3D 球面就能分开。
 */
function _gBipartite(d){
  const bp = obj(d.bipartite), c = obj(d.counts);
  const L = arr(bp.left), R = arr(bp.right), E = arr(bp.edges);
  const nExt = R.filter(x => x.external).length;
  if(!E.length) return '<div class="note">当前没有可定位的「制度→监管」关系。</div>';
  const degL = {}, degR = {};
  E.forEach(e => {
    degL[e.from] = (degL[e.from] || 0) + 1;
    degR[e.to] = (degR[e.to] || 0) + 1;
  });
  const nodes = L.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                             kind: "internal", group: "internal",
                             degree: degL[x.id] || 1}))
    .concat(R.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                         kind: x.external ? "external" : "regulatory",
                         group: "regulatory", degree: degR[x.id] || 1})));
  const edges = E.map(e => ({
    from: e.from, to: e.to, label: e.label || e.relation,
    title: (e.label || e.relation) + (e.matched_by ? "（" + e.matched_by + "）" : ""),
    external: !!e.external,
    color: e.relation === "repeal" ? "var(--bad)" : "var(--primary)",
  }));
  const uv = obj(obj(c.unresolved_by_view).internal_to_regulatory);
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("制度", num(L.length), "份")}
      ${kpi("监管文件", num(R.length - nExt), "份")}
      ${kpi("外部法规", num(nExt), "份", nExt ? "warn" : "")}
      ${kpi("关系", num(E.length), "条")}
    </div>
    ${g3dBox("graph.bipartite", {nodes, edges}, 1040, 620)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--alt)"></i>监管文件</span>
      <span><i style="background:var(--card);border:1px dashed var(--line2)"></i>外部法规（语料外）</span>
      <span><i style="background:var(--bad)"></i>废止（虚线）</span>
      <span class="muted">语料内待补登记 ${num(uv.corpus)} 条未入图（可补 RFN）；
        目标为机关名的已在抽取层排除（不是文件）</span>
    </div>`;
}

/*: 视图 ②「监管 ↔ 监管」：枢纽球（节点大小=被引次数，枢纽间直连边照画） */
function _gRegulatory(d){
  const g = obj(d.regulatory), nodes0 = arr(g.nodes), edges0 = arr(g.edges);
  if(!nodes0.length) return '<div class="note">暂无监管↔监管关系。</div>';
  const nodes = nodes0.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                                  kind: "regulatory", group: "reg",
                                  degree: Number(x.degree) || 1}));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "",
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  const top = nodes0.slice().sort((a, b) => (b.degree || 0) - (a.degree || 0)).slice(0, 10);
  return `<div class="muted" style="margin-bottom:var(--s2)">
      枢纽 ${num(nodes0.length)} 个 / 图上直连边 ${num(edges0.length)} 条（全库监管↔监管
      ${num(g.total_edges)} 条）。绝大多数关系是"各自依据同一部上位法"，故用
      **节点大小=被引次数**表达；枢纽之间真正互引的边照画。</div>
    ${g3dBox("graph.regulatory", {nodes, edges}, 1040, 620)}
    <h3 style="margin:var(--s3) 0 var(--s2)"><span>枢纽 Top 10</span>
      <span class="hint">球面大小 = 被依据次数</span></h3>
    <div class="scrollx"><table><thead><tr><th>文件</th><th>文号</th><th>被引</th></tr></thead>
      <tbody>${top.map(x => `<tr><td class="ttl">${esc(x.name || x.id)}</td>
        <td class="mono">${esc(x.docno || "—")}</td>
        <td class="mono">${num(x.degree)}</td></tr>`).join("")}</tbody></table></div>`;
}

/*: 视图 ③「制度 ↔ 制度」：当前 24/24 全可定位，整张球面画出来 */
function _gInternal(d){
  const g = obj(d.internal), nodes0 = arr(g.nodes), edges0 = arr(g.edges);
  if(!nodes0.length) return '<div class="note">暂无制度↔制度关系。</div>';
  const deg = {};
  edges0.forEach(e => {
    deg[e.from] = (deg[e.from] || 0) + 1;
    deg[e.to] = (deg[e.to] || 0) + 1;
  });
  const nodes = nodes0.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                                  kind: x.external ? "external" : "internal",
                                  group: x.external ? "ext" : "int",
                                  degree: deg[x.id] || 1}));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "", external: !!e.external,
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  return `<div class="muted" style="margin-bottom:var(--s2)">
      制度文件 ${num(nodes0.length)} 份 / 关系 ${num(edges0.length)} 条
      （当前**全部可定位**，没有"指向库外旧版本"的悬空边）。</div>
    ${g3dBox("graph.internal", {nodes, edges, labelAll: true}, 1040, 620)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--bad)"></i>废止</span>
    </div>`;
}

/*: 视图 ④「主题关系」：11 主题 × 被引文件（二部球） */
function _gTheme(d){
  const g = obj(d.theme), ths = arr(g.themes), docs = arr(g.docs), es = arr(g.edges);
  if(!ths.length) return '<div class="note">暂无主题关系（主题只对入册文件打标）。</div>';
  const cnt = {};
  es.forEach(e => { cnt[e.ref] = (cnt[e.ref] || 0) + 1; });
  const nodes = ths.map(x => ({id: "T:" + x.code, name: x.label || x.code,
                               kind: "theme", group: "theme",
                               degree: es.filter(e => e.theme === x.code).length || 1}))
    .concat(docs.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                            kind: "regulatory", group: "doc",
                            degree: cnt[x.id] || 1})));
  const edges = es.map(e => ({
    from: "T:" + e.theme, to: e.ref, label: e.label || "",
    title: (e.label || "") + (e.count ? "（" + e.count + " 份引用）" : ""),
    color: "var(--alt)",
  }));
  return `<div class="muted" style="margin-bottom:var(--s2)">
      ${num(ths.length)} 个主题 / ${num(docs.length)} 份被引监管文件 / ${num(es.length)} 条主题边。
      主题只对**入册**文件打标（覆盖率和主题口径见「治理审计」页）。</div>
    ${g3dBox("graph.theme", {nodes, edges, labelAll: true}, 1040, 620)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>主题</span>
      <span><i style="background:var(--alt)"></i>被引监管文件</span>
    </div>`;
}

function viewGraph(d){
  if (!d || d.available === false) return unavail(obj(d), "关系图谱");
  if (d.mode === "global") return viewGraphGlobal(d);   // 无中心 ⇒ 全局视图
  const nodes = arr(d.nodes), edges = arr(d.edges), center = obj(d.center);
  const c = obj(d.counts);
  const head = `<div class="toolbar">
    <button class="link" id="gback" title="回到全局视图">← 全局视图</button>
    <span class="tag">${esc(center.kind_label || "中心")}</span>
    <b>${esc(center.name || d.ref)}</b>
    <span class="mono">${esc(d.ref)}</span>
    <span class="muted">${esc(center.docno || "")}</span>
    <span class="muted">出 ${num(c.out)} · 入 ${num(c.in)} ·
      依据 ${num(c.basis)} · 废止 ${num(c.repeal)}</span>
    ${c.external ? `<span class="tag">其中 ${num(c.external)} 条指向语料外法规（点线）</span>` : ""}
    ${c.weak_skipped ? `<span class="tag">已隐藏 ${num(c.weak_skipped)} 条弱线索（未登记 RFN）</span>` : ""}
    ${c.organ_skipped ? `<span class="tag">已忽略 ${num(c.organ_skipped)} 条机关名（不是文件）</span>` : ""}
    ${c.truncated ? '<span class="tag">结果已截断（上限 200 条）</span>' : ""}
  </div>`;
  if (!edges.length) {
    /* 空图分两种，"暂无关系"这个说法只对第一种成立（2026-10-23 补）：
     *   · 真的没有关系；
     *   · **有关系，但对方未登记 RFN**（只有 `dst_key`）⇒ 画不出节点，默认过滤掉。
     * 全库实测 4197 条关系里有 2462 条（58.6%）属于后者。若一律显示"暂无"，
     * 读者会以为"这份文件没有依据关系"，而事实是"关系存在、只是没能定位到具体文件"。
     * 所以这里**把过滤掉的条数说清楚**，并给出可操作建议（补登记 RFN 后即可上图）。 */
    const weak = Number(c.weak_skipped) || 0;
    const note = weak
      ? `<div class="pill warn">⚠ 有 ${num(weak)} 条关系指向<b>未登记文件</b>，故未画图</div>
         <div class="note">这些关系的对方只有「文号 / 标题线索」，尚未登记为 RFN，
         无法作为图节点定位（不会把它们伪造成"已定位"）。</div>
         <div class="muted">处置：先在归属表补登记对方文件（生成 RFN），再回到本页查看。</div>`
      : '<div class="note">该文件暂无「依据 / 废止」关系记录。</div>';
    return card("关系图谱", esc(d.ref), head + note,
      d.source_name || "relations_api.ego", d.fetched_at);
  }
    /* 2026-10-26：绘图改 3D（`_gEgo`）。局部图常见 20~60 个邻居，
   * 2D 圆周布局在 30+ 时会挤成一圈字；3D 簇状球更好分辨。 */
  return card("关系图谱", esc(d.ref),
    head + _gEgo(d), d.source_name || "relations_api.ego", d.fetched_at);
}


/** 表头排序 + 筛选 + 翻页的**共用绑定**（两个表格行为必须一致）。 */
function bindTable(st, pagerId){
  const v = $("#view");
  $$("th.sortable", v).forEach(th => {
    th.onclick = () => {
      const k = th.dataset.sort;
      if (st.sort === k) st.desc = !st.desc;
      else { st.sort = k; st.desc = false; }   // 首次点列：升序（标题/编号类更自然）
      st.page = 1;
      render();
    };
  });
  $$("[data-f]", v).forEach(el => {
    const k = el.dataset.f;
    if (el.dataset.mode === "change") {
      el.onchange = () => { st[k] = el.value; st.page = 1; render(); };
    } else {
      // 文本框只在回车时提交：onchange（失焦）会在每次点击别处时重渲染、抢焦点
      el.onkeydown = e => {
        if (e.key === "Enter") { st[k] = el.value; st.page = 1; render(); }
      };
    }
  });
  const pg = $("#" + pagerId, v);
  if (pg) {
    $$("[data-pg]", pg).forEach(b => {
      b.onclick = () => {
        const n = Number(b.dataset.pg) || 1;
        if (n === Number(st.page)) return;
        st.page = n; render();
      };
    });
  }
  $$("[data-rel]", v).forEach(b => { b.onclick = () => goGraph(b.dataset.rel); });
}

function bindLaws(){ bindTable(STATE.laws, "lawsPager"); }
function bindRules(){ bindTable(STATE.rules, "rulesPager"); }

function bindGraph(){
  const v = $("#view");
  // 视图切换（全览 / 四类关系）——**只切视图、不换中心**，条件保留在 STATE
  $$("[data-gview]", v).forEach(el => {
    el.onclick = (ev) => {
      const key = el.dataset.gview;
      if (!key) return;
      // 卡片里可能嵌了图表按钮，避免冒泡重复触发
      ev.stopPropagation();
      STATE.graph = Object.assign({}, obj(STATE.graph), {view: key});
      CUR = "graph"; render();
    };
  });
  $$("g.gnode", v).forEach(g => { g.onclick = () => goGraph(g.dataset.ref); });
  // 表格/枢纽榜里的"查看"也是入口
  $$("[data-ref]", v).forEach(el => {
    if (el.tagName === "G") return;              // 图节点上面已绑
    el.onclick = () => goGraph(el.dataset.ref);
  });
  const back = $("#gback", v);
  if (back) back.onclick = () => {
    STATE.graph = {};                             // 清空中心 ⇒ 下次渲染走全局
    CUR = "graph"; render();
  };
  bindG3d();
}

/** 跳到「关系图谱」页签并以 `ref` 为中心。
 *  不直接 `render()`：先改 hash，让 hashchange 统一负责 CUR/导航高亮/渲染，
 *  避免"手改 CUR + 再触发 hashchange"造成**渲染两次**（闪一下）。 */
function goGraph(ref){
  if (!ref) return;
  STATE.graph = Object.assign({}, obj(STATE.graph), {ref: ref});
  if (location.hash.slice(1) === "graph") { CUR = "graph"; render(); }
  else { location.hash = "graph"; }
}

 * 2026-10-26 用户澄清：「EAST / 监管数据标准化」指的就是**这一块**（含"当前库内仅 1 条"

function eastRegstatsDocs(d){

    return `<h3 style="margin:var(--s4) 0 var(--s2)">
        <span>${esc(cat.label)} <span class="tag">${num(cat.count)} 条</span></span>
        <span class="hint">${esc(cat.note || "")}</span></h3>

      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  return `<h3 style="margin:0 0 var(--s2)"><span>EAST / 监管数据标准化
      <span class="tag">${num(cov.east_direct)} 条</span></span>
      <span class="hint">按受控关键词分类的**资料指针**（本段位于附件清单上方）</span></h3>
    <div class="note" style="margin:0 0 var(--s2)">

      不产出任何 EAST 报送数据、也不校验报文字段。</div>
    ${sections}`;
}

/* ===================== 「EAST 规范」浏览器（v3，2026-10-26） =====================
 *
 * 六个分页，按"人怎么用规范"切：
 *   概览    —— 通知信息 + 覆盖度 + 附件清单（1, 1-1, 1-2 … 自然序）
 *   数据表  —— 112 张表 → 3062 个数据项（含**数据元**编码/名称/说明/取值范围）
 *   数据元  —— 307 个数据元字典（编码/名称/定义/取值/格式/被几张表用到）
 *   代码表  —— 63 张业务代码表（带 `CDxxxxxx` 编号；多级表按层级缩进）
 *   检核规则 —— A~E 2096 条
 *   E-R 图  —— 表间字段级关系（3D 可拖拽）
 *
 * 三条 UX 纪律（都写在代码里，免得后人改回去）：
 *   · `取值范围` 若是"参照《业务代码表》XX，编号CDxxxxxx"，**点它直接跳到那张代码表**；
 *     跳转目标由抽取层解析（`code_ref`），页面不做字符串猜测；
 *   · 代码表**不显示「返回目录」**列 —— 那是 xlsm 的导航超链接，已在抽取层剔除；
 *   · 数据项/数据元/代码表/规则全部**懒加载**（首屏只下 434KB 结构件）。
 */
const EAST_TABS = [

/* ---------------- 概览：覆盖度 + 附件清单 ---------------- */
function _natNo(a, b){
  // 附件号自然序：1 < 1-1 < 1-2 < 1-10 < 2（直接字符串比较会把 1-10 排到 1-2 前面）
  const pa = String(a || "").split(/[-.]/), pb = String(b || "").split(/[-.]/);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i], y = pb[i];
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    const nx = Number(x), ny = Number(y);
    if (!isNaN(nx) && !isNaN(ny) && nx !== ny) return nx - ny;
    if (isNaN(nx) || isNaN(ny)) {
      const c = String(x).localeCompare(String(y), "zh");
      if (c) return c;
    }
  }
  return 0;
}

function eastOverview(d, regstats){
  const st = obj(d.stats), src = obj(d.source);
  /* ③（2026-10-26 复核用户原意）：「EAST / 监管数据标准化」指的是**监管统计资料清单**
   * 那个区块（含"当前库内仅 1 条"与 名称/文号/时效/源/访问地址/关系 表），

  const docsBlock = arr(obj(regstats).categories).length
    ? eastRegstatsDocs(regstats) : "";
  const atts = arr(src.attachments).slice().sort((a, b) => _natNo(a.no, b.no));
  const rows = atts.map(a => `<tr>
      <td class="mono">${esc(a.no || "-")}</td>
      <td class="ttl">${esc(a.name || "")}</td>
      <td><span class="tag">${esc(a.kind || "—")}</span></td>
      <td class="mono">${(Number(a.bytes || 0) / 1048576).toFixed(2)} MB</td>
      <td>${a.text_len ? pill(num(a.text_len) + " 字", "ok")
                       : (String(a.kind) === "jpg" ? '<span class="muted">图片</span>'
                                                   : pill("未抽出", "warn"))}</td>
      <td class="mono">${esc(a.sha256 || "")}</td></tr>`).join("");
  const nEmpty = atts.filter(a => !a.text_len && String(a.kind) !== "jpg").length;
  return `<h3 style="margin:0 0 var(--s2)"><span>EAST / 监管数据标准化</span>
      <span class="hint">《保险业监管数据标准化规范（人身保险公司 2024 版）》2025-04-10 修订版</span></h3>
    ${eastKpis(d)}
    <div class="note" style="margin:var(--s2) 0 var(--s3)">
      <b>能力边界</b>：本页只做**规范查阅**（有哪些表、每个数据项怎么填、代码表取值、
      检核规则、表间关系），<b>不校验报文、不生成 EAST 数据</b>。
      覆盖附件 1 / 1-1 / 1-2 / 1-3 / 1-4 / 1-5 / 1-6 与表单类 2~6。
    </div>
    ${docsBlock}
    <h3 style="margin:var(--s3) 0 var(--s2)">
      <span>附件清单 <span class="tag">${num(atts.length)} 个</span></span>
      <span class="hint">按附件号自然序排列（1, 1-1, 1-2 …）；抽取状态如实标注${
        nEmpty ? "（" + num(nEmpty) + " 个非图片附件未抽出正文）" : ""}</span></h3>
    <div class="scrollx"><table><thead><tr>
      <th>号</th><th>文件名</th><th>类型</th><th>大小</th><th>正文</th><th>sha256</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin-top:var(--s2)">
      来源：<code title="${esc(src.index || "")}">${esc(String(src.index || "").split("/").pop())}</code>
      ；附件字节存采集目录（唯一事实源），正文全文可在「文档检索」问。</div>`;
}

  const listRows = list.map(x => `<button class="etbl${cur && x.table_no === cur.table_no ? " on" : ""}"

  const head = cur ? `<div class="toolbar" style="margin-bottom:6px">

  return `<div class="muted" style="margin-bottom:var(--s2)">

/* ---------------- 代码表：带 CD 编号；多级表按层级缩进 ---------------- */
function eastCodes(d){
  const list = arr(d.code_index).slice().sort((a, b) => {
    // 按 `CDxxxxxx` 编号自然序（无编号的排末尾）；不能用 localeCompare 直接比中文名，
    // 那样"保险机构代码"会跑到"中介机构类别代码"前面，与附件1-4 目录顺序相反。
    const x = String(a.id || "zzzzzz"), y = String(b.id || "zzzzzz");
    return x < y ? -1 : (x > y ? 1 : 0);
  });
  const q = String(STATE.east_cq || "").trim().toLowerCase();
  const shown = list.filter(c => !q ||

      <span class="hint">这是**字段到字段**的校验关系（1-5-E + 1-3 关联数据项）；

    </tr></thead><tbody>${edges0.slice(0, 80).map(e => `<tr>

/* ---------------- E-R 图（表级，按附件1-6 语义重建） ----------------
 *
 * 附件1-6 是一张 **JPG 图片**（`…_附件1-6_E-R图（修订版）_20250410.jpg`），
 * 机器不可解析。但它的语义在附件里是**有机器可读来源**的：
 *   1-5-E「表间数据项关联性校验规则」319 条 + 1-3「关联数据项」362 条
 *   —— 两条来源都明确写了"哪张表的哪个字段必须出现在哪张表里"。
 * 所以本图**不是凭空画的**：把 681 条字段级关系按（源表→目标表）聚合，
 * 得到表级 E-R；点任一张表会列出它的**上游**（谁指向它）与**下游**（它指向谁）。
 * 页面明写图片原件位置，读者可自行核对 —— 不假装"我们解析了那张图"。
 */
function eastErd(d){
  const er = obj(d.er), edges0 = arr(er.edges), nodes0 = arr(er.nodes);
  if(!edges0.length) return '<div class="note">尚未解析出表间关系。</div>';
  // 聚合：表→表（保留来源集合与样例规则）
  const agg = {};
  edges0.forEach(e => {
    const k = e.from + "→" + e.to;
    if(!agg[k]) agg[k] = {from: e.from, to: e.to, from_table: e.from_table,
                          to_table: e.to_table, count: 0, sources: {},
                          sample: e.rule || ""};
    agg[k].count += 1;
    agg[k].sources[e.source] = (agg[k].sources[e.source] || 0) + 1;
  });
  const pairs = Object.values(agg);
  const deg = {};
  pairs.forEach(p => {
    deg[p.from] = (deg[p.from] || 0) + p.count;
    deg[p.to] = (deg[p.to] || 0) + p.count;
  });
  const byNo = {};
  nodes0.forEach(n => { byNo[n.id] = n; });
  const involved = Object.keys(deg);
  const nodes = involved.map(id => {
    const n = byNo[id] || {id: id, name: id, domain: "未分类"};
    return {id: id, name: n.name, docno: n.code, kind: "table",
            group: n.domain || "未分类", degree: deg[id] || 1};
  });
  const links = pairs.map(p => ({
    from: p.from, to: p.to,
    title: `${p.from_table} → ${p.to_table}（${p.count} 条字段关系）`,
    color: "var(--primary)",
  }));
  const sel = String(STATE.east_erd || "");
  const model = {
    nodes: nodes, edges: links, labelAll: true,
    pick: (id) => { STATE.east_erd = id || ""; render(); },
  };
  const pickNode = sel ? byNo[sel] : null;
  const up = pairs.filter(p => p.to === sel);
  const down = pairs.filter(p => p.from === sel);
  const row = (p, dir) => `<tr>
      <td>${dir === "up" ? "←" : "→"}</td>
      <td class="ttl">${esc(dir === "up" ? p.from_table : p.to_table)}</td>
      <td class="mono">${num(p.count)} 条</td>
      <td class="muted">${Object.keys(p.sources).join(" / ")}</td>
      <td class="muted">${esc(_gCut(p.sample, 80))}</td></tr>`;
  const chain = sel ? `<h3 style="margin:var(--s3) 0 var(--s2)">
      <span>「${esc((pickNode || {}).name || sel)}」的指向链路</span>
      <span class="hint">上游 ${num(up.length)} 张表 · 下游 ${num(down.length)} 张表
        · 共 ${num(deg[sel] || 0)} 条字段关系；再点该表取消聚焦</span></h3>
    <div class="scrollx"><table><thead><tr>
      <th></th><th>表</th><th>字段关系数</th><th>来源</th><th>样例规则</th>
    </tr></thead><tbody>${[...up.map(p => row(p, "up")),
      ...down.map(p => row(p, "down"))].join("")
      || '<tr><td colspan="5" class="muted">该表没有表间关系</td></tr>'}</tbody></table></div>`
    : `<div class="muted" style="margin-top:var(--s2)">点球面上任一张表 → 这里列出它的
        **上游（谁指向它）/ 下游（它指向谁）**，图上同时只高亮这些边。</div>`;
  return `<div class="note" style="margin-bottom:var(--s2)">
      附件1-6 是**图片**（E-R 图（修订版）），机器不可解析；本图按其语义用
      <b>1-5-E 表间关联规则（319 条）</b>+<b>1-3 关联数据项（362 条）</b>聚合出
      **${num(nodes.length)} 张表 / ${num(pairs.length)} 条表间指向**，
      与图片可逐条核对。<b>不假装解析了那张图</b>。</div>
    <div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("参与表", num(nodes.length), "张")}
      ${kpi("表间指向", num(pairs.length), "条")}
      ${kpi("字段级关系", num(edges0.length), "条")}
      ${kpi("单向最多", num(Math.max(1, ...pairs.map(p => p.count))), "条/对")}
    </div>
    ${g3dBox("east.erd", model, 1040, 680,
             "拖拽旋转 · 滚轮缩放 · **点表聚焦**（下方列出上下游链路）")}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>表间指向（字段级关系聚合）</span>
      <span class="muted">节点大小 = 该表参与的关系数</span>
    </div>
    ${chain}`;
}

/*: 数据格式码 → 官方解释（说明书是参数化码 `M!an`，数据项是具体码 `24!an`） */
function eastFmtDesc(code){
  const lg = obj(obj(STATE.east).format_legend);
  const c = String(code || "");
  if (!c) return "";
  if (lg[c]) return lg[c];
  const m = c.replace(/\d+/g, "M");
  if (lg[m]) return lg[m];
  return lg[m.replace(/\(M\)/, "(N)")] || "";
}

  const pageOpt = TABS.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
  const form = `<div class="card" style="box-shadow:none;border-style:dashed">
    <h3><span>记录一个问题</span><span class="hint">想改什么、哪里不对、缺什么功能</span></h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s2)">
      <label class="muted">分类<select id="fbkind">${kindOpt}</select></label>
      <label class="muted">严重度<select id="fbsev">${sevOpt}</select></label>
      <label class="muted">页面<select id="fbpage">${pageOpt}</select></label>
      ${whoCell}
    </div>
    <label class="muted" style="display:block;margin-top:var(--s2)">标题
      <input id="fbtitle" maxlength="120" placeholder="一句话说清问题（≥4 字）"></label>
    <label class="muted" style="display:block;margin-top:var(--s2)">详细说明（可选）
      <textarea id="fbdetail" rows="3" maxlength="4000"
        placeholder="复现步骤 / 期望结果 / 实际结果；数据问题请带上 RFN 或文号"></textarea></label>
    <div class="toolbar" style="margin-top:var(--s2)">
      <button class="primary" id="fbsubmit">提交</button>
      <span class="muted" style="font-size:12px">
        ${esc(whoNote)} 留言只追加不删除，处置只改状态。</span>
    </div></div>`;
  const rows = items.map(it => `<tr>
      <td class="mono">${esc((it.created_at || "").replace("T", " ").slice(0, 19))}</td>
      <td class="mono">${esc(it.fid || "")}</td>
      <td><span class="tag">${esc(it.kind_label || it.kind || "")}</span></td>
      <td>${pill(it.severity_label || it.severity || "",
        it.severity === "high" || it.severity === "blocker" ? "bad"
        : (it.severity === "low" ? "" : "warn"))}</td>
      <td>${esc(it.page || "—")}</td>
      <td class="ttl">${esc(it.title || "")}${
        it.detail ? `<details><summary>展开说明</summary><div class="muted"
          style="white-space:pre-wrap">${esc(it.detail)}</div></details>` : ""}</td>
      <td>${esc(it.account || "—")}
        <span class="muted" style="font-size:11px">（${esc(it.account_src_label || "")}）</span></td>
      <td class="mono">${esc(it.ip || "—")}</td>
      <td>${pill(it.status_label || it.status || "",
        it.status === "closed" ? "ok" : (it.status === "ack" ? "warn" : ""))}</td>
      <td>${STATE.health && STATE.health.local_only
        ? `<button class="link" data-fbx="${esc(it.fid)}">处置</button>` : '<span class="muted">—</span>'}</td>
    </tr>`).join("")
    || '<tr><td colspan="10" class="muted">还没有留言。发现问题就写在上面 —— 每一条都会进入改进清单。</td></tr>';
  const body = `${form}
    <div class="toolbar" style="margin-top:var(--s4)">
      <b>共 ${num(st.total || 0)} 条</b>
      <span class="muted">待处置 ${num(obj(st.by_status).open)} · 已受理 ${
        num(obj(st.by_status).ack)} · 已闭环 ${num(obj(st.by_status).closed)}</span>
      <select id="fbfilter"><option value="">全部状态</option>
        <option value="open">待处置</option><option value="ack">已受理</option>
        <option value="closed">已闭环</option></select>
    </div>
    <div class="scrollx"><table><thead><tr>
      <th>时间</th><th>编号</th><th>分类</th><th>严重度</th><th>页面</th><th>标题 / 说明</th>
      <th>记录者</th><th>IP</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
  return card("留言板", "发现问题就记一条", body,
    d.source_name || "interfaces.feedback_api", d.fetched_at);
}

function bindFeedback(){
  const v = $("#view");
  const sub = $("#fbsubmit", v);
  if (sub) sub.onclick = async () => {
    const payload = {
      kind: ($("#fbkind", v) || {}).value || "bug",
      severity: ($("#fbsev", v) || {}).value || "normal",
      page: ($("#fbpage", v) || {}).value || "",
      account: (($("#fbacc", v) || {}).value || "").trim(),
      title: (($("#fbtitle", v) || {}).value || "").trim(),
      detail: (($("#fbdetail", v) || {}).value || "").trim(),
    };
    sub.disabled = true;
    try {
      const r = await api("/api/feedback", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (r && r.ok) {
        toast("已记录：" + r.fid);
        render();
      } else {
        toast("提交失败：" + ((r && r.reason) || "未知原因"), true);
        sub.disabled = false;
      }
    } catch (e) {
      toast("提交失败：" + String(e), true);
      sub.disabled = false;
    }
  };
  const flt = $("#fbfilter", v);
  if (flt) {
    flt.value = (STATE._fbq || {}).status || "";
    flt.onchange = () => {
      STATE._fbq = Object.assign({}, obj(STATE._fbq), {status: flt.value});
      render();
    };
  }
  $$("[data-fbx]", v).forEach(b => {
    b.onclick = async () => {
      const fid = b.dataset.fbx;
      const handling = prompt("处置说明（闭环必填，≥4 字）：\n" + fid, "已核验并修复");
      if (handling == null) return;
      const r = await api("/api/feedback/resolve", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({fid: fid, handling: handling, status: "closed"}),
      });
      if (r && r.ok) { toast("已闭环 " + fid); render(); }
      else toast("处置失败：" + ((r && r.reason) || "未知原因"), true);
    };
  });
}

function applyHash(){
  const id=(location.hash||"").replace(/^#\/?/,"").trim();
  if(!id) return false;
  const t=TABS.find(x=>x.id===id);
  if(!t) return false;
  $$("#nav button").forEach(x=>x.classList.toggle("on", x.dataset.id===id));
  CUR=id; return true;
}
function initNav(){
  const nav=$("#nav");
  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.textContent=t.name; b.dataset.id=t.id;
    b.onclick=()=>{ $$("#nav button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on"); CUR=t.id;
      if(location.hash.slice(1)!==t.id) location.hash=t.id;
      render(); };
    nav.appendChild(b);
  });
  window.addEventListener("hashchange", ()=>{ if(applyHash()) render(); });
  if(!applyHash()) nav.firstChild.classList.add("on");
}

/* SSE：失败自动降级为 5s 轮询（旁路纪律：确认台自身不可用绝不影响主链）。 */
function initSSE(){
  const live=$("#live");
  const setLive=(txt,cls)=>{ live.textContent=txt; live.className="badge "+(cls||""); };
  try{
    const es=new EventSource("/api/events");
    es.onopen=()=>setLive("实时","live");
    es.addEventListener("hello",()=>setLive("实时","live"));
    es.addEventListener("steps",e=>{ try{ const d=JSON.parse(e.data||"{}");
      setLive(`实时 · ${d.step||""}`, "live"); }catch(_){} });
    es.onerror=()=>{ setLive("轮询回退","off"); };
  }catch(e){ setLive("轮询","off"); }
  // 无论 SSE 是否可用都做一次轻量健康探测（让"门禁"徽标有数据）
  ensureHealth().then(()=>{
    const h = obj(STATE.health);
    const g=$("#gates");
    g.textContent = h.ok? `门禁 ${h.gates_registered} 道` : "门禁 不可用";
    g.className = h.ok? "badge" : "badge bad";
    const local = h.local_only === true || String(h.scope || "local") === "local";
    if (!local && LOCAL_ONLY_TABS.indexOf(CUR) >= 0) { location.hash = "overview"; }
  }).catch(()=>{});
  setInterval(()=>{ if(CUR==="overview"||CUR==="worklist") render(); }, 60000);
}

initNav();
initSSE();
render();
</script>
