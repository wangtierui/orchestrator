function viewOverview(d, assets, publish, rel){
  if(!d.available) return unavail(d);
  const rh=obj(d.run_health), gs=obj(d.gate_status), wl=obj(d.worklist),
        al=obj(d.alerts), fr=obj(d.freshness), st=obj(d.storage);
  const counts=obj(rh.counts);
  const okN=Number(counts.ok||0), failN=Number(counts.failed||counts.error||0);

  /* 顶部 KPI：先给"最该一眼看到"的 4 个数 */
  const kpis = `<div class="card"><h3><span>关键指标</span>
      <span class="hint">最近运行 ${esc(rh.run_id||"—")}</span></h3>
    <div class="kpibar">
      ${kpi("门禁通过", `${num(gs.passed)}<span class="u">/ ${num(gs.total)}</span>`,
            "", Number(gs.failed&&gs.failed.length)?"bad":"ok")}
      ${kpi("待办未处置", num(wl.open_total), "条", Number(wl.open_total)>0?"warn":"ok")}
      ${kpi("链步成功", num(okN), `步${failN?` · 失败 ${failN}`:""}`, failN?"bad":"ok")}
      ${kpi("存储占用", kb(st.total_bytes), "", "")}
    </div>
    <div class="note">四项分别回答：能不能交付 / 有没有欠账 / 链跑得怎样 / 数据多大。</div>
    <div class="src">数据源：治理库台账 + worklist + paths 目录扫描</div></div>`;

  const runHtml = rh.available
    ? kv("run_id", esc(rh.run_id||"—")) + kv("总步数", num(rh.steps))
      + kv("状态分布", Object.entries(counts).map(([k,v])=>pill(`${k} ${v}`,
          k==="ok"?"ok":((k==="failed"||k==="error")?"bad":"warn"))).join(" "))
      + kv("累计耗时", (rh.total_elapsed_s??"—")+" s")
      + kv("最近运行", esc(rh.run_at||"—"))
    : `<div class="note">⚠ ${esc(rh.reason||"无运行台账")}</div>`;
  const gateHtml = gs.available
    ? kv("最近一轮", esc(gs.run_id||"—"))
      + kv("通过", `${num(gs.passed)}/${num(gs.total)}`, Number(gs.failed&&gs.failed.length)?"bad":"ok")
      + (arr(gs.failed).length
          ? `<div style="margin-top:6px">${arr(gs.failed).map(f=>`<div class="bad" style="font-size:12px">● ${esc(f.gate)} — ${esc(f.descr||"")}</div>`).join("")}</div>`
          : `<div class="ok" style="margin-top:6px;font-size:12px">✓ 全部通过</div>`)
    : `<div class="note">⚠ ${esc(gs.reason||"无门禁记录")}</div>`;
  const wlHtml = wl.available
    ? kv("open 总数", num(wl.open_total), Number(wl.open_total)>0?"warn":"ok")
      + kv("最老未处置", (wl.oldest_open_days??"—")+" 天", Number(wl.oldest_open_days)>7?"bad":"")
      + kv("按 kind", Object.entries(obj(wl.by_kind)).map(([k,v])=>pill(`${k} ${v}`)).join(" "))
    : `<div class="note">⚠ ${esc(wl.reason||"待办不可用")}</div>`;
  /* 用户第 7 条：告警不用表格，与「条文契约自检」同一种 kv 呈现 */
  const alHtml = arr(al.alerts).length
    ? arr(al.alerts).slice(0, 8).map(a => kv(a.event || a.title || "—",
        esc(a.at || a.ts || ""))).join("")
    : `<div class="muted">无近期告警（${esc(al.count ?? 0)} 条记录）</div>`;
  const frHtml = fr.available
    ? kv("边状态", Object.entries(obj(fr.by_status)).map(([k,v])=>pill(`${k} ${v}`,
        k==="stale"?"bad":(k==="ok"?"ok":"warn"))).join(" "))
      + (arr(fr.stale).length ? `<div style="margin-top:6px;font-size:12px">${
          arr(fr.stale).slice(0,5).map(s=>`<div class="bad">● ${esc(s.artifact)} ← ${esc(s.dep)}（建议重跑上游链）</div>`).join("")}</div>`:"")
    : `<div class="note">⚠ ${esc(fr.reason||"水位不可用")}</div>`;
  const stHtml = st.available
    ? Object.entries(obj(st.bytes)).map(([k,v])=>kv(k, kb(v)+" · "+((obj(st.ratio)[k])||0)+"%")).join("")
      + (st.heavy_ready===false?`<div class="note">${esc(st.note||"外部模型目录统计中")}</div>`:"")
    : `<div class="note">⚠ ${esc(st.reason||"存储扫描不可用")}</div>`;

  /* P2 产物清单（并入总览） */
  let assetsCards = "";
  if(!assets || assets.available===false) {
    assetsCards = `<div class="card"><div class="note">⚠ ${esc((assets||{}).reason||"不可用")}</div></div>`;
  } else if(assets.warming) {
    assetsCards = `<div class="card"><div class="note">${esc(assets.note||"统计中…")}</div></div>`;
  } else {
    /* 产物清单同样不用表格：一行 = 源 → 快照日 · 记录数 */
    const rows = arr(assets.files).map(f => kv(f.source,
      `${esc(f.date || "—")} · ${num(f.records)} 条`)).join("");
    const c = obj(assets.contract);
    const pub = obj(assets.publish);
    const pubRows = ["external","internal"].map(b=>{const m=obj(pub[b]);
      return `<tr><td>${esc(b)}</td><td>${m.available===false?`<span class="bad">${esc(m.reason||"未发布")}</span>`
        :`${esc(m.snapshot_date||m.snapshot||"—")}<br><span class="muted" style="font-size:11px">${esc(m.schema_version||"")} ${esc(String(m.sha256||"").slice(0,12))}</span>`}</td>
        <td class="num">${num(m.count||m.records||m.record_count)}</td></tr>`;}).join("");
    // 与「01 运行与风险」用**同一个**栅格（`.grid`），否则两张卡的最小宽不同，
    // 两个板块的卡片宽度对不齐（用户报「模块宽度应保持一致」）。
    assetsCards = `${card("产物清单","clean 索引", rows?`${rows}`
        :'<div class="muted">无产物</div>', assets.source, assets.fetched_at)}
      ${card("发布件状态","双底座", `${pubRows}`, assets.source, assets.fetched_at)}
      ${card("条文契约自检","clause schema",
        kv("覆盖文件",num(c.files))+kv("条文",num(c.articles))+kv("章节",num(c.chapters))
        +kv("表格结构",num(c.structures))+kv("法条类",num(c.law))
        +kv("降级解析",num(c.degraded),Number(c.degraded)>0?"warn":"ok")
        +kv("无效",num(c.invalid),Number(c.invalid)>0?"bad":"ok")
        +kv("告警",num(c.warned),Number(c.warned)>0?"warn":"ok"), assets.source, assets.fetched_at)}`;
  }
  /* P7 投放看板（并入总览） */
  let pubHtml="";
  if(publish && publish.available!==false){
    const w=obj(publish.wiki_sources);
    pubHtml = card("投放看板","wiki 投放源",
      kv("目录", esc(w.dir||"—"))+kv("存在", w.exists?"是":"否", w.exists?"ok":"warn")
      +kv("文件数", num(w.files)), publish.source, publish.fetched_at);
  }

  /* 2026-10-27（用户第 2 条）：12 个模块必须**等宽**。
   *
   * 原实现按"板块"各建一个 `.grid`（`auto-fit minmax(340px,1fr)`）：
   * 6 张卡的板块自动铺成 4 列、3 张卡的铺成 3 列、只有 1 张卡的格子铺满整行 ——
   * 于是同一页出现 360px / 496px / 1520px 三种宽度。
   * 修法：**一个固定列数的网格装全部 12 个模块**，板块标题用 `grid-column:1/-1`
   * 横跨整行 —— 卡片宽度只由列数决定，与"这一板块有几张卡"无关。
   */
  const sec = (no, name, desc) => `<div class="section" style="grid-column:1/-1">
      <span class="no">${esc(no)}</span><h2>${esc(name)}</h2>
      <span class="desc">${esc(desc)}</span></div>`;
  const r0 = obj(rel), sb0 = obj(r0.sbom);
  const toc = [{key: "ov-kpi", label: "关键指标"},
               {key: "ov-01", label: "01 运行与风险", count: 6},
               {key: "ov-02", label: "02 产物与发布", count: 5}];
  const body = `<div class="grid g3">
    <div id="ov-kpi" style="grid-column:1/-1">${kpis}</div>
    ${sec("01", "运行与风险", "回答\"现在健康吗、有没有欠账\"").replace(
      '<div class="section"', '<div id="ov-01" class="section"')}
    ${card("运行健康","最近一次运行",runHtml,rh.source,rh.fetched_at)}
    ${card("门禁状态","逐道结果",gateHtml,gs.source,gs.fetched_at)}
    ${card("待办","worklist open",wlHtml,wl.source,wl.fetched_at)}
    ${card("告警","reports/_alerts",alHtml,al.source,al.fetched_at)}
    ${card("数据新鲜度","水位边状态",frHtml,fr.source,fr.fetched_at)}
    ${card("存储占用","实测体积",stHtml,st.source,st.fetched_at)}
    ${sec("02", "产物与发布", "P2 数据状态 + P7 投放看板").replace(
      '<div class="section"', '<div id="ov-02" class="section"')}
    ${assetsCards}
    ${pubHtml}
    ${card("发布物证据", "SBOM + 契约版本",
      kv("SBOM 组件数", num(sb0.components))
      + kv("lock sha256", esc(String(sb0.lock_sha256 || "").slice(0, 16)))
      + kv("契约版本", esc(r0.contract_version || "—"))
      + `<div class="muted" style="margin-top:6px">提交明细按日期看 → 「发布事件」</div>`,
      r0.source || "git", r0.fetched_at)}
  </div>`;
  railSet("本页", toc.map(x => ({side: "toc", skey: x.key, label: x.label,
                                   count: x.count})), "");
  return body;
}

/* ---------------- P1 数据流转（分层 DAG） ---------------- */
/*: 每层一条竖列；同层节点纵向堆叠。为什么不用桑基：
 * 桑基要求"每个节点进出守恒"，而本链有大量**多进多出**与**旁路/条件**步骤
 * （gates/reports/retention…），强行守恒会把数据改成假的。分层 DAG 只表达
 * "谁依赖谁 + 流量多少"，语义上忠实。 */
function viewFlow(d){
  if(!d.available) return unavail(d);
  const nodes=arr(d.nodes), edges=arr(d.edges), layers=arr(d.layers);
  if(!nodes.length) return card("数据流转","",'<div class="pill warn">⚠ 链路为空</div>'
    +'<div class="note">STEP_ORDER 未加载</div>', d.source, d.fetched_at);

  const byLayer = {};
  layers.forEach(l=>{ byLayer[l.id]=[]; });
  nodes.forEach(n=>{ (byLayer[n.layer]||(byLayer[n.layer]=[])).push(n); });
  const lids = layers.length?layers.map(l=>l.id):Object.keys(byLayer);

  const COLW=186, GAPX=54, ROWH=30, GAPY=8, PADX=16, PADY=34;
  const colX={}; lids.forEach((l,i)=>{ colX[l]=PADX+i*(COLW+GAPX); });
  const maxRows = Math.max(1, ...lids.map(l=>(byLayer[l]||[]).length));
  const W = PADX*2 + lids.length*(COLW+GAPX) - GAPX;
  const H = PADY + maxRows*(ROWH+GAPY) + 18;
  const pos={};
  lids.forEach(l=>{ (byLayer[l]||[]).forEach((n,i)=>{
    const x=colX[l], y=PADY+i*(ROWH+GAPY);
    pos[n.id]={x,y,cx:x+COLW/2,cy:y+ROWH/2}; }); });

  /* 颜色一律走令牌（原来写死 hex，换主题/换色板时这张图是唯一"不跟着变"的地方） */
const STATUS_FILL={ok:"var(--ok-l)",failed:"var(--bad-l)",skip:"var(--alt)",
                     degraded:"var(--warn-l)",idle:"var(--bg)",unknown:"var(--bg)"};
  const STATUS_STROKE={ok:"#12855A",failed:"#C0392B",skip:"#D0D5DD",
                       degraded:"#B26A00",idle:"#D0D5DD",unknown:"#D0D5DD"};
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  // 层标题带
  lids.forEach(l=>{
    const nm=(layers.find(x=>x.id===l)||{}).name||l;
    svg+=`<text x="${colX[l]}" y="20" fill="#86909C" font-size="11.5" font-weight="600">${esc(nm)}</text>`;
  });
  // 边（先画，压在节点下方）
  edges.forEach(e=>{
    const a=pos[e.from], b=pos[e.to];
    if(!a||!b) return;
    const x1=a.x+COLW, y1=a.cy, x2=b.x, y2=b.cy;
    const dx=Math.max(24,(x2-x1)/2);
    const w=Math.max(1.2, Math.min(16, Math.sqrt(Number(e.volume)||1)/3.2));
    svg+=`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"
      fill="none" stroke="#2F7CF6" stroke-opacity="0.30" stroke-width="${w}">
      <title>${esc(e.from)} → ${esc(e.to)}（${esc(e.artifact)}，${num(e.volume)} 条）</title></path>`;
  });
  // 节点
  lids.forEach(l=>{
    (byLayer[l]||[]).forEach(n=>{
      const p=pos[n.id];
      const st=n.status||"idle";
      const vol=Number(n.volume)||0;
      const label=n.label.length>26?n.label.slice(0,25)+"…":n.label;
      svg+=`<g class="fnode" data-step="${esc(n.id)}" style="cursor:pointer">
        <rect x="${p.x}" y="${p.y}" width="${COLW}" height="${ROWH}" rx="6"
          fill="${STATUS_FILL[st]||"#fff"}" stroke="${STATUS_STROKE[st]||"#D0D5DD"}"/>
        <text x="${p.x+8}" y="${p.y+19}" font-size="11.5" fill="#1D2129">${esc(label)}</text>
        ${vol?`<text x="${p.x+COLW-7}" y="${p.y+19}" font-size="10.5" fill="#4E5969"
          text-anchor="end">${num(vol)}</text>`:""}
        <title>${esc(n.id)}
层：${esc((layers.find(x=>x.id===n.layer)||{}).name||n.layer)}
状态：${esc(st)}${n.rc!=null?"（rc="+esc(n.rc)+"）":""}${n.elapsed_s!=null?"  耗时 "+n.elapsed_s+"s":""}
记录数：${vol?num(vol):"（该步骤无记录数语义）"}
${n.purpose?("作用："+esc(n.purpose)):""}</title>
      </g>`;
    });
  });
  svg+="</svg>";

  const legend=`<div class="legend">
    <span><i style="background:var(--ok-l);border:1px solid var(--ok)"></i>ok</span>
    <span><i style="background:var(--warn-l);border:1px solid var(--warn)"></i>degraded</span>
    <span><i style="background:var(--bad-l);border:1px solid var(--bad)"></i>failed</span>
    <span><i style="background:#F2F4F7;border:1px solid #D0D5DD"></i>skip/未运行</span>
    <span>连线宽度 ∝ √记录数；悬停看详情，点击看抽屉</span></div>`;
  const t=obj(d.totals);
  /* 左侧「节点抽屉」：按层列出全部节点 + 状态点。
   * 原来只有一个 `<select>`（要先展开、还看不到状态），排在 40 个节点上纯属折磨。 */
  const _dot = (s) => ({ok: "#12855A", failed: "#C0392B", degraded: "#B26A00",
                        skip: "#D0D5DD"}[s] || "#D0D5DD");
  const _fItems = nodes.map(n => ({key: n.id, label: n.id, dot: _dot(n.status),
                                   title: `${n.id} · ${n.status || "unknown"}`}));
  return card("",
    `${num(t.nodes)} 节点 · ${num(t.edges)} 条边 · ${num(t.sources)} 源`,
    sideShell("flow", _fItems, String(STATE.flow_sel || ""),
    `<div class="scrollx">${svg}</div>${legend}
     <div class="toolbar" style="margin-top:10px">
       <span class="muted">节点抽屉在左侧：点任一节点看它的状态与日志尾巴</span>
       <span class="muted" style="margin-left:auto">最近运行：${esc(d.run_id||"—")}</span>
     </div><div id="stepout"></div>`, "节点"), d.source, d.fetched_at);
}

/* ---------------- P3 指标 ---------------- */
const SLI_LABEL = {
  "sli_chain_success_rate":"链成功率",
  "sli_data_freshness":"数据新鲜度",
  "sli_gate_pass_rate":"门禁通过率",
};
function lineChart(rows, color){
  rows=arr(rows);
  if(rows.length<2) return '<div class="muted">数据点不足（需 ≥2 个运行）</div>';
  const W=560,H=150,pad=30;
  const vals=rows.map(r=>Number(r.rate)||0);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const spanRaw=hi-lo, margin=spanRaw<2?0.5:Math.max(1,spanRaw*0.25);
  const min=lo-margin, max=hi+margin, span=(max-min)||1;
  const pts=rows.map((r,i)=>[pad+i*(W-2*pad)/Math.max(1,rows.length-1),
    H-pad-((Number(r.rate)||0)-min)/span*(H-2*pad)]);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E5E6EB"/>`;
  svg+=`<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  rows.forEach((r,i)=>{svg+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3" fill="#fff"
    stroke="${color}" stroke-width="2"><title>${esc(r.run_id)}：${r.rate}%</title></circle>`;});
  svg+=`<text x="${W-pad}" y="14" fill="#86909C" font-size="10.5" text-anchor="end">y 轴 ${lo}~${hi}%</text>`;
  svg+=`<text x="${pad}" y="${H-10}" fill="#86909C" font-size="10.5">${esc(rows[0].run_id||"")}</text>
    <text x="${W-pad}" y="${H-10}" fill="#86909C" font-size="10.5" text-anchor="end">${esc(rows[rows.length-1].run_id||"")}</text></svg>`;
  return svg;
}
function viewMetrics(d){
  if(!d.available) return unavail(d);
  const q=obj(d.quality), s=obj(d.slo);
  const qd=obj(obj(q.doc).dimensions);
  const dims=Object.entries(qd).map(([k,v])=>({k, v:obj(v).score==null?"—":obj(v).score}));
  const qHtml = dims.length===0
    ? '<div class="muted">暂无质量快照（python -m tools.gen_quality_metrics）</div>'
    : `<div class="bars">${dims.map(x=>{
        const val = x.v==="—"?0:Number(x.v);
        const color = val>=90?"var(--ok)":(val>=70?"var(--warn)":"var(--bad)");
        return `<div class="brow" title="${esc(x.k)}：${esc(x.v)}">
          <div class="bl">${esc(x.k)}</div>
          <div class="bt"><div class="bf" style="width:${Math.max(val>0?1.5:0,val)}%;background:${color}"></div></div>
          <div class="bv">${esc(x.v)}</div></div>`;}).join("")}</div>
      <div class="note">健康度 ${esc(obj(q.doc).health_score??"—")}（均权；缺失维度不计入分母）</div>`;

  const lastSLI=obj(obj(s.last).sli), tgt=obj(obj(s.last).targets);
  const sliRows=Object.keys(lastSLI).map(k=>{
    const v=Number(obj(lastSLI[k]).value), g=Number(tgt[k]);
    const bad = !Number.isNaN(v)&&!Number.isNaN(g)&&v<g;
    return kv(SLI_LABEL[k]||k, `${v}%（SLO ${Number.isNaN(g)?"—":Math.round(g)}%）`, bad?"bad":"ok");
  }).join("");

  const tEntries=Object.entries(obj(d.theme_dist)).sort((a,b)=>(Number(b[1])||0)-(Number(a[1])||0));
  const TOP_N=7, tDist={};
  tEntries.slice(0,TOP_N).forEach(([k,v])=>{tDist[k]=v;});
  const restSum=tEntries.slice(TOP_N).reduce((a,[,v])=>a+(Number(v)||0),0);
  if(restSum>0) tDist[`其他（${tEntries.length-TOP_N} 项）`]=restSum;
  const tTotal=tEntries.reduce((a,[,v])=>a+(Number(v)||0),0);

  return `<div class="grid">
    ${card("门禁通过率趋势","逐轮", lineChart(d.gate_trend,"#2F7CF6"), d.source, d.fetched_at)}
    ${card("待办 aging","未处置天数分布", bars(d.worklist_aging,"#B26A00","条"), d.source, d.fetched_at)}
    ${card("DAMA 六维","质量快照", qHtml, q.source, q.fetched_at)}
    ${card("SLI / SLO","最近快照", sliRows||'<div class="muted">尚无快照（python -m tools.check_slo）</div>', s.source, s.fetched_at)}
    ${card("时效三态","valid / pending / uncertain", bars(d.timeliness_tri,"#12855A","条"), d.source, d.fetched_at)}
    ${card("主题分布",`${tEntries.length} 个主题 / 合计 ${num(tTotal)}`,
      bars(tDist,"#6C5CE7","条")
      + `<div class="note">显示前 ${Math.min(TOP_N,tEntries.length)} 项${restSum>0?`，其余 ${tEntries.length-TOP_N} 项合并为「其他」`:""}；各条合计 = ${num(tTotal)}（可自行核对）</div>`,
      d.source, d.fetched_at)}
  </div>`;
}

/* ---------------- P4 待办闭环 ---------------- */
/*: 单元格渲染：值 / 来源标签 / "不确定"说明三态。
 * 铁律：`not_found`（查不到）与 `not_applicable`（该 kind 没这个概念）**必须分开**，
 * 且 `mismatch`（命中的不是同一份文件）要**明说**——用户就是被"看起来能点、
 * 点开却是另一份文件"坑过。 */
function cellVal(v, src, note){
  if(v) return esc(v);
  const lab = SRC_LABEL[src] || (src ? src : "—");
  const cls = (src==="mismatch")?"bad":((src==="not_found")?"muted":"muted");
  return `<span class="${cls}" title="${esc(note||lab)}">${esc(lab)}</span>`;
}
function cellUrl(f){
  if(f.url){
    return `<a href="${esc(f.url)}" target="_blank" rel="noopener">打开</a>
      <span class="muted" style="font-size:11px">(${esc(SRC_LABEL[f.url_src]||f.url_src||"")})</span>`;
  }
  if(f.local_path){
    /* 本地文件走 `GET /api/local/file`：PDF/TXT 浏览器内联打开，Office 文档下载。
     * **不**由服务端拉起 Word（那会夺焦点，本仓明令禁止）。 */
    return `<a href="/api/local/file?path=${encodeURIComponent(f.local_path)}"
      target="_blank" rel="noopener" title="打开/下载：${esc(f.local_path)}">打开本地文件</a>
      <span class="muted" style="font-size:11px">(本地)</span>`;
  }
  const lab = SRC_LABEL[f.url_src] || (f.url_src||"—");
  if(f.url_src==="mismatch"){
    return `<span class="bad" title="${esc(f.url_note||"")}">地址不匹配</span>
      <div class="muted" style="font-size:11px;max-width:280px;white-space:normal">${esc(f.url_note||"命中记录与本条不是同一份文件，已停止提供链接")}</div>`;
  }
  return `<span class="muted" title="${esc(f.url_note||"")}">${esc(lab)}</span>`;
}

function viewWorklist(d, kinds){
  if(!d.available) return unavail(d);
  const schema=obj(d.fields_schema), caps=obj(schema.kinds);
  const items=arr(d.items);
  const total = (d.total!=null?d.total:(d.count||0));
  const shown = items.length;
  const wtitle = total>shown
    ? `${esc(d.status)}：共 <b>${total}</b> 条，本页 ${shown} 条（可按 kind 筛选）`
    : `${esc(d.status)}：共 ${total} 条`;

  /* 行：**操作列在最左**（勾选 + 处置）。
   * 用户报"处置在列表最下方，交互不合理"——原来点行尾按钮，表单出现在**整张表之后**，
   * 长列表里等于"点完要滚到页底才能填"。现在处置表单**就地插在该行下方**，
   * 且勾选/操作固定在左列，阅读动线是"选 → 处置 → 填 → 提交"。 */
  const rows = items.map((it, idx)=>{
    const f=obj(it.fields), kind=String(it.kind||"");
    const cap=obj(caps[kind]);
    const detail=[f.note, it.suggestion].filter(Boolean).join(" ｜ ");
    return `<div class="lv-row" data-id="${esc(it.item_id)}" data-idx="${idx}">

      <span class="lv-cell id">${cellVal(f.identity, f.identity_src)}</span>

      <span class="lv-cell">${cellUrl(f)}</span>
      <span class="lv-cell muted"><span class="Truncate" title="${esc(detail)}">${esc(detail||"—")}</span></span>
    </div>`;
  }).join("");

  const statBar = ghStateTabs([
    {key: "open", label: "待处置", count: obj(STATE._wlcnt).open},
    {key: "resolved", label: "已处置", count: obj(STATE._wlcnt).resolved},
  ], String(STATE._wlstatus || "open"), "wlstatus");
  const kd = arr(kinds&&(kinds.kinds||kinds.items));
  const _kItems = [{key: "", label: "全部 kind"}].concat(
    kd.map(x => (typeof x === "string"
      ? {key: x, label: x}
      : {key: String(x.kind || x.key || x.value || ""),
         label: String(x.label || x.kind || x.key || x.value || ""),
         count: (x.count != null ? x.count : undefined)})));

  const curKind=(d.filter&&d.filter.kind)||"";
  const kindOpts=['<option value="">全部 kind</option>'].concat(
    (kd.length?kd.map(x=>x.kind||x):Object.keys(obj(d.kind_counts)))
      .map(k=>`<option value="${esc(k)}"${k===curKind?" selected":""}>${esc(k)}${
        (obj(d.kind_counts)[k])?"（"+obj(d.kind_counts)[k]+"）":""}</option>`)).join("");

  const toolbar = `<div class="toolbar">
      <span class="muted">kind</span><select id="wlkind">${kindOpts}</select>
      <span class="muted">已选 <b id="wln">0</b> 条</span>
      <select id="wlstatus"><option value="resolved">resolved（已处置）</option>
        <option value="dismissed">dismissed（不适用）</option></select>
      <input id="wlby" placeholder="操作者" value="confirm_console" style="width:160px">
      <input id="wlwhy" placeholder="批量处置理由（必填，进审计台账）" style="flex:1;min-width:220px">
      <button class="btn" id="wlbulk">批量处置</button>
      <span class="muted" style="margin-left:auto">写路径纪律：${esc((kinds&&kinds.action_policy)||"worklist_resolve")}</span>
    </div>`;

  // 操作列固定最左，且**带全选**：批量处置前要先能"一次勾完"。
  // 2026-10-22 重写时漏过一次（旧守卫 test_console_exposes_bulk_selection 抓到）。
  /* 表头 = 工具条（状态开关 + 字段按钮 + 批量控件），列名不再出现（GitHub 同构） */
  const COL_LABELS = ["操作", "kind", "唯一标识号", "名称", "文号", "访问地址", "详情"];
  const NO_FILTER = new Set([0]);

    `<button class="lv-fbtn btn btn-invisible" data-gcol="${i}"
      aria-haspopup="dialog" title="按「${esc(lab)}」筛选">${esc(lab)}${
      ico("chevron-down", 16)}</button>`).join("");
  const head = `<div class="lv-headbar">${statBar}${colBtns}
      <span class="sp"></span>
      <label class="muted" style="display:inline-flex;align-items:center;gap:6px">
        <input type="checkbox" id="wlall" title="全选本页"> 全选</label>
    </div>`;
  return card("", wtitle,
    sideShell("worklist", _kItems, String(STATE._wlkind || ""), (rows
      ? `<div class="lv lv-gtable" data-lg="worklist">

          ${toolbar}

    + `<div class="note">列含义：唯一标识号 = 该条的机器身份（RFN/IPN/文号）；
        文号仅对"有外部文号"的 kind 显示，其余标「不适用」；
        访问地址标「未查到」= 库里确实没有，「不匹配」= 命中的不是同一份文件（已停止提供链接）。</div>`,
      "kind"),

}

/* ---------------- P8 发布事件流 ---------------- */
function viewRelease(d){
  if(!d.available) return unavail(d);
  const all=arr(d.commits);
  /* 左侧 = **倒序日期流**（同一天聚成一条，带当日提交数）。
   * 点某天只看那天 —— 发布事件的读者通常是"某次发布前后改了什么"，
   * 日期是最自然的入口，比让人在 100 条 commit 里翻要快。
   * 「发布物证据」已移入总览（它属于"当前产物的证据"，不属于"某次提交"）。 */
  const dayCount = {};
  all.forEach(c => { const k = String(c.date || "—"); dayCount[k] = (dayCount[k] || 0) + 1; });
  const dayItems = [{key: "", label: "全部日期", count: all.length}]
    .concat(Object.keys(dayCount).sort().reverse()
      .map(k => ({key: k, label: k, count: dayCount[k]})));
  const day = String(STATE.rel_day || "");
  const commitsAll = day ? all.filter(c => String(c.date || "—") === day) : all;
  /* 列表不再设固定高度（用户要求），但 364 条全铺会把页面撑到 2.7 万像素。
   * 单页 100 条 + 明说还剩多少，让"左侧按日期"成为缩小范围的主入口。 */
  const PER = 100;
  const commits = commitsAll.slice(0, PER);
  const rows=commits.map(c=>`<div class="lv-row" data-sha="${esc(c.sha)}" style="cursor:pointer">
    <span class="lv-cell muted" style="white-space:nowrap">${esc(c.date)}</span>
    <span class="lv-cell mono">${esc(c.sha)}</span>
    <span class="lv-cell">${esc(c.subject)}</span>
    <span class="lv-cell"><button class="link" data-sha="${esc(c.sha)}">变更</button></span></div>`).join("");
  const stream = `<div class="rel-split"><div class="grid">
    ${card("",`git log ${day ? day + " · " : "全量 "}${commits.length} 条${
      d.commit_total ? "（total " + d.commit_total + "）" : ""}`,
      commits?`<div class="lv lv-gtable" data-lg="release">
        <div class="lv-headbar">
          ${["日期", "sha", "主题"].map((lab, i) =>
            `<button class="lv-fbtn btn btn-invisible" data-gcol="${i}"
              aria-haspopup="dialog" title="按「${esc(lab)}」筛选">${esc(lab)}${
              ico("chevron-down", 16)}</button>`).join("")}
          <span class="sp"></span>
        </div>
        <div class="lv-scroll"><div class="lv-grid"
          style="--cols:96px 92px minmax(0,1fr) 64px">${rows}</div></div>
      </div>
        <div class="note">点「变更」看该提交的**完整**改动（文件清单 + 完整提交说明）。${
          commitsAll.length > PER
            ? ` 共 ${commitsAll.length} 条，此处显示前 ${PER} 条；用左侧日期可缩小范围。`
            : ""}</div>`
        :`<div class="muted">git 不可用${d.git_error?("："+esc(d.git_error)):""}</div>`, d.source, d.fetched_at)}
  </div><div id="commitbox"></div></div>`;
  return sideShell("release", dayItems, day, stream, "日期（倒序）");
}

/* ---------------- 交互 ---------------- */
let CUR="overview", STATE={}, HEALTH_P=null;
/*: 401 后"切登录卡片"的一次性闸门（防 render→api→render 递归，见 `api()`） */
let AUTH_RELOADING=false;

/*: 认证前置：**每次渲染前**确认身份（缓存一次，401 时由 `api()` 置空重取）。
 * 为什么不在页面加载时判一次就够：会话 8 小时过期，长时间开着的页面可能在
 * 中间失效；每页渲染前取一次状态最省事也最准。 */
/*: 认证/访问范围状态（**唯一来源 = `/api/health`**）
 *
 * 2026-10-23 真实故障与根因（记在这里，避免以后又拆成两个源）：
 *   原实现先取 `/api/auth/status`（免认证，有 mode），再取 `/api/health`
 *   （**被认证闸门拦成 401**，body 里没有 `auth_mode`）⇒ `mode` 被覆盖成 `"off"`
 *   ⇒ `render()` 认为"没开认证"，直接去拉数据接口 → 又 401 → 又 render → **递归**。
 *   结果：两个地址都只剩"未认证/未登录"，一个页签都打不开。
 * 现约定：
 *   · `/api/health` **允许未认证访问**，且**恒带** `auth_mode/authenticated/need_login`；
 *   · 未认证时它只回**公开子集**（不含门禁数、本机专属路由等内情）；
 *   · `/api/auth/status` 仅用于"已认证后领取 CSRF 令牌"（代理认证场景的唯一入口）。
 */
function ensureHealth(){
  if(!HEALTH_P){
    HEALTH_P = api("/api/health").then(h=>{
      STATE.health = obj(h);
      STATE.auth = {
        authenticated: h.authenticated === true,
        user: String(h.user || ""),
        user_source: String(h.user_source || ""),
        mode: String(h.auth_mode || "off"),
        need_login: h.need_login === true,
        /* 审计级别：`user` 能定位到人；`shared` 只有共享口令（无法定位到人）。
         * 必须显示出来——否则读者会默认"既然要登录，那一定审计到人了"。 */
        auditLevel: String(h.audit_level || ""),
        auditLabel: String(h.audit_level_label || ""),
      };
      applyScope(h);
      // 已认证才需要 CSRF（未认证时 status 只会回 need_login，不浪费一次往返）
      if(STATE.auth.authenticated && !STATE.csrf){
        return api("/api/auth/status").catch(()=>obj({})).then(st=>{
          STATE.authStatus = obj(st);
          return STATE.auth;
        });
      }
      return STATE.auth;
    }).catch(e=>{
      // 连 health 都拿不到 ⇒ 服务不可达：给出**可行动**的结论，而不是"未登录"
      STATE.auth = {authenticated:false, mode:"", unreachable:String(e||"")};
      return STATE.auth;
    });
  }
  return HEALTH_P;
}

/*: 访问范围徽标 + 本机专属页签隐藏（原有逻辑，抽出来供 ensureHealth 调用）。 */
function applyScope(h){
  const scope = String(h.scope || "local");
  const local = h.local_only === true || scope === "local";
  const sc = $("#scope");
  if(sc){
    sc.textContent = local ? "本机" : "内网只读";
    sc.className = "badge " + (local ? "" : "warn");
    sc.title = local ? "全部功能可用（含待办处置）"
      : `内网访问（${scope}）：本地文件/宿主诊断/提交详情仅限本机`;
  }
  /* 内网只读时，"本机专属"页签不给入口（服务端另有强制拦截）。
   * 记在 STATE 里而不是直接改 DOM：页签可能还没构建完，`foldTabs` 会读它。 */
  STATE._local = local;
  if (typeof foldTabs === "function") foldTabs();
  const au = $("#auth");
  if(au){
    const a = obj(STATE.auth);
    /* 三种身份要能分辨（原来只有"已登录/未登录"两态，本机自动认证会被显示成
     * "已登录 <机器账号>"，容易被误读成"有人登录过"）： */
    const src = String(a.user_source || "");
    if(a.authenticated && src === "本机账号"){
      au.textContent = a.user || "本机账号";   /* 范围由 #scope 表达，避免重复 */
      au.className = "badge";
      au.title = "回环访问：已自动认证为当前 Windows 账号（内网访问需口令）";
    }else if(a.authenticated){
      const shared = String(a.auditLevel || "") === "shared";
      au.textContent = `已登录 ${a.user || ""}` + (shared ? "（共享）" : "");
      au.className = "badge" + (shared ? " warn" : "");
      au.title = (src || "已认证") + (shared
        ? "\n⚠ 共享口令：操作无法定位到人（如需到人，请向管理员申请个人令牌）"
        : "\n" + (a.auditLabel || "可审计到人"));
    }else if(a.mode === "off"){
      au.textContent = "未启用认证";
      au.className = "badge";
    }else{
      au.textContent = a.unreachable ? "服务不可达" : "未登录";
      au.className = "badge bad";
      au.title = a.unreachable || "请登录后查看";
    }
  }
}

/*: 登录卡片：token 模式只填口令；basic 模式填账号+口令。
 * 登录成功后服务端同时下发 `wb_sess` 与 `wb_csrf`，后者用于所有写请求的 CSRF 校验。 */
function viewLogin(){
  const mode = String(obj(STATE.auth).mode || "");
  const userField = mode === "basic"
    ? `<label class="muted" style="display:block;margin-bottom:8px">账号
         <input id="lguser" autocomplete="username" placeholder="域账号"></label>` : "";
  return `<div class="card" style="max-width:460px;margin:8vh auto">
    <h3><span>登录确认台</span><span class="hint">${mode === "basic" ? "账号口令" : "内网共享口令"}</span></h3>
    <div class="note">本确认台对内网开放，**不允许匿名读取数据**（内网与回环不同：
      回环访问已自动认证为当前 Windows 账号）。
      口令在服务启动日志里（检索 <code>内网共享口令</code> 一行），
      也可直接看 <code>data\\state\\console_token.txt</code> 或运行
      <code>python -m web.auth token</code> 获取/重置。</div>
    <div class="muted" style="font-size:12px;margin-bottom:var(--s2)">
      会话 8 小时；跨机器请勿共用口令，建议由 IT 统一发放或接可信代理（README §6.9）。</div>
    ${userField}
    <label class="muted" style="display:block">${mode === "basic" ? "口令" : "共享口令"}
      <input id="lgpw" type="password" autocomplete="current-password"
        placeholder="${mode === "basic" ? "你的口令" : "XXXX-XXXX-XXXX-XXXX"}"></label>
    <div class="toolbar" style="margin-top:var(--s3)">
      <button class="btn btn-primary" id="lgbtn">登录</button>
      <span class="muted" id="lgmsg" style="font-size:12px"></span>
    </div>
  </div>`;
}

function bindLogin(){
  const v = $("#view");
  const btn = $("#lgbtn", v);
  const go = async () => {
    const pw = (($("#lgpw", v) || {}).value || "").trim();
    const user = (($("#lguser", v) || {}).value || "").trim();
    const msg = $("#lgmsg", v);
    if(!pw){ if(msg) msg.textContent = "请输入口令"; return; }
    btn.disabled = true;
    try{
      const r = await api("/api/auth/login", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({user: user, password: pw}),
      });
      if(r && r.ok){
        STATE.csrf = String(r.csrf || "");
        STATE.auth = {authenticated:true, user:String(r.user||""), mode:String(obj(STATE.auth).mode||"")};
        HEALTH_P = null;
        toast("已登录：" + (r.user || ""));
        render();
      }else{
        if(msg) msg.textContent = (r && (r.error || r.reason)) || "登录失败";
        btn.disabled = false;
      }
    }catch(e){
      if(msg) msg.textContent = "登录失败：" + String(e);
      btn.disabled = false;
    }
  };
  if(btn) btn.onclick = go;
  const pw = $("#lgpw", v);
  if(pw) pw.onkeydown = (e) => { if(e.key === "Enter") go(); };
}

/*: 旧式表格增强：给每个 <th> 加"筛选下拉"，点开列出该列取值（含计数），选中即过滤行。
 *
 * 为什么不重写成 .lv：这些页（待办/检索/审计/发布事件/留言板/监管统计/关系图谱）
 * 的数据形状差异很大，重写等于七次改版；先把**交互**统一（表头即筛选），
 * 再把视觉交给全局表格样式，收益/风险比最高。
 */
/*: 表单控件统一挂 Primer `.form-control`（批 134 P1）
 *
 * 为什么不逐处改模板：输入框分散在 30+ 个模板字符串里，逐个加 class 既容易漏，
 * 也会让"哪个控件长什么样"取决于写模板的人。这里在**渲染完成后一次性收口**，
 * 只保留一个判据：可输入的控件就必须是 Primer 控件。 */
function applyPrimerControls(){
  /* 弹窗/浮层挂在 body 下（不在 #view 里）⇒ 必须扫全文档，否则反馈表单永远裸控件 */
  /* 筛选/字段/列头按钮统一成 Primer 的不可见按钮（删掉三套自研外观） */
  $$(".gbtn, .lv-fbtn, .colf").forEach(el => {
    if (!el.classList.contains("btn")) el.classList.add("btn", "btn-invisible");
  });
  $$(".lv-empty").forEach(el => el.classList.add("blankslate"));
  $$("input, select, textarea").forEach(el => {
    const type = String(el.getAttribute("type") || "").toLowerCase();
    if (type === "checkbox" || type === "radio" || type === "hidden" || type === "file") return;
    /* 筛选框/浮层搜索框按 GitHub 实测 30（不是表单控件的 32） */
    if (el.classList.contains("lv-fq") || el.classList.contains("q")) return;
    if (!el.classList.contains("form-control")) el.classList.add("form-control");
  });
}

/*: GitHub 的「开启/关闭」状态开关（列表头最左，30px、带计数、无边框）
 *
 * 实测：`Open 454 (454)` / `Closed 15,462`——未选中灰字，选中黑字加粗，hover 浅灰底。
 * 计数直接来自各页已有的统计（待办取 /api/worklist 两个状态的 total；
 * 留言板取 st.by_status），不新增接口。 */
function ghStateTabs(items, cur, side){
  return `<div class="ghstate" role="tablist" aria-label="状态">` + items.map(it =>
    `<button class="ghstate-btn${it.key === cur ? " on" : ""}" role="tab"
       aria-selected="${it.key === cur}" data-${side}="${esc(it.key)}"
       >${esc(it.label)}<span class="n">${num(it.count)}</span></button>`).join("") +
    `</div>`;
}

/*: 网格行（.lv-row = div）的列筛选：与表格版同一套选项面板，只是取值来自 .lv-cell */
function openGridFilter(root, idx, anchor){
  const rows = $$(".lv-row", root).filter(r => !r.classList.contains("detail"));
  const counts = {};
  rows.forEach(r => {
    const c = r.querySelectorAll(".lv-cell")[idx];
    const v = c ? (c.textContent || "").trim() : "";
    if (v) counts[v] = (counts[v] || 0) + 1;
  });
  let sel = [];
  try { sel = JSON.parse(root.dataset["f" + idx] || "[]"); } catch (e) { sel = []; }
  openOptionList({
    anchor,
    options: Object.keys(counts).sort().map(k => ({
      value: k, label: k, sub: `${num(counts[k])} 条`})),
    selected: sel,
    multi: true,
    placeholder: "搜索取值…",
    emptyText: "该列没有取值",
    onChange: (vals) => {
      if (vals.length) root.dataset["f" + idx] = JSON.stringify(vals);
      else delete root.dataset["f" + idx];
      applyGridFilters(root);
    },
  });
}

function applyGridFilters(root){
  const idxs = Object.keys(root.dataset).filter(k => /^f\d+$/.test(k));
  $$(".lv-row", root).forEach(r => {
    if (r.classList.contains("detail")) return;
    let ok = true;
    idxs.forEach(k => {
      const i = Number(k.slice(1));
      let want = [];
      try { want = JSON.parse(root.dataset[k]); } catch (e) { want = []; }
      const c = r.querySelectorAll(".lv-cell")[i];
      if (!want.length || !c) return;
      if (want.indexOf((c.textContent || "").trim()) < 0) ok = false;
    });
    r.hidden = !ok;
  });
}

/*: 列头筛选：多选（复选框），条件同时进顶部 token 条（用户第 1、3 条）。 */
/*: 把某张表的列筛选渲染成顶部 token（与列表页的 token 同一套外观） */
async function render(){
  const v=$("#view");
  RAILCFG = null;          // 每轮重来：视图没登记就说明本页没有第二维
  try{
    // 认证闸门：未登录且服务端开了认证 ⇒ 只渲染登录卡片（不请求任何数据接口）
    const au = await ensureHealth();
    if(au && au.authenticated === false && au.mode && au.mode !== "off"){
      CUR="__login";
      v.innerHTML = viewLogin(); bindLogin(); return;
    }
    if(CUR==="__login") CUR="overview";
    if(CUR==="overview"){
      /* 总览要多一份 release：**发布物证据**（SBOM/契约版本）从「发布事件」移到这里的
       * 「02 产物与发布」板块 —— 它讲的是"当前产物是什么"，与"某次提交改了什么"不同轴。 */
      const [o,a,p,r]=await Promise.all([api("/api/overview"),api("/api/assets"),
        api("/api/publish"),api("/api/release")]);
      STATE.overview=o; STATE.release=r;
      v.innerHTML=viewOverview(o,a,p,r); return;
    }
    if(CUR==="metrics"){
      const [m,q,s]=await Promise.all([api("/api/metrics"),api("/api/quality"),api("/api/slo")]);
      /* ⚠️ 2026-10-22 修 P3 的 TypeError：原实现 `Object.assign(LAST.metrics, m)`，
       * 而首次进入时 `LAST.metrics` 是 undefined ⇒
       * `TypeError: Cannot convert undefined or null to object`（用户看到的就是这句）。
       * 改为**新建对象**，永不向 undefined 上赋值。 */
      STATE.metrics = Object.assign({}, obj(m), {quality:q, slo:s});
      v.innerHTML=viewMetrics(STATE.metrics); return;
    }
    if(CUR==="worklist"){
      const wlSt = String(STATE._wlstatus || "open");
      const qk = "?status=" + wlSt + (STATE._wlkind
        ? "&kind=" + encodeURIComponent(STATE._wlkind) : "");
      const [wl,k]=await Promise.all([api("/api/worklist"+qk),api("/api/worklist/kinds")]);
      STATE.worklist=wl; STATE._wlkinds=k;
      /* 两个状态的计数各取一次并缓存（已处置只有十来条，代价可忽略） */
      if (!STATE._wlcnt) {
        const other = await api("/api/worklist?status=" + (wlSt === "open" ? "resolved" : "open"));
        STATE._wlcnt = wlSt === "open"
          ? {open: wl.total || 0, resolved: other.total || 0}
          : {open: other.total || 0, resolved: wl.total || 0};
      } else {
        STATE._wlcnt[wlSt] = wl.total || 0;
      }
      v.innerHTML=viewWorklist(wl,k);
      bindWorklist(v); return;
    }
    if(CUR==="search"){
      const q=$("#q")?$("#q").value:"";
      const kind=$("#kind")?$("#kind").value:"records";
      STATE.search=await api(`/api/search?q=${encodeURIComponent(q)}&kind=${kind}`);
      v.innerHTML=viewSearch(STATE.search);
      bindSearch(); return;
    }
    if(CUR==="release"){
      STATE.release=await api("/api/release");
      v.innerHTML=viewRelease(STATE.release);
      bindRelease(); return;
    }
    if(CUR==="flow"){
      STATE.flow=await api("/api/flow");
      v.innerHTML=viewFlow(STATE.flow);
      bindFlow(); return;
    }
    if(CUR==="laws"){
      /* 表格状态用 `Object.assign` 兜底：首次进入给默认值，之后**沿用用户的选择**
       * （翻到第 3 页、按文号筛过，再切回本页时不该被重置）。 */
      const st = STATE.laws = Object.assign(
        {page:1, size:50, sort:"publish_date", desc:true,
         theme:"", source:"", timeliness:"", q_title:"", q_docno:"", q_rfn:""},
        obj(STATE.laws));
      if(!STATE.laws_f) STATE.laws_f = await api("/api/records/facets");
      const d = await api("/api/records?" + toQuery(st));
      STATE.laws_d = d;
      v.innerHTML = viewLaws(d, st, obj(STATE.laws_f));
      bindLaws(); return;
    }
    if(CUR==="rules"){
      const st = STATE.rules = Object.assign(
        {page:1, size:50, sort:"title", desc:false,
         theme:"", q_title:"", q_docno:"", q_ipn:""},
        obj(STATE.rules));
      if(!STATE.rules_f) STATE.rules_f = await api("/api/rules/facets");
      const d = await api("/api/rules?" + toQuery(st));
      STATE.rules_d = d;
      v.innerHTML = viewRules(d, st, obj(STATE.rules_f));
      bindRules(); return;
    }
    if(CUR==="graph"){
      /* 未指定中心 ⇒ **全局视图**（2026-10-23 用户要求：不再叫用户"先从列表进入"）。 */
      const ref = obj(STATE.graph).ref || "";
      const d = await api("/api/relations" +
        (ref ? "?ref=" + encodeURIComponent(ref) : ""));
      v.innerHTML = viewGraph(d);
      bindGraph(); return;
    }
    if(CUR==="regstats"){
      const [rs, es, sc] = await Promise.all([
        api("/api/regstats"), api("/api/east"),
        /* 统计制度 → 公司制度：复用 `/api/rules` 的**服务端**关键词筛选（不在前端扫全量） */
        api("/api/rules?size=100&q_title=" + encodeURIComponent("统计")),
      ]);
      STATE.stat_corp = sc;
      STATE.regstats = rs;
      STATE.east = es;
      v.innerHTML = viewRegstats(STATE.regstats);
      bindRegstats(); return;
    }
    if(CUR==="feedback"){
      const q = STATE._fbq || {};
      STATE.feedback = await api("/api/feedback?" + toQuery(q));
      v.innerHTML = viewFeedback(STATE.feedback);
      bindFeedback(); return;
    }
    if(CUR==="governance"){
      STATE.governance=await api("/api/governance");
      v.innerHTML=viewGovernance(STATE.governance); return;
    }
  }catch(e){
    v.innerHTML=card("渲染异常","",`<div class="pill bad">⚠ 前端异常</div>
      <div class="note">${esc(String(e&&e.stack?e.stack:String(e)))}</div>`,"web 前端");
  }finally{
    paintRail();           // 所有分支（含登录/异常）都走这里
    syncTabInk();          // 页签墨线跟随当前页签，侧栏才不会残留上一页
    applyPrimerControls();  // 输入类控件统一 Primer .form-control
    const cur = TABS.find(x => x.id === CUR);
    const cn = $("#crumbName");
    if (cn) cn.textContent = cur ? cur.name : (CUR === "__login" ? "登录" : CUR);
    if (cn) cn.title = cn.textContent;
    $("#stamp").textContent = "抓取 "+new Date().toLocaleTimeString();
  }
}

function bindFlow(){

async function openStep(step){
  const out=$("#stepout"); if(!out) return;
  out.innerHTML=card("步骤抽屉："+step,"加载中…","","web");
  const d=await api("/api/flow/step?step="+encodeURIComponent(step));
  if(d.available===false){
    out.innerHTML=card("步骤抽屉："+step,"",`<div class="pill warn">⚠ ${esc(d.reason||"不可用")}</div>`,d.source);
    return;
  }
  const row=obj(d.row);
  out.innerHTML=card("步骤抽屉："+step, esc(d.source||""),
    kv("status", esc(row.status||"—")) + kv("rc", esc(row.rc!=null?row.rc:(row.exit_code||"—")))
    + kv("耗时", esc(row.elapsed_s!=null?row.elapsed_s+"s":"—"))
    + (row.note? '<div class="muted" style="margin-top:6px">note</div><pre>'
        + esc(String(row.note).slice(0,800)) + "</pre>" : "")
    + `<pre>${esc(d.log_tail||"(无日志)")}</pre>
       <div style="margin-top:10px"><button class="act ghost" id="dlgbtn" type="button">诊断这一步</button>
       <div id="diagbox" style="margin-top:8px"></div></div>`, d.source, d.fetched_at);
  const b=$("#dlgbtn"); if(b) b.onclick=()=>diagnoseStep(step);
  out.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function diagnoseStep(step){
  const box=document.getElementById("diagbox"); if(!box) return;
  box.innerHTML='<div class="muted">诊断中…</div>';
  const d=await api("/api/diagnose?kind=step&name="+encodeURIComponent(step));
  if(d.available===false){ box.innerHTML=`<div class="pill warn">⚠ ${esc(d.note||"诊断不可用")}</div>`; return; }
  const sus=arr(d.suspicions).map(s=>`<li>${esc(s.claim)} <span class="muted">— ${esc(s.basis)}</span></li>`).join("");
  const gaps=arr(d.missing).map(g=>`<li class="muted">${esc(g)}</li>`).join("");
  box.innerHTML = kv("匹配形态", esc(d.matched_as||"—")) + kv("声明步骤", esc(d.spec_step||"—"))
    + kv("证据项", esc(String(arr(d.evidence).length)))
    + (sus?`<div class="muted" style="margin-top:6px">怀疑（每条附依据）</div><ul>${sus}</ul>`:"")
    + (gaps?`<div class="muted" style="margin-top:6px">证据缺口</div><ul>${gaps}</ul>`:"")
    + `<pre>${esc(String(d.rendered||"").slice(0,4000))}</pre>`;
}

function bindWorklist(v){
  const cks=$$(".wlck",v);
  const upd=()=>{const n=$("#wln"); if(n) n.textContent=cks.filter(c=>c.checked).length;};
  cks.forEach(c=>c.onchange=upd);
  const all=$("#wlall");
  if(all) all.onchange=()=>{ cks.forEach(c=>{ c.checked=all.checked; }); upd(); };
  $$("[data-wlstatus]", v).forEach(b => {
    b.onclick = () => { STATE._wlstatus = b.dataset.wlstatus; render(); };
  });
  const ks=$("#wlkind");
  if(ks) ks.onchange=()=>{ STATE._wlkind=ks.value; render(); };
  // 行内处置：表单插在**该行下方**（不再跑到整张表之后）
  $$("button[data-resolve]",v).forEach(b=>{
    b.onclick=()=>openResolveInline(b.closest("tr") || b.closest(".lv-row"), b.dataset.resolve);
  });
  const bulk=$("#wlbulk");
  if(bulk) bulk.onclick=async()=>{
    const sel=cks.filter(c=>c.checked).map(c=>c.value);
    if(!sel.length){ toast("未选择任何条目", true); return; }
    const why=$("#wlwhy").value.trim();
    if(!why){ toast("批量处置必须填理由（进审计台账）", true); return; }
    const st=$("#wlstatus").value, by=$("#wlby").value.trim()||"confirm_console";
    bulk.disabled=true;
    let ok=0; const bad=[];
    for(const id of sel){
      try{
        const r=await api("/api/worklist/resolve",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({item_id:id, resolution:why, status:st, by})});
        if(r.ok||r.available) ok++; else bad.push(id+":"+(r.reason||r.error||"失败"));
      }catch(e){ bad.push(id+":异常"); }
    }
    bulk.disabled=false;
    toast(ok===sel.length?`已批量处置 ${ok} 条（逐条落审计）`
      :`完成 ${ok}/${sel.length}；失败 ${bad.length}：${bad.slice(0,3).join(",")}`, ok!==sel.length);
    render();
  };
}

function openResolveInline(tr, id){
  if(!tr) return;
  const next=tr.nextElementSibling;
  if(next && next.classList.contains("detail")){ next.remove(); return; }  // 再点收起
  const isTr = tr.tagName === "TR";
  const tr2 = document.createElement(isTr ? "tr" : "div");
  tr2.className = isTr ? "detail" : "lv-row detail";
  tr2.innerHTML = isTr ? `<td colspan="7">
    <div class="row"><b>处置 ${esc(id)}</b>
      <select id="rstatus"><option value="resolved">resolved（已处置）</option>
        <option value="dismissed">dismissed（不适用）</option></select>
      <input id="rby" placeholder="操作者" value="confirm_console" size="14">
      <button class="btn btn-primary" id="rok">提交</button>
      <button class="act ghost" id="rcancel">取消</button></div>
    <textarea id="rwhy" placeholder="处置理由（必填，进入审计台账）"></textarea>
    <div class="note">写路径：<code>worklist_resolve</code>（唯一写口，逐条落审计）。</div>
  </td>` : `<div class="fb-body">
    <div class="row"><b>处置 ${esc(id)}</b>
      <select id="rstatus"><option value="resolved">resolved（已处置）</option>
        <option value="dismissed">dismissed（不适用）</option></select>
      <input id="rby" placeholder="操作者" value="confirm_console" size="14">
      <button class="btn btn-primary" id="rok">提交</button>
      <button class="btn" id="rcancel">取消</button></div>
    <textarea id="rwhy" placeholder="处置理由（必填，进入审计台账）"></textarea>
    <div class="note">写路径：<code>worklist_resolve</code>（唯一写口，逐条落审计）。</div>
  </div>`;
  tr.after(tr2);
  const box=$("#rwhy"); if(box) box.focus();
  $("#rcancel").onclick=()=>tr2.remove();
  $("#rok").onclick=async()=>{
    const why=$("#rwhy").value.trim();
    if(!why){ toast("必须填处置理由", true); return; }
    const r=await api("/api/worklist/resolve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({item_id:id, resolution:why, status:$("#rstatus").value, by:$("#rby").value})});
    if(r.ok||r.available){ toast("已处置："+id); tr2.remove(); render(); }
    else toast("处置失败："+(r.reason||r.error||"未知"), true);
  };
}

/* ============================================================
 * 政策法规 / 公司制度 / 关系图谱（2026-10-23 第一百一十批）
 * ------------------------------------------------------------
 * 三页共用一套"**服务端**分页 + 表头筛选 + 表头排序"的表格骨架：
 *   · 分页必须在服务端：政策法规 16607 行，整包下发 4MB+ 且首屏必卡
 *     （这与上一批 `/api/overview` 22s 的教训同源：**别把全量搬进浏览器**）；
 *   · 排序/筛选参数一律交给 `interfaces/base_api` 白名单校验，前端不做任何 SQL
 *     拼接，也不在前端"取了 50 条再本地排序"（那会让排序结果只覆盖当前页）；
 *   · 条件存 `STATE`，翻页/排序/改筛选后**不丢条件**。
 * ============================================================ */
const toQuery = o => Object.entries(o)
  .filter(([, v]) => v !== "" && v != null && v !== undefined)
  .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

function thSort(key, label, st){
  const on = st.sort === key;
  const arw = on ? `<span class="arw">${ico(st.desc ? "triangle-down" : "triangle-up", 16)}</span>` : "";
  return `<th class="sortable${on ? " on" : ""}" data-sort="${key}"
    title="点击按「${esc(label)}」排序">${esc(label)}${arw}</th>`;
}
function fInput(key, st, ph){
  return `<input data-f="${key}" data-mode="enter" value="${esc(st[key] || "")}"
    placeholder="${esc(ph || "")}" title="输入后按回车筛选">`;
}
function fSelect(key, st, items, ph){
  const cur = st[key] || "";
  const opts = [`<option value="">${esc(ph || "全部")}</option>`]
    .concat(arr(items).map(it => {
      const v = it.value || "";
      return `<option value="${esc(v)}"${v === cur ? " selected" : ""}>` +
        `${esc(it.label || v || "（空）")}（${num(it.count)}）</option>`;
    }));
  return `<select data-f="${key}" data-mode="change">${opts.join("")}</select>`;
}
/*: 分页器（Primer `.pagination`）：居中、当前页蓝底 32×32、页码窗口 + … 折叠。
 * GitHub 实测：条目 32×32、圆角 6、当前页 `#0969da` 白字、disabled 灰字、整条居中。 */
function pager(d, id){
  const total = Number(d.total) || 0;
  const pages = Math.max(1, Number(d.pages) || 1);
  const page = Math.min(pages, Math.max(1, Number(d.page) || 1));
  const nums = [];
  const push = (n) => { if (n >= 1 && n <= pages && nums.indexOf(n) < 0) nums.push(n); };
  push(1);
  for (let n = page - 2; n <= page + 2; n++) push(n);
  push(pages);
  nums.sort((a, b) => a - b);
  let last = 0;
  const items = nums.map(n => {
    const gap = (last && n - last > 1) ? '<span class="gap" aria-hidden="true">…</span>' : "";
    last = n;
    return gap + (n === page
      ? `<span class="current" aria-current="page">${n}</span>`
      : `<a data-pg="${n}" href="#" role="button">${n}</a>`);
  }).join("");
  const prevDis = page <= 1, nextDis = page >= pages;
  return `<div class="paginate-container" id="${id}">
    <div class="pagination" role="navigation" aria-label="分页">
      <a class="previous_page" data-pg="${page - 1}" href="#"${
        prevDis ? ' aria-disabled="true" tabindex="-1"' : ""}>Previous</a>
      ${items}
      <a class="next_page" data-pg="${page + 1}" href="#"${
        nextDis ? ' aria-disabled="true" tabindex="-1"' : ""}>Next</a>
    </div>
    <div class="muted" style="font-size:12px;margin-top:4px">共 ${num(total)} 条</div>
  </div>`;
}

/*: 唯一标识号单元格（政策法规）。
 *
 * 2026-10-26：底座现在**每条记录都有 RFN**（入册的用归属表编号，未入册的由发布件
 * 派生）。两者语义不同，必须视觉可分：`派生` 标签 + 悬停说明，避免把"派生号"
 * 当成"已收录"。以前这里对无号行显示 "—"，读者既引用不了也对不上账。 */
function idCell(it){
  const rfn = String(it.rfn || "");
  if(!rfn) return '<span class="muted">—</span>';
  const derived = String(it.rfn_origin || "") === "derived";
  return `<span class="mono">${esc(rfn)}</span>` + (derived
    ? ' <span class="Label" title="未入册：编号由发布件派生，可稳定引用，但不代表已被归属表收录（不参与主题/时效统计）">派生</span>'
    : "");
}

function relBtn(ref){
  if (!ref) return '<span class="muted">—</span>';
  return `<button class="link" data-rel="${esc(ref)}"
    title="在「关系图谱」中查看 ${esc(ref)}">关系</button>`;
}
function themeCell(t){
  return t ? `<span class="Label">${esc(t)}</span>` : '<span class="muted">—</span>';
}
function timeCell(v){
  /* 时效状态用**中文**呈现：底座存的是受控枚举（valid/amended/…），
   * 直接显示英文枚举会让读者以为"没翻译完"（上一批 P4 已统一过这个口径）。 */
  const map = {valid:["现行有效","ok"], amended:["已修订","warn"],
               repealed:["已废止","bad"], expired:["已失效","bad"],

function addrCell(it){

  return '<span class="muted">未查到</span>';

/*: 主题自然序：T0, T1, T2 … T10（不能用 localeCompare 直接比，
 * 那会把 "T10" 排到 "T2" 前面；也不能按 count 排 —— 用户要的是编号顺序）。 */
function _themeSort(items){
  const key = (x) => {
    const v = String((x && (x.value ?? x.key ?? x)) || "");
    const m = /^T(\d+)/.exec(v);
    return m ? Number(m[1]) : 9999;
  };
  return arr(items).slice().sort((a, b) => key(a) - key(b));
}

function viewLaws(d, st, f){
  if (!d || d.available === false) return unavail(obj(d), "政策法规");
  /* 2026-10-27：列表页统一交给 `lvRender`（GitHub Issues 风格）。
   * 主题仍进左侧栏（"本页"组），与切片面板并存 —— 侧栏是"导航"，切片是"临时过滤"。 */
  const themes = _themeSort(arr(f.themes).filter(x => String(x.value) !== ""));
  const unset = arr(f.themes).find(x => String(x.value) === "");
  railSet("主题", [{side: "lvtheme", key: "", label: "全部主题",
     count: (unset && unset.count) || undefined}]
    .concat(themes.map(x => ({side: "lvtheme", key: x.value,
      label: x.label || x.value, count: x.count}))),
    String(obj(st).theme || ""));
  return lvRender("laws", d, st, f);
}

function viewRules(d, st, f){
  if (!d || d.available === false) return unavail(obj(d), "公司制度");
  const themes = _themeSort(arr(f.themes).filter(x => String(x.value) !== ""));
  const unset = arr(f.themes).find(x => String(x.value) === "");
  railSet("主题", [{side: "lvtheme", key: "", label: "全部主题",
     count: (unset && unset.count) || undefined}]
    .concat(themes.map(x => ({side: "lvtheme", key: x.value,
      label: x.label || x.value, count: x.count}))),
    String(obj(st).theme || ""));
  return lvRender("rules", d, st, f);
}

/*: 全局关系图 —— **四视图**（2026-10-23 用户要求：四类关系都要能看见）。
 *
 * 为什么不是一个"全量图"
 * ----------------------
 * 5281 条关系里监管↔监管 5139、制度↔制度 24、制度→监管 118：全量同屏是不可读的黑网。
 * 但"画不下"不等于"不显示"。四类关系各自给最合适的呈现：
 *   ① 制度→监管：可定位的**全画**（25 条，不抽样）
 *   ② 监管↔监管：**枢纽星型**（Top15 按被引次数定大小，枢纽间直连边照画）
 *   ③ 制度↔制度：**全画**（24 条，数字编号 + 图例表，避免长名字互相压字）
 *   ④ 主题关系：**二部图**（主题 → 被其制度引用最多的监管文件）
 * 未定位的关系**不伪造节点**，但每个视图都显式给出条数（"找不到"≠"不存在"）。
 */
const GRAPH_VIEWS = [
  {key: "overview", name: "全览"},
  {key: "internal_to_regulatory", name: "制度 → 监管"},
  {key: "regulatory_to_regulatory", name: "监管 ↔ 监管"},
  {key: "internal_to_internal", name: "制度 ↔ 制度"},
  {key: "theme", name: "主题关系"},
  /* 2026-10-23 新增：语料外文件的**独立键空间**（`RFN-EXT-*`）。
   * 它必须单列一屏：这些目标不在库里，混进"监管文件"会让读者以为能点开原文。 */
  {key: "external", name: "外部法规"},
];

function _gTab(cur){
  return `<div class="toolbar gtabs">` + GRAPH_VIEWS.map(v =>
    `<button class="gbtn${v.key === cur ? " on" : ""}" data-gview="${v.key}">${
      esc(v.name)}</button>`).join("") + `</div>`;
}

function _gCut(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; }

/* ============================ 3D 关系图引擎 ============================
 *
 * 为什么自己写（不引 three.js）：本控制台**零外链、零构建**（内网可用、离线可跑），
 * 引一个 600KB 的 3D 库既破坏这条约束，也超出需求 —— 我们要的只是"能把一团
 * 关系转起来看清楚"，不是渲染管线。
 *
 * 做法：正交投影 + 深度排序，纯 SVG。
 *   · 布局：节点按 `group` 分簇，簇心沿**斐波那契球**均匀铺开（避免极区堆积），
 *     簇内再套一层小球面 ⇒ 既分层又不糊成一坨；
 *   · 旋转：拖拽改变 yaw/pitch；滚轮缩放；**惰性重绘**（rAF 合帧），
 *     681 条边在 1000×620 上实测流畅；
 *   · 可读性：标签只画"在前景且度数够大"的节点（默认不糊），
 *     点节点 → 高亮它的边 + 其余降到 0.06 透明度。
 *
 * 状态按 `key` 常驻（切页签回来还是你转到的角度），存在 `G3D_ST`。
 */
const G3D_ST = {};        // key -> {yaw, pitch, zoom, sel}
const G3D_MODEL = {};     // key -> model（拖拽时重算用）

function _g3dHash(s){
  let h = 2166136261;
  s = String(s || "");
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;   // 0..1 稳定抖动
}

function _g3dLayout(model){
  const nodes = model.nodes || [];
  const groups = [];
  const by = {};
  nodes.forEach(n => {
    const g = String(n.group || "");
    if(!(g in by)){ by[g] = []; groups.push(g); }
    by[g].push(n);
  });
  const R = 300, G = Math.max(1, groups.length);
  const out = {};
  groups.forEach((g, gi) => {
    // 簇心：斐波那契球（只取球面上一点，保证均匀）
    let cx = 0, cy = 0, cz = 0;
    if(G > 1){
      const y = -1 + 2 * (gi + 0.5) / G;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = gi * 2.399963229728653;
      cx = r * Math.cos(th) * R; cy = y * R; cz = r * Math.sin(th) * R;
    }
    const mem = by[g], M = Math.max(1, mem.length);
    // 簇内半径：成员多则铺开（∝ sqrt），但不超过簇间距的一半
    const rr = G === 1 ? R * 0.92 : Math.min(R * 0.55, 26 + 12 * Math.sqrt(M));
    mem.forEach((n, i) => {
      const y = M === 1 ? 0 : -1 + 2 * (i + 0.5) / M;
      const r2 = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * 2.399963229728653 + _g3dHash(n.id) * 1.7;
      out[n.id] = {
        x: cx + r2 * Math.cos(th) * rr,
        y: cy + y * rr,
        z: cz + r2 * Math.sin(th) * rr,
      };
    });
  });
  return out;
}

function _g3dProj(pos, st, W, H){
  const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw);
  const cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
  const D = 1000, zoom = st.zoom || 1;
  const out = {};
  Object.keys(pos).forEach(k => {
    const p = pos[k];
    let x = p.x * cy - p.z * sy;
    let z1 = p.x * sy + p.z * cy;
    const y = p.y * cp - z1 * sp;
    z1 = p.y * sp + z1 * cp;
    const s = zoom * D / (D + z1);
    out[k] = {x: W / 2 + x * s, y: H / 2 + y * s, z: z1, s: s};
  });
  return out;
}

/*: 渲染一张 3D 图（返回 SVG 字符串；拖拽由 `bindG3d` 接管重绘） */
function _g3dSvg(key, W, H){
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"
      class="g3svg" data-g3="${esc(key)}" role="img" aria-label="三维关系图">
      ${_g3dInner(key, W, H)}</svg>`;
}

/*: 只产出 **内部** 内容 —— 拖拽重绘走 `svg.innerHTML = _g3dInner(...)`，
 * 关键点：**不能替换 svg 元素本身**，否则绑定在上面的 pointer 监听全丢，
 * 表现为"能转一下，之后就死住"（实测踩到）。 */
function _g3dInner(key, W, H){
  const model = G3D_MODEL[key] || {nodes: [], edges: []};
  const st = G3D_ST[key] || (G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""});
  const pos = model._pos || (model._pos = _g3dLayout(model));
  const pr = _g3dProj(pos, st, W, H);
  const sel = String(st.sel || "");
  const touch = new Set();
  (model.edges || []).forEach(e => {
    if(!sel) return;
    if(e.from === sel) touch.add(e.to);
    if(e.to === sel) touch.add(e.from);
  });
  const maxDeg = Math.max(1, ...(model.nodes || []).map(n => Number(n.degree) || 1));

  const edgeSvg = (model.edges || []).map(e => {
    const a = pr[e.from], b = pr[e.to];
    if(!a || !b) return "";
    const hot = sel && (e.from === sel || e.to === sel);
    const depth = (a.z + b.z) / 2;
    const op = hot ? .9 : (sel ? .05 : Math.max(.08, Math.min(.55, .42 - depth / 1400)));
    const dash = e.external ? ' stroke-dasharray="3 3"' : (e.dashed ? ' stroke-dasharray="6 4"' : "");
    return `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}"
      y2="${b.y.toFixed(1)}" stroke="${e.color || "var(--primary)"}"
      stroke-width="${(hot ? 1.8 : .8) * ((a.s + b.s) / 2)}" opacity="${op.toFixed(2)}"${dash}>
      <title>${esc(e.title || e.label || "")}</title></line>`;
  }).join("");

  const ordered = (model.nodes || []).slice().sort((n1, n2) =>
    (pr[n1.id] ? pr[n1.id].z : 0) - (pr[n2.id] ? pr[n2.id].z : 0));
  const nodeSvg = ordered.map(n => {
    const p = pr[n.id];
    if(!p) return "";
    const deg = Number(n.degree) || 1;
    const r = (3.2 + 6.2 * Math.sqrt(deg / maxDeg)) * p.s;
    const on = sel === n.id, near = touch.has(n.id);
    // 标签策略：前景(s>0.95) 或 选中/邻接 或 高度数节点才显示 —— 否则 100+ 标签互相压
    const showLabel = on || near || (p.s > 0.98 && deg >= Math.max(2, maxDeg * 0.12))
      || (model.labelAll && p.s > 0.9);
    const fill = on ? "var(--primary)"
      : n.kind === "external" ? "var(--card)"
      : n.kind === "internal" ? "var(--primary-l)" : "var(--alt)";
    return `<g class="g3n" data-nid="${esc(n.id)}" style="cursor:pointer">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"
        fill="${fill}" stroke="${on || near ? "var(--primary)" : "var(--line2)"}"
        stroke-width="${on ? 2 : 1}" ${n.kind === "external" ? 'stroke-dasharray="2 2"' : ""}
        opacity="${sel && !on && !near ? .35 : .95}"/>
      ${showLabel ? `<text x="${(p.x + r + 3).toFixed(1)}" y="${(p.y + 3.4).toFixed(1)}"
        style="font-size:${(10.5 * Math.min(1.25, p.s)).toFixed(1)}px;fill:${
        on ? "var(--primary)" : "var(--fg2)"};pointer-events:none">${
        esc(_gCut(n.name || n.id, 14))}</text>` : ""}
      <title>${esc(n.name || n.id)}${n.docno ? "\n" + esc(n.docno) : ""}${
        n.degree ? "\n关联 " + num(n.degree) + " 条" : ""}\n点击聚焦</title></g>`;
  }).join("");

  return `<g>${edgeSvg}</g><g>${nodeSvg}</g>`;
}

/*: 容器（含操作提示与"重置视角"）—— 图例由调用方给 */
function g3dBox(key, model, W, H, hint){
  G3D_MODEL[key] = model;
  if(!G3D_ST[key]) G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""};
  return `<div class="g3wrap" data-g3key="${esc(key)}">
      ${_g3dSvg(key, W, H)}
      <div class="g3bar">
        <span class="muted">${hint || "拖拽旋转 · 滚轮缩放 · 点节点聚焦"}</span>
        <span style="flex:1"></span>
        <button class="link" data-g3reset="${esc(key)}">重置视角</button>
      </div>
    </div>`;
}

/*: 绑定拖拽/缩放/点选（**幂等**：每次渲染后调用一次即可） */
/*: 左侧栏折叠（顶栏按钮 / Ctrl+B）；状态存 localStorage。 */
function syncRailToggle(){
  const b = $("#railToggle");
  const off = document.body.classList.contains("rail-off");
  if (b) {
    b.setAttribute("aria-expanded", off ? "false" : "true");
    b.setAttribute("aria-label", off ? "展开侧边栏" : "折叠侧边栏");
    b.title = (off ? "展开侧边栏" : "折叠侧边栏") + "（Ctrl+B）";
    b.innerHTML = `<span class="rt-ico">${ico(off ? "sidebar-expand" : "sidebar-collapse", 16)}</span>`
      + `<span class="rt-txt">${off ? "展开" : "折叠"}</span>`;
  }
}

function bindRailToggle(){
  const saved = (typeof localStorage !== "undefined") ? localStorage.getItem("rail") : "";
  if (saved === "off") document.body.classList.add("rail-off");
  const toggle = () => {
    const off = document.body.classList.toggle("rail-off");
    document.body.classList.toggle("rail-open", !off && window.innerWidth < 1024);
    try { localStorage.setItem("rail", off ? "off" : "on"); } catch (e) { /* 隐私模式 */ }
    syncRailToggle();
  };
  document.addEventListener("click", (ev) => {
    const t = ev.target && ev.target.closest ? ev.target.closest("#railToggle") : null;
    if (!t) return;
    ev.preventDefault();
    toggle();
  });
  document.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && String(ev.key).toLowerCase() === "b") {
      ev.preventDefault();
      toggle();
    }
  });
}

/*: 图谱下方的关系列表（与列表页同构：.lv 容器 + 行；末尾多一列「引用次数」）
 *
 * 联动方向：图里点节点 → 列表只剩与该节点相关的行；点列表行 → 图里选中该节点。
 * 两边共享 `G3D_ST[key].sel`，不新增状态。 */
function _gEdgeTable(key, edges, nameOf, countOf){
  const es = arr(edges);
  if (!es.length) return "";
  const inDeg = {};
  es.forEach(e => { const to = e.to != null ? e.to : e.ref; inDeg[to] = (inDeg[to] || 0) + 1; });
  const rows = es.map((e, i) => {
    const from = e.from != null ? e.from : e.theme;
    const to = e.to != null ? e.to : e.ref;
    return {i, from, to, label: e.label || e.relation || "",
            count: countOf ? countOf(e) : (inDeg[to] || 1)};
  });
  const body = rows.map(r => `<div class="lv-row" data-grow="${esc(key)}"
      data-gfrom="${esc(r.from)}" data-gto="${esc(r.to)}">
      <span class="lv-cell"><span class="lv-title" style="font-size:14px;font-weight:500">${esc(nameOf(r.from))}</span></span>
      <span class="lv-cell"><span class="Label">${esc(r.label || "—")}</span></span>
      <span class="lv-cell">${esc(nameOf(r.to))}</span>
      <span class="lv-cell mono" style="text-align:right">${num(r.count)}</span>
    </div>`).join("");
  return `<div class="lv lv-gtable" style="margin-top:var(--s3)" data-gtable="${esc(key)}">
      <div class="lv-scroll"><div class="lv-grid"
        style="--cols:minmax(0,1.2fr) 90px minmax(0,1.2fr) 96px">${body}</div></div></div>`;
}

/*: 按当前选中节点过滤列表（图 → 列表） */
function syncGraphTable(key){
  const sel = String(obj(G3D_ST[key]).sel || "");
  $$(`[data-gtable="${key}"] .lv-row`).forEach(tr => {
    const hit = !sel || tr.dataset.gfrom === sel || tr.dataset.gto === sel;
    tr.hidden = !hit;
  });
}

/*: 列表行 → 图（点行即选中该节点并重绘） */
function bindGraphRows(){
  document.addEventListener("click", (ev) => {
    const tr = ev.target && ev.target.closest ? ev.target.closest("[data-grow]") : null;
    if (!tr) return;
    const key = tr.dataset.grow;
    const st = G3D_ST[key];
    if (!st) return;
    st.sel = st.sel === tr.dataset.gto ? "" : tr.dataset.gto;
    const svg = document.querySelector(`[data-g3key="${key}"] .g3svg`);
    if (svg) svg.innerHTML = _g3dInner(key, 1040, 620);
    syncGraphTable(key);
  }, true);
}

function bindG3d(){
  const v = $("#view");
  if(!v) return;
  $$("[data-g3key]", v).forEach(wrap => {
    const key = wrap.dataset.g3key;
    const svg = $(".g3svg", wrap);
    if(!svg || svg.dataset.bound === "1") return;
    svg.dataset.bound = "1";
    const W = 1040, H = 620;
    let drag = null;
    const redraw = () => {
      // 只换内容，不换 svg 元素（否则 pointer 监听丢失 → "转一下就死住"）
      svg.innerHTML = _g3dInner(key, W, H);
    };
    const onDown = (ev) => {
      drag = {x: ev.clientX, y: ev.clientY, moved: 0,
              yaw: G3D_ST[key].yaw, pitch: G3D_ST[key].pitch};
      svg.setPointerCapture && svg.setPointerCapture(ev.pointerId);
    };
    const onMove = (ev) => {
      if(!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
      G3D_ST[key].yaw = drag.yaw + dx * 0.008;
      G3D_ST[key].pitch = Math.max(-1.35, Math.min(1.35, drag.pitch + dy * 0.006));
      if(!drag.raf){
        drag.raf = requestAnimationFrame(() => { drag.raf = 0; redraw(); });
      }
    };
    /* 点选**不能**依赖节点上的 click 监听：
     * `setPointerCapture` 之后，浏览器把后续 pointer 事件重定向到 svg，
     * 合成的 `click` 的 target 也变成 svg 本身（不是被点的 `<g>`）⇒ 节点监听永不触发。
     * 这正是"点节点聚焦失效"的根因（上一版重绑 dataset 标记只是缓解，不是根治）。
     * 正解：在 pointerup 里按**坐标**命中元素（moved 很小才算点击，避免拖拽误触）。
     */
    const pickAt = (ev) => {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const g = el && el.closest ? el.closest(".g3n") : null;
      if (!g) return false;
      const id = g.dataset.nid || "";
      const st = G3D_ST[key];
      st.sel = (st.sel === id) ? "" : id;
      syncGraphTable(key);      /* 图 → 列表联动 */
      const m = G3D_MODEL[key] || {};
      if (typeof m.pick === "function") { m.pick(st.sel); return true; }
      svg.innerHTML = _g3dInner(key, W, H);
      return true;
    };
    const onUp = (ev) => {
      const d = drag;
      drag = null;
      if (!d) return;
      if (d.moved <= 6 && ev && ev.clientX != null) {
        try { pickAt(ev); } catch (e) { /* 命中失败不该影响拖拽 */ }
      }
    };
    svg.addEventListener("pointerdown", onDown);
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerup", onUp);
    svg.addEventListener("pointerleave", onUp);
    svg.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      G3D_ST[key].zoom = Math.max(0.45, Math.min(3, G3D_ST[key].zoom *
        (ev.deltaY > 0 ? 0.92 : 1.08)));
      redraw();
    }, {passive: false});
  });
  $$("[data-g3reset]", v).forEach(b => {
    b.onclick = () => {
      const key = b.dataset.g3reset;
      G3D_ST[key] = {yaw: -0.55, pitch: 0.32, zoom: 1, sel: ""};
      render();
    };
  });
}

/*: 视图 ⑥ 局部图（点节点进入）：中心 + 一跳邻居，3D 球 */
function _gEgo(d){
  const nodes0 = arr(d.nodes), edges0 = arr(d.edges), c = obj(d.counts);
  const center = obj(d.center);
  if(!nodes0.length) return '<div class="note">该文件没有可画的关系。</div>';
  const deg = {};
  edges0.forEach(e => {
    deg[e.from] = (deg[e.from] || 0) + 1;
    deg[e.to] = (deg[e.to] || 0) + 1;
  });
  const nodes = nodes0.map(x => ({
    id: x.id, name: x.name || x.id, docno: x.docno,
    kind: x.external ? "external" : (x.kind || "regulatory"),
    group: x.id === center.id ? "center" : (x.kind === "internal" ? "internal" : "regulatory"),
    degree: deg[x.id] || 1,
  }));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "", external: !!e.external,
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("节点", num(nodes0.length), "个")}
      ${kpi("关系", num(edges0.length), "条")}
      ${kpi("依据", num(c.basis), "条", "ok")}
      ${kpi("废止", num(c.repeal), "条", c.repeal ? "bad" : "")}
      ${kpi("指向外部", num(c.external), "条", c.external ? "warn" : "")}
    </div>
    ${g3dBox("graph.ego." + String(center.id || ""), {nodes, edges, labelAll: true},
             1040, 600)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>中心文件</span>
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--alt)"></i>监管文件</span>
      <span><i style="background:var(--bad)"></i>废止</span>
    </div>`;
}

function viewGraphGlobal(d){
  const cur = (obj(STATE.graph).view) || "overview";
  const body = cur === "internal_to_regulatory" ? _gBipartite(d)
    : cur === "regulatory_to_regulatory" ? _gRegulatory(d)
    : cur === "internal_to_internal" ? _gInternal(d)
    : cur === "theme" ? _gTheme(d)
    : cur === "external" ? _gExternal(d)
    : _gOverview(d);
  const uv = obj(obj(d.counts).unresolved_by_view);
  const items = GRAPH_VIEWS.map(v => ({
    key: v.key, label: v.name,
    count: v.key === "external" ? obj(d.external).total
      : (obj(uv[v.key]).entity != null ? obj(uv[v.key]).entity : undefined),
    title: v.name + " · 数字为已定位条数",
  }));
  return card("", "全局", sideShell("graph", items, cur, body, "视图"),
    d.source_name || "relations_api.global_graph", d.fetched_at);
}

/*: 视图 ⑤：外部法规（语料外，独立键空间 `RFN-EXT-*`）
 *
 * 呈现选择：**排行榜**而不是关系图 ——
 *   · 这些目标没有"出边"（它们不引用别人），画成图会得到一堆孤立点；
 *   · 读者真正想知道的是"我们的文件最常依据哪几部法"，这是一张榜能答的。
 * 诚实标注：编号 `RFN-EXT-*` + 「语料外」标记 + 顶部一句话说明"库里没有原文"。 */
function _gExternal(d){
  const g = obj(d.external), nodes = arr(g.nodes), c = obj(d.counts);
  const by = obj(g.by_guise), lbl = obj(g.guise_labels);
  const maxDeg = Math.max(1, ...nodes.map(n => Number(n.degree) || 0));
  const rows = nodes.map(n => `<tr>
      <td class="mono">${esc(n.id)}</td>
      <td class="ttl">${esc(n.name || "")}</td>
      <td class="mono">${esc(n.docno || "—")}</td>
      <td><span class="Label">${esc(n.guise_label || "未分类")}</span></td>
      <td style="min-width:120px">
        <div class="bar" style="width:${Math.max(4, Math.round(n.degree / maxDeg * 100))}%"></div>
      </td>
      <td class="mono">${num(n.degree)}</td></tr>`).join("")
    || '<tr><td colspan="6" class="muted">尚未生成外部权威表（运行 tools/build_external_authority.py）</td></tr>';
  const chips = Object.keys(by).map(k =>
    `<span class="Label">${esc(lbl[k] || k)} ${num(by[k])}</span>`).join(" ");
  return `<div class="note" style="margin-bottom:8px">
      外部法规是**语料外**文件（国家法律 / 行政法规 / 部委规章 / 制度历史版本）的登记键空间：
      编号 <code>RFN-EXT-*</code> 表示「被引用过、已登记」，<b>不代表库里能打开这份文件</b>。
      需要原文请按名称/文号在「政策法规」或官网检索。</div>
    <div class="kpibar" style="margin-bottom:var(--s3)">
      ${kpi("外部法规", num(c.external_total), "条")}
      ${kpi("覆盖关系", num(c.external_evidence), "条")}
      ${kpi("归属率（含外部）", `${(Number(c.attributed_ratio || 0) * 100).toFixed(1)}%`, "",
            Number(c.attributed_ratio) >= 0.8 ? "ok" : "warn")}
    </div>
    <div style="margin-bottom:var(--s3)">${chips}</div>
    <div class="lv lv-gtable"><div class="lv-scroll"><div class="lv-grid" style="--cols:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">${rows}</div></div></div>
    <div class="muted" style="margin-top:var(--s2)">${esc(g.note || "")}</div>`;
}

function _gOverview(d){
  const c = obj(d.counts), vs = arr(d.views), uv = obj(c.unresolved_by_view);
  const cards = vs.map((v, i) => {
    const b = obj(uv[v.key]);
    /* 四桶（2026-10-23 扩）：entity / corpus / organ / external。
     * 之前把 corpus+external 混成"未定位"，读者会把"可补登记"误当成"没法修"。 */
    const bucketBar = v.key === "external"
      ? `<div class="kpibar" style="margin:8px 0">
           ${kpi("外部法规", num(obj(d.external).total), "条")}
           ${kpi("覆盖关系", num(obj(d.external).evidence), "条")}
         </div>`
      : `<div class="kpibar" style="margin:8px 0">
           ${kpi("已定位实体", num(b.entity), "条", b.entity ? "ok" : "")}
           ${kpi("语料内待补登记", num(b.corpus), "条", b.corpus ? "warn" : "")}
           ${kpi("语料外（已登记）", num(b.external), "条", "")}
           ${kpi("机关名（非文件）", num(b.organ), "条", "")}
         </div>`;
    return `<div class="gcard" data-gview="${esc(v.key)}">
      <div class="gcard-h"><b>${esc(v.label)}</b>
        <span class="Label">${num(v.total)} 条</span></div>
      ${bucketBar}
      <div class="muted" style="font-size:12px">${esc(v.note || "")}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">
        本视图绘制 ${num(v.edges)} 条边 / ${num(v.nodes)} 个节点 ⇒ 点击展开</div>
    </div>`;
  }).join("");
  const ratio = (x) => `${(Number(x || 0) * 100).toFixed(1)}%`;
  return `<div class="kpibar" style="margin-bottom:var(--s3)">
      ${kpi("关系总数", num(c.total_relations), "条")}
      ${kpi("文件类定位率", ratio(c.file_resolved_ratio), "",
            Number(c.file_resolved_ratio) >= 0.5 ? "ok" : "warn")}
      ${kpi("文件类可达率", ratio(c.file_located_ratio), "")}
      ${kpi("分母（剔除机关名）", num(c.file_denominator), "条")}
    </div>
    <div class="muted" style="margin-bottom:var(--s3)">${esc(d.note || "")}</div>
    <div class="ggrid">${cards}</div>`;
}

/*: 视图 ①「制度 → 监管」：3D 二部球（左簇=公司制度，右簇=监管/外部法规）
 *
 * 全画不抽样：可定位 cross 关系实测 100 条、双方各 80+ 节点 —— 这个规模下单层
 * 2D 二部图已经开始互相压字，转到 3D 球面就能分开。
 */
function _gBipartite(d){
  const bp = obj(d.bipartite), c = obj(d.counts);
  const L = arr(bp.left), R = arr(bp.right), E = arr(bp.edges);
  const nExt = R.filter(x => x.external).length;
  if(!E.length) return '<div class="note">当前没有可定位的「制度→监管」关系。</div>';
  const degL = {}, degR = {};
  E.forEach(e => {
    degL[e.from] = (degL[e.from] || 0) + 1;
    degR[e.to] = (degR[e.to] || 0) + 1;
  });
  const nodes = L.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                             kind: "internal", group: "internal",
                             degree: degL[x.id] || 1}))
    .concat(R.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                         kind: x.external ? "external" : "regulatory",
                         group: "regulatory", degree: degR[x.id] || 1})));
  const edges = E.map(e => ({
    from: e.from, to: e.to, label: e.label || e.relation,
    title: (e.label || e.relation) + (e.matched_by ? "（" + e.matched_by + "）" : ""),
    external: !!e.external,
    color: e.relation === "repeal" ? "var(--bad)" : "var(--primary)",
  }));
  const uv = obj(obj(c.unresolved_by_view).internal_to_regulatory);
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("制度", num(L.length), "份")}
      ${kpi("监管文件", num(R.length - nExt), "份")}
      ${kpi("外部法规", num(nExt), "份", nExt ? "warn" : "")}
      ${kpi("关系", num(E.length), "条")}
    </div>
    ${g3dBox("graph.bipartite", {nodes, edges}, 1040, 620)}
    ${_gEdgeTable("graph.bipartite", E,
      (id) => ((L.concat(R)).find(x => x.id === id) || {}).name || id)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--alt)"></i>监管文件</span>
      <span><i style="background:var(--card);border:1px dashed var(--line2)"></i>外部法规（语料外）</span>
      <span><i style="background:var(--bad)"></i>废止（虚线）</span>
      <span class="muted">语料内待补登记 ${num(uv.corpus)} 条未入图（可补 RFN）；
        目标为机关名的已在抽取层排除（不是文件）</span>
    </div>`;
}

/*: 视图 ②「监管 ↔ 监管」：枢纽球（节点大小=被引次数，枢纽间直连边照画） */
function _gRegulatory(d){
  const g = obj(d.regulatory), nodes0 = arr(g.nodes), edges0 = arr(g.edges);
  if(!nodes0.length) return '<div class="note">暂无监管↔监管关系。</div>';
  const nodes = nodes0.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                                  kind: "regulatory", group: "reg",
                                  degree: Number(x.degree) || 1}));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "",
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  const top = nodes0.slice().sort((a, b) => (b.degree || 0) - (a.degree || 0)).slice(0, 10);
  const nBasis = edges0.filter(e => e.relation !== "repeal").length;
  const nRepeal = edges0.length - nBasis;
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("枢纽文件", num(nodes0.length), "份")}
      ${kpi("全库关系", num(g.total_edges), "条")}
      ${kpi("图上直连", num(edges0.length), "条")}
      ${kpi("依据", num(nBasis), "条", "ok")}
      ${kpi("废止", num(nRepeal), "条", nRepeal ? "bad" : "")}
    </div>
    <div class="muted" style="margin-bottom:var(--s2)">
      枢纽 ${num(nodes0.length)} 个 / 图上直连边 ${num(edges0.length)} 条（全库监管↔监管
      ${num(g.total_edges)} 条）。绝大多数关系是"各自依据同一部上位法"，故用
      **节点大小=被引次数**表达；枢纽之间真正互引的边照画。</div>
    ${g3dBox("graph.regulatory", {nodes, edges}, 1040, 620)}
    <h3 style="margin:var(--s3) 0 var(--s2)"><span>枢纽 Top 10</span>
      <span class="hint">球面大小 = 被依据次数</span></h3>
    <div class="lv lv-gtable"><div class="lv-scroll"><div class="lv-grid" style="--cols:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)">
      ${top.map(x => `<div class="lv-row"><span class="lv-cell" class="ttl">${esc(x.name || x.id)}</span>
        <span class="lv-cell" class="mono">${esc(x.docno || "—")}</span>
        <span class="lv-cell" class="mono">${num(x.degree)}</span></div>`).join("")}</div></div></div>`;
}

/*: 视图 ③「制度 ↔ 制度」：当前 24/24 全可定位，整张球面画出来 */
function _gInternal(d){
  const g = obj(d.internal), nodes0 = arr(g.nodes), edges0 = arr(g.edges);
  if(!nodes0.length) return '<div class="note">暂无制度↔制度关系。</div>';
  const deg = {};
  edges0.forEach(e => {
    deg[e.from] = (deg[e.from] || 0) + 1;
    deg[e.to] = (deg[e.to] || 0) + 1;
  });
  const nodes = nodes0.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                                  kind: x.external ? "external" : "internal",
                                  group: x.external ? "ext" : "int",
                                  degree: deg[x.id] || 1}));
  const edges = edges0.map(e => ({from: e.from, to: e.to, label: e.label,
                                  title: e.label || "", external: !!e.external,
                                  color: e.relation === "repeal"
                                    ? "var(--bad)" : "var(--primary)"}));
  const nBasis = edges0.filter(e => e.relation !== "repeal").length;
  const nRepeal = edges0.length - nBasis;
  const nExt = nodes0.filter(x => x.external).length;
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("制度文件", num(nodes0.length), "份")}
      ${kpi("关系", num(edges0.length), "条")}
      ${kpi("依据", num(nBasis), "条", "ok")}
      ${kpi("废止", num(nRepeal), "条", nRepeal ? "bad" : "")}
      ${kpi("指向库外", num(nExt), "份", nExt ? "warn" : "")}
    </div>
    <div class="muted" style="margin-bottom:var(--s2)">
      制度文件 ${num(nodes0.length)} 份 / 关系 ${num(edges0.length)} 条
      （当前**全部可定位**，没有"指向库外旧版本"的悬空边）。</div>
    ${g3dBox("graph.internal", {nodes, edges, labelAll: true}, 1040, 620)}
    ${_gEdgeTable("graph.internal", edges0,
      (id) => (nodes0.find(x => x.id === id) || {}).name || id)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary-l)"></i>公司制度</span>
      <span><i style="background:var(--bad)"></i>废止</span>
    </div>`;
}

/*: 视图 ④「主题关系」：11 主题 × 被引文件（二部球） */
function _gTheme(d){
  const g = obj(d.theme), ths = arr(g.themes), docs = arr(g.docs), es = arr(g.edges);
  if(!ths.length) return '<div class="note">暂无主题关系（主题只对入册文件打标）。</div>';
  const cnt = {};
  es.forEach(e => { cnt[e.ref] = (cnt[e.ref] || 0) + 1; });
  const nodes = ths.map(x => ({id: "T:" + x.code, name: x.label || x.code,
                               kind: "theme", group: "theme",
                               degree: es.filter(e => e.theme === x.code).length || 1}))
    .concat(docs.map(x => ({id: x.id, name: x.name || x.id, docno: x.docno,
                            kind: "regulatory", group: "doc",
                            degree: cnt[x.id] || 1})));
  const edges = es.map(e => ({
    from: "T:" + e.theme, to: e.ref, label: e.label || "",
    title: (e.label || "") + (e.count ? "（" + e.count + " 份引用）" : ""),
    color: "var(--alt)",
  }));
  const nDocs = new Set(es.map(e => e.ref)).size;
  return `<div class="kpibar" style="margin-bottom:var(--s2)">
      ${kpi("主题", num(ths.length), "个")}
      ${kpi("有关联文件", num(nDocs), "份")}
      ${kpi("主题边", num(es.length), "条")}
    </div>
    <div class="muted" style="margin-bottom:var(--s2)">
      ${num(ths.length)} 个主题 / ${num(docs.length)} 份被引监管文件 / ${num(es.length)} 条主题边。
      主题只对**入册**文件打标（覆盖率和主题口径见「治理审计」页）。</div>
    ${g3dBox("graph.theme", {nodes, edges, labelAll: true}, 1040, 620)}
    ${_gEdgeTable("graph.theme", es,
      (id) => id.startsWith("T:")
        ? ((ths.find(x => "T:" + x.code === id) || {}).label || id.slice(2))
        : ((docs.find(x => x.id === id) || {}).name || id),
      (e) => e.count)}
    <div class="glegend" style="margin-top:var(--s2)">
      <span><i style="background:var(--primary)"></i>主题</span>
      <span><i style="background:var(--alt)"></i>被引监管文件</span>
    </div>`;
}

function viewGraph(d){
  if (!d || d.available === false) return unavail(obj(d), "关系图谱");
  if (d.mode === "global") return viewGraphGlobal(d);   // 无中心 ⇒ 全局视图
  /* 局部图也要有左栏：否则内容区突然变宽、且左上角少了返回路径（破坏三段式的稳定感）。 */
  railSet("视图", [{side: "graph", skey: "overview", label: "← 回到全局视图"}], "");
  const nodes = arr(d.nodes), edges = arr(d.edges), center = obj(d.center);
  const c = obj(d.counts);
  const head = `<div class="toolbar">
    <button class="link" id="gback" title="回到全局视图">← 全局视图</button>
    <span class="Label">${esc(center.kind_label || "中心")}</span>
    <b>${esc(center.name || d.ref)}</b>
    <span class="mono">${esc(d.ref)}</span>
    <span class="muted">${esc(center.docno || "")}</span>
    <span class="muted">出 ${num(c.out)} · 入 ${num(c.in)} ·
      依据 ${num(c.basis)} · 废止 ${num(c.repeal)}</span>
    ${c.external ? `<span class="Label">其中 ${num(c.external)} 条指向语料外法规（点线）</span>` : ""}
    ${c.weak_skipped ? `<span class="Label">已隐藏 ${num(c.weak_skipped)} 条弱线索（未登记 RFN）</span>` : ""}
    ${c.organ_skipped ? `<span class="Label">已忽略 ${num(c.organ_skipped)} 条机关名（不是文件）</span>` : ""}
    ${c.truncated ? '<span class="Label">结果已截断（上限 200 条）</span>' : ""}
  </div>`;
  if (!edges.length) {
    /* 空图分两种，"暂无关系"这个说法只对第一种成立（2026-10-23 补）：
     *   · 真的没有关系；
     *   · **有关系，但对方未登记 RFN**（只有 `dst_key`）⇒ 画不出节点，默认过滤掉。
     * 全库实测 4197 条关系里有 2462 条（58.6%）属于后者。若一律显示"暂无"，
     * 读者会以为"这份文件没有依据关系"，而事实是"关系存在、只是没能定位到具体文件"。
     * 所以这里**把过滤掉的条数说清楚**，并给出可操作建议（补登记 RFN 后即可上图）。 */
    const weak = Number(c.weak_skipped) || 0;
    const note = weak
      ? `<div class="pill warn">⚠ 有 ${num(weak)} 条关系指向<b>未登记文件</b>，故未画图</div>
         <div class="note">这些关系的对方只有「文号 / 标题线索」，尚未登记为 RFN，
         无法作为图节点定位（不会把它们伪造成"已定位"）。</div>
         <div class="muted">处置：先在归属表补登记对方文件（生成 RFN），再回到本页查看。</div>`
      : '<div class="note">该文件暂无「依据 / 废止」关系记录。</div>';
    return card("", esc(d.ref), head + note,
      d.source_name || "relations_api.ego", d.fetched_at);
  }
    /* 2026-10-26：绘图改 3D（`_gEgo`）。局部图常见 20~60 个邻居，
   * 2D 圆周布局在 30+ 时会挤成一圈字；3D 簇状球更好分辨。 */
  return card("", esc(d.ref),
    head + _gEgo(d), d.source_name || "relations_api.ego", d.fetched_at);
}
