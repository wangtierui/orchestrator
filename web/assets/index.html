<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监管合规编排器 · 本地确认台</title>
<!-- 零 CDN / 零构建：原生 JS + CSS + 手绘 SVG（§8.4 纪律）。 -->
<style>
/* ============================================================
 * 设计令牌（2026-10-22 第一百零九批重设计）
 * 参照 idataserch.com 的 B2B 信息型语法：**浅底白卡 + 深蓝主色 + 数字背书**。
 * 为什么换成浅色：确认台是"每天要读数字"的工作台，浅底白卡在长时间阅读、
 * 打印/截图归档、以及和 Excel/公文并排时都更稳（深色系在投影与外发截图里会失真）。
 * 令牌全部集中在此，页面里不写死色值/圆角/间距 —— 改主题只改这一处。
 * ============================================================ */
:root{
  --primary:#1A5FB4; --primary-h:#144A8F; --primary-l:#E8F1FB;
  --accent:#2F7CF6; --ai:#6C5CE7;
  --ok:#12855A; --ok-l:#E6F6EF; --warn:#B26A00; --warn-l:#FFF6E5;
  --bad:#C0392B; --bad-l:#FDECEA;
  --fg:#1D2129; --fg2:#4E5969; --fg3:#86909C; --fg4:#C9CDD4;
  --bg:#F7F8FA; --card:#FFFFFF; --alt:#F2F4F7;
  --line:#E5E6EB; --line2:#D0D5DD;
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow:0 1px 2px rgba(29,33,41,.04), 0 2px 8px rgba(29,33,41,.06);
  --shadow-h:0 4px 16px rgba(29,33,41,.10);
  --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:var(--s4);padding:10px var(--s5);max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));
  display:inline-block}
.brand small{font-weight:400;color:var(--fg3);font-size:12px;margin-left:2px}
.hstat{display:flex;gap:var(--s2);align-items:center;margin-left:auto;flex-wrap:wrap}
.badge{font-size:12px;color:var(--fg2);border:1px solid var(--line);background:var(--alt);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.badge.live{color:var(--ok);background:var(--ok-l);border-color:#BFE6D6}
.badge.off{color:var(--warn);background:var(--warn-l);border-color:#F0DCB4}
.badge.bad{color:var(--bad);background:var(--bad-l);border-color:#F3C9C2}

/* ---------- 页签 ---------- */
nav{background:#fff;border-bottom:1px solid var(--line)}
.nwrap{display:flex;gap:var(--s1);padding:0 var(--s5);max-width:1560px;margin:0 auto;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--fg2);
  padding:11px 14px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap}
nav button:hover{color:var(--fg);background:var(--alt)}
nav button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

main{max-width:1560px;margin:0 auto;padding:var(--s5)}

/* ---------- 卡片 ---------- */
.grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);box-shadow:var(--shadow)}
.card>h3{margin:0 0 var(--s3);font-size:15px;font-weight:600;display:flex;
  justify-content:space-between;align-items:baseline;gap:var(--s2)}
.card>h3 .hint{font-size:12px;color:var(--fg3);font-weight:400}
.card .src{margin-top:var(--s3);padding-top:var(--s2);border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--fg3)}
.section{margin:var(--s6) 0 var(--s3);display:flex;align-items:baseline;gap:var(--s3)}
.section h2{margin:0;font-size:19px;font-weight:600}
.section .desc{color:var(--fg3);font-size:13px}
.section .no{font-family:var(--mono);color:var(--primary);font-weight:700}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .u{font-size:13px;color:var(--fg3);font-weight:400;margin-left:4px}
.kpi .l{font-size:12.5px;color:var(--fg2)}
.kpibar{display:flex;gap:var(--s4);flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:5px 0;
  border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--fg2)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ---------- 状态色 ---------- */
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--fg3)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;
  border:1px solid var(--line2);background:var(--alt);color:var(--fg2);white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-l);border-color:#BFE6D6}
.pill.warn{color:var(--warn);background:var(--warn-l);border-color:#F0DCB4}
.pill.bad{color:var(--bad);background:var(--bad-l);border-color:#F3C9C2}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg2);font-weight:600;background:var(--alt);position:sticky;top:0;z-index:1;
  font-size:12.5px;white-space:nowrap}
tbody tr:hover td{background:#FAFBFC}
td.num{font-variant-numeric:tabular-nums;text-align:right}
td.id{font-family:var(--mono);font-size:12px;color:var(--fg2);word-break:break-all}
.tblwrap{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.trunc{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.detail>td{background:var(--primary-l);border-bottom:1px solid var(--line2)}

/* ---------- 控件 ---------- */
input,select,textarea{font:inherit;background:#fff;color:var(--fg);border:1px solid var(--line2);
  border-radius:var(--r-md);padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-l);border-color:var(--primary)}
textarea{width:100%;min-height:60px;resize:vertical}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
button.act{font:inherit;font-weight:500;cursor:pointer;border-radius:var(--r-md);
  border:1px solid var(--primary);background:var(--primary);color:#fff;padding:7px 14px}
button.act:hover{background:var(--primary-h)}
button.act.ghost{background:#fff;color:var(--primary);border-color:var(--line2)}
button.act.ghost:hover{background:var(--primary-l);border-color:var(--primary)}
button.link{background:none;border:0;color:var(--primary);cursor:pointer;font:inherit;padding:0}
button.link:hover{text-decoration:underline}
button[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- 条形（用 flex 而非 SVG：从结构上消灭"标签溢出画布"） ---------- */
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:minmax(88px,150px) 1fr 96px;gap:var(--s2);align-items:center;
  font-size:12.5px}
.brow .bl{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{background:var(--alt);border-radius:var(--r-sm);height:16px;position:relative;overflow:hidden}
.brow .bf{height:100%;border-radius:var(--r-sm);transition:width .25s}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
.note{font-size:11.5px;color:var(--fg3);margin-top:var(--s2)}

/* ---------- 图例/工具条 ---------- */
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s3);font-size:11.5px;color:var(--fg3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toolbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3)}
.toast{position:fixed;right:var(--s5);bottom:var(--s5);background:var(--fg);color:#fff;
  border-radius:var(--r-md);padding:10px 14px;font-size:13px;opacity:0;transform:translateY(6px);
  transition:all .2s;z-index:50;max-width:min(520px,90vw);pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad)}
pre{background:var(--alt);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;
  overflow:auto;font-size:12px;max-height:280px;font-family:var(--mono)}
details>summary{cursor:pointer;color:var(--primary);font-size:13px}
.foot{color:var(--fg3);font-size:11.5px;text-align:center;padding:var(--s6) 0 var(--s3)}
.scrollx{overflow-x:auto;padding-bottom:var(--s2)}
/* ---------- 政策法规 / 公司制度：可筛选 + 可排序的表头（2026-10-23） ---------- */
/* 两行表头：第一行筛选控件、第二行列名（点击排序）。
 * 为什么不做"一个搜索框搜全部"：用户明确要求"表头可筛选"，逐列筛才能表达
 * "只看 mof 的已废止"这种组合意图；而排序指示（▴/▾）必须与列名同格，否则
 * 读者不知道当前是按哪一列排的。 */
tr.filters th{padding:4px 6px;background:var(--card);position:static;border-bottom:1px solid var(--line)}
tr.filters input,tr.filters select{width:100%;font-size:12px;padding:4px 6px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--fg)}
tr.filters input:focus,tr.filters select:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 2px var(--primary-l)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover,th.sortable.on{color:var(--primary)}
th.sortable .arw{font-size:10px;opacity:.85}
.pager{display:flex;gap:var(--s3);align-items:center;justify-content:flex-end;
  margin-top:var(--s3);font-size:13px;color:var(--fg2)}
.pager button{padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r-sm);
  background:var(--card);cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
  border:1px solid var(--line);background:var(--alt);color:var(--fg2);white-space:nowrap}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--fg2)}
.ttl{max-width:420px}
/* ---------- 关系图谱 ---------- */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
.gnode{cursor:pointer}
.gnode:hover circle{stroke:var(--primary);stroke-width:2.5}
.gnode text{font-size:11px;fill:var(--fg2);paint-order:stroke;stroke:var(--card);
  stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.glegend{display:flex;gap:var(--s4);font-size:12px;color:var(--fg2);margin:var(--s2) 0}
.glegend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
.brand .logo{width:20px;height:20px;fill:currentColor;margin-right:8px;opacity:.92;flex:none}
/* ---------- 关系图谱：四视图切换 + 全览卡片 ---------- */
.gtabs{gap:var(--s1);margin-bottom:var(--s3)}
.gbtn{padding:5px 12px;border:1px solid var(--line2);background:var(--card);
  border-radius:999px;cursor:pointer;font-size:13px;color:var(--fg2)}
.gbtn:hover{border-color:var(--primary);color:var(--primary)}
.gbtn.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3)}
.gcard{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  background:var(--card);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.gcard:hover{border-color:var(--primary);box-shadow:var(--shadow-h)}
.gcard-h{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.gnode text{pointer-events:none}
/* ---------- EAST 数据结构：左表右项（2026-10-26） ---------- */
.eastwrap{display:grid;grid-template-columns:300px 1fr;gap:var(--s3);align-items:start}
@media (max-width:900px){.eastwrap{grid-template-columns:1fr}}
.eastleft{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2);background:var(--card)}
.eastright{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);background:var(--card);min-width:0}
.echips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;max-height:96px;overflow:auto}
.echips .gbtn{font-size:11.5px;padding:2px 8px}
.elist{display:flex;flex-direction:column;gap:2px;max-height:460px;overflow:auto}
.etbl{display:grid;grid-template-columns:1fr auto;grid-auto-rows:auto;gap:0 6px;
  text-align:left;padding:5px 8px;border:1px solid transparent;border-radius:var(--r-sm);
  background:none;cursor:pointer;font-size:12.5px;color:var(--fg)}
.etbl .code{font-family:var(--mono);font-size:11px;color:var(--fg2);grid-column:1}
.etbl .nm{grid-column:1;font-size:12.5px}
.etbl .cnt{grid-column:2;grid-row:1/span 2;align-self:center;font-family:var(--mono);
  font-size:11px;color:var(--fg3)}
.etbl:hover{background:var(--alt)}
.etbl.on{background:var(--primary-l);border-color:var(--primary)}

/*: 3D 关系图容器（2026-10-26）：SVG 拖拽旋转 + 底部操作条 */
.g3wrap{border:1px solid var(--line);border-radius:10px;background:
  radial-gradient(circle at 50% 45%, var(--card), var(--bg) 78%);overflow:hidden}
.g3svg{touch-action:none;cursor:grab;display:block}
.g3svg:active{cursor:grabbing}
.g3bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);
  font-size:12px;background:var(--card)}
.g3n circle{transition:r .12s}

/*: 左侧标签栏（2026-10-27，参照 GitHub Issues 双栏布局）
 * 为什么不是顶部页签：页签多了横向挤，而且"第二维"（主题/kind/节点/日期）
 * 没有地方放 —— 放左边才像目录，放上面只能再排一行筛选器。 */
.sidewrap{display:grid;grid-template-columns:212px minmax(0,1fr);gap:var(--s4);
  align-items:start}
@media (max-width:980px){.sidewrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
.side{position:sticky;top:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);padding:6px;max-height:calc(100vh - 120px);overflow:auto}
.side-h{font-size:11.5px;letter-spacing:.04em;color:var(--fg3);padding:6px 8px 4px}
.sideitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--fg);cursor:pointer;
  text-align:left;line-height:1.35}
.sideitem:hover{background:var(--alt)}
.sideitem.on{background:var(--primary-l);color:var(--primary);font-weight:600}
.sideitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sideitem .cnt{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.sideitem .dot{width:7px;height:7px;border-radius:50%;flex:none}
.sidebody{min-width:0}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand"><svg class="logo" viewBox="0 0 16 16" aria-hidden="true"
      focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>监管合规编排器<small>本地确认台</small></div>
    <div class="hstat">
      <span class="badge" id="live">连接中…</span>
      <span class="badge" id="scope" title="访问范围">—</span>
      <span class="badge" id="auth" title="登录身份">—</span>
      <span class="badge" id="gates">门禁 —</span>
      <span class="badge" id="stamp">—</span>
    </div>
  </div>
  <nav><div class="nwrap" id="nav"></div></nav>
</header>

<main id="view"><div class="card">加载中…</div></main>
<div class="foot">本地只读确认台 · loopback-only · 无鉴权 · 零外链</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
 * 确认台前端
 * 纪律：① 每张卡披露「数据源 + 抓取时刻」；② 不可用即显示**原因**（不白屏）；
 *      ③ SSE 失败自动降级为 5s 轮询；④ 零外链、零构建。
 *
 * 2026-10-22（第一百零九批）修的用户可见缺陷：
 *   · P3 报 TypeError: Cannot convert undefined or null to object
 *     —— 根因是 `Object.assign(LAST.metrics, m)` 而 `LAST.metrics` 首次为 undefined。
 *     现改为**新建对象**，并新增 `obj()` 兜底所有 `Object.entries/keys`。
 *   · P1 无任何显示 —— 后端已改为"展开 {src} + 按产物连边的真实 DAG"，
 *     前端改为**分层列布局**（此前两列灰块、无连线无数字）。
 *   · P4 列与内容错位 / 地址错配 / 本地文件打不开 / 处置在列表最下方
 *     —— 见各函数内注释。
 *   · P2/P7 并入总览；P6 增访问地址列；P8 全量提交 + 点开完整变更。
 * ============================================================ */

const TABS = [
  {id:"overview", name:"总览"},
  {id:"flow",     name:"数据流转"},
  {id:"metrics",  name:"指标"},
  {id:"worklist", name:"待办闭环"},
  /* 2026-10-23 新增三页：政策法规 / 公司制度 / 关系图谱。
   * 为什么放在待办闭环之后：读者动线是"看总量 → 查具体文件 → 看它的来龙去脉"，
   * 而"关系图谱"必须紧邻两个列表（点列表里的"查看"要跳过去）。 */
  {id:"laws",     name:"政策法规"},
  {id:"rules",    name:"公司制度"},
  {id:"graph",    name:"关系图谱"},
  {id:"regstats", name:"监管统计"},
  {id:"governance",name:"治理审计"},
  {id:"search",   name:"文档检索"},
  {id:"release",  name:"发布事件"},
  {id:"feedback", name:"留言板"},
];

/*: 仅本机可见的页签（服务端已按来源 IP 拒绝其接口，这里是**避免误点**）。
 * 判定来自 `/api/health.local_only`，**不是**前端猜测 —— 隐藏不构成安全边界。 */
const LOCAL_ONLY_TABS = ["worklist"];

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (n==null||n==="")?"—":(typeof n==="number"?(n.toLocaleString?n.toLocaleString():String(n)):String(n));
const kb  = b => { if(b==null) return "—"; const u=["B","KB","MB","GB","TB"]; let i=0,v=Number(b)||0;
  while(v>=1024&&i<u.length-1){v/=1024;i++;} return (v<10?v.toFixed(1):v.toFixed(0))+" "+u[i]; };
/*: `obj()` —— 把"可能为 null/undefined/非对象"的值安全转成对象。
 * 为什么需要：`Object.entries(null)` 会抛 TypeError（本次 P3 的报错文案就是它）。
 * 后端已保证字段齐全，但**前端不能把"后端某天少给一个字段"变成整页白屏**。 */
const obj = x => (x && typeof x==="object" && !Array.isArray(x)) ? x : {};
const arr = x => Array.isArray(x) ? x : [];

/*: 字段来源标签 —— 让"这个值从哪来"对读者可见（本仓一贯要求"降级可辨"）。 */

  "payload:title":"待办载荷", "payload:document_number":"待办载荷", "payload:url":"待办载荷",
  "bridge:docno":"桥表(文号)", "bridge:title":"桥表(名称)",
  "local:file":"本地文件", "ipn":"IPN", "subject":"subject",
  "not_found":"未查到", "mismatch":"地址不匹配", "warming":"统计中…",
  "not_applicable":"不适用", "aggregate":"汇总项",
};


/*: 左侧栏外壳：`items` = [{key,label,count?,dot?,title?}] */
function sideShell(key, items, cur, body, title){
  const list = items.map(it => `<button class="sideitem${String(it.key) === String(cur) ? " on" : ""}"
      data-side="${esc(key)}" data-skey="${esc(it.key)}"
      title="${esc(it.title || it.label || "")}">
      ${it.dot ? `<span class="dot" style="background:${esc(it.dot)}"></span>` : ""}
      <span class="nm">${esc(it.label)}</span>
      ${it.count != null ? `<span class="cnt">${num(it.count)}</span>` : ""}
    </button>`).join("");
  return `<div class="sidewrap">
      <aside class="side">${title ? `<div class="side-h">${esc(title)}</div>` : ""}${list}</aside>
      <div class="sidebody">${body}</div>
    </div>`;
}

document.addEventListener("click", (ev) => {
  const b = ev.target && ev.target.closest ? ev.target.closest("[data-side]") : null;
  if (!b) return;
  ev.preventDefault();
  const act = SIDE_ACT[b.dataset.side];

  render();
});

function toast(msg, bad){
  const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":"");
  clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",3600);
}

/*: CSRF 令牌：优先用登录响应里给的，其次读 `wb_csrf` cookie（double-submit）。
 * 为什么必须回落到 cookie：**可信代理认证**从不走登录接口，令牌只由
 * `/api/auth/status` 下发成 cookie，前端拿不到它就无法写（实测踩到）。 */
function csrfToken(){
  if(STATE.csrf) return STATE.csrf;
  const m = (document.cookie || "").match(/(?:^|;\s*)wb_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}

async function api(path, opts){
  const o = Object.assign({headers:{}}, opts||{});
  o.headers = Object.assign({"Accept":"application/json"}, obj(opts && opts.headers));
  // CSRF：写请求必须带与 cookie 一致的 `X-CSRF`（服务端强制校验）
  const ctk = csrfToken();
  if(ctk) o.headers["X-CSRF"] = ctk;
  const r = await fetch(path, o);
  const ct = r.headers.get("content-type")||"";
  if(!ct.includes("json")) return {available:false, reason:"非 JSON 响应（HTTP "+r.status+"）"};
  let j={}; try{ j = await r.json(); }catch(e){ return {available:false, reason:"响应不是合法 JSON"}; }
  /* 401 ⇒ 会话失效/未登录：置状态，并**异步**触发一次重渲染切到登录卡片。
   *
   * ⚠️ 为什么不能直接 `render()`（2026-10-23 真实故障）：
   * `render()` 内部会 await 多个 `api()`，而 `api()` 在 401 时又调 `render()`
   * ⇒ **递归**（render→api→render→…），浏览器表现为"页面空着/一直转"，
   * 用户看到的就是"两个地址都显示未认证、什么都点不出来"。
   * 改为 `setTimeout(0)` + 一次性闸门：跳出当前调用栈，且并发 401 只触发一次。 */
  if(r.status === 401 && j && j.need_login){
    STATE.auth = {authenticated:false, mode:j.mode || "",
                  user:"", user_source:"未认证"};
    HEALTH_P = null;
    if(!AUTH_RELOADING && CUR !== "__login"){
      AUTH_RELOADING = true;
      setTimeout(()=>{ AUTH_RELOADING = false; render(); }, 0);
    }
  }
  if(!r.ok) return Object.assign({available:false}, obj(j), {httpStatus:r.status});
  return j;
}

function card(title, hint, body, src, at){
  return `<div class="card"><h3><span>${esc(title)}</span><span class="hint">${esc(hint||"")}</span></h3>
    ${body}<div class="src">数据源：${esc(src||"—")}${at?(" ｜ 抓取："+esc(at)):""}</div></div>`;
}
function unavail(d, why){
  return card(why||"卡片","",`<div class="pill warn">⚠ 不可用</div>
    <div class="note">${esc(d.reason||d.error||"未知原因")}</div>`, d.source);
}
const kv = (k,v,cls)=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v ${cls||""}">${v}</span></div>`;
const pill = (t,c)=>`<span class="pill ${c||""}">${esc(t)}</span>`;
const kpi = (label,value,unit,cls)=>
  `<div class="kpi"><div class="n ${cls||""}">${value}${unit?`<span class="u">${esc(unit)}</span>`:""}</div>
   <div class="l">${esc(label)}</div></div>`;

/*: 条形列表（**用 flex 而非 SVG**）
 * 用户三次报"图表渲染异常"，其中两次的根因都是 SVG 里**文字按估算宽度排版会溢出画布**
 * （标签压柱、数值被裁）。CSS 网格 + `text-overflow` 从结构上消除了这类问题：
 * 文字只在它自己的格子里，永远不会跑到柱子上。 */
function bars(data, color, unit){
  const e = Object.entries(obj(data));
  if(!e.length) return '<div class="muted">暂无数据</div>';
  const max = Math.max(1, ...e.map(([,v])=>Number(v)||0));
  const total = e.reduce((a,[,v])=>a+(Number(v)||0),0);
  const rows = e.map(([k,v])=>{
    const n=Number(v)||0, pct=max?Math.max(n>0?1.5:0, n/max*100):0;
    const share=total?(n/total*100):0;
    return `<div class="brow" title="${esc(k)}：${num(n)}${unit||""}（占 ${share.toFixed(1)}%）">
      <div class="bl">${esc(k)}</div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${color}"></div></div>
      <div class="bv">${num(n)}${unit?" "+esc(unit):""}<span class="muted" style="font-weight:400"> · ${share.toFixed(share>=10?0:1)}%</span></div>
    </div>`;}).join("");
  const pos=e.map(([,v])=>Number(v)||0).filter(v=>v>0);
  const minPos=pos.length?Math.min(...pos):0;
  const note = (minPos>0 && max/minPos>=20)
    ? `<div class="note">分布高度集中（最大 ${num(max)} / 最小非零 ${num(minPos)}，约 ${Math.round(max/minPos)} 倍）：
        小值条形按线性比例接近不可见，**数值与占比均已标注**——这是真实分布，不是图坏了。</div>` : "";
  return `<div class="bars">${rows}</div>${note}`;
}

/* ---------------- P1 数据流转（分层 DAG） ---------------- */
/*: 每层一条竖列；同层节点纵向堆叠。为什么不用桑基：
 * 桑基要求"每个节点进出守恒"，而本链有大量**多进多出**与**旁路/条件**步骤
 * （gates/reports/retention…），强行守恒会把数据改成假的。分层 DAG 只表达
 * "谁依赖谁 + 流量多少"，语义上忠实。 */
function viewFlow(d){
  if(!d.available) return unavail(d);
  const nodes=arr(d.nodes), edges=arr(d.edges), layers=arr(d.layers);
  if(!nodes.length) return card("数据流转","",'<div class="pill warn">⚠ 链路为空</div>'
    +'<div class="note">STEP_ORDER 未加载</div>', d.source, d.fetched_at);

  const byLayer = {};
  layers.forEach(l=>{ byLayer[l.id]=[]; });
  nodes.forEach(n=>{ (byLayer[n.layer]||(byLayer[n.layer]=[])).push(n); });
  const lids = layers.length?layers.map(l=>l.id):Object.keys(byLayer);

  const COLW=186, GAPX=54, ROWH=30, GAPY=8, PADX=16, PADY=34;
  const colX={}; lids.forEach((l,i)=>{ colX[l]=PADX+i*(COLW+GAPX); });
  const maxRows = Math.max(1, ...lids.map(l=>(byLayer[l]||[]).length));
  const W = PADX*2 + lids.length*(COLW+GAPX) - GAPX;
  const H = PADY + maxRows*(ROWH+GAPY) + 18;
  const pos={};
  lids.forEach(l=>{ (byLayer[l]||[]).forEach((n,i)=>{
    const x=colX[l], y=PADY+i*(ROWH+GAPY);
    pos[n.id]={x,y,cx:x+COLW/2,cy:y+ROWH/2}; }); });

  const STATUS_FILL={ok:"#E6F6EF",failed:"#FDECEA",skip:"#F2F4F7",
                     degraded:"#FFF6E5",idle:"#FFFFFF",unknown:"#FFFFFF"};
  const STATUS_STROKE={ok:"#12855A",failed:"#C0392B",skip:"#D0D5DD",
                       degraded:"#B26A00",idle:"#D0D5DD",unknown:"#D0D5DD"};
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  // 层标题带
  lids.forEach(l=>{
    const nm=(layers.find(x=>x.id===l)||{}).name||l;
    svg+=`<text x="${colX[l]}" y="20" fill="#86909C" font-size="11.5" font-weight="600">${esc(nm)}</text>`;
  });
  // 边（先画，压在节点下方）
  edges.forEach(e=>{
    const a=pos[e.from], b=pos[e.to];
    if(!a||!b) return;
    const x1=a.x+COLW, y1=a.cy, x2=b.x, y2=b.cy;
    const dx=Math.max(24,(x2-x1)/2);
    const w=Math.max(1.2, Math.min(16, Math.sqrt(Number(e.volume)||1)/3.2));
    svg+=`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"
      fill="none" stroke="#2F7CF6" stroke-opacity="0.30" stroke-width="${w}">
      <title>${esc(e.from)} → ${esc(e.to)}（${esc(e.artifact)}，${num(e.volume)} 条）</title></path>`;
  });
  // 节点
  lids.forEach(l=>{
    (byLayer[l]||[]).forEach(n=>{
      const p=pos[n.id];
      const st=n.status||"idle";
      const vol=Number(n.volume)||0;
      const label=n.label.length>26?n.label.slice(0,25)+"…":n.label;
      svg+=`<g class="fnode" data-step="${esc(n.id)}" style="cursor:pointer">
        <rect x="${p.x}" y="${p.y}" width="${COLW}" height="${ROWH}" rx="6"
          fill="${STATUS_FILL[st]||"#fff"}" stroke="${STATUS_STROKE[st]||"#D0D5DD"}"/>
        <text x="${p.x+8}" y="${p.y+19}" font-size="11.5" fill="#1D2129">${esc(label)}</text>
        ${vol?`<text x="${p.x+COLW-7}" y="${p.y+19}" font-size="10.5" fill="#4E5969"
          text-anchor="end">${num(vol)}</text>`:""}
        <title>${esc(n.id)}
层：${esc((layers.find(x=>x.id===n.layer)||{}).name||n.layer)}
状态：${esc(st)}${n.rc!=null?"（rc="+esc(n.rc)+"）":""}${n.elapsed_s!=null?"  耗时 "+n.elapsed_s+"s":""}
记录数：${vol?num(vol):"（该步骤无记录数语义）"}
${n.purpose?("作用："+esc(n.purpose)):""}</title>
      </g>`;
    });
  });
  svg+="</svg>";

  const legend=`<div class="legend">
    <span><i style="background:#E6F6EF;border:1px solid #12855A"></i>ok</span>
    <span><i style="background:#FFF6E5;border:1px solid #B26A00"></i>degraded</span>
    <span><i style="background:#FDECEA;border:1px solid #C0392B"></i>failed</span>
    <span><i style="background:#F2F4F7;border:1px solid #D0D5DD"></i>skip/未运行</span>
    <span>连线宽度 ∝ √记录数；悬停看详情，点击看抽屉</span></div>`;
  const t=obj(d.totals);
  /* 左侧「节点抽屉」：按层列出全部节点 + 状态点。
   * 原来只有一个 `<select>`（要先展开、还看不到状态），排在 40 个节点上纯属折磨。 */
  const _dot = (s) => ({ok: "#12855A", failed: "#C0392B", degraded: "#B26A00",
                        skip: "#D0D5DD"}[s] || "#D0D5DD");
  const _fItems = nodes.map(n => ({key: n.id, label: n.id, dot: _dot(n.status),
                                   title: `${n.id} · ${n.status || "unknown"}`}));
  return card("全链数据流（分层 DAG）",
    `${num(t.nodes)} 节点 · ${num(t.edges)} 条边 · ${num(t.sources)} 源`,
    sideShell("flow", _fItems, String(STATE.flow_sel || ""),
    `<div class="scrollx">${svg}</div>${legend}
     <div class="toolbar" style="margin-top:10px">
       <span class="muted">节点抽屉：</span>
       <select id="stepsel">${nodes.map(n=>`<option>${esc(n.id)}</option>`).join("")}</select>
       <button class="act ghost" id="stepbtn">查看</button>
       <span class="muted">最近运行：${esc(d.run_id||"—")}</span>
     </div><div id="stepout"></div>`, "节点"), d.source, d.fetched_at);
}

/* ---------------- P3 指标 ---------------- */
const SLI_LABEL = {
  "sli_chain_success_rate":"链成功率",
  "sli_data_freshness":"数据新鲜度",
  "sli_gate_pass_rate":"门禁通过率",
};
function lineChart(rows, color){
  rows=arr(rows);
  if(rows.length<2) return '<div class="muted">数据点不足（需 ≥2 个运行）</div>';
  const W=560,H=150,pad=30;
  const vals=rows.map(r=>Number(r.rate)||0);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const spanRaw=hi-lo, margin=spanRaw<2?0.5:Math.max(1,spanRaw*0.25);
  const min=lo-margin, max=hi+margin, span=(max-min)||1;
  const pts=rows.map((r,i)=>[pad+i*(W-2*pad)/Math.max(1,rows.length-1),
    H-pad-((Number(r.rate)||0)-min)/span*(H-2*pad)]);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E5E6EB"/>`;
  svg+=`<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  rows.forEach((r,i)=>{svg+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3" fill="#fff"
    stroke="${color}" stroke-width="2"><title>${esc(r.run_id)}：${r.rate}%</title></circle>`;});
  svg+=`<text x="${W-pad}" y="14" fill="#86909C" font-size="10.5" text-anchor="end">y 轴 ${lo}~${hi}%</text>`;
  svg+=`<text x="${pad}" y="${H-10}" fill="#86909C" font-size="10.5">${esc(rows[0].run_id||"")}</text>
    <text x="${W-pad}" y="${H-10}" fill="#86909C" font-size="10.5" text-anchor="end">${esc(rows[rows.length-1].run_id||"")}</text></svg>`;
  return svg;
}
function viewMetrics(d){
  if(!d.available) return unavail(d);
  const q=obj(d.quality), s=obj(d.slo);
  const qd=obj(obj(q.doc).dimensions);
  const dims=Object.entries(qd).map(([k,v])=>({k, v:obj(v).score==null?"—":obj(v).score}));
  const qHtml = dims.length===0
    ? '<div class="muted">暂无质量快照（python -m tools.gen_quality_metrics）</div>'
    : `<div class="bars">${dims.map(x=>{
        const val = x.v==="—"?0:Number(x.v);
        const color = val>=90?"var(--ok)":(val>=70?"var(--warn)":"var(--bad)");
        return `<div class="brow" title="${esc(x.k)}：${esc(x.v)}">
          <div class="bl">${esc(x.k)}</div>
          <div class="bt"><div class="bf" style="width:${Math.max(val>0?1.5:0,val)}%;background:${color}"></div></div>
          <div class="bv">${esc(x.v)}</div></div>`;}).join("")}</div>
      <div class="note">健康度 ${esc(obj(q.doc).health_score??"—")}（均权；缺失维度不计入分母）</div>`;

  const lastSLI=obj(obj(s.last).sli), tgt=obj(obj(s.last).targets);
  const sliRows=Object.keys(lastSLI).map(k=>{
    const v=Number(obj(lastSLI[k]).value), g=Number(tgt[k]);
    const bad = !Number.isNaN(v)&&!Number.isNaN(g)&&v<g;
    return kv(SLI_LABEL[k]||k, `${v}%（SLO ${Number.isNaN(g)?"—":Math.round(g)}%）`, bad?"bad":"ok");
  }).join("");

  const tEntries=Object.entries(obj(d.theme_dist)).sort((a,b)=>(Number(b[1])||0)-(Number(a[1])||0));
  const TOP_N=7, tDist={};
  tEntries.slice(0,TOP_N).forEach(([k,v])=>{tDist[k]=v;});
  const restSum=tEntries.slice(TOP_N).reduce((a,[,v])=>a+(Number(v)||0),0);
  if(restSum>0) tDist[`其他（${tEntries.length-TOP_N} 项）`]=restSum;
  const tTotal=tEntries.reduce((a,[,v])=>a+(Number(v)||0),0);

  return `<div class="grid">
    ${card("门禁通过率趋势","逐轮", lineChart(d.gate_trend,"#2F7CF6"), d.source, d.fetched_at)}
    ${card("待办 aging","未处置天数分布", bars(d.worklist_aging,"#B26A00","条"), d.source, d.fetched_at)}
    ${card("DAMA 六维","质量快照", qHtml, q.source, q.fetched_at)}
    ${card("SLI / SLO","最近快照", sliRows||'<div class="muted">尚无快照（python -m tools.check_slo）</div>', s.source, s.fetched_at)}
    ${card("时效三态","valid / pending / uncertain", bars(d.timeliness_tri,"#12855A","条"), d.source, d.fetched_at)}
    ${card("主题分布",`${tEntries.length} 个主题 / 合计 ${num(tTotal)}`,
      bars(tDist,"#6C5CE7","条")
      + `<div class="note">显示前 ${Math.min(TOP_N,tEntries.length)} 项${restSum>0?`，其余 ${tEntries.length-TOP_N} 项合并为「其他」`:""}；各条合计 = ${num(tTotal)}（可自行核对）</div>`,
      d.source, d.fetched_at)}
  </div>`;
}

/* ---------------- P4 待办闭环 ---------------- */
/*: 单元格渲染：值 / 来源标签 / "不确定"说明三态。
 * 铁律：`not_found`（查不到）与 `not_applicable`（该 kind 没这个概念）**必须分开**，
 * 且 `mismatch`（命中的不是同一份文件）要**明说**——用户就是被"看起来能点、
 * 点开却是另一份文件"坑过。 */
function cellVal(v, src, note){
  if(v) return esc(v);
  const lab = SRC_LABEL[src] || (src ? src : "—");
  const cls = (src==="mismatch")?"bad":((src==="not_found")?"muted":"muted");
  return `<span class="${cls}" title="${esc(note||lab)}">${esc(lab)}</span>`;
}
function cellUrl(f){
  if(f.url){
    return `<a href="${esc(f.url)}" target="_blank" rel="noopener">打开</a>
      <span class="muted" style="font-size:11px">(${esc(SRC_LABEL[f.url_src]||f.url_src||"")})</span>`;
  }
  if(f.local_path){
    /* 本地文件走 `GET /api/local/file`：PDF/TXT 浏览器内联打开，Office 文档下载。
     * **不**由服务端拉起 Word（那会夺焦点，本仓明令禁止）。 */
    return `<a href="/api/local/file?path=${encodeURIComponent(f.local_path)}"
      target="_blank" rel="noopener" title="打开/下载：${esc(f.local_path)}">打开本地文件</a>
      <span class="muted" style="font-size:11px">(本地)</span>`;
  }
  const lab = SRC_LABEL[f.url_src] || (f.url_src||"—");
  if(f.url_src==="mismatch"){
    return `<span class="bad" title="${esc(f.url_note||"")}">地址不匹配</span>
      <div class="muted" style="font-size:11px;max-width:280px;white-space:normal">${esc(f.url_note||"命中记录与本条不是同一份文件，已停止提供链接")}</div>`;
  }
  return `<span class="muted" title="${esc(f.url_note||"")}">${esc(lab)}</span>`;
}

function viewWorklist(d, kinds){
  if(!d.available) return unavail(d);
  const schema=obj(d.fields_schema), caps=obj(schema.kinds);
  const items=arr(d.items);
  const total = (d.total!=null?d.total:(d.count||0));
  const shown = items.length;
  const wtitle = total>shown
    ? `${esc(d.status)}：共 <b>${total}</b> 条，本页 ${shown} 条（可按 kind 筛选）`
    : `${esc(d.status)}：共 ${total} 条`;

  /* 行：**操作列在最左**（勾选 + 处置）。
   * 用户报"处置在列表最下方，交互不合理"——原来点行尾按钮，表单出现在**整张表之后**，
   * 长列表里等于"点完要滚到页底才能填"。现在处置表单**就地插在该行下方**，
   * 且勾选/操作固定在左列，阅读动线是"选 → 处置 → 填 → 提交"。 */
  const rows = items.map((it, idx)=>{
    const f=obj(it.fields), kind=String(it.kind||"");
    const cap=obj(caps[kind]);
    const detail=[f.note, it.suggestion].filter(Boolean).join(" ｜ ");
    return `<tr data-id="${esc(it.item_id)}" data-idx="${idx}">
      <td style="white-space:nowrap">
        <input type="checkbox" class="wlck" value="${esc(it.item_id)}" title="选择本条">
        <button class="act" style="padding:4px 10px;font-size:12px" data-resolve="${esc(it.item_id)}">处置</button>
      </td>
      <td><code>${esc(kind)}</code></td>
      <td class="id">${cellVal(f.identity, f.identity_src)}</td>
      <td>${f.aggregate? esc(f.title) : cellVal(f.title, f.title_src)}</td>
      <td class="mono">${cap.docno ? cellVal(f.document_number, f.document_number_src) : '<span class="muted">不适用</span>'}</td>
      <td>${cellUrl(f)}</td>
      <td class="muted"><div class="trunc" title="${esc(detail)}">${esc(detail||"—")}</div></td>
    </tr>`;
  }).join("");

  const kd = arr(kinds&&(kinds.kinds||kinds.items));
  const _kItems = [{key: "", label: "全部 kind"}].concat(
    kd.map(x => (typeof x === "string"
      ? {key: x, label: x}
      : {key: String(x.kind || x.key || x.value || ""),
         label: String(x.label || x.kind || x.key || x.value || ""),
         count: (x.count != null ? x.count : undefined)})));

  const curKind=(d.filter&&d.filter.kind)||"";
  const kindOpts=['<option value="">全部 kind</option>'].concat(
    (kd.length?kd.map(x=>x.kind||x):Object.keys(obj(d.kind_counts)))
      .map(k=>`<option value="${esc(k)}"${k===curKind?" selected":""}>${esc(k)}${
        (obj(d.kind_counts)[k])?"（"+obj(d.kind_counts)[k]+"）":""}</option>`)).join("");

  const toolbar = `<div class="toolbar">
      <span class="muted">kind</span><select id="wlkind">${kindOpts}</select>
      <span class="muted">已选 <b id="wln">0</b> 条</span>
      <select id="wlstatus"><option value="resolved">resolved（已处置）</option>
        <option value="dismissed">dismissed（不适用）</option></select>
      <input id="wlby" placeholder="操作者" value="confirm_console" size="14">
      <input id="wlwhy" placeholder="批量处置理由（必填，进审计台账）" size="30">
      <button class="act" id="wlbulk">批量处置</button>
      <span class="muted" style="margin-left:auto">写路径纪律：${esc((kinds&&kinds.action_policy)||"worklist_resolve")}</span>
    </div>`;

  // 操作列固定最左，且**带全选**：批量处置前要先能"一次勾完"。
  // 2026-10-22 重写时漏过一次（旧守卫 test_console_exposes_bulk_selection 抓到）。
  const head = `<tr><th style="width:150px">
      <label style="cursor:pointer"><input type="checkbox" id="wlall" title="全选本页"> 操作</label>
    </th><th style="width:190px">kind</th>
    <th style="width:170px">唯一标识号</th><th>名称</th><th style="width:170px">文号</th>
    <th style="width:200px">访问地址</th><th>详情 / 生产者建议</th></tr>`;
  return card("待办闭环台", wtitle,
    sideShell("worklist", _kItems, String(STATE._wlkind || ""), toolbar + (rows
      ? `<div class="tblwrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
      : '<div class="muted">当前无待办 ✓</div>')
    + `<div class="note">列含义：唯一标识号 = 该条的机器身份（RFN/IPN/文号）；
        文号仅对"有外部文号"的 kind 显示，其余标「不适用」；
        访问地址标「未查到」= 库里确实没有，「不匹配」= 命中的不是同一份文件（已停止提供链接）。</div>`,
      "kind"),
    d.source, d.fetched_at);
}

/* ---------------- P8 发布事件流 ---------------- */
function viewRelease(d){
  if(!d.available) return unavail(d);
  const all=arr(d.commits);
  /* 左侧 = **倒序日期流**（同一天聚成一条，带当日提交数）。
   * 点某天只看那天 —— 发布事件的读者通常是"某次发布前后改了什么"，
   * 日期是最自然的入口，比让人在 100 条 commit 里翻要快。
   * 「发布物证据」已移入总览（它属于"当前产物的证据"，不属于"某次提交"）。 */
  const dayCount = {};
  all.forEach(c => { const k = String(c.date || "—"); dayCount[k] = (dayCount[k] || 0) + 1; });
  const dayItems = [{key: "", label: "全部日期", count: all.length}]
    .concat(Object.keys(dayCount).sort().reverse()
      .map(k => ({key: k, label: k, count: dayCount[k]})));
  const day = String(STATE.rel_day || "");
  const commits = day ? all.filter(c => String(c.date || "—") === day) : all;
  const rows=commits.map(c=>`<tr data-sha="${esc(c.sha)}" style="cursor:pointer">
    <td class="muted" style="white-space:nowrap">${esc(c.date)}</td>
    <td class="mono">${esc(c.sha)}</td><td>${esc(c.subject)}</td>
    <td><button class="link" data-sha="${esc(c.sha)}">变更</button></td></tr>`).join("");
  const stream = `<div class="grid">
    ${card("提交流",`git log ${day ? day + " · " : "全量 "}${commits.length} 条${
      d.commit_total ? "（total " + d.commit_total + "）" : ""}`,
      commits?`<div class="tblwrap" style="max-height:560px"><table><thead><tr><th style="width:96px">日期</th>
        <th style="width:92px">sha</th><th>主题</th><th style="width:64px"></th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="note">点「变更」看该提交的**完整**改动（文件清单 + 完整提交说明）。</div>`
        :`<div class="muted">git 不可用${d.git_error?("："+esc(d.git_error)):""}</div>`, d.source, d.fetched_at)}
  </div>
  <div id="commitbox" style="margin-top:16px"></div>`;
  return sideShell("release", dayItems, day, stream, "日期（倒序）");
}

 *   原实现先取 `/api/auth/status`（免认证，有 mode），再取 `/api/health`
 *   （**被认证闸门拦成 401**，body 里没有 `auth_mode`）⇒ `mode` 被覆盖成 `"off"`
 *   ⇒ `render()` 认为"没开认证"，直接去拉数据接口 → 又 401 → 又 render → **递归**。
 *   结果：两个地址都只剩"未认证/未登录"，一个页签都打不开。
 * 现约定：
 *   · `/api/health` **允许未认证访问**，且**恒带** `auth_mode/authenticated/need_login`；
 *   · 未认证时它只回**公开子集**（不含门禁数、本机专属路由等内情）；
 *   · `/api/auth/status` 仅用于"已认证后领取 CSRF 令牌"（代理认证场景的唯一入口）。
 */
function ensureHealth(){
  if(!HEALTH_P){
    HEALTH_P = api("/api/health").then(h=>{
      STATE.health = obj(h);
      STATE.auth = {
        authenticated: h.authenticated === true,
        user: String(h.user || ""),
        user_source: String(h.user_source || ""),
        mode: String(h.auth_mode || "off"),
        need_login: h.need_login === true,
        /* 审计级别：`user` 能定位到人；`shared` 只有共享口令（无法定位到人）。
         * 必须显示出来——否则读者会默认"既然要登录，那一定审计到人了"。 */
        auditLevel: String(h.audit_level || ""),
        auditLabel: String(h.audit_level_label || ""),
      };
      applyScope(h);
      // 已认证才需要 CSRF（未认证时 status 只会回 need_login，不浪费一次往返）
      if(STATE.auth.authenticated && !STATE.csrf){
        return api("/api/auth/status").catch(()=>obj({})).then(st=>{
          STATE.authStatus = obj(st);
          return STATE.auth;
        });
      }
      return STATE.auth;
    }).catch(e=>{
      // 连 health 都拿不到 ⇒ 服务不可达：给出**可行动**的结论，而不是"未登录"
      STATE.auth = {authenticated:false, mode:"", unreachable:String(e||"")};
      return STATE.auth;
    });
  }
  return HEALTH_P;
}

/*: 访问范围徽标 + 本机专属页签隐藏（原有逻辑，抽出来供 ensureHealth 调用）。 */
function applyScope(h){
  const scope = String(h.scope || "local");
  const local = h.local_only === true || scope === "local";
  const sc = $("#scope");
  if(sc){
    sc.textContent = local ? "本机" : "内网只读";
    sc.className = "badge " + (local ? "" : "warn");
    sc.title = local ? "全部功能可用（含待办处置）"
      : `内网访问（${scope}）：本地文件/宿主诊断/提交详情仅限本机`;
  }
  if(!local){
    $$("#nav button").forEach(b=>{
      if(LOCAL_ONLY_TABS.indexOf(b.dataset.id) >= 0) b.style.display = "none";
    });
  }
  const au = $("#auth");
  if(au){
    const a = obj(STATE.auth);
    /* 三种身份要能分辨（原来只有"已登录/未登录"两态，本机自动认证会被显示成
     * "已登录 <机器账号>"，容易被误读成"有人登录过"）： */
    const src = String(a.user_source || "");
    if(a.authenticated && src === "本机账号"){
      au.textContent = `本机 · ${a.user || ""}`;
      au.className = "badge";
      au.title = "回环访问：已自动认证为当前 Windows 账号（内网访问需口令）";
    }else if(a.authenticated){
      const shared = String(a.auditLevel || "") === "shared";
      au.textContent = `已登录 ${a.user || ""}` + (shared ? "（共享）" : "");
      au.className = "badge" + (shared ? " warn" : "");
      au.title = (src || "已认证") + (shared
        ? "\n⚠ 共享口令：操作无法定位到人（如需到人，请向管理员申请个人令牌）"
        : "\n" + (a.auditLabel || "可审计到人"));
    }else if(a.mode === "off"){
      au.textContent = "未启用认证";
      au.className = "badge";
    }else{
      au.textContent = a.unreachable ? "服务不可达" : "未登录";
      au.className = "badge bad";
      au.title = a.unreachable || "请登录后查看";
    }
  }
}

/*: 登录卡片：token 模式只填口令；basic 模式填账号+口令。
 * 登录成功后服务端同时下发 `wb_sess` 与 `wb_csrf`，后者用于所有写请求的 CSRF 校验。 */
function viewLogin(){
  const mode = String(obj(STATE.auth).mode || "");
  const userField = mode === "basic"
    ? `<label class="muted" style="display:block;margin-bottom:8px">账号
         <input id="lguser" autocomplete="username" placeholder="域账号"></label>` : "";
  return `<div class="card" style="max-width:460px;margin:8vh auto">
    <h3><span>登录确认台</span><span class="hint">${mode === "basic" ? "账号口令" : "内网共享口令"}</span></h3>
    <div class="note">本确认台对内网开放，**不允许匿名读取数据**（内网与回环不同：
      回环访问已自动认证为当前 Windows 账号）。
      口令在服务启动日志里（检索 <code>内网共享口令</code> 一行），
      也可直接看 <code>data\\state\\console_token.txt</code> 或运行
      <code>python -m web.auth token</code> 获取/重置。</div>
    <div class="muted" style="font-size:12px;margin-bottom:var(--s2)">
      会话 8 小时；跨机器请勿共用口令，建议由 IT 统一发放或接可信代理（README §6.9）。</div>
    ${userField}
    <label class="muted" style="display:block">${mode === "basic" ? "口令" : "共享口令"}
      <input id="lgpw" type="password" autocomplete="current-password"
        placeholder="${mode === "basic" ? "你的口令" : "XXXX-XXXX-XXXX-XXXX"}"></label>
    <div class="toolbar" style="margin-top:var(--s3)">
      <button class="primary" id="lgbtn">登录</button>
      <span class="muted" id="lgmsg" style="font-size:12px"></span>
    </div>
  </div>`;
}

function bindLogin(){
  const v = $("#view");
  const btn = $("#lgbtn", v);
  const go = async () => {
    const pw = (($("#lgpw", v) || {}).value || "").trim();
    const user = (($("#lguser", v) || {}).value || "").trim();
    const msg = $("#lgmsg", v);
    if(!pw){ if(msg) msg.textContent = "请输入口令"; return; }
    btn.disabled = true;
    try{
      const r = await api("/api/auth/login", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({user: user, password: pw}),
      });
      if(r && r.ok){
        STATE.csrf = String(r.csrf || "");
        STATE.auth = {authenticated:true, user:String(r.user||""), mode:String(obj(STATE.auth).mode||"")};
        HEALTH_P = null;
        toast("已登录：" + (r.user || ""));
        render();
      }else{
        if(msg) msg.textContent = (r && (r.error || r.reason)) || "登录失败";
        btn.disabled = false;
      }
    }catch(e){
      if(msg) msg.textContent = "登录失败：" + String(e);
      btn.disabled = false;
    }
  };
  if(btn) btn.onclick = go;
  const pw = $("#lgpw", v);
  if(pw) pw.onkeydown = (e) => { if(e.key === "Enter") go(); };
}

async function render(){
  const v=$("#view");
  try{
    // 认证闸门：未登录且服务端开了认证 ⇒ 只渲染登录卡片（不请求任何数据接口）
    const au = await ensureHealth();
    if(au && au.authenticated === false && au.mode && au.mode !== "off"){
      CUR="__login";
      v.innerHTML = viewLogin(); bindLogin(); return;
    }
    if(CUR==="__login") CUR="overview";
    if(CUR==="overview"){
      /* 总览要多一份 release：**发布物证据**（SBOM/契约版本）从「发布事件」移到这里的
       * 「02 产物与发布」板块 —— 它讲的是"当前产物是什么"，与"某次提交改了什么"不同轴。 */
      const [o,a,p,r]=await Promise.all([api("/api/overview"),api("/api/assets"),
        api("/api/publish"),api("/api/release")]);
      STATE.overview=o; STATE.release=r;
      v.innerHTML=viewOverview(o,a,p,r); return;
    }
    if(CUR==="metrics"){
      const [m,q,s]=await Promise.all([api("/api/metrics"),api("/api/quality"),api("/api/slo")]);
      /* ⚠️ 2026-10-22 修 P3 的 TypeError：原实现 `Object.assign(LAST.metrics, m)`，
       * 而首次进入时 `LAST.metrics` 是 undefined ⇒
       * `TypeError: Cannot convert undefined or null to object`（用户看到的就是这句）。
       * 改为**新建对象**，永不向 undefined 上赋值。 */
      STATE.metrics = Object.assign({}, obj(m), {quality:q, slo:s});
      v.innerHTML=viewMetrics(STATE.metrics); return;
    }
    if(CUR==="worklist"){
      const qk=STATE._wlkind?("?kind="+encodeURIComponent(STATE._wlkind)):"";
      const [wl,k]=await Promise.all([api("/api/worklist"+qk),api("/api/worklist/kinds")]);
      STATE.worklist=wl; STATE._wlkinds=k;
      v.innerHTML=viewWorklist(wl,k);
      bindWorklist(v); return;
    }
    if(CUR==="search"){
      const q=$("#q")?$("#q").value:"";
      const kind=$("#kind")?$("#kind").value:"records";
      STATE.search=await api(`/api/search?q=${encodeURIComponent(q)}&kind=${kind}`);
      v.innerHTML=viewSearch(STATE.search);
      bindSearch(); return;
    }
    if(CUR==="release"){
      STATE.release=await api("/api/release");
      v.innerHTML=viewRelease(STATE.release);
      bindRelease(); return;
    }
    if(CUR==="flow"){
      STATE.flow=await api("/api/flow");
      v.innerHTML=viewFlow(STATE.flow);
      bindFlow(); return;
    }
    if(CUR==="laws"){
      /* 表格状态用 `Object.assign` 兜底：首次进入给默认值，之后**沿用用户的选择**
       * （翻到第 3 页、按文号筛过，再切回本页时不该被重置）。 */
      const st = STATE.laws = Object.assign(
        {page:1, size:50, sort:"publish_date", desc:true,
         theme:"", source:"", timeliness:"", q_title:"", q_docno:"", q_rfn:""},
        obj(STATE.laws));
      if(!STATE.laws_f) STATE.laws_f = await api("/api/records/facets");
      const d = await api("/api/records?" + toQuery(st));
      v.innerHTML = viewLaws(d, st, obj(STATE.laws_f));
      bindLaws(); return;
    }
    if(CUR==="rules"){
      const st = STATE.rules = Object.assign(
        {page:1, size:50, sort:"title", desc:false,
         theme:"", q_title:"", q_docno:"", q_ipn:""},
        obj(STATE.rules));
      if(!STATE.rules_f) STATE.rules_f = await api("/api/rules/facets");
      const d = await api("/api/rules?" + toQuery(st));
      v.innerHTML = viewRules(d, st, obj(STATE.rules_f));
      bindRules(); return;
    }
    if(CUR==="graph"){
      /* 未指定中心 ⇒ **全局视图**（2026-10-23 用户要求：不再叫用户"先从列表进入"）。 */
      const ref = obj(STATE.graph).ref || "";
      const d = await api("/api/relations" +
        (ref ? "?ref=" + encodeURIComponent(ref) : ""));
      v.innerHTML = viewGraph(d);
      bindGraph(); return;
    }
    if(CUR==="regstats"){
      const [rs, es] = await Promise.all([api("/api/regstats"), api("/api/east")]);
      STATE.regstats = rs;
      STATE.east = es;
      v.innerHTML = viewRegstats(STATE.regstats);
      bindRegstats(); return;
    }
    if(CUR==="feedback"){
      const q = STATE._fbq || {};
      STATE.feedback = await api("/api/feedback?" + toQuery(q));
      v.innerHTML = viewFeedback(STATE.feedback);
      bindFeedback(); return;
    }
    if(CUR==="governance"){
      STATE.governance=await api("/api/governance");
      v.innerHTML=viewGovernance(STATE.governance); return;
    }
  }catch(e){
    v.innerHTML=card("渲染异常","",`<div class="pill bad">⚠ 前端异常</div>
      <div class="note">${esc(String(e&&e.stack?e.stack:String(e)))}</div>`,"web 前端");
  }finally{
    $("#stamp").textContent = "抓取 "+new Date().toLocaleTimeString();
  }
}

/*: 本地文件打开：POST（有副作用，不适合 GET）+ 失败原因必须显示出来。 */

function bindFlow(){
  const v=$("#view");
  $$("g.fnode",v).forEach(g=>{ g.onclick=()=>openStep(g.dataset.step); });
  const btn=$("#stepbtn");
  if(btn) btn.onclick=()=>{ const s=$("#stepsel").value; if(s) openStep(s); };
  // 侧栏点了节点 ⇒ 直接开它的抽屉（不必再点"查看"）
  if(STATE.flow_sel){
    const sel=$("#stepsel");
    if(sel) sel.value = STATE.flow_sel;
    openStep(STATE.flow_sel);
  }
}
async function openStep(step){
  const out=$("#stepout"); if(!out) return;
  out.innerHTML=card("步骤抽屉："+step,"加载中…","","web");
  const d=await api("/api/flow/step?step="+encodeURIComponent(step));
  if(d.available===false){
    out.innerHTML=card("步骤抽屉："+step,"",`<div class="pill warn">⚠ ${esc(d.reason||"不可用")}</div>`,d.source);
    return;
  }
  const row=obj(d.row);
  out.innerHTML=card("步骤抽屉："+step, esc(d.source||""),
    kv("status", esc(row.status||"—")) + kv("rc", esc(row.rc!=null?row.rc:(row.exit_code||"—")))
    + kv("耗时", esc(row.elapsed_s!=null?row.elapsed_s+"s":"—"))
    + (row.note? '<div class="muted" style="margin-top:6px">note</div><pre>'
        + esc(String(row.note).slice(0,800)) + "</pre>" : "")
    + `<pre>${esc(d.log_tail||"(无日志)")}</pre>
       <div style="margin-top:10px"><button class="act ghost" id="dlgbtn" type="button">诊断这一步</button>
       <div id="diagbox" style="margin-top:8px"></div></div>`, d.source, d.fetched_at);
  const b=$("#dlgbtn"); if(b) b.onclick=()=>diagnoseStep(step);
  out.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function diagnoseStep(step){
  const box=document.getElementById("diagbox"); if(!box) return;
  box.innerHTML='<div class="muted">诊断中…</div>';
  const d=await api("/api/diagnose?kind=step&name="+encodeURIComponent(step));
  if(d.available===false){ box.innerHTML=`<div class="pill warn">⚠ ${esc(d.note||"诊断不可用")}</div>`; return; }
  const sus=arr(d.suspicions).map(s=>`<li>${esc(s.claim)} <span class="muted">— ${esc(s.basis)}</span></li>`).join("");
  const gaps=arr(d.missing).map(g=>`<li class="muted">${esc(g)}</li>`).join("");
  box.innerHTML = kv("匹配形态", esc(d.matched_as||"—")) + kv("声明步骤", esc(d.spec_step||"—"))
    + kv("证据项", esc(String(arr(d.evidence).length)))
    + (sus?`<div class="muted" style="margin-top:6px">怀疑（每条附依据）</div><ul>${sus}</ul>`:"")
    + (gaps?`<div class="muted" style="margin-top:6px">证据缺口</div><ul>${gaps}</ul>`:"")
    + `<pre>${esc(String(d.rendered||"").slice(0,4000))}</pre>`;
}

function bindWorklist(v){
  const cks=$$(".wlck",v);
  const upd=()=>{const n=$("#wln"); if(n) n.textContent=cks.filter(c=>c.checked).length;};
  cks.forEach(c=>c.onchange=upd);
  const all=$("#wlall");
  if(all) all.onchange=()=>{ cks.forEach(c=>{ c.checked=all.checked; }); upd(); };
  const ks=$("#wlkind");
  if(ks) ks.onchange=()=>{ STATE._wlkind=ks.value; render(); };
  // 行内处置：表单插在**该行下方**（不再跑到整张表之后）
  $$("button[data-resolve]",v).forEach(b=>{
    b.onclick=()=>openResolveInline(b.closest("tr"), b.dataset.resolve);
  });
  const bulk=$("#wlbulk");
  if(bulk) bulk.onclick=async()=>{
    const sel=cks.filter(c=>c.checked).map(c=>c.value);
    if(!sel.length){ toast("未选择任何条目", true); return; }
    const why=$("#wlwhy").value.trim();
    if(!why){ toast("批量处置必须填理由（进审计台账）", true); return; }
    const st=$("#wlstatus").value, by=$("#wlby").value.trim()||"confirm_console";
    bulk.disabled=true;
    let ok=0; const bad=[];
    for(const id of sel){
      try{
        const r=await api("/api/worklist/resolve",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({item_id:id, resolution:why, status:st, by})});
        if(r.ok||r.available) ok++; else bad.push(id+":"+(r.reason||r.error||"失败"));
      }catch(e){ bad.push(id+":异常"); }
    }
    bulk.disabled=false;
    toast(ok===sel.length?`已批量处置 ${ok} 条（逐条落审计）`
      :`完成 ${ok}/${sel.length}；失败 ${bad.length}：${bad.slice(0,3).join(",")}`, ok!==sel.length);
    render();
  };
}

function openResolveInline(tr, id){
  if(!tr) return;
  const next=tr.nextElementSibling;
  if(next && next.classList.contains("detail")){ next.remove(); return; }  // 再点收起
  const tr2=document.createElement("tr");
  tr2.className="detail";
  tr2.innerHTML=`<td colspan="7">
    <div class="row"><b>处置 ${esc(id)}</b>
      <select id="rstatus"><option value="resolved">resolved（已处置）</option>
        <option value="dismissed">dismissed（不适用）</option></select>
      <input id="rby" placeholder="操作者" value="confirm_console" size="14">
      <button class="act" id="rok">提交</button>
      <button class="act ghost" id="rcancel">取消</button></div>
    <textarea id="rwhy" placeholder="处置理由（必填，进入审计台账）"></textarea>
    <div class="note">写路径：<code>worklist_resolve</code>（唯一写口，逐条落审计）。</div>
  </td>`;
  tr.after(tr2);
  const box=$("#rwhy"); if(box) box.focus();
  $("#rcancel").onclick=()=>tr2.remove();
  $("#rok").onclick=async()=>{
    const why=$("#rwhy").value.trim();
    if(!why){ toast("必须填处置理由", true); return; }
    const r=await api("/api/worklist/resolve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({item_id:id, resolution:why, status:$("#rstatus").value, by:$("#rby").value})});
    if(r.ok||r.available){ toast("已处置："+id); tr2.remove(); render(); }
    else toast("处置失败："+(r.reason||r.error||"未知"), true);
  };
}

function bindSearch(){
  const btn=$("#qbtn"); if(btn) btn.onclick=()=>render();

/* ============================================================
 * 政策法规 / 公司制度 / 关系图谱（2026-10-23 第一百一十批）
 * ------------------------------------------------------------
 * 三页共用一套"**服务端**分页 + 表头筛选 + 表头排序"的表格骨架：
 *   · 分页必须在服务端：政策法规 16607 行，整包下发 4MB+ 且首屏必卡
 *     （这与上一批 `/api/overview` 22s 的教训同源：**别把全量搬进浏览器**）；
 *   · 排序/筛选参数一律交给 `interfaces/base_api` 白名单校验，前端不做任何 SQL
 *     拼接，也不在前端"取了 50 条再本地排序"（那会让排序结果只覆盖当前页）；
 *   · 条件存 `STATE`，翻页/排序/改筛选后**不丢条件**。
 * ============================================================ */
const toQuery = o => Object.entries(o)
  .filter(([, v]) => v !== "" && v != null && v !== undefined)
  .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");

function thSort(key, label, st){
  const on = st.sort === key;
  const arw = on ? `<span class="arw">${st.desc ? "▾" : "▴"}</span>` : "";
  return `<th class="sortable${on ? " on" : ""}" data-sort="${key}"
    title="点击按「${esc(label)}」排序">${esc(label)}${arw}</th>`;
}
function fInput(key, st, ph){
  return `<input data-f="${key}" data-mode="enter" value="${esc(st[key] || "")}"
    placeholder="${esc(ph || "")}" title="输入后按回车筛选">`;
}
function fSelect(key, st, items, ph){
  const cur = st[key] || "";
  const opts = [`<option value="">${esc(ph || "全部")}</option>`]
    .concat(arr(items).map(it => {
      const v = it.value || "";
      return `<option value="${esc(v)}"${v === cur ? " selected" : ""}>` +
        `${esc(it.label || v || "（空）")}（${num(it.count)}）</option>`;
    }));
  return `<select data-f="${key}" data-mode="change">${opts.join("")}</select>`;
}
function pager(d, id){
  const total = Number(d.total) || 0, pages = Number(d.pages) || 1,
        page = Number(d.page) || 1;
  return `<div class="pager" id="${id}">
    <span>共 <b>${num(total)}</b> 条 · 第 ${page} / ${pages} 页</span>
    <button data-pg="1" ${page <= 1 ? "disabled" : ""}>« 首页</button>
    <button data-pg="${page - 1}" ${page <= 1 ? "disabled" : ""}>‹ 上一页</button>
    <button data-pg="${page + 1}" ${page >= pages ? "disabled" : ""}>下一页 ›</button>
    <button data-pg="${pages}" ${page >= pages ? "disabled" : ""}>末页 »</button>
  </div>`;
}
/*: 唯一标识号单元格（政策法规）。
 *
 * 2026-10-26：底座现在**每条记录都有 RFN**（入册的用归属表编号，未入册的由发布件
 * 派生）。两者语义不同，必须视觉可分：`派生` 标签 + 悬停说明，避免把"派生号"
 * 当成"已收录"。以前这里对无号行显示 "—"，读者既引用不了也对不上账。 */
function idCell(it){
  const rfn = String(it.rfn || "");
  if(!rfn) return '<span class="muted">—</span>';
  const derived = String(it.rfn_origin || "") === "derived";
  return `<span class="mono">${esc(rfn)}</span>` + (derived
    ? ' <span class="tag" title="未入册：编号由发布件派生，可稳定引用，但不代表已被归属表收录（不参与主题/时效统计）">派生</span>'
    : "");
}

function relBtn(ref){
  if (!ref) return '<span class="muted">—</span>';
  return `<button class="link" data-rel="${esc(ref)}"
    title="在「关系图谱」中查看 ${esc(ref)}">查看</button>`;
}
function themeCell(t){
  return t ? `<span class="tag">${esc(t)}</span>` : '<span class="muted">—</span>';
}
function timeCell(v){
  /* 时效状态用**中文**呈现：底座存的是受控枚举（valid/amended/…），
   * 直接显示英文枚举会让读者以为"没翻译完"（上一批 P4 已统一过这个口径）。 */
  const map = {valid:["现行有效","ok"], amended:["已修订","warn"],
               repealed:["已废止","bad"], expired:["已失效","bad"],
               pending:["待核验",""]};
  if (!v) return '<span class="muted">未核验</span>';
  const m = map[v];
  return m ? pill(m[0], m[1]) : pill(v, "");
}
function addrCell(it){
  if (it.url) {
    return `<a href="${esc(it.url)}" target="_blank" rel="noopener">打开原文</a>`;
  }
  return '<span class="muted">未查到</span>';
}

function viewLaws(d, st, f){
  if (!d || d.available === false) return unavail(obj(d), "政策法规");
  const items = arr(d.items);
  const rows = items.map(it => `<tr>
      <td>${themeCell(it.theme_label)}</td>
      <td>${idCell(it)}</td>
      <td class="ttl">${esc(it.title || "")}</td>
      <td class="mono">${esc(it.document_number || "—")}</td>
      <td>${timeCell(it.timeliness_status)}</td>
      <td><span class="tag">${esc(it.source || "—")}</span></td>
      <td>${addrCell(it)}</td>
      <td>${relBtn(it.rfn)}</td></tr>`).join("")
    || '<tr><td colspan="8" class="muted">无匹配记录（放宽筛选条件再试）</td></tr>';
  /* 主题移到**左侧栏**（GitHub issues 式）：表头那一列只留占位，
   * 否则同一维度出现两次（左侧点了主题、表头下拉还显示"全部主题"，人会以为没生效）。 */
  const _themes = arr(f.themes).filter(x => String(x.value) !== "");
  const _unset = arr(f.themes).find(x => String(x.value) === "");
  const _sideItems = [{key: "", label: "全部主题", count: (_unset && _unset.count) || undefined}]
    .concat(_themes.map(x => ({key: x.value, label: x.label || x.value, count: x.count})));
  const body = `
    <div class="scrollx"><table>
      <thead>
        <tr class="filters">
          <th class="muted" style="font-size:11px">主题见左侧</th>
          <th>${fInput("q_rfn", st, "RFN 前缀")}</th>
          <th>${fInput("q_title", st, "名称包含…")}</th>
          <th>${fInput("q_docno", st, "文号包含…")}</th>
          <th>${fSelect("timeliness", st, arr(f.timeliness), "全部时效")}</th>
          <th>${fSelect("source", st, arr(f.sources), "全部来源")}</th>
          <th></th><th></th>
        </tr>
        <tr>
          ${thSort("theme", "主题", st)}
          ${thSort("rfn", "唯一标识号", st)}
          ${thSort("title", "名称", st)}
          ${thSort("document_number", "文号", st)}
          ${thSort("timeliness_status", "时效", st)}
          ${thSort("source", "源", st)}
          <th>访问地址</th><th>关系</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${pager(d, "lawsPager")}`;
  return card("政策法规", `${num(d.total)} 条 / ${d.pages} 页`,
    sideShell("laws", _sideItems, String(obj(st).theme || ""), body, "主题"),
    d.source_name || "base_api.list_external_page", d.fetched_at);
}
